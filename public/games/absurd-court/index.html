function overlay(html){ const o=$("#ov"); o.innerHTML=`<div class="paper" role="dialog" aria-modal="true">${html}</div>`; o.hidden=false; o.scrollTop=0; o.querySelector("button")?.focus({preventScroll:true}); }

function showIntro(){
  overlay(`<span class="label">${esc(CASE.no)} · 晨報 第 1 天</span>
    <h2>${esc(CASE.intro.head)}</h2>${victimRow(S.victims)}
    <p>${esc(CASE.intro.body)}</p>
    <div class="rule"></div>
    <p class="hint">你有 ${CASE.days} 天，每天 ${CASE.actionsPerDay} 次行動。證詞會記在「法官筆記」，拿證據當面追問最容易抓到謊話。</p>
    <button class="big red" data-close="1">接手案件</button>`);
}
function night(){
  const c=S.choice; if(c===undefined) return;
  S.isolated=c; S.history.push(c);
  if(c===CASE.culprit) return ending(true);
  const n=CASE.nights[c||"none"]; S.victims+=n.add;
  if(S.day>=CASE.days) return ending(false,c);
  S.day++; S.actions=CASE.actionsPerDay; S.choice=undefined; S.curTopic=null;
  render();
  overlay(`<span class="label">晨報 第 ${S.day} 天</span>
    <h2>${esc(n.head)}</h2>${victimRow(S.victims)}<p>${esc(n.body)}</p>
    ${c?`<p class="hint">${esc(CASE.chars[c].name)}仍被關押中。今晚可以改關別人。</p>`:""}
    <button class="big red" data-close="1">開始第 ${S.day} 天</button>`);
}
function ending(win,c){
  const wrong=S.history.filter(x=>x&&x!==CASE.culprit).length;
  const back=CASE._test?`<button class="big" data-go="admin">回到後台</button>`:`<button class="big" data-go="home">回到卷宗</button>`;
  if(win){
    const rank=ranks(CASE,S.day);
    if(!CASE._test){ const b=store(true,"ac-best")||{}; const order=["勉強及格","名偵探","傳奇法官"]; if(order.indexOf(rank)>order.indexOf(b[CASE.id])){b[CASE.id]=rank; store(false,"ac-best",b);} }
    overlay(`<span class="label">晨報 · 號外</span>
      <h2>${esc(CASE.good.head)}</h2>
      <p class="rank">評價：${rank}</p>
      <p>第 ${S.day} 晚破案。${esc(CASE.counter)}共 ${S.victims}，冤枉過 ${wrong} 次，看過 ${S.seen.length} / ${Object.keys(CASE.evidence).length} 件證據。</p>
      <p>${esc(CASE.good.body)}</p>${truthBlock()}
      <div class="row">${back}<button class="big red" data-replay="1">再審一次</button></div>`);
  } else {
    const b=CASE.bad[c||"none"];
    overlay(`<span class="label">晨報 · 最終版</span>
      <h2>${esc(b.head)}</h2>${victimRow(S.victims)}
      <p>${esc(b.body)}</p>
      <p>真正的兇手，是<b style="color:var(--red)">${esc(CASE.chars[CASE.culprit].name)}</b>。</p>${truthBlock()}
      <div class="row">${back}<button class="big red" data-replay="1">重新審判</button></div>`);
  }
}

/* ===== 後台 ===== */
function openAdmin(){
  if(!W){
    W=clone(DATA);
    let draft=null; try{draft=JSON.parse(sessionStorage.getItem("ac-draft")||"null")}catch(e){}
    if(draft && JSON.stringify(draft)!==JSON.stringify(DATA)){ W=draft; W.cases.forEach(normalize); dirty=true; saveMsg="已還原上次還沒儲存成功的草稿。"; }
    try{sessionStorage.removeItem("ac-draft")}catch(e){}
  }
  sel=Math.min(sel,W.cases.length-1); go("admin");
}
const txt=(label,path,val,rows)=>rows
  ?`<label class="f"><span>${label}</span><textarea data-path="${path}" rows="${rows}">${esc(val)}</textarea></label>`
  :`<label class="f"><span>${label}</span><input data-path="${path}" value="${esc(val)}"></label>`;
const num=(label,path,val,min,max)=>`<label class="f"><span>${label}</span><input type="number" inputmode="numeric" min="${min}" max="${max}" data-path="${path}" data-num="1" value="${val}"></label>`;
const pick=(label,path,val,opts,re)=>`<label class="f"><span>${label}</span><select data-path="${path}" ${re?'data-re="1"':''}>${Object.entries(opts).map(([k,v])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(v)}</option>`).join("")}</select></label>`;

function renderAdmin(){
  const c=W.cases[sel];
  const list=W.cases.map((x,i)=>`<li>
      <button class="pick ${i===sel?'on':''}" data-sel="${i}"><small>${esc(x.no)}</small>${esc(x.title||"未命名")}</button>
      <button class="mv" data-move="${i},-1" aria-label="上移" ${i===0?'disabled':''}>↑</button>
      <button class="mv" data-move="${i},1" aria-label="下移" ${i===W.cases.length-1?'disabled':''}>↓</button>
    </li>`).join("");
  let ed="";
  if(c){
    const chars=Object.entries(c.chars), evs=Object.entries(c.evidence);
    const nameOf=k=>k==="none"?"不關押":(c.chars[k]?.name||k);
    ed=`
    <fieldset class="fs"><legend>基本資料</legend>
      <div class="grid2">
        ${txt("案件編號","no",c.no)}${txt("案件標題","title",c.title)}
        ${txt("標題紅字（標題裡的幾個字）","titleHi",c.titleHi||"")}${txt("受害計數名稱（例：受害兔）","counter",c.counter)}
        ${num("天數","days",c.days,1,7)}${num("每天行動數","actionsPerDay",c.actionsPerDay,1,9)}
        ${num("開場受害數","startVictims",c.startVictims,0,99)}
        ${pick("難度","level",String(c.level),{"1":"★ 入門","2":"★★ 普通","3":"★★★ 困難"})}
        ${pick("真兇","culprit",c.culprit,Object.fromEntries(chars.map(([k,v])=>[k,v.name||k])),true)}
      </div>
      ${txt("卷宗簡介（首頁卡片上的一句話）","blurb",c.blurb||"",2)}
      ${txt("開場晨報標題","intro.head",c.intro.head)}
      ${txt("開場晨報內容","intro.body",c.intro.body,3)}
    </fieldset>

    <fieldset class="fs"><legend>嫌疑犯（${chars.length}）</legend>
      ${chars.map(([k,v])=>`<div class="sub">
        <div class="sub-h"><h4>${esc(v.name||"未命名")}${k===c.culprit?'<span class="tag-culprit">真兇</span>':''}</h4>
          <button class="btn sm" data-delchar="${k}" ${chars.length<=2?'disabled title="至少要有兩名嫌疑犯"':''}>刪除</button></div>
        <div class="grid2">${txt("名字",`chars.${k}.name`,v.name)}${txt("身分標籤",`chars.${k}.tag`,v.tag)}</div>
        ${txt("描述",`chars.${k}.desc`,v.desc,2)}
        <div class="look">${portrait(v.look,v.name)}
          <div class="looksel">${["head","ears","body","eyes","mark","fill"].map(p=>pick({head:"頭",ears:"耳朵",body:"身體",eyes:"眼睛",mark:"特徵",fill:"顏色"}[p],`chars.${k}.look.${p}`,v.look[p],LOOK_OPTS[p],true)).join("")}</div>
        </div>
      </div>`).join("")}
      <button class="btn" data-addchar="1">＋ 新增嫌疑犯</button>
    </fieldset>

    <fieldset class="fs"><legend>證據（${evs.length}）</legend>
      ${evs.map(([k,v])=>`<div class="sub">
        <div class="sub-h"><h4>${esc(v.name||"未命名")}</h4><button class="btn sm" data-delev="${k}" ${evs.length<=1?'disabled':''}>刪除</button></div>
        <div class="grid2">${txt("名稱",`evidence.${k}.name`,v.name)}${txt("發現地點",`evidence.${k}.where`,v.where)}${pick("圖示",`evidence.${k}.icon`,v.icon,ICONS)}</div>
        ${txt("查看後的描述",`evidence.${k}.text`,v.text,3)}
      </div>`).join("")}
      <button class="btn" data-addev="1">＋ 新增證據</button>
    </fieldset>

    <fieldset class="fs"><legend>證詞</legend>
      <p class="hint">括號（　）裡的文字會用淡色顯示，適合寫動作和表情。</p>
      ${chars.map(([k,v])=>`<div class="sub"><div class="sub-h"><h4>${esc(v.name)}</h4></div>
        ${txt("問：昨晚你在哪？",`lines.${k}.alibi`,c.lines[k].alibi,2)}
        ${evs.map(([e,ev])=>txt(`出示：${esc(ev.name)}`,`lines.${k}.${e}`,c.lines[k][e],2)).join("")}
      </div>`).join("")}
    </fieldset>

    <fieldset class="fs"><legend>抓錯人的隔天晨報</legend>
      ${["none",...Object.keys(c.chars).filter(k=>k!==c.culprit)].map(k=>`<div class="sub"><div class="sub-h"><h4>關押：${esc(nameOf(k))}</h4></div>
        <div class="grid2">${num("受害數增加",`nights.${k}.add`,c.nights[k].add,0,20)}${txt("晨報標題",`nights.${k}.head`,c.nights[k].head)}</div>
        ${txt("晨報內容",`nights.${k}.body`,c.nights[k].body,2)}</div>`).join("")}
    </fieldset>

    <fieldset class="fs"><legend>結局</legend>
      <div class="sub"><div class="sub-h"><h4>破案（關到真兇）</h4></div>
        ${txt("標題","good.head",c.good.head)}${txt("內容","good.body",c.good.body,3)}</div>
      ${["none",...Object.keys(c.chars).filter(k=>k!==c.culprit)].map(k=>`<div class="sub"><div class="sub-h"><h4>失敗：最後一晚關押 ${esc(nameOf(k))}</h4></div>
        ${txt("標題",`bad.${k}.head`,c.bad[k].head)}${txt("內容",`bad.${k}.body`,c.bad[k].body,2)}</div>`).join("")}
      ${txt("真相檔案（每行一段）","truth",c.truth.join("\n"),5)}
    </fieldset>

    <div class="row">
      <button class="btn dark" data-test="1">試玩這一關</button>
      <button class="btn" data-dup="1">複製這一關</button>
      <button class="btn" data-delcase="1" ${W.cases.length<=1?'disabled':''}>刪除這一關</button>
    </div>`;
  }
  $("#app").innerHTML=`
    <button class="btn sm back" data-go="home">← 回到首頁</button>
    <div class="savebar">
      <strong style="font-family:var(--f-display)">後台</strong>
      <span class="msg ${saveWarn?'warn':''}" aria-live="polite">${esc(saveMsg|| (dirty?"有尚未儲存的修改。":"所有修改都已儲存。"))}</span>
      <button class="btn sm" data-io="1">匯出／匯入</button>
      <button class="btn sm red" data-save="1" ${(!dirty||readOnly)?'disabled':''}>儲存並發佈</button>
    </div>
    <div class="adm">
      <aside class="panel" style="padding:14px">
        <div class="sec-h" style="margin-bottom:8px"><h2 style="font-size:20px">關卡</h2></div>
        <ul class="clist">${list}</ul>
        <button class="btn" style="width:100%;margin-top:10px" data-newcase="1">＋ 新增關卡</button>
      </aside>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${ed}</div>
    </div>`;
}
function setPath(obj,path,val){
  const ks=path.split("."); let o=obj;
  for(let i=0;i<ks.length-1;i++){ o[ks[i]]=o[ks[i]]||{}; o=o[ks[i]]; }
  o[ks[ks.length-1]]=val;
}
function touch(){ dirty=true; saveMsg=""; saveWarn=false; const m=$(".savebar .msg"); if(m){m.textContent="有尚未儲存的修改。";m.classList.remove("warn")} const b=$("[data-save]"); if(b&&!readOnly) b.disabled=false; }
document.addEventListener("input",e=>{
  const t=e.target; if(view!=="admin"||!t.dataset||!t.dataset.path) return;
  const c=W.cases[sel]; let v=t.value;
  if(t.dataset.num) v=parseInt(v)||0;
  if(t.dataset.path==="truth") v=v.split("\n").map(s=>s.trim()).filter(Boolean);
  setPath(c,t.dataset.path,v); touch();
});
document.addEventListener("change",e=>{
  const t=e.target; if(view!=="admin"||!t.dataset||!t.dataset.path) return;
  if(t.dataset.re || /^chars\.[^.]+\.name$/.test(t.dataset.path) || /^evidence\.[^.]+\.name$/.test(t.dataset.path) || t.dataset.path==="title" || t.dataset.path==="no"){
    normalize(W.cases[sel]); const y=window.scrollY; renderAdmin(); window.scrollTo({top:y});
  }
});
function blankCase(){
  const a=uid("c"), b=uid("c"), e=uid("e");
  return normalize({id:uid("case"),no:"案件 #"+String(W.cases.length+1).padStart(2,"0"),title:"新的案件",titleHi:"",counter:"受害者",blurb:"一句話介紹這個案件。",
    days:3,actionsPerDay:4,startVictims:1,culprit:a,
    chars:{[a]:{name:"嫌犯甲",tag:"看起來很無辜",desc:"",look:{ears:"up"}},[b]:{name:"嫌犯乙",tag:"看起來很兇",desc:"",look:{ears:"cat",eyes:"angry"}}},
    evidence:{[e]:{name:"第一件證據",where:"案發現場",icon:"magnifier",text:"描述這件證據。"}},
    lines:{},intro:{head:"案件發生了",body:"描述案情。"},nights:{},bad:{},good:{head:"結案",body:"描述破案後的結局。"},truth:["寫下真相。"]});
}
async function save(){
  if(!artifactNS){ saveWarn=true; saveMsg="這個檢視無法儲存。請在 Claude 裡開啟這個頁面再試。"; return renderAdmin(); }
  W.cases.forEach(normalize);
  const data={cases:W.cases.map(c=>{const x=clone(c); delete x._test; return x;})};
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  const open='<script type="application/json" id="case-data">';
  const i=SRC.indexOf(open), j=SRC.indexOf("</"+"script>",i);
  if(i<0||j<0){ saveWarn=true; saveMsg="找不到資料區塊，無法儲存。請用匯出備份。"; return renderAdmin(); }
  const body=SRC.slice(0,i+open.length)+json+SRC.slice(j);
  const doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+body+'</body></html>';
  try{sessionStorage.setItem("ac-draft",JSON.stringify(data))}catch(e){}
  saveMsg="儲存中…"; saveWarn=false; renderAdmin(); $("[data-save]").disabled=true;
  try{
    await artifactNS.publish(doc);
    saveMsg="已發佈，頁面即將重新載入。"; dirty=false; renderAdmin();
  }catch(err){
    const code=err&&err.code;
    saveWarn=true;
    if(code==="not_writer"||code==="not_granted"){ readOnly=true; saveMsg="你沒有這個頁面的編輯權限，只能瀏覽。可以先用匯出備份內容。"; }
    else if(code==="conflict"){ saveMsg="有更新的版本剛發佈，頁面會重新載入，你的修改會以草稿還原。"; }
    else if(code==="rate_limited"){ saveMsg="儲存太頻繁了，請稍等一下再按一次。"; }
    else saveMsg="儲存失敗（"+(code||"未知錯誤")+"）。請稍後再試，或先匯出備份。";
    renderAdmin();
  }
}
function showIO(){
  const data=JSON.stringify({cases:W.cases},null,2);
  overlay(`<span class="label">備份與搬移</span><h2>匯出／匯入關卡</h2>
    <p class="hint">複製下面的內容就能備份。貼上別的內容後按「匯入」，會取代後台裡所有關卡（還沒發佈，按儲存才生效）。</p>
    <textarea class="code" id="io-text" spellcheck="false">${esc(data)}</textarea>
    <p class="hint" id="io-msg" aria-live="polite" style="margin-top:8px"></p>
    <div class="row"><button class="big" data-copy="1">複製</button><button class="big red" data-import="1">匯入</button></div>
    <button class="btn" style="margin-top:12px" data-close="1">關閉</button>`);
}

/* ===== 點擊 ===== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset;
  if(d.go){ if(d.go==="admin") openAdmin(); else go(d.go); return; }
  if(d.play!==undefined){ startCase(DATA.cases[+d.play]); return; }
  if(d.close){ $("#ov").hidden=true; return; }
  if(d.replay){ const c=CASE; $("#ov").hidden=true; startCase(c); return; }
  if(view==="game"){
    if(d.ev){ const k=d.ev; if(S.seen.includes(k)||S.actions<1) return; S.seen.push(k); S.actions--; const ev=CASE.evidence[k]; S.notes.push({type:"ev",title:ev.name,text:ev.text}); render(); }
    else if(d.sus){ S.cur=d.sus; S.curTopic=null; render(); $("#interro")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); }
    else if(d.topic){
      const key=S.cur+":"+d.topic;
      if(!S.asked[key]){ if(S.actions<1) return; S.actions--; S.asked[key]=1;
        S.notes.push({type:"line",day:S.day,who:CASE.chars[S.cur].name,q:d.topic==="alibi"?"昨晚在哪":"出示 "+CASE.evidence[d.topic].name,text:CASE.lines[S.cur][d.topic]}); }
      S.curTopic=d.topic; render();
    }
    else if(d.opt){ S.choice=d.opt==="none"?null:d.opt; render(); }
    else if(t.id==="night") night();
    return;
  }
  if(view==="admin"){
    const c=W.cases[sel], y=window.scrollY, re=()=>{renderAdmin(); window.scrollTo({top:y});};
    if(d.sel!==undefined){ sel=+d.sel; pendingDel=null; renderAdmin(); window.scrollTo({top:0}); }
    else if(d.move){ const [i,dir]=d.move.split(",").map(Number); const j=i+dir; [W.cases[i],W.cases[j]]=[W.cases[j],W.cases[i]]; if(sel===i) sel=j; else if(sel===j) sel=i; touch(); re(); }
    else if(d.newcase){ W.cases.push(blankCase()); sel=W.cases.length-1; touch(); renderAdmin(); window.scrollTo({top:0}); }
    else if(d.dup){ const x=clone(c); x.id=uid("case"); x.title=c.title+"（複製）"; W.cases.splice(sel+1,0,x); sel++; touch(); renderAdmin(); window.scrollTo({top:0}); }
    else if(d.delcase){
      overlay(`<span class="label">刪除關卡</span><h2>刪除「${esc(c.title)}」？</h2><p>刪除後按「儲存並發佈」才會真的生效，在那之前重新整理頁面就能復原。</p>
        <div class="row"><button class="big" data-close="1">取消</button><button class="big red" data-confirmdel="1">刪除</button></div>`);
    }
    else if(d.addchar){ const k=uid("c"); c.chars[k]={name:"新嫌疑犯",tag:"",desc:"",look:{}}; normalize(c); touch(); re(); }
    else if(d.delchar){ if(Object.keys(c.chars).length<=2) return; delete c.chars[d.delchar]; normalize(c); touch(); re(); }
    else if(d.addev){ const k=uid("e"); c.evidence[k]={name:"新證據",where:"",icon:"magnifier",text:""}; normalize(c); touch(); re(); }
    else if(d.delev){ if(Object.keys(c.evidence).length<=1) return; delete c.evidence[d.delev]; normalize(c); touch(); re(); }
    else if(d.test){ normalize(c); const x=clone(c); x._test=true; startCase(x); }
    else if(d.save){ save(); }
    else if(d.io){ showIO(); }
  }
  if(d.confirmdel){ W.cases.splice(sel,1); sel=Math.max(0,sel-1); touch(); $("#ov").hidden=true; renderAdmin(); window.scrollTo({top:0}); }
  if(d.copy){ const ta=$("#io-text"); try{ await navigator.clipboard.writeText(ta.value); $("#io-msg").textContent="已複製。"; }catch(err){ ta.focus(); ta.select(); $("#io-msg").textContent="請按 Ctrl+C（或長按）複製已選取的文字。"; } }
  if(d.import){
    try{
      const v=JSON.parse($("#io-text").value);
      if(!v||!Array.isArray(v.cases)||!v.cases.length) throw new Error("需要有 cases 陣列，且至少一關。");
      v.cases.forEach(x=>{ if(!x.chars||!x.evidence) throw new Error("每一關都要有 chars 和 evidence。"); x.id=x.id||uid("case"); normalize(x); });
      W=v; sel=0; touch(); $("#ov").hidden=true; renderAdmin();
    }catch(err){ $("#io-msg").textContent="匯入失敗："+err.message; }
  }
});

/* ===== 權限 ===== */
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
    artifactNS=a;
    canEdit=!!(u && await u.canEdit());
    let draft=null; try{draft=sessionStorage.getItem("ac-draft")}catch(e){}
    if(canEdit && view==="home") renderHome();
    if(canEdit && draft && JSON.stringify(JSON.parse(draft))!==JSON.stringify(DATA) && view==="home"){ openAdmin(); }
  }catch(e){}
})();
</script>
