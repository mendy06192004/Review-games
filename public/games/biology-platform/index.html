<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>生物大平台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a lab-bench lobby of four specimen cards; each game runs in one full-height stage under a sticky HUD. Single bright theme by choice. */
:root{
  --bg:#E9F7EF; --bg2:#D4F0E2; --paper:#FFFFFF; --ink:#0F3A40; --ink2:#4B6B6E;
  --leaf:#22A86A; --leaf-d:#15804F; --sun:#FFC93C; --sun-d:#E0A400;
  --mem:#E8456F; --nuc:#3D6FE0; --vio:#8A5CF6; --line:#BFE3CF;
  --ok:#1FAF5E; --bad:#F06548;
  --f-disp:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{background-image:radial-gradient(circle at 12% 18%,#fff8 0 60px,transparent 61px),radial-gradient(circle at 88% 70%,#fff6 0 90px,transparent 91px),radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:auto,auto,22px 22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--nuc);outline-offset:3px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;text-wrap:balance;margin:0}
.screen{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}

/* Lobby */
#lobby{padding-block:22px 40px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand svg{width:64px;height:64px;flex:none}
.brand h1{font-size:clamp(34px,7vw,56px);line-height:1.05;color:var(--ink);letter-spacing:.02em}
.brand h1 span{color:var(--leaf)}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.modebar{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--paper);padding:8px;border-radius:22px;border:2px solid var(--line);max-width:620px}
.modebtn{border-radius:16px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;transition:background .2s,transform .15s}
.modebtn svg{width:40px;height:40px;flex:none}
.modebtn b{display:block;font-family:var(--f-disp);font-size:19px;font-weight:400}
.modebtn small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.modebtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.modebtn[aria-pressed="true"] small{color:#CFE9DC}
.modebtn:active{transform:scale(.97)}
.grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.gcard{position:relative;text-align:left;background:var(--paper);border-radius:26px;padding:16px 16px 18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:transform .18s,box-shadow .18s;overflow:hidden;min-width:0}
.gcard:hover{transform:translateY(-4px);box-shadow:0 12px 0 -4px var(--c)}
.gcard:active{transform:scale(.98)}
.gcard .art{height:130px;border-radius:18px;background:var(--cbg);display:grid;place-items:center}
.gcard .art svg{height:116px;width:auto;max-width:100%}
.gcard .tag{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--c)}
.gcard h3{font-size:24px;line-height:1.2}
.gcard p{margin:0;color:var(--ink2);font-size:14px}
.gcard .best{margin-top:auto;font-family:var(--f-num);font-size:14px;color:var(--ink2)}
.gcard .best b{color:var(--ink);font-size:18px}
.foot{margin-top:26px;color:var(--ink2);font-size:13px}

/* HUD + stage */
#game{display:flex;flex-direction:column;height:100%;min-height:100%}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-size:14px}
.back svg{width:18px;height:18px}
.hud h2{font-size:20px;flex:1;min-width:120px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--f-num);font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
.chip.mode{font-family:var(--f-disp);font-weight:400;font-size:14px;background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .3s}
#stage{flex:1;position:relative;max-width:1040px;width:100%;margin:0 auto 16px;min-height:0}

/* Shared game bits */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px}
.q{font-family:var(--f-disp);font-size:clamp(19px,4.4vw,26px);line-height:1.35;text-align:center;margin:4px 0 12px}
.q em{font-style:normal;color:var(--mem)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.opt{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:14px 12px;font-size:18px;font-weight:700;transition:transform .12s,border-color .12s,background .2s}
.opt:hover{border-color:var(--leaf)}
.opt:active{transform:scale(.97)}
.opt.right{background:#D9F7E5;border-color:var(--ok)}
.opt.wrong{background:#FFE3DC;border-color:var(--bad);animation:shake .35s}
.btn{background:var(--leaf);color:#fff;border-radius:999px;padding:12px 26px;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--leaf-d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.alt{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}

/* Game 1: cell defense */
.g1{display:flex;flex-direction:column;gap:10px;height:100%}
.field{position:relative;flex:1;min-height:340px;border-radius:28px;overflow:hidden;background:#FFF6D6;border:3px solid #F3D277}
.field>svg.bgcell{position:absolute;inset:0;width:100%;height:100%}
.danger{position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(-45deg,#F0654833 0 12px,transparent 12px 24px);border-top:2px dashed var(--bad)}
.bubble{position:absolute;left:50%;width:min(86%,420px);transform:translateX(-50%);background:var(--paper);border:3px solid var(--mem);border-radius:22px;padding:10px 14px 10px 64px;font-weight:700;font-size:clamp(15px,3.6vw,19px);line-height:1.4;box-shadow:0 6px 0 #E8456F44}
.bubble svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:44px;height:44px}
.bubble.hit{animation:pop .3s reverse forwards}
.towers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tower{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px;transition:transform .1s}
.tower svg{width:100%;max-width:70px;height:52px}
.tower:active{transform:scale(.94)}
.tower.flash{background:#D9F7E5;border-color:var(--ok)}
.tower.no{background:#FFE3DC;border-color:var(--bad)}
.lives{display:flex;gap:4px}
.lives svg{width:20px;height:20px}

/* Game 2: customs */
.g2{display:flex;flex-direction:column;gap:12px;height:100%}
.desk{display:flex;justify-content:center;align-items:center;min-height:250px;position:relative}
.card{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--paper);border:3px solid var(--ink);border-radius:24px;width:min(300px,82vw);padding:12px 14px 14px;text-align:center;box-shadow:0 8px 0 var(--ink);cursor:grab;animation:pop .35s}
.card.drag{cursor:grabbing;box-shadow:0 18px 30px #0F3A4033;position:fixed;z-index:30;animation:none}
.card .stamp{font-size:12px;letter-spacing:.12em;font-weight:900;color:var(--ink2)}
.card svg{width:150px;height:120px;display:block;margin:4px auto}
.card b{font-family:var(--f-disp);font-weight:400;font-size:26px;display:block}
.card small{display:block;color:var(--ink2);font-size:14px;line-height:1.4;margin-top:2px}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gate{border-radius:20px;padding:10px 6px;border:3px dashed var(--gc);background:var(--gbg);font-family:var(--f-disp);font-size:clamp(15px,3.6vw,19px);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.gate svg{width:34px;height:34px}
.gate small{font-family:var(--f-body);font-size:11.5px;color:var(--ink2)}
.gate.over{transform:scale(1.06);border-style:solid}
.gate.flash{background:#D9F7E5;border-color:var(--ok);border-style:solid}
.gate.no{background:#FFE3DC;border-color:var(--bad);animation:shake .35s}
.hint{text-align:center;color:var(--ink2);font-size:13px}

/* Game 3: ecosystem */
.chain{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 12px}
.node{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:6px 6px 4px;width:clamp(74px,17vw,118px);font-weight:700;font-size:14px;transition:transform .12s}
.node svg{width:100%;height:64px}
.node.tap:hover{border-color:var(--leaf);transform:translateY(-3px)}
.node.right{background:#D9F7E5;border-color:var(--ok)}
.node.wrong{background:#FFE3DC;border-color:var(--bad);animation:shake .35s}
.node.hl{border-color:var(--mem);box-shadow:0 0 0 4px #E8456F33}
.arrow{width:24px;height:20px;flex:none}
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;margin:4px 0 12px}
.pyr div{border-radius:10px;padding:6px 8px;color:#fff;font-weight:700;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.decomp{display:flex;justify-content:center;margin-top:-4px}

/* Game 4: genetics */
.punnett{display:grid;grid-template-columns:56px repeat(2,minmax(70px,110px));grid-template-rows:48px repeat(2,minmax(62px,90px));gap:6px;justify-content:center;margin:8px auto 14px}
.punnett .h{display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:24px;border-radius:14px;background:var(--bg2)}
.punnett .h.m{background:#DCE6FF;color:var(--nuc)}
.punnett .h.f{background:#FFE0EA;color:var(--mem)}
.pcell{border:2.5px dashed var(--ink2);border-radius:16px;font-family:var(--f-num);font-weight:800;font-size:28px;background:var(--paper)}
.pcell.set{border-style:solid;border-color:var(--nuc)}
.pcell.right{background:#D9F7E5;border-color:var(--ok)}
.pcell.wrong{background:#FFE3DC;border-color:var(--bad)}
.dna{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:10px 0}
.pair{display:flex;flex-direction:column;align-items:center;gap:4px}
.pair .rung{width:4px;height:18px;background:var(--line);border-radius:2px}
.base{width:clamp(30px,7.4vw,44px);height:clamp(36px,8.6vw,50px);border-radius:12px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:clamp(18px,4.6vw,24px);color:#fff}
.base.empty{background:var(--paper);border:2.5px dashed var(--ink2);color:var(--ink)}
.base.empty.cur{border-style:solid;border-color:var(--mem);box-shadow:0 0 0 4px #E8456F33}
.base.wrong{outline:3px solid var(--bad)}
.bA{background:#E8456F}.bT{background:#F59E0B}.bG{background:#22A86A}.bC{background:#3D6FE0}
.pad{display:flex;justify-content:center;gap:10px;margin:8px 0 12px}
.pad button{width:58px;height:58px;border-radius:18px;font-family:var(--f-num);font-weight:800;font-size:26px;color:#fff;box-shadow:0 4px 0 #0002}
.pad button:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chromo{display:block;margin:0 auto 8px;max-width:100%;height:auto}

/* Result */
#result{display:grid;place-items:center;padding-block:30px}
.rcard{background:var(--paper);border:3px solid var(--ink);border-radius:32px;padding:24px 22px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 0 var(--ink);animation:pop .45s}
.rstars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.rstars svg{width:66px;height:66px}
.rstars svg:nth-child(2){width:84px;height:84px;margin-top:-12px}
.rscore{font-family:var(--f-num);font-weight:800;font-size:64px;line-height:1;color:var(--leaf)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.rgrid div{background:var(--bg);border-radius:16px;padding:8px 4px}
.rgrid b{display:block;font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.rgrid small{color:var(--ink2);font-size:12.5px}
.rmsg{color:var(--ink2);margin:0 0 16px}

/* Tip sheet + toast */
#tip{position:fixed;inset:0;z-index:40;display:grid;place-items:end center;background:#0F3A4055;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tipbox{background:var(--paper);border-radius:28px;max-width:520px;width:100%;padding:18px 20px 20px;border:3px solid var(--sun);animation:pop .3s;display:flex;gap:14px;align-items:flex-start}
.tipbox svg{width:64px;height:64px;flex:none}
.tipbox h3{font-size:21px;color:var(--sun-d)}
.tipbox p{margin:6px 0 4px}
.tipbox .ans{font-weight:700;color:var(--leaf-d)}
.tipbox .btn{margin-top:10px}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:45;background:var(--leaf);color:#fff;font-family:var(--f-disp);font-size:30px;padding:8px 28px;border-radius:999px;box-shadow:0 6px 0 var(--leaf-d);pointer-events:none;animation:pop .3s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.sound{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;width:46px;height:46px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center}
.sound svg{width:24px;height:24px}

@media (max-width:520px){
  .towers{gap:5px}.tower{font-size:12px;border-radius:14px}.tower svg{height:42px}
  .gates{gap:7px}
  .modebtn svg{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div></div>

<style>
[hidden]{display:none!important}
/* ===== 第二版：動作玩法樣式 ===== */
.hearts{display:flex;gap:3px}.hearts svg{width:22px;height:22px}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:44;display:flex;align-items:center;gap:10px;background:#FFFBEA;border:3px solid var(--sun);border-radius:22px;padding:8px 16px 8px 8px;max-width:min(92vw,520px);box-shadow:0 8px 0 #E0A40033;font-weight:700;font-size:16px;line-height:1.4;animation:pop .3s;pointer-events:none}
#hint svg{width:48px;height:48px;flex:none}
.pop{position:fixed;z-index:46;pointer-events:none;font-family:var(--f-num);font-weight:800;font-size:28px;color:var(--leaf);text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:rise .9s forwards}
.pop.bad{color:var(--bad);font-family:var(--f-disp);font-size:22px}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}}
@keyframes boom{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@keyframes wob{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-50%) rotate(4deg)}}

/* 細胞防衛戰 */
.arena{position:relative;height:min(46vh,440px);min-height:260px;border-radius:50% / 40%;overflow:hidden;background:radial-gradient(circle at 50% 50%,#FFFDF2 0 30%,#FFF4C9 70%);border:6px solid #8CD45C;box-shadow:inset 0 0 0 6px #C9F0A8}
.nuc{position:absolute;left:50%;top:50%;width:96px;height:96px;transform:translate(-50%,-50%);transition:transform .2s}
.nuc.hurt{animation:shake .4s}
.enemy{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;cursor:pointer;touch-action:manipulation}
.enemy .mon{width:62px;height:62px;animation:wob 1.2s ease-in-out infinite}
.enemy .need{background:#fff;border:2.5px solid var(--ec);border-radius:12px;padding:1px 7px;font-weight:900;font-size:13px;line-height:1.35;text-align:center;display:flex;align-items:center;gap:3px;white-space:nowrap}
.enemy .need svg{width:18px;height:18px;flex:none}
.enemy.tgt::before{content:"";position:absolute;left:50%;top:31px;width:78px;height:78px;transform:translate(-50%,-50%);border:3px dashed var(--mem);border-radius:50%;animation:spin 3s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.enemy.dead{animation:boom .35s forwards;pointer-events:none}
.enemy.dead .mon{animation:none}
.shot{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);transition:left .22s linear,top .22s linear;z-index:3}
.shot svg{width:100%;height:100%}
.towers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.tower{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:900;font-size:15px;box-shadow:0 5px 0 var(--line);transition:transform .08s}
.tower>svg{width:100%;max-width:84px;height:58px}
.tower:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tower .badge{position:absolute;top:-10px;right:-6px;width:32px;height:32px;background:#fff;border-radius:50%;padding:4px;border:2px solid var(--line)}
.tower .badge svg{width:100%;height:100%}

/* 生物海關：輸送帶 */
.belt{position:relative;height:230px;border-radius:26px;background:linear-gradient(#EAF6FF,#D3ECFF);overflow:hidden;border:3px solid #9CCBEB}
.belt .track{position:absolute;left:0;right:0;bottom:16px;height:30px;background:repeating-linear-gradient(90deg,#33424D 0 26px,#45576A 26px 52px);border-block:4px solid #22303A;animation:roll 1s linear infinite}
.belt.fast .track{animation-duration:.55s}
@keyframes roll{to{background-position:52px 0}}
.belt .endzone{position:absolute;right:0;top:0;bottom:0;width:56px;background:repeating-linear-gradient(-45deg,#F0654833 0 10px,transparent 10px 20px);border-left:3px dashed var(--bad)}
.item{position:absolute;bottom:42px;width:150px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:4px 8px 8px;text-align:center;box-shadow:0 6px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.item svg{width:118px;height:94px;display:block;margin:0 auto}
.item b{font-family:var(--f-disp);font-weight:400;font-size:21px;display:block;line-height:1.2}
.item small{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.item.drag{position:fixed;bottom:auto;z-index:30;cursor:grabbing;box-shadow:0 16px 28px #0F3A4040}
@keyframes vanish{to{transform:scale(1.4);opacity:0}}.item.gone{animation:vanish .3s forwards;pointer-events:none}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gates.three{grid-template-columns:repeat(3,1fr)}
.gate{border-radius:22px;padding:8px 6px 10px;border:3px solid var(--gc);background:var(--gbg);font-family:var(--f-disp);font-size:clamp(16px,3.8vw,20px);display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 5px 0 var(--gc);transition:transform .1s;animation:pop .3s}
.gate>svg{width:58px;height:46px}
.gate small{font-family:var(--f-body);font-size:12px;color:var(--ink2)}
.gate:active,.gate.over{transform:translateY(3px) scale(1.04)}
.gate.flash{background:#D9F7E5;border-color:var(--ok)}
.gate.no{background:#FFE3DC;animation:shake .35s}

/* 食物鏈 */
.slots{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.slot{width:clamp(62px,15vw,96px);aspect-ratio:1;border-radius:22px;border:3px dashed #9CB8AE;background:#ffffffaa;display:grid;place-items:center;position:relative;font-size:12px;color:var(--ink2);font-weight:700;text-align:center;line-height:1.2;padding:4px}
.slot.on{border:3px solid var(--leaf);background:#fff;animation:pop .3s}
.slot svg{width:100%;height:100%}
.slot .lb{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--leaf-d)}
.pond{position:relative;height:min(46vh,360px);min-height:250px;border-radius:30px;background:radial-gradient(circle at 30% 20%,#fff 0 12%,transparent 40%),linear-gradient(#E9F8E4,#CDEFD8);border:3px solid #9BD9B0;overflow:hidden;margin-top:26px}
.bub{position:absolute;transform:translate(-50%,-50%);width:clamp(84px,21vw,124px);aspect-ratio:1;border-radius:50%;background:#ffffffd9;border:3px solid #fff;box-shadow:0 6px 14px #15804F22,inset 0 -6px 0 #CDEFD8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:14px;animation:bob 2.4s ease-in-out infinite;touch-action:manipulation}
.bub svg{width:72%;height:58%}
.bub.no{border-color:var(--bad);background:#FFE3DC}
.bub.used{animation:boom .3s forwards;pointer-events:none}
.bub .tag{position:absolute;top:-8px;right:-4px;width:30px;height:30px;background:#fff;border-radius:50%;padding:3px;border:2px solid var(--sun)}
.rule{display:inline-flex;align-items:center;gap:6px;background:#FFFBEA;border:2px solid var(--sun);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px}
.rule svg{width:20px;height:20px}
.cans{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.can{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:8px 10px;min-width:96px;font-family:var(--f-num);font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--line);transition:transform .08s}
.can svg{width:46px;height:66px}
.can:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.can.right{border-color:var(--ok);background:#D9F7E5}.can.wrong{border-color:var(--bad);background:#FFE3DC;animation:shake .35s}
.drip{position:absolute;width:22px;height:30px;animation:fall 1.4s ease-in infinite}
@keyframes fall{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}100%{transform:translateY(80px);opacity:0}}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:6px;flex-wrap:wrap;margin:6px 0}
.lineup .node{width:clamp(70px,17vw,110px)}

/* 解碼室 */
.zip{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.zip .pair{transition:transform .2s}
.zip .pair.now{transform:translateY(-6px)}
.zip .pair.now .base:first-child{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--mem)}
.timebar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0 10px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--mem),var(--sun));transition:width .2s linear}
.legend{display:flex;justify-content:center;gap:10px;margin-bottom:8px;font-family:var(--f-num);font-weight:800}
.legend span{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 10px}
.legend i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.pad button{width:68px;height:68px;font-size:30px}
.lock{display:flex;justify-content:center;margin-bottom:4px}
.lock svg{width:64px;height:64px;transition:transform .4s}
.lock.open svg{transform:rotate(-12deg) scale(1.1)}
.pcell.glow,.punnett .h.glow{box-shadow:0 0 0 4px var(--sun)}
.numpad{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.numpad .opt{width:64px;font-family:var(--f-num);font-size:26px}
@media (max-width:520px){.tower .badge{width:26px;height:26px;top:-8px}.tower>svg{height:46px}.item{width:132px}.item svg{width:100px;height:80px}.gates{gap:7px}.gate>svg{width:46px;height:38px}.pad button{width:58px;height:58px}}

.towers.six{grid-template-columns:repeat(6,1fr)}
@media (max-width:620px){.towers.six{grid-template-columns:repeat(3,1fr)}}
.towers{grid-template-columns:repeat(var(--n,5),1fr)}
.geno{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.gq{display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.gq b{min-width:58px;padding:8px 6px;border-radius:14px;background:#EAF0FF;color:#3552B8;font-family:var(--f-num);font-size:22px;text-align:center;line-height:1}
.gq span{min-width:58px;padding:4px 6px;border-radius:12px;border:2.5px dashed var(--ink2);text-align:center;font-weight:900;font-size:15px}
.gq.now{transform:translateY(-6px)}.gq.now b{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--mem)}
.gq.ok span{border:2.5px solid var(--ok);background:#D9F7E5;color:var(--leaf-d)}
.ptype{flex-wrap:wrap}.ptype button{width:auto;min-width:76px;padding:0 16px;font-family:var(--f-disp);font-size:22px;border-radius:18px;color:#fff}
.tb0{background:#4C6FE0}.tb1{background:#F0506E}.tb2{background:#9B5DE5}.tb3{background:#F5A524}
.pcell{font-size:24px}.pcell sup,.punnett .h sup{font-size:.6em}
.legend span b{font-family:var(--f-num);font-size:18px}
</style>
<div id="hint" hidden></div>
<style>
/* ===== 第三版：共用玩法樣式 ===== */
.lane{position:relative;height:min(40vh,300px);min-height:220px;border-radius:24px;background:linear-gradient(#F4FBF7,#E2F3E9);border:3px solid var(--line);overflow:hidden}
.lane .floor{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(-45deg,#F0654833 0 8px,transparent 8px 16px);border-top:2px dashed var(--bad)}
.faller{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:20px;padding:6px 14px 8px;display:flex;flex-direction:column;align-items:center;max-width:82%;box-shadow:0 5px 0 var(--ink)}
.faller svg{width:84px;height:66px}
.faller b{font-family:var(--f-disp);font-weight:400;font-size:clamp(17px,4.4vw,22px);text-align:center;line-height:1.25}
.faller.good{animation:vanish .35s forwards;border-color:var(--ok)}
.faller.bad{animation:shake .35s;border-color:var(--bad);background:#FFE3DC}
.bins{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin-top:12px}
.bin{border-radius:20px;padding:14px 8px;background:var(--bc);color:#fff;font-family:var(--f-disp);font-size:clamp(17px,4.4vw,22px);box-shadow:0 5px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.bin svg{width:34px;height:34px}
.bin:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.bin.no{animation:shake .35s}
.kb{margin-top:8px}
@media (hover:none){.kb{display:none}}
.oslots{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;margin:6px 0 14px}
.os{min-width:62px;min-height:48px;padding:4px 8px;border-radius:14px;border:2.5px dashed #9CB8AE;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px;background:#fff;text-align:center;line-height:1.2}
.os .n{color:#9CB8AE;font-family:var(--f-num);font-size:20px}
.os.on{border:2.5px solid var(--leaf);background:#E7F7EE;color:var(--leaf-d);animation:pop .3s}
.os .ci svg,.chip .ci svg{width:42px;height:32px;display:block}
.sep{font-style:normal;color:#9CB8AE;font-weight:900;font-size:20px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--line)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip.used{opacity:.25;box-shadow:none}
.shake{animation:shake .35s}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{text-align:center;color:var(--ink2);font-size:13px}
.pb{background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;font-weight:700;font-size:15px;line-height:1.35;min-height:52px;box-shadow:0 4px 0 var(--line)}
.pb.sel{border-color:var(--nuc);background:#EAF0FF;transform:translateY(-2px)}
.pb.lock{background:var(--pc);border-color:var(--pc);color:#fff;box-shadow:none;opacity:.92}
.mem{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;max-width:560px;margin:0 auto}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{position:relative;aspect-ratio:1/0.82;max-width:100%;border-radius:16px;perspective:600px;padding:0;background:none}
.mc span{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:6px;backface-visibility:hidden;transition:transform .35s;font-weight:900;font-size:clamp(13px,3.4vw,16px);line-height:1.3;text-align:center}
.mc .back{background:repeating-linear-gradient(45deg,#4CC38A 0 10px,#3FB27A 10px 20px);border:3px solid #2E9E68}
.mc .front{background:#fff;border:3px solid var(--line);transform:rotateY(180deg)}
.mc.s1 .front{background:#FFF8E6}
.mc.open .back{transform:rotateY(180deg)}.mc.open .front{transform:rotateY(0)}
.mc.done .front{border-color:var(--ok);background:#D9F7E5}
.ask{text-align:center;font-weight:900;font-size:18px;margin:0 0 8px}
.ask em{font-style:normal;color:#fff;background:var(--mem);border-radius:999px;padding:2px 14px}
.hs{display:flex;justify-content:center}
.hs svg{width:min(100%,420px);height:auto}
.hs [data-h]{cursor:pointer;transition:opacity .15s}
.hs [data-h]:hover{opacity:.8}
.hs [data-h].hit{opacity:.55}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.found span{background:#D9F7E5;color:var(--leaf-d);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.picopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.pico{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px;box-shadow:0 4px 0 var(--line)}
.pico svg{width:100%;max-width:150px;height:96px}
.pico.right{background:#D9F7E5;border-color:var(--ok)}.pico.wrong{background:#FFE3DC;border-color:var(--bad);animation:shake .35s}
.pic{display:flex;justify-content:center;margin:0 0 10px}.pic svg{width:min(100%,320px);height:auto}
/* 顯微鏡視野 */
.view{position:relative;width:200px;height:200px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle,#FFFDF2 0 60%,#F1EBD0 100%);border:8px solid #33424D;overflow:hidden}
.view .cross{position:absolute;inset:0;background:linear-gradient(#0000 49.5%,#33424D22 49.5% 50.5%,#0000 50.5%),linear-gradient(90deg,#0000 49.5%,#33424D22 49.5% 50.5%,#0000 50.5%)}
.view b{position:absolute;left:50%;top:50%;font-family:"Baloo 2",serif;font-size:56px;line-height:1;color:#3552B8;transition:transform .45s}
.dpad{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center}
.dpad button{height:52px;border-radius:14px;background:#fff;border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:22px;font-weight:900;color:var(--ink)}
.dpad button:active{transform:translateY(3px);box-shadow:none}
.dpad .mid{visibility:hidden}
.glyph{font-family:"Baloo 2",serif;font-size:54px;line-height:1;color:#3552B8;display:inline-block}
/* 反應燈 */
.lamp{width:min(70vw,240px);aspect-ratio:1;border-radius:50%;margin:6px auto 12px;background:#F0506E;display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-size:24px;box-shadow:0 8px 0 #B83A55;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lamp.go{background:#2DBE7E;box-shadow:0 8px 0 #1E8F57}
.lamp.wait{background:#F5A524;box-shadow:0 8px 0 #C47F0A}
/* 恆定儀表 */
.gauges{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin-bottom:12px}
.gauge{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.gauge b{font-size:14px}
.gbar{position:relative;width:26px;height:140px;border-radius:13px;background:linear-gradient(#F0506E 0 15%,#FFE3DC 15% 35%,#D9F7E5 35% 65%,#DCE8FF 65% 85%,#4C6FE0 85%);overflow:visible}
.gbar i{position:absolute;left:-7px;right:-7px;height:6px;border-radius:3px;background:var(--ink);transform:translateY(50%);transition:bottom .25s linear}
.gauge.alert{border-color:var(--bad);animation:shake .4s}
.gauge small{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.event{background:#FFFBEA;border:3px solid var(--sun);border-radius:18px;padding:8px 12px;text-align:center;font-weight:900;font-size:18px;min-height:48px;margin-bottom:10px}

.act{background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;font-weight:900;font-size:15px;line-height:1.3;box-shadow:0 4px 0 var(--line)}

.gcard .ch{position:absolute;top:12px;right:12px;background:#fff;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:900;color:var(--c);border:2px solid var(--c)}
</style>
<script>
/* ===== 圖庫 A：簡潔扁平風格（色塊為主、無陰影、無描邊） ===== */
const sv=(vb,inner)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round">${inner}</svg>`;
const DK='#23343C';

let AC=null;

function tone(f,t,d,type='triangle',v=.18){const a=ac();if(!a||!S.sound)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+t);g.gain.linearRampToValueAtTime(v,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}
function noise(t,d,v=.12){const a=ac();if(!a||!S.sound)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n)*(0.6+0.4*Math.sin(i/300));const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.7;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}

function starPath(x,y,r){cx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.closePath()}

 if(!fxRun){fxRun=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.a+=p.va;p.life-=.009;cx.save();cx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));cx.translate(p.x,p.y);cx.rotate(p.a);starPath(0,0,p.r);cx.fillStyle=p.c;cx.fill();cx.restore()}

/* ===== 共用玩法引擎 ===== */
/* 關卡流程：seq 為關卡代號陣列，R 為 {代號:(box,next)=>{}} */
function runRounds(st,seq,R,doneTitle){st.innerHTML='<div class="panel" id="rbox"></div>';const box=st.querySelector('#rbox');let i=0;const N=seq.length;
 const next=()=>{i++;go()};function go(){if(i>=N){finish(doneTitle);return}setProg(i,N);R[seq[i]](box,next)}
 startClock(null);go()}
/* 掉落分類：物品從上往下掉，點下方分類桶 */
function fallSort({box,title,bins,items,speed=9,next,sub=''}){const tok=S.tok;
 box.innerHTML=`<p class="q">${title}</p>${sub}<div class="lane"><div class="floor"></div></div><div class="bins" style="--n:${bins.length}">${bins.map(b=>`<button class="bin" data-b="${b.id}" style="--bc:${b.c}">${b.icon?b.icon:''}<span>${b.label}</span></button>`).join('')}</div>${bins.length===2?'<p class="hint kb">電腦可以用鍵盤 ← → 分類</p>':''}`;
 const lane=box.querySelector('.lane'),binEls=[...box.querySelectorAll('.bin')];let i=0,y=0,cur=null,el=null,alive=true,last=performance.now(),raf;
 const bl=id=>bins.find(b=>b.id===id).label;
 function spawn(){if(!alive||S.tok!==tok)return;if(i>=items.length){alive=false;later(next,500);return}
  cur=items[i];el=document.createElement('div');el.className='faller';el.innerHTML=(cur.a?ART[cur.a]():'')+`<b>${cur.t}</b>`;lane.appendChild(el);y=-10;el.style.top=y+'px'}
 function resolve(ok){const e=el;cur=null;e.classList.add(ok?'good':'bad');later(()=>e.remove(),380);i++;later(spawn,ok?420:900)}
 function loop(t){if(!alive||S.tok!==tok)return;const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!S.paused&&cur){y+=(lane.clientHeight)/speed*dt;el.style.top=y+'px';
   if(y>lane.clientHeight-el.offsetHeight-6){const c=cur;miss(`來不及了！「${c.t}」屬於「${bl(c.bin)}」。${c.why||''}`);resolve(false)}}
  raf=requestAnimationFrame(loop)}

 binEls.forEach(b=>b.onclick=()=>pickBin(b));
 const key=e=>{if(S.tok!==tok){removeEventListener('keydown',key);return}if(bins.length!==2)return;if(e.key==='ArrowLeft')pickBin(binEls[0]);if(e.key==='ArrowRight')pickBin(binEls[1])};
 addEventListener('keydown',key);spawn();raf=requestAnimationFrame(loop)}
/* 依序點選：items 為正確順序，decoys 為干擾項 {t,why} */
function orderTap({box,title,items,decoys=[],next,pre=0,sub='',hintFn,arts}){
 const chips=shuffle(items.slice(pre).map(t=>({t})).concat(decoys.map(d=>({t:d.t,why:d.why,dec:1}))));

 box.innerHTML=`<p class="q">${title}</p>${sub}<div class="oslots">${items.map((t,k)=>`${k?'<i class="sep">›</i>':''}<div class="os${k<pre?' on':''}" data-s="${k}">${k<pre?lab(t):`<span class="n">${k+1}</span>`}</div>`).join('')}</div><div class="chips">${chips.map((c,j)=>`<button class="chip" data-j="${j}">${lab(c.t)}</button>`).join('')}</div>`;
 let pos=pre,done=false;
 box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(done||S.paused)return;const c=chips[+b.dataset.j];
  if(!c.dec&&c.t===items[pos]){const s=box.querySelector(`.os[data-s="${pos}"]`);s.innerHTML=lab(c.t);s.classList.add('on');b.disabled=true;b.classList.add('used');tone(523+pos*90,0,.14);pos++;
   if(pos===items.length){done=true;right(box.querySelector('.oslots'));later(next,900)}}
  else{b.classList.add('shake');later(()=>b.classList.remove('shake'),400);miss(c.dec?c.why:(hintFn?hintFn(pos,c.t):`「${c.t}」不是下一個，想想「${items[pos-1]||'開頭'}」之後是誰？`),b)}})}
/* 配對連線：pairs [[左,右]] */
function pairUp({box,title,pairs,next,sub='',lt='',rt=''}){const L=shuffle(pairs.map((p,k)=>({t:p[0],k}))),Rr=shuffle(pairs.map((p,k)=>({t:p[1],k})));const cols=['#4C6FE0','#F0506E','#2E9E68','#F5A524','#9B5DE5','#1FA3A3','#C9761A','#5B8DEF'];
 box.innerHTML=`<p class="q">${title}</p>${sub}<div class="pairs"><div class="pc">${lt?`<b class="ph">${lt}</b>`:''}${L.map(x=>`<button class="pb" data-s="L" data-k="${x.k}">${x.t}</button>`).join('')}</div><div class="pc">${rt?`<b class="ph">${rt}</b>`:''}${Rr.map(x=>`<button class="pb" data-s="R" data-k="${x.k}">${x.t}</button>`).join('')}</div></div>`;
 let sel=null,left=pairs.length;
 box.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{if(S.paused||b.classList.contains('lock'))return;
  if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove('sel');sel=b;b.classList.add('sel');SFX.tap();return}
  const a=sel;sel=null;a.classList.remove('sel');
  if(a.dataset.k===b.dataset.k){const c=cols[(pairs.length-left)%cols.length];[a,b].forEach(x=>{x.classList.add('lock');x.style.setProperty('--pc',c)});right(b);left--;if(!left)later(next,800)}
  else{const lA=a.dataset.s==='L'?a:b;const p=pairs[+lA.dataset.k];[a,b].forEach(x=>{x.classList.add('shake');later(()=>x.classList.remove('shake'),400)});miss(`「${p[0]}」要配「${p[1]}」。`,b)}})}
/* 翻牌記憶：pairs [[a,b]] */
function memory({box,title,pairs,next,peek=3000,hard=false}){const cards=shuffle(pairs.flatMap(([a,b],k)=>[{t:a,k,side:0},{t:b,k,side:1}]));const seen=new Set();

 const els=[...box.querySelectorAll('.mc')];let first=null,lock=true,left=pairs.length;

GAMES.cell={name:'細胞防衛戰',start(st,mode){

  const f={t,el,p:0,a,fast:1,need};el.onclick=()=>{target=f;mark()};arena.appendChild(el);foes.push(f);place(f)}

 st.querySelectorAll('.tower').forEach(b=>b.onclick=()=>{if(!alive||S.paused||cool>0)return;mark();const f=target;if(!f)return;cool=.25;SFX.tap();

  later(()=>{sh.remove();if(!foes.includes(f))return;
   if(o===f.t){foes.splice(foes.indexOf(f),1);f.el.classList.add('dead');right(f.el);later(()=>f.el.remove(),400);mark()}

GAMES.kingdom={name:'生物海關審查員',start(st,mode){
 const hard=mode==='hard',N=hard?14:10,CROSS=hard?6.5:11;
 const pool=hard?ORGS:ORGS.filter(o=>o.lv===0);let list=shuffle(pool);while(list.length<N)list=list.concat(shuffle(pool));list=list.slice(0,N);
 let i=0,lives=3,x=0,cur=null,el=null,drag=false,busy=true,alive=true,raf=0,last=performance.now();
 st.innerHTML=`<div class="belt${hard?' fast':''}" id="belt"><div class="track"></div><div class="endzone"></div></div><div class="gates" id="gates"></div>
  <p class="hint" style="margin-top:10px">${hard?'六個閘門全開、輸送帶加速，放錯也會扣愛心！':'把生物拖進閘門，或直接點閘門。掉進紅色區就來不及了！'}</p>`;
 const belt=st.querySelector('#belt'),gw=st.querySelector('#gates');hearts(lives);
 const gateHTML=k=>`<button class="gate" data-k="${k.id}" style="--gc:${k.c};--gbg:${k.bg}">${ART[k.ic]()}<span>${k.name}</span>${hard?'':`<small>${k.sub}</small>`}</button>`;

 if(hard){gw.innerHTML=KD.map(gateHTML).join('');bindGates()}

/* ===== 遊戲三：生態系食物網 ===== */

 {nodes:[['grass','草'],['hopper','蚱蜢'],['frog','青蛙'],['snake','蛇'],['hawk','老鷹']],dec:['shroom','蕈類']},
 {nodes:[['algae','浮游藻'],['zoo','浮游動物'],['fish','小魚'],['bigfish','大魚'],['gull','海鷗']],dec:['bacteria','細菌']}];
const ROLE=['生產者','初級消費者','次級消費者','三級消費者','四級消費者'];
const SPOTS={3:[[22,34],[52,68],[80,36]],5:[[18,30],[50,24],[82,30],[30,72],[70,72]],6:[[17,30],[50,24],[83,30],[22,74],[52,72],[82,74]]};
GAMES.eco={name:'生態系食物網',start(st,mode){
 const hard=mode==='hard',len=hard?5:3;
 const seq=hard?['chain',...shuffle(['chain','chain','energy','energy2','ddt','ddtWhy','dec','pop','rel'])]:['chain',...shuffle(['chain','chain','chain','energy','energy','ddt','ddt','dec','dec'])];
 const N=seq.length;let i=0;st.innerHTML=`<div class="panel" id="eco"></div>`;const box=st.querySelector('#eco');
 const next=()=>{i++;round()};
 const nodeHTML=(a,n,lab,tap,k)=>`<${tap?'button':'div'} class="node${tap?' tap':''}" data-i="${k}">${ART[a]()}<span>${n}</span>${lab!=null?`<small style="font-family:var(--f-num);font-weight:800;color:var(--mem);font-size:15px">${lab}</small>`:''}</${tap?'button':'div'}>`;
 const lineup=(ns,labs=[],arrows=true,tap=false)=>`<div class="lineup">${ns.map((x,k)=>(k&&arrows?ART.arrow():'')+nodeHTML(x[0],x[1],labs[k],tap,x[2]??k)).join('')}</div>`;
 function pond(items,onTap){const p=box.querySelector('.pond');const spots=shuffle(SPOTS[items.length]);
  p.innerHTML=items.map((it,k)=>`<button class="bub" data-i="${it.i}" style="left:${spots[k][0]}%;top:${spots[k][1]}%;animation-delay:${(-Math.random()*2).toFixed(2)}s">${it.tag?`<span class="tag">${ICON.sun()}</span>`:''}${ART[it.a]()}<span>${it.n}</span></button>`).join('');
  p.querySelectorAll('.bub').forEach(b=>b.onclick=()=>{if(!S.paused)onTap(b.dataset.i,b)})}
 function cans(html,opts,ans,tip){box.innerHTML=html+`<div class="cans">${opts.map(v=>`<button class="can" data-v="${v}">${ART.battery()}<span>${fmt(v)}</span></button>`).join('')}</div>`;let done=false;
  box.querySelectorAll('.can').forEach(b=>b.onclick=()=>{if(done||S.paused)return;done=true;
   if(+b.dataset.v===ans){b.classList.add('right');right(b);later(next,800)}
   else{b.classList.add('wrong');box.querySelector(`.can[data-v="${ans}"]`).classList.add('right');miss(tip,b);later(next,2600)}})}
 function round(){if(i>=N){finish('生態調查完成！');return}setProg(i,N);const ch=pick(CHAINS),ns=ch.nodes.slice(0,len),t=seq[i];
  if(t==='chain'){let pos=0,done=false;
   box.innerHTML=`<p class="q">${hard?'照<em>能量流動</em>的順序點泡泡，組出食物鏈！':'從<em>生產者</em>開始，誰被誰吃？依序點泡泡！'}</p>
    <div class="slots">${ns.map((n,k)=>`${k?ART.arrow():''}<div class="slot" data-s="${k}">${k===0&&!hard?ICON.sun():''}<span class="lb">${hard?'':ROLE[k]}</span></div>`).join('')}</div><div class="pond"></div>`;
   const items=ns.map(([a,n],k)=>({a,n,i:k,tag:!hard&&k===0}));if(hard)items.push({a:ch.dec[0],n:ch.dec[1],i:'d'});
   pond(items,(id,b)=>{if(done)return;
    if(id===String(pos)){const s=box.querySelector(`.slot[data-s="${pos}"]`);s.innerHTML=ART[ns[pos][0]]()+`<span class="lb">${hard?ns[pos][1]:ROLE[pos]}</span>`;s.classList.add('on');b.classList.add('used');tone(523+pos*130,0,.15);pos++;
     if(pos===len){done=true;right(box.querySelector('.slots'));later(next,900)}}
    else{b.classList.add('no');later(()=>b.classList.remove('no'),400);
     miss(id==='d'?'蕈類、細菌是分解者，不在捕食的食物鏈裡喔！':pos===0?(hard?'食物鏈要從生產者開始！':'先找有太陽標記、會行光合作用的生產者！'):`誰會吃掉「${ns[pos-1][1]}」？`,b)}})}
  else if(t==='energy'){const E=hard?pick([10000,20000,50000]):1000,k=1+(Math.random()*(len-1)|0),ans=E/Math.pow(10,k);
   const opts=hard?shuffle(uniq([ans,ans*10,ans/10,E-ans])):shuffle([ans,ans*10,ans/10]);
   cans(`<p class="q">${ns[0][1]}有 ${fmt(E)} 份能量，<em>${ns[k][1]}</em>能拿到多少？</p>${hard?'':`<p style="text-align:center;margin:0 0 6px"><span class="rule">${ICON.bolt()}每往上一級，能量只剩 1/10</span></p>`}`+lineup(ns,ns.map((_,j)=>j===0?fmt(E):j===k?'?':null)),opts,ans,`每往上一級只剩 1/10：${fmt(E)}${' ÷ 10'.repeat(k)} = ${fmt(ans)}。`)}
  else if(t==='energy2'){const top=pick([5,10,20]),n=len-1,ans=top*Math.pow(10,n);
   cans(`<p class="q"><em>${ns[n][1]}</em>想得到 ${top} 份能量，${ns[0][1]}最少要有多少？</p>`+lineup(ns,ns.map((_,j)=>j===n?top:j===0?'?':null)),shuffle(uniq([ans,ans/10,ans*10,top*n*10])),ans,`往下推，每一級都要乘以 10，共 ${n} 次：${top} × ${fmt(Math.pow(10,n))} = ${fmt(ans)}。`)}
  else if(t==='ddt'){const show=hard?shuffle(ns.map((x,k)=>[x[0],x[1],k])):ns;
   box.innerHTML=`<p class="q">有毒的<em>汙染物質</em>（例如汞）流進環境了！誰體內累積<em>最多</em>？點牠！</p><div style="position:relative">${lineup(show,[],!hard,true)}${[0,1,2].map(k=>`<span class="drip" style="left:${10+k*30}%;top:-10px;animation-delay:${k*.45}s">${ART.drop()}</span>`).join('')}</div><p class="hint">${hard?'順序被打亂了，想想誰在最頂端':'箭頭指向「吃牠的生物」'}</p>`;let done=false;
   box.querySelectorAll('.node').forEach(b=>b.onclick=()=>{if(done||S.paused)return;done=true;
    if(b.dataset.i===String(len-1)){b.classList.add('right');right(b);later(next,800)}
    else{b.classList.add('wrong');box.querySelector(`.node[data-i="${len-1}"]`).classList.add('right');miss(`汙染物質不易被生物排除，會隨食物鏈累積，愈高級的消費者濃度愈高，最頂端的${ns[len-1][1]}最多（生物放大作用）。`,b);later(next,2600)}})}
  else if(t==='dec'){box.innerHTML=`<p class="q">誰會把<em>落葉和屍體</em>分解掉，讓養分回到土裡？</p><div class="pond"></div>`;let done=false;
   const items=shuffle(ns).slice(0,hard?4:2).map(([a,n])=>({a,n,i:'x'})).concat([{a:ch.dec[0],n:ch.dec[1],i:'d'}]);
   pond(items,(id,b)=>{if(done)return;done=true;if(id==='d'){b.classList.add('used');right(b);later(next,800)}else{b.classList.add('no');miss(`${ch.dec[1]}是分解者！分解者會分泌酵素到體外，把遺體和排泄物分解，讓物質回到環境。`,b);later(next,2400)}})}
  else if(t==='ddtWhy'){const E=1;mcq(box,`<p class="q">${ns[0][1]}體內的汙染物質是 <em>1 ppm</em>，愈往上會怎樣？</p>`+lineup(ns,ns.map((_,j)=>j===0?'1 ppm':j===len-1?'?':null)),shuffle(['愈來愈高，最高級消費者最多','愈來愈低，最高級消費者最少','每一級都一樣','只會留在生產者體內']),'愈來愈高，最高級消費者最多','汙染物質不易被生物體排除，會隨食物鏈傳遞而累積：愈高級的消費者，體內濃度愈高（生物放大作用）。',next)}
  else if(t==='rel'){const R=pick([['硫化菌住在管蟲體內，管蟲給牠住所，牠給管蟲養分','互利共生'],['錐蟲住在人的血液裡，讓人得昏睡病','寄生'],['老鷹抓蛇來吃','掠食'],['兩種草長在一起，搶同一片陽光和水','競爭']]);mcq(box,`<p class="q">這是哪一種<em>互動關係</em>？</p><p class="q" style="font-size:18px;color:var(--ink2)">${R[0]}</p>`,['競爭','掠食','寄生','互利共生'],R[1],`${R[0]}：屬於${R[1]}。`,next)}
  else if(t==='pop'){const prey=ns[1][1],pred=ns[2][1];mcq(box,`<p class="q">如果<em>${pred}</em>被大量捕捉，短時間內<em>${prey}</em>會？</p>`+lineup(ns),['變多','變少','不變'],'變多',`吃${prey}的${pred}變少了，${prey}被吃掉的少，短期內會變多。`,next)}
 }
 startClock(null);round();
}};
</script>
<script>
/* ===== 遊戲四：遺傳學解碼室（課本：生殖、遺傳） ===== */
const TRAITS=[{L:'T',who:'豌豆莖的高度',d:'高莖',r:'矮莖'},{L:'R',who:'豌豆種子的形狀',d:'圓形',r:'皺皮'},{L:'Y',who:'豌豆子葉的顏色',d:'黃色',r:'綠色'}];
const ALBINO={L:'A',who:'膚色（白化症）',d:'正常',r:'白化症'};
const G=s=>s.replace(/I([AB])/g,'I<sup>$1</sup>');                       /* IA → I^A */
const allele=s=>s.match(/I[AB]|i|[A-Za-z]/g);
const rank=a=>a==='IA'?0:a==='IB'?1:a==='i'?2:a==='X'?0:a==='Y'?1:(a===a.toUpperCase()?0:1);
const gt=(a,b)=>rank(a)<=rank(b)?a+b:b+a;
const ABO=g=>({IAIA:'A',IAi:'A',IBIB:'B',IBi:'B',IAIB:'AB',ii:'O'})[g];
const FR=n=>['0','1/4','1/2','3/4','1'][n];
const lockSVG=open=>sv('0 0 64 64',`<path d="M20 30V20a12 12 0 0 1 24 0v10" stroke="#8A9AA6" stroke-width="6" fill="none" transform="${open?'translate(10 -8) rotate(18 44 30)':''}"/><rect x="12" y="28" width="40" height="30" rx="9" fill="${open?'#4CC38A':'#F5B82E'}"/><circle cx="32" cy="41" r="4.5" fill="${DK}"/><path d="M32 44v6" stroke="${DK}" stroke-width="4"/>`);
function chromoSVG(kind,top,cnt=4){const T=(x,y,s,txt,c='#0F3A40',w=700)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${s}" font-weight="${w}" fill="${c}" font-family="Noto Sans TC,Baloo 2,sans-serif">${txt}</text>`;
 const cell=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFF1CF"/>${Array.from({length:c},(_,k)=>{const a=k/c*Math.PI*2+.4,px=x+Math.cos(a)*r*.42,py=y+Math.sin(a)*r*.42;return `<rect x="${(px-3.5).toFixed(1)}" y="${(py-10).toFixed(1)}" width="7" height="20" rx="3.5" fill="${['#4C6FE0','#F0506E'][k%2]}" transform="rotate(${k*41} ${px.toFixed(1)} ${py.toFixed(1)})"/>`}).join('')}`;
 const q=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#E5B544" stroke-width="3" stroke-dasharray="5 4"/>`+T(x,y+8,22,'?','#F0506E',800);
 const arr=(x,lab)=>`<path d="M${x} 70h36M${x+26} 60l12 10-12 10" stroke="#7A9295" stroke-width="3.5" fill="none"/>`+T(x+18,50,13,lab,'#4B6B6E');
 let b;
 if(kind==='meio')b=cell(56,66,42,cnt)+T(56,130,14,top)+arr(112,'減數分裂')+[[194,38],[250,38],[194,102],[250,102]].map(([x,y])=>q(x,y,24)).join('');
 else if(kind==='mito')b=cell(56,66,42,cnt)+T(56,130,14,top)+arr(112,'細胞分裂')+[[204,70],[286,70]].map(([x,y])=>q(x,y,34)).join('');
 else b=cell(36,38,26,2)+cell(36,104,26,2)+T(100,43,13,'精子 '+top)+T(100,109,13,'卵 '+top)+arr(140,'受精')+q(250,70,40);
 return `<svg class="chromo" width="340" height="146" viewBox="0 0 340 146">${b}</svg>`}
let zipTick=null;
GAMES.gene={name:'遺傳學解碼室',start(st,mode){
 const hard=mode==='hard';
 const seq=hard?shuffle(['pun','pun','abo','abo','sex','rev','type','type','chr','chr']):['type','pun','chr','sex','type','chr','pun','chr'];
 const N=seq.length;let i=0;st.innerHTML=`<div class="panel" id="gene"></div>`;const box=st.querySelector('#gene');
 const next=()=>{clearInterval(zipTick);i++;round()};
 function round(){if(i>=N){finish('遺傳密碼破解！');return}setProg(i,N);({pun,abo,sex,rev,type,chr})[seq[i]]()}

 /* 表現型判斷機：限時連按 */
 function type(){let L,LIM,cards,btns,ans,legend,title;
  if(!hard){const T=pick(TRAITS),D=T.L,r=D.toLowerCase();L=6;LIM=40;cards=Array.from({length:L},()=>pick([D+D,D+r,D+r,r+r]));btns=[T.d,T.r];ans=g=>g===r+r?T.r:T.d;
   title=`${T.who}：看<em>基因型</em>，按出<em>表現型</em>！`;legend=`<div class="legend"><span>有大寫 <b>${D}</b> → ${T.d}</span><span>兩個小寫 <b>${r}${r}</b> → ${T.r}</span></div>`}
  else{L=10;LIM=30;cards=Array.from({length:L},()=>pick(['IAIA','IAi','IBIB','IBi','IAIB','ii']));btns=['A','B','AB','O'];ans=g=>ABO(g);
   title=`ABO 血型：看<em>基因型</em>，按出<em>血型</em>！`;legend=''}
  let k=0,left=LIM,done=false;
  box.innerHTML=`<p class="q">${title}</p>${legend}<div class="timebar"><i style="width:100%"></i></div><div class="geno"></div><div class="pad ptype">${btns.map((b,j)=>`<button class="tb${j}" data-b="${b}">${b}</button>`).join('')}</div>`;
  const row=box.querySelector('.geno'),bar=box.querySelector('.timebar i');
  const draw=()=>{row.innerHTML=cards.map((g,j)=>`<div class="gq${j===k?' now':''}${j<k?' ok':''}"><b>${G(g)}</b><span>${j<k?ans(g):'?'}</span></div>`).join('')};draw();
  clearInterval(zipTick);zipTick=setInterval(()=>{if(S.paused||done)return;left-=.1;bar.style.width=Math.max(0,left/LIM*100)+'%';if(left<=0){done=true;clearInterval(zipTick);miss(hard?'時間到！I<sup>A</sup>、I<sup>B</sup> 是顯性，i 是隱性，ii 才是 O 型。':'時間到！有大寫就是顯性的表現型。');later(next,2000)}},100);
  box.querySelectorAll('.pad button').forEach(p=>p.onclick=()=>{if(done||S.paused)return;
   if(p.dataset.b===ans(cards[k])){tone(440*Math.pow(2,k/12),0,.12,'square',.06);k++;draw();
    if(k===L){done=true;clearInterval(zipTick);right(row);if(left>LIM/2){S.score+=5;$('#gScore').textContent=S.score;later(()=>popAt(bar,'快手 +5'),300)}later(next,900)}}
   else miss(hard?`${G(cards[k])} 是 ${ans(cards[k])} 型喔！`:`${cards[k]} 有沒有大寫？答案是${ans(cards[k])}。`,p)})}

 /* 棋盤方格法密碼鎖（通用） */
 function grid({head,m,f,opts,after,tip}){const ansG=[gt(m[0],f[0]),gt(m[0],f[1]),gt(m[1],f[0]),gt(m[1],f[1])],ch=['?',...opts],cur=[0,0,0,0];
  box.innerHTML=`<div class="lock" id="lk">${lockSVG(false)}</div><p class="q">${head}<br>點格子，轉出子代的基因型！</p>
   <div class="punnett"><div></div><div class="h f" data-h="c0">${G(f[0])}</div><div class="h f" data-h="c1">${G(f[1])}</div><div class="h m" data-h="r0">${G(m[0])}</div><button class="pcell" data-c="0">?</button><button class="pcell" data-c="1">?</button><div class="h m" data-h="r1">${G(m[1])}</div><button class="pcell" data-c="2">?</button><button class="pcell" data-c="3">?</button></div>
   <div class="row"><button class="btn" id="chk">轉開密碼鎖</button></div>${hard?'':'<p class="hint">每一格 = 上面的一個 + 左邊的一個</p>'}`;
  const cells=[...box.querySelectorAll('.pcell')];
  cells.forEach(c=>c.onclick=()=>{const k=+c.dataset.c;cur[k]=cur[k]%(ch.length-1)+1;c.innerHTML=G(ch[cur[k]]);c.classList.add('set');tone(660,0,.05,'square',.05);
   if(!hard){box.querySelectorAll('.glow').forEach(x=>x.classList.remove('glow'));[`r${k>>1}`,`c${k&1}`].forEach(h=>box.querySelector(`[data-h="${h}"]`).classList.add('glow'))}});
  let checked=false;box.querySelector('#chk').onclick=function(){if(checked)return;if(cur.includes(0)){hint('還有格子是問號喔！',1500);return}checked=true;this.disabled=true;let ok=true;
   cells.forEach((c,k)=>{c.onclick=null;const g=ch[cur[k]]===ansG[k];c.classList.add(g?'right':'wrong');if(!g){ok=false;c.innerHTML=G(ansG[k])}});
   box.querySelectorAll('.glow').forEach(x=>x.classList.remove('glow'));
   const go=()=>after(ansG,box.querySelector('.punnett').outerHTML);
   if(ok){const lk=box.querySelector('#lk');lk.innerHTML=lockSVG(true);lk.classList.add('open');right(lk);later(go,900)}
   else{miss(tip,this);later(go,2600)}}}
 function pun(){const T=hard&&Math.random()<.35?ALBINO:pick(TRAITS),D=T.L,r=D.toLowerCase();
  const P=hard?[[D+r,D+r],[D+r,r+r],[D+D,D+r],[D+r,D+r]]:[[D+r,D+r],[D+D,r+r],[D+r,r+r]];const [m,f]=pick(P).map(s=>s.split(''));
  grid({head:`${T.who}：<em>${D}</em> 是${T.d}（顯性），${r} 是${T.r}（隱性）<br>親代 ${m.join('')} × ${f.join('')}`,m,f,opts:[D+D,D+r,r+r],tip:'每一格 = 上面的字母 + 左邊的字母，大寫寫在前面。',
   after:(ansG,gridHTML)=>{const domN=ansG.filter(g=>g!==r+r).length,recN=4-domN,hetN=ansG.filter(g=>g===D+r).length;
    if(!hard)return mcq(box,`<p class="q">4 格裡面，有幾格是<em>${T.d}</em>？</p>${gridHTML}<p class="hint">有大寫 ${D} 的格子就是${T.d}</p>`,[0,1,2,3,4],domN,`有大寫 ${D} 的格子就是${T.d}，共 ${domN} 格。`,next,'numpad');
    if(T===ALBINO)return mcq(box,`<p class="q">白化症是<em>隱性</em>遺傳疾病，孩子是白化症的機率？</p>${gridHTML}`,['0','1/4','1/2','3/4','1'],FR(recN),`要從爸媽各得到一個隱性的 a（aa）才會白化，共 ${recN} 格，機率 ${FR(recN)}。`,next);
    if(domN===3&&Math.random()<.5)return mcq(box,`<p class="q">子代中表現<em>${T.d}</em>的個體裡，${D}${r} 占多少？</p>${gridHTML}`,['1/3','1/2','2/3','3/4'],'2/3',`${T.d}有 ${D}${D}、${D}${r}、${D}${r} 三格，其中 ${D}${r} 兩格，所以是 2/3。`,next);
    if(Math.random()<.5)return mcq(box,`<p class="q">子代基因型是 <em>${D}${r}</em> 的機率？</p>${gridHTML}`,['0','1/4','1/2','3/4','1'],FR(hetN),`${D}${r} 有 ${hetN} 格，機率 ${hetN}/4。`,next);
    mcq(box,`<p class="q">子代表現型是<em>${T.d}</em>的機率？</p>${gridHTML}`,['0','1/4','1/2','3/4','1'],FR(domN),`含 ${D} 的有 ${domN} 格，機率 ${FR(domN)}。`,next)}})}
 function abo(){const [m,f]=pick([['IAi','IBi'],['IAIB','ii'],['IAi','IAi'],['IAIB','IAi'],['IBi','ii']]).map(allele);
  const opts=uniq(['IAIA','IAi','IBIB','IBi','IAIB','ii'].filter(g=>[gt(m[0],f[0]),gt(m[0],f[1]),gt(m[1],f[0]),gt(m[1],f[1])].includes(g)).concat(['IAIB','ii'])).slice(0,4);
  grid({head:`ABO 血型：I<sup>A</sup>、I<sup>B</sup> 為顯性，i 為隱性<br>父 ${G(m.join(''))} × 母 ${G(f.join(''))}`,m,f,opts,tip:'每一格各取父母一個等位基因，I<sup>A</sup> 寫前面、i 寫後面。',

 hearts(lives);

 function newEv(){if(k>=N){alive=false;draw();later(()=>finish('體內恆定守住了！'),500);return}setProg(k,N);k++;const e=pick(events);cur={g:e[0],dir:e[1],t:e[2]};st.querySelector('#ev').innerHTML=`<b>${e[2]}</b>：${G[e[0]].n}${e[1]>0?'上升中 ⬆':'下降中 ⬇'}`}
 function loop(t){if(!alive||S.tok!==tok)return;const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!S.paused){if(cur){v[cur.g]+=cur.dir*DRIFT*dt;if(v[cur.g]>=100||v[cur.g]<=0){const g=cur.g,hi=v[g]>50;cur=null;lives--;hearts(lives);v[g]=50;miss(`${G[g].n}失控了！${G[g].n}太${hi?'高':'低'}時要「${G[g][hi?'dn':'up'].b}」。`);if(lives<=0){alive=false;finish('身體失去恆定了！');return}gap=1.2}}
   else{gap-=dt;if(gap<=0)newEv()}
   keys.forEach(x=>{if(!cur||cur.g!==x)v[x]+=(50-v[x])*0.3*dt});draw()}
  raf=requestAnimationFrame(loop)}

  count:(box,next)=>{if(!hard){const a=pick([4,5,6]);return mcq(box,`<p class="q">樣區法：田地分成 <em>12 格</em>，抽一格數到 ${a} 隻蝸牛，全部大約有幾隻？</p>`,shuffle(uniq([a*12,a+12,a*10,a*6])).map(String),String(a*12),`估計值 = ${a} × 12 = ${a*12} 隻。`,next)}
   const m=pick([20,30,40]),c=pick([30,40,60]),r=pick([5,10]);const ans=m*c/r;mcq(box,`<p class="q">捉放法：先捉 <em>${m}</em> 隻做記號放回；第二次捉 <em>${c}</em> 隻，其中 <em>${r}</em> 隻有記號。族群大約幾隻？</p>`,shuffle(uniq([ans,m+c,m*r,c*r/2])).map(String),String(ans),`族群數 = 第一次標記數 × 第二次捕捉數 ÷ 第二次有記號數 = ${m} × ${c} ÷ ${r} = ${ans}。`,next)},
  carbon:(box,next)=>{const items=shuffle([['光合作用','in'],['呼吸作用','out'],['分解者的分解作用','out'],['燃燒木材','out'],['汽機車燃燒汽油','out'],['二氧化碳溶在海水中','in']]).map(([t,bin])=>({t,bin}));
   fallSort({box,title:'碳循環：這個作用會<em>吸收</em>還是<em>釋放</em>二氧化碳？',bins:[{id:'in',label:'吸收 CO₂',c:'#2E9E68'},{id:'out',label:'釋放 CO₂',c:'#7A8C99'}],items,speed:hard?6:9,next})},
  succ:(box,next)=>orderTap({box,title:'森林大火後的<em>演替</em>，依序排好',items:['草本植物出現','形成草原','木本植物增加','形成森林'],next}),
  rel:(box,next)=>{const R2=pick([['獅子和斑馬','掠食'],['跳蚤和狗','寄生'],['兩種植物搶陽光','競爭'],['硫化菌和管蟲','互利共生'],['利用瓢蟲吃蚜蟲','生物防治']]);mcq(box,`<p class="q">「${R2[0]}」是哪一種關係？</p>`,R2[1]==='生物防治'?['生物防治','寄生','競爭']:['競爭','掠食','寄生','互利共生'],R2[1],`${R2[0]}：${R2[1]}。`,next)},
  treaty:(box,next)=>pairUp({box,title:'配對：國際保育公約',pairs:[['拉姆薩公約','保護濕地'],['華盛頓公約','限制野生動植物不當交易'],['生物多樣性公約','維護全球生物多樣性'],['氣候變遷綱要公約','控制溫室氣體排放']],next}),
  eutro:(box,next)=>mcq(box,`<p class="q">含磷的清潔劑流進湖泊，藻類大量繁殖、水中缺氧，叫做？</p>`,['優養化','生物放大作用','溫室效應'],'優養化','磷化物讓水中養分過多，藻類大量繁殖造成缺氧，稱為優養化。',next)
 };
 runRounds(st,hard?shuffle(['eco','alien','hippo','levels','pop','count','carbon','succ','treaty','eutro']):['eco','alien','levels','pop','grow','carbon','count','rel'],R,'地球守護成功！')}};
</script>
