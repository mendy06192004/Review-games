<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>公民大平台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: quiet paper-toned civics workshop. Ink-line drawings, muted subject colors, clay stamp for correct answers. Single light theme. Learn mode scales type up for resource-class students. */
:root{
  --paper:#f3eee3; --paper2:#e9e2d2; --card:#fbf8f1; --sheet:#fffdf8; --ink:#2e2b3a; --ink2:#5b5868; --muted:#857d6c; --line:#d6ccb8;
  --indigo:#3c4a6e; --clay:#b4553d; --sage:#5f7f6f; --ochre:#b8862f;
  --ok-bg:#e6eee8; --no-bg:#f5e4de; --hint-bg:#f6efdc;
  --c-sort:#9a5c4a; --c-law:#5d6b8c; --c-econ:#b8862f; --c-pol:#5f7f6f; --c-seq:#7a5f8c; --c-ruler:#4f7d8a;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px; --fz:1;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
body.learn{--fz:1.14}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.22rem;letter-spacing:.06em;white-space:nowrap}
.seal{width:30px;height:30px;border:1.5px solid var(--clay);color:var(--clay);display:grid;place-items:center;font-size:.92rem;font-weight:700;border-radius:4px;transform:rotate(-4deg);flex:none}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:6px 13px;font-size:.86rem;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{background:var(--card)}
.iconbtn[aria-pressed="true"].tog{background:var(--indigo);color:var(--card);border-color:var(--indigo)}
main{position:relative;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
#home{overflow-y:auto}
.home-in{padding-block:20px 28px;display:flex;flex-direction:column;gap:22px;max-width:1180px;width:100%;margin:0 auto;box-sizing:border-box}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);align-items:end;gap:18px 32px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.5rem,3.2vw,2.2rem);margin:0;line-height:1.35;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--ink2);max-width:46ch;line-height:1.8}
.settings{display:flex;flex-direction:column;gap:14px;min-width:0}
.label{font-size:.72rem;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.88rem;display:inline-flex;gap:5px;align-items:baseline}
.chip small{font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border-radius:999px;padding:6px 16px;font-size:.92rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--card)}
.mode-note{font-size:.82rem;color:var(--muted);margin-top:6px;max-width:46ch;line-height:1.65}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gcard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 13px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;min-width:0;transition:transform .2s, box-shadow .2s, opacity .2s}
.gcard:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px rgba(46,43,58,.45)}
.gcard .band{position:absolute;inset:0 auto 0 0;width:3px;border-radius:var(--r) 0 0 var(--r);background:var(--c)}
.gcard .art{width:52px;height:52px;color:var(--c);grid-row:span 3}
.gcard .theme{font-size:.74rem;color:var(--muted);letter-spacing:.05em}
.gcard h3{margin:0;font-family:var(--serif);font-weight:700;font-size:1.15rem}
.gcard p{margin:0;color:var(--ink2);font-size:.86rem;line-height:1.65;grid-column:1/-1;margin-top:6px}
.gcard .meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);font-size:.77rem;color:var(--muted)}
.gcard .meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:1px 8px;border:1px solid var(--c);border-radius:999px;font-size:.7rem;color:var(--c);white-space:nowrap}
.tag.rec{background:var(--c);color:var(--card)}
.gcard.dim{opacity:.5}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.pane h4{margin:0 0 4px;font-family:var(--serif);font-size:1.05rem;display:flex;gap:8px;align-items:center}
.pane .sub{margin:0 0 10px;font-size:.82rem;color:var(--muted);line-height:1.6}
.wrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.wrow:last-child{border-bottom:0}
.wrow .ic{color:var(--c)}
.wrow .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px;max-height:300px;overflow:auto}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 40px;gap:8px;align-items:center;font-size:.85rem;padding:5px 0}
.mrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{color:var(--muted);margin-right:5px}
.mrow .bar{height:5px;background:var(--paper2);border-radius:9px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--sage)}
.mrow.weak .bar i{background:var(--clay)}
.mrow.weak .nm{color:var(--clay)}
.mrow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.8rem}
.tips{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:.84rem}
.portrait-hint{display:none;border:1px solid var(--ochre);color:var(--ink2);border-radius:var(--r);padding:10px 14px;font-size:.88rem;background:var(--card)}
@media (orientation:portrait) and (max-width:700px){.portrait-hint{display:block}}
@media (max-width:980px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.panes{grid-template-columns:1fr}}
@media (max-width:520px){.games{grid-template-columns:1fr}}
@media (max-height:520px) and (orientation:landscape){.gcard p{display:none}.gcard .art{width:38px;height:38px}.home-in{padding-block:10px 16px;gap:14px}.hero p{display:none}.top{padding-block:6px}}

.btn{background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font-size:calc(.95rem*var(--fz));white-space:nowrap}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.go{background:var(--indigo);color:var(--card)}
.btn.sm{padding:6px 14px;font-size:calc(.85rem*var(--fz))}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--indigo);text-decoration:underline;text-underline-offset:3px;font-size:.84rem;padding:4px 6px;white-space:nowrap}
.lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
.speak{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.8rem;color:var(--ink2);background:var(--card);white-space:nowrap}
.speak:hover{border-color:var(--indigo);color:var(--indigo)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.kicker{font-size:.75rem;letter-spacing:.06em;color:var(--muted)}

.ghead{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.ghead h2{margin:0;font-family:var(--serif);font-weight:700;font-size:1.1rem;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mode-pill{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2);font-family:var(--sans);font-weight:400}
.stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--card)}
.stat b{font-weight:700;color:var(--ink)}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding-block:0 12px}
.groot{flex:1;min-height:0;position:relative}

.ovl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(46,43,58,.32);z-index:8;padding:16px;overflow:auto}
.panel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:560px;width:100%;box-shadow:0 18px 40px -24px rgba(46,43,58,.6);animation:pop .3s ease;box-sizing:border-box}
.panel h3{margin:0 0 10px;font-family:var(--serif);font-weight:700;font-size:calc(1.28rem*var(--fz))}
.panel p{margin:0 0 10px;line-height:1.8}
.panel ul{margin:0 0 12px;padding-left:1.2em;line-height:1.85;color:var(--ink2);font-size:calc(.93rem*var(--fz))}
.panel .pic{width:64px;height:64px;margin-bottom:6px;color:var(--c)}
.defs{display:grid;gap:6px;margin:4px 0 12px}
.defs div{background:var(--paper);border-radius:8px;padding:8px 12px;font-size:calc(.9rem*var(--fz));line-height:1.6}
.defs b{font-family:var(--serif);margin-right:6px}

.fb{position:relative;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:10px;padding:11px 14px;overflow:hidden;animation:pop .2s}
.fb.no{border-left-color:var(--clay)}
.fb-ic{color:var(--sage);display:flex}
.fb.no .fb-ic{color:var(--clay)}
.fb-tx{flex:1;min-width:0;font-size:calc(.92rem*var(--fz));line-height:1.7}
.fb-tx b{display:block;font-family:var(--serif);font-weight:700}
.fb-act{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.fb-bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--indigo);transform-origin:left;opacity:.55}
.hintline{background:var(--hint-bg);border:1px solid #e3d3a7;border-radius:10px;padding:9px 12px;font-size:calc(.9rem*var(--fz));line-height:1.65;display:flex;gap:8px;align-items:flex-start;animation:pop .2s}
.hintline .ic{color:var(--ochre);margin-top:3px}

.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media (orientation:portrait){.duel{grid-template-columns:1fr;overflow-y:auto;align-content:start}}
.qside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-bottom:4px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;position:relative}
.qcard .qtext{font-family:var(--serif);font-size:calc(1.08rem*var(--fz));line-height:1.75;font-weight:600;margin-top:4px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.learn .opts{grid-template-columns:1fr}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);color:var(--ink);text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:calc(.95rem*var(--fz));line-height:1.55;min-height:54px;display:flex;gap:10px;align-items:center;transition:border-color .15s, background .15s}
body.learn .opt{min-height:60px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt .k{flex:none;width:24px;height:24px;border:1px solid var(--muted);border-radius:50%;color:var(--ink2);display:grid;place-items:center;font-size:.78rem;font-family:var(--serif)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--sage);background:var(--ok-bg)}
.opt.right .k{background:var(--sage);border-color:var(--sage);color:var(--card)}
.opt.wrong{border-color:var(--clay);background:var(--no-bg);animation:shake .35s;opacity:.7}
.opt.wrong .k{background:var(--clay);border-color:var(--clay);color:var(--card)}
.opt.fade{opacity:.45}
.opt .ob{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .an{font-family:var(--serif);font-weight:700}
.opt .at{font-size:.84rem;color:var(--ink2);line-height:1.55}

.qtop{padding-right:58px}
.receipt h4{padding-right:60px}
.stamp{position:absolute;right:6px;top:-12px;width:52px;height:52px;font-size:.9rem!important;border:2px solid var(--clay);color:var(--clay);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:1rem;border-radius:6px;transform:rotate(-12deg);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none;background:rgba(251,248,241,.85);z-index:2}
@keyframes stampIn{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hit{0%{opacity:1}40%{opacity:.25}100%{opacity:1}}
@keyframes cardIn{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(95,127,111,.5)}50%{box-shadow:0 0 0 7px rgba(95,127,111,0)}}
.shake{animation:shake .4s}

/* SORT */
.sort{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px}
.sort-head{display:flex;align-items:center;gap:12px;min-width:0}
.sort-ic{width:40px;height:40px;color:var(--c-sort);flex:none}
.sort-title{font-family:var(--serif);font-weight:700;font-size:calc(1.12rem*var(--fz))}
.sort-left{margin-left:auto;font-size:.84rem;color:var(--ink2);white-space:nowrap}
.bins{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.bin{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:border-color .15s, background .2s;position:relative;min-width:0}
.bin .basket{width:46px;height:34px;color:var(--ink2);display:flex}
.bin .basket .ic{width:100%;height:100%}
.bin b{font-family:var(--serif);font-size:calc(.98rem*var(--fz));line-height:1.35}
.bin small{font-size:calc(.76rem*var(--fz));color:var(--ink2);line-height:1.5}
.bin .key{position:absolute;top:5px;left:8px;font-size:.7rem;color:var(--muted)}
.bin:hover{border-color:var(--c-sort)}
.bin.hit{border-color:var(--sage);background:var(--ok-bg)}
.bin.miss{border-color:var(--clay);background:var(--no-bg);animation:shake .35s}
.bin.reveal{border-color:var(--sage);animation:pulse 1.2s infinite}
.throwzone{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:6px 0 4px;overflow-y:auto}
.tz-ask{font-size:calc(.9rem*var(--fz));color:var(--ink2);text-align:center;line-height:1.6}
.tcard.ok{border-color:var(--sage);background:var(--ok-bg)}
.tcard.no{border-color:var(--clay);background:var(--no-bg)}
.tcard.flying{opacity:.5}
.tcard .res{display:block;font-family:var(--sans);font-size:calc(.86rem*var(--fz));font-weight:500;color:var(--sage);margin-top:4px}
.tcard.no .res{color:var(--clay)}
.tcard .res:empty{display:none}
body.learn .tcard{cursor:default;touch-action:manipulation}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--sheet);border:1px solid var(--c-sort);border-radius:14px;padding:14px 20px;font-family:var(--serif);font-weight:600;font-size:1.1rem;line-height:1.5;text-align:center;box-sizing:border-box;box-shadow:0 12px 26px -16px rgba(46,43,58,.6)}
.bin .got{font-size:.74rem;color:var(--sage);font-weight:500}
.bin .got:empty{display:none}
.tcard{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 26px;max-width:min(560px,94%);box-sizing:border-box;font-family:var(--serif);font-size:calc(clamp(1.08rem,2.3vw,1.4rem)*var(--fz));font-weight:600;line-height:1.6;text-align:center;box-shadow:0 12px 26px -16px rgba(46,43,58,.6);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;z-index:3}
.tcard.drag{cursor:grabbing}
.tcard.enter{animation:cardIn .3s ease}
.tcard .speak{position:absolute;right:8px;bottom:-13px;font-family:var(--sans);font-weight:400}
.tz-hint{font-size:.8rem;color:var(--muted);text-align:center}
.ctimer{width:min(560px,94%);height:3px;background:var(--paper2);overflow:hidden;border-radius:3px}
.ctimer i{display:block;height:100%;background:var(--c-sort);transform-origin:left}
.tz-fb{width:100%;display:flex;justify-content:center}
.tz-fb>*{width:min(660px,100%)}
.tz-hintbox{width:min(560px,94%)}
@media (max-width:620px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-height:560px){.bin small{display:none}.bin .basket{width:34px;height:26px}.tcard{padding:12px 20px}.sort{gap:8px}}

/* LAW */
.casefile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;position:relative}
.cf-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.cf-boss{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.cf-boss .bic{width:28px;height:28px;color:var(--c-law);display:flex}
.cf-boss .bic .ic{width:100%;height:100%}
.hpbar{width:90px;height:5px;border-radius:99px;background:var(--paper2);overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--clay);transition:width .4s}
.cf-title{margin:0;font-family:var(--serif);font-size:calc(1.18rem*var(--fz))}
.cf-story{margin:0;font-family:var(--serif);font-size:calc(1.02rem*var(--fz));line-height:1.95}
.cf-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.cf-steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.cf-steps li{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.cf-steps li.now{border-color:var(--c-law);color:var(--c-law)}
.cf-steps li.done{background:var(--paper2);color:var(--ink2)}
.hearts{display:flex;gap:3px;color:var(--clay)}

  }catch(e){}
}

function prefer(list, n, g){
  const wrong=new Set(getWrong(g)); const exam=isExam();
  let src=list; if(!exam){ const easy=list.filter(x=>x.lv!==2); if(easy.length>=Math.min(n,list.length)) src=easy; }

}

  const binsEl=$('#bins'), card=$('#card'), cardTx=$('#cardTx'), cardRes=$('#cardRes');
  const sb=speakBtn(()=>cardTx.textContent); if(sb) card.appendChild(sb);
  let ri=0, ci=0, cur=null, busy=true, tries=0, dragX=0, dragY=0, sx=0, sy=0, dragging=false, timerRaf=0, tStart=0, fbCancel=null, introCancel=null, got=[];
  const LIMIT=10;
  const upd=()=>setStats([['回合',`${Math.min(ri+1,rounds.length)}/${rounds.length}`],['連續答對',R.combo],['得分',R.score]]);

    $('#sIc').innerHTML=I(r.ic,'40px'); $('#sKick').textContent=`第 ${ri+1} 回合｜${BOOK_SEM[r.b]}・${r.u}`; $('#sTitle').textContent=r.t;

  }
  function nextCard(){

    document.body.appendChild(g);
    const ex=(br.left+br.width/2)-(cr.left+cr.width/2), ey=(br.top+br.height/2)-(cr.top+cr.height/2);
    sfx.whoosh(); card.classList.add('flying');
    const a=g.animate([{transform:'translate(0,0) scale(1)',opacity:.95},{transform:`translate(${ex/2}px,${Math.min(0,ey)/2-50}px) scale(.6)`,opacity:.9,offset:.55},{transform:`translate(${ex}px,${ey}px) scale(.25)`,opacity:0}],{duration:reduceMotion?1:560,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'});
    const end=()=>{ g.remove(); card.classList.remove('flying'); };
    return a.finished.then(end,end);
  }
  function judge(i){
    if(busy) return; busy=true; cancelAnimationFrame(timerRaf);
    const r=rounds[ri], ok=i===cur.bin, bins=binsEl.querySelectorAll('.bin');
    const settle=()=>{
      const first=tries===0 && ok;
      award(R, first); if(exam && first){ R.score+=Math.max(0,Math.round((LIMIT*1000-(performance.now()-tStart))/100)); }
      record('sort',cur.id,cur.u,first);
      if(!first) R.wrong.push({q:`「${cur.t}」應該放進哪一籃？`,a:r.bins[cur.bin][0],e:cur.why||r.bins[cur.bin][1]});
      upd();
      const bn=r.bins[cur.bin];
      card.classList.add(ok?'ok':'no');
      cardRes.textContent = ok ? `已放進「${bn[0]}」` : `${i<0?'時間到。':''}答案是「${bn[0]}」`;
      const body = exam ? (ok?'':`正解：${esc(bn[0])}`) : `${esc(cur.why||bn[1])}`;
      $('#hintHost').innerHTML='';
      fbCancel=feedback($('#fbHost'),{ok:ok,head:ok?`放進「${bn[0]}」，答對了`:(i<0?'時間到':'放錯籃子了'),body,label:ci>=r.cards.length-1?(ri>=rounds.length-1?'看結算':'下一回合'):'下一張'},()=>{ fbCancel=null; ci++; nextCard(); });
      try{ $('#fbHost').scrollIntoView({block:'nearest',behavior:reduceMotion?'auto':'smooth'}); }catch(_){}
    };
    if(i<0){ R.combo=0; sfx.bad(); bins[cur.bin].classList.add('reveal'); return settle(); }
    ghostFly(i).then(()=>{
      if(ok){ sfx.ok(); bins[i].classList.add('hit'); got[i]++; const gEl=bins[i].querySelector('.got'); if(gEl) gEl.textContent=`已放 ${got[i]} 張`; settle(); return; }
      sfx.bad(); bins[i].classList.add('miss'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      if(exam){ bins[cur.bin].classList.add('reveal'); settle(); return; }
      tries++; setTimeout(()=>bins[i].classList.remove('miss'),500); busy=false;
      if(tries===1) hintLine($('#hintHost'),`「${r.bins[i][0]}」不對。卡片還在這裡，看看每個籃子下面的說明，再點一次。`);
      else { bins[cur.bin].classList.add('reveal'); hintLine($('#hintHost'),`提示：答案是正在發光的「${r.bins[cur.bin][0]}」，點一下它。`); }
    });
  }
  binsEl.addEventListener('click',e=>{ const b=e.target.closest('.bin'); if(b) judge(+b.dataset.i); });
  const key=e=>{ const n=parseInt(e.key); if(!busy && rounds[ri] && n>=1 && n<=rounds[ri].bins.length) judge(n-1); };
  window.addEventListener('keydown',key);
  /* 拖曳丟卡只在模擬會考開放；見習公民只用點選，避免手指一滑卡片就飛走 */
  if(exam){
    card.addEventListener('pointerdown',e=>{ if(busy) return; dragging=true; sx=e.clientX; sy=e.clientY; dragX=dragY=0; card.classList.add('drag'); try{card.setPointerCapture(e.pointerId);}catch(_){} });
    card.addEventListener('pointermove',e=>{ if(!dragging) return; dragX=e.clientX-sx; dragY=e.clientY-sy; card.style.transform=`translate(${dragX}px,${dragY}px) rotate(${dragX/30}deg)`; });
    const reset=()=>{ card.animate([{transform:card.style.transform||'none'},{transform:'none'}],{duration:200,easing:'ease-out'}); card.style.transform=''; dragX=dragY=0; };
    card.addEventListener('pointerup',()=>{
      if(!dragging) return; dragging=false; card.classList.remove('drag'); if(busy){ reset(); return; }
      if(-dragY>80){
        const cr=card.getBoundingClientRect(); const ccx=cr.left+cr.width/2; let best=-1, bd=1e9;
        [...binsEl.children].forEach((b,i)=>{ const br=b.getBoundingClientRect(); const d=Math.abs(ccx-(br.left+br.width/2)); if(d<bd){bd=d;best=i;} });
        card.style.transform=''; dragX=dragY=0; judge(best);
      } else reset();
    });
    card.addEventListener('pointercancel',()=>{ if(!dragging) return; dragging=false; card.classList.remove('drag'); reset(); });
  }
  S.cleanup=()=>{ busy=true; cancelAnimationFrame(timerRaf); window.removeEventListener('keydown',key); fbCancel&&fbCancel(); introCancel&&introCancel(); };
  startRound();
}

  const ro=new ResizeObserver(resize); ro.observe(cv);
  const Qmax=180,Pmax=130;
  function draw(){

    <div class="slots" id="slots"></div>
    <div id="hintHost"></div>
    <div class="seqfoot"><div class="pool" id="pool"></div><div class="row" style="justify-content:center" id="sfoot"></div><div class="ctimer" id="ctm" style="width:100%" ${exam?'':'hidden'}><i id="ctmBar"></i></div><div id="fbHost"></div></div></div>`;
  const upd=()=>setStats([['題目',`${Math.min(si+1,list.length)}/${list.length}`],['連續全對',R.combo],['得分',R.score]]);
  function show(){
    if(si>=list.length) return finish(R,`排好 ${list.length} 個流程。`);
    cur=list[si]; mist=0; busy=false;
    const n=cur.steps.length; placed=Array(n).fill(null);
    const preset=!exam && n>=4; if(preset) placed[0]=0;
    pool=shuffle(cur.steps.map((_,i)=>i).filter(i=>!(preset&&i===0)));
    $('#sq').innerHTML=`${I(cur.ic)}<div class="qt"><div class="kicker">${BOOK_SEM[cur.b]}・${esc(cur.u)}｜${esc(cur.t)}</div>${esc(cur.q)}</div><span id="qsp"></span>`;
    const sp=speakBtn(()=>cur.q+'。'+pool.map(i=>cur.steps[i]).join('。')); if(sp) $('#qsp').appendChild(sp);
    $('#hintHost').innerHTML=''; $('#fbHost').innerHTML='';
    $('#sfoot').innerHTML=exam?'<button class="btn go" id="check" disabled>完成，檢查順序</button>':'';
    if(exam){ $('#check').onclick=check; tStart=performance.now(); cancelAnimationFrame(timerRaf); const bar=$('#ctmBar'); const tick=t=>{ if(busy) return; const p=Math.min(1,(t-tStart)/(LIMIT*1000)); bar.style.transform=`scaleX(${1-p})`; if(p>=1){ check(); return; } timerRaf=requestAnimationFrame(tick); }; timerRaf=requestAnimationFrame(tick); }
    render(); upd();
    autoSpeak(cur.q+(preset?'第一步已經幫你放好了，請找出第二步。':'請找出第一步。'));
  }
  function render(){
    const n=cur.steps.length;
    $('#slots').innerHTML=placed.map((p,i)=>`<div class="slot ${p!=null?'filled':''} ${(!exam&&p!=null)?'fixed':''}" data-i="${i}"><span class="no">第 ${i+1} 步</span><span class="tx">${p!=null?esc(cur.steps[p]):''}</span>${i<n-1?'<span class="arrow">→</span>':''}</div>`).join('');
    $('#pool').innerHTML=pool.map(i=>`<button class="pcard" data-s="${i}">${esc(cur.steps[i])}</button>`).join('');
    if(exam) $('#check').disabled=placed.some(p=>p==null);
  }
  $('#pool').addEventListener('click',e=>{
    const b=e.target.closest('.pcard'); if(!b||busy) return; const s=+b.dataset.s; const slot=placed.indexOf(null); if(slot<0) return;
    if(!exam && s!==slot){
      mist++; sfx.bad(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong');
      hintLine($('#hintHost'), mist<3?`「${cur.steps[s]}」不是第 ${slot+1} 步，想想看在它之前要先發生什麼？`:`提示：第 ${slot+1} 步是「${cur.steps[slot]}」。`);
      return;
    }
    placed[slot]=s; pool=pool.filter(x=>x!==s); sfx.whoosh(); $('#hintHost').innerHTML=''; render();
    if(!exam){ autoSpeak(`第${slot+1}步，${cur.steps[s]}`); if(placed.every(p=>p!=null)) done(mist===0); }
  });
  $('#slots').addEventListener('click',e=>{ if(!exam||busy) return; const sl=e.target.closest('.slot.filled'); if(!sl) return; const i=+sl.dataset.i; pool.push(placed[i]); placed[i]=null; render(); });
  function check(){
    if(busy) return; busy=true; cancelAnimationFrame(timerRaf);
    const ok=placed.every((p,i)=>p===i);
    [...$('#slots').children].forEach((el,i)=>{ el.classList.add(placed[i]===i?'ok':'bad'); });
    $('#check').disabled=true; done(ok);
  }
  function done(ok){
    busy=true; award(R,ok,120); if(exam&&ok) R.score+=Math.max(0,Math.round((LIMIT*1000-(performance.now()-tStart))/200));
    record('seq',cur.id,cur.u,ok); if(!ok) R.wrong.push({q:`排出「${cur.t}」的順序`,a:cur.steps.join(' → '),e:cur.e});
    if(ok||!exam) sfx.ok(); upd();
    const body=exam&&!ok?`正確順序：${esc(cur.steps.join(' → '))}`:esc(cur.e);
    fbCancel=feedback($('#fbHost'),{ok:ok||!exam,head:ok?'順序全對':(exam?'順序有誤':'全部排好了'),body,label:si>=list.length-1?'看結算':'下一題'},()=>{ fbCancel=null; si++; show(); });
  }
  S.cleanup=()=>{ busy=true; cancelAnimationFrame(timerRaf); fbCancel&&fbCancel(); introCancel&&introCancel(); };
  upd();
  introCancel=intro({icon:'steps',title:'程序接力賽',lines:['把打散的步驟卡，依照正確順序放到上方的格子。', exam?`每題限時 ${LIMIT} 秒。放錯的卡片可以點格子拿回來，全部放好後按「完成」。`:'依序點選下一步的卡片。點錯了不會放進去，還會給你提示。四步以上的流程，第一步已經幫你放好。']},()=>{ introCancel=null; show(); });
}

/* ================= 6. 公民數字尺 ================= */
function playRuler(opts={}){
  const R=newRec(), exam=isExam(), review=!!opts.review;
  let list;
  if(review){ const ids=new Set(getWrong('ruler')); list=shuffle(RULER.filter(r=>ids.has(r.id))).slice(0,10); if(!list.length){ toast('公民數字尺沒有錯題'); return goHome(); } }
  else list=prefer(byBook(RULER,'ruler',3),exam?10:7,'ruler');
  let qi=0, cur=null, tries=0, busy=false, fbCancel=null, introCancel=null, val=0, unbind=null;
  const stage=$('#stage');
  stage.innerHTML=`<div class="ruler groot">
    <div class="rq" id="rq"><div class="qtop"><span class="kicker" id="rk"></span><span id="rsp"></span></div><div class="qtext" id="rqt"></div></div>
    <div class="rbox"><div class="rbar" id="rbar"></div></div>
    <div id="hintHost"></div>
    <div><div class="rctrl" id="rctrl"></div><div id="fbHost" style="margin-top:10px"></div></div></div>`;
  const sp=speakBtn(()=>cur?cur.q:''); if(sp) $('#rsp').appendChild(sp);
  const upd=()=>setStats([['題目',`${Math.min(qi+1,list.length)}/${list.length}`],['連續答對',R.combo],['得分',R.score]]);
  const range=it=>it.ty==='cls'?[0,90]:[it.min,it.max];
  const pct=(v,it)=>{ const [a,b]=range(it); return Math.max(0,Math.min(100,(v-a)/(b-a)*100)); };
  function drawRuler(it, markV, showZones){
    const [a,b]=range(it); const span=b-a; const stepMaj=span<=12?1:span<=30?5:span<=60?10:10; const stepMin=span<=12?0:span<=30?1:5;
    let h='<div class="rline"></div>';
    if(stepMin) for(let v=Math.ceil(a/stepMin)*stepMin; v<=b; v+=stepMin){ if(v%stepMaj!==0) h+=`<i class="tick m" style="left:${pct(v,it)}%"></i>`; }
    for(let v=Math.ceil(a/stepMaj)*stepMaj; v<=b; v+=stepMaj){ h+=`<i class="tick" style="left:${pct(v,it)}%"></i><span class="tlab" style="left:${pct(v,it)}%">${v}</span>`; }
    if(showZones && it.z && ZONES[it.z]) ZONES[it.z].forEach(([x,y,lab,col])=>{ const l=pct(Math.max(x,a),it), r=pct(Math.min(y,b),it); if(r>l) h+=`<span class="zone" style="left:${l}%;width:${r-l}%;background:${col}" title="${lab}">${lab}</span>`; });
    if(markV!=null) h+=`<span class="marker" id="mk" style="left:${pct(markV,it)}%">${I('person')}<b>${markV}${esc(it.unit||'歲')}</b></span>`;
    $('#rbar').innerHTML=h;
  }
  function moveMarker(v){ const mk=$('#mk'); if(!mk){ drawRuler(cur,v,false); return; } mk.style.left=pct(v,cur)+'%'; mk.querySelector('b').textContent=v+(cur.unit||'歲'); }
  function show(){
    if(qi>=list.length) return finish(R,`完成 ${list.length} 題數字挑戰。`);
    cur=list[qi]; tries=0; busy=false; $('#hintHost').innerHTML=''; $('#fbHost').innerHTML='';
    $('#rq').querySelectorAll(':scope > .stamp').forEach(s=>s.remove());
    $('#rk').textContent=`第 ${qi+1} 題｜${BOOK_SEM[cur.b]}・${cur.u}`; $('#rqt').textContent=cur.q;
    const ctrl=$('#rctrl');
    if(cur.ty==='cls'){
      drawRuler(cur,cur.age,false);
      const q=mkQ(cur); ctrl.innerHTML='<div class="opts" id="opts" style="width:100%"></div>';
      unbind=renderOpts($('#opts'),q,(first)=>{ unbind=null; drawRuler(cur,cur.age,true); result(first); },{onWrong:()=>hintLine($('#hintHost'),'再想想：看看這個年齡在哪一段。')});
      autoSpeak(cur.q+'。'+q.opts.join('，'));
    } else if(!exam){
      const mid=Math.round((cur.min+cur.max)/2); drawRuler(cur,null,false);
      ctrl.innerHTML=shuffle(cur.ch).map(v=>`<button class="bigchip" data-v="${v}">${v} ${esc(cur.unit)}</button>`).join('');
      ctrl.onclick=e=>{ const b=e.target.closest('.bigchip'); if(!b||busy||b.disabled) return; const v=+b.dataset.v; moveMarker(v);
        if(v===cur.ans){ busy=true; b.classList.add('right'); ctrl.querySelectorAll('.bigchip').forEach(x=>x.disabled=true); drawRuler(cur,v,true); result(tries===0); }
        else { tries++; sfx.bad(); b.classList.add('wrong'); b.disabled=true; hintLine($('#hintHost'), tries===1?`${v} ${cur.unit}不對，再看看另一個數字。`:`提示：答案是 ${cur.ans} ${cur.unit}。`); } };
      autoSpeak(cur.q+'。選項有：'+cur.ch.join(cur.unit+'、')+cur.unit);
    } else {
      val=Math.round((cur.min+cur.max)/2); drawRuler(cur,val,false);
      ctrl.innerHTML=`<div class="rslider"><button class="stepbtn" id="mn" aria-label="減一">－</button><input type="range" id="rs" min="${cur.min}" max="${cur.max}" step="1" value="${val}" aria-label="數值"><button class="stepbtn" id="pl" aria-label="加一">＋</button><span class="rnum" id="rn">${val} ${esc(cur.unit)}</span></div><button class="btn go" id="ok">確定</button>`;
      const rs=$('#rs'); const set=v=>{ val=Math.max(cur.min,Math.min(cur.max,v)); rs.value=val; $('#rn').textContent=`${val} ${cur.unit}`; moveMarker(val); };
      rs.addEventListener('input',()=>set(+rs.value)); $('#mn').onclick=()=>set(val-1); $('#pl').onclick=()=>set(val+1);
      $('#ok').onclick=()=>{ if(busy) return; busy=true; const ok=val===cur.ans; rs.disabled=true; $('#ok').disabled=true; drawRuler(cur,val,true); if(!ok){ const mk=document.createElement('span'); mk.className='marker'; mk.style.left=pct(cur.ans,cur)+'%'; mk.style.color='var(--sage)'; mk.innerHTML=`${I('check')}<b>正解 ${cur.ans}</b>`; $('#rbar').appendChild(mk); } result(ok); };
    }
    upd();
  }
  function result(first){
    award(R,first); record('ruler',cur.id,cur.u,first);
    if(!first) R.wrong.push({q:cur.q,a:cur.ty==='cls'?cur.c:`${cur.ans} ${cur.unit}`,e:cur.e});
    if(first||!exam){ sfx.ok(); stampOn($('#rq')); } else sfx.bad();
    upd(); $('#hintHost').innerHTML='';
    const ans=cur.ty==='cls'?cur.c:`${cur.ans} ${cur.unit}`;
    const body=exam?(first?'':`正解：${esc(ans)}`):esc(cur.e);
    fbCancel=feedback($('#fbHost'),{ok:first||!exam,head:first?`答對了：${ans}`:(exam?'差一點':`答案是：${ans}`),body,label:qi>=list.length-1?'看結算':'下一題'},()=>{ fbCancel=null; qi++; show(); });
  }
  S.cleanup=()=>{ busy=true; unbind&&unbind(); fbCancel&&fbCancel(); introCancel&&introCancel(); };
  upd();
  introCancel=intro({icon:'ruler',title:'公民數字尺',lines:['課本裡有很多重要的年齡和期限，例如成年、投票、童工、猶豫期。', exam?'拖動滑桿或按「＋」「－」，把人物移到正確數字，再按「確定」。數字要完全正確才算對。':'從下面三個數字中選一個，人物會走到那個位置。答錯可以再選。','答完後，尺上會出現年齡分段，幫你記住分界。']},()=>{ introCancel=null; show(); });
}

/* init */
updSoundBtn(); renderHome();
</script>
