<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fffaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奶油養成日記：小守宮的大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffaf6; --line:#f1e5de; --text:#5d4037; --soft:#a1887f;
  --accent:#f0839f; --accent-d:#d9677f; --accent-l:#ffe8ee;
  --hunger:#ffb27a; --health:#7fd1ae; --mood:#f591ab; --growth:#b39cf2;
  --yoga:#ffd6df; --read:#e2d8ff; --type:#d3ecfb;
  --dk:clamp(46px, 8.2dvh, 64px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body.lock{overflow:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--text);
  background:#f3ebe5;-webkit-user-select:none;user-select:none;font-size:16px;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input{font-family:inherit}

#app{position:relative;width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100svh;background:var(--bg);
  display:flex;flex-direction:column;overflow-x:hidden;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(120,80,60,.12)}}

/* ---------- top ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
  padding:10px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:max(10px,env(safe-area-inset-top))}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-l);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.avatar svg{width:40px;height:40px}
.who b{font-size:19px;display:block;line-height:1.2}
.who small{color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.coin{display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);border-radius:999px;
  padding:5px 13px 5px 9px;font-weight:900;font-size:17px;flex:none}
.coin.pop{animation:pop .4s}

/* ---------- stage (side-view tank) ---------- */
.stage{position:relative;isolation:isolate;z-index:0;flex:none;height:clamp(200px,calc(100vh - 380px),560px);height:clamp(200px,calc(100svh - 380px),560px);margin:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));
  border-radius:22px;overflow:hidden;border:3px solid #fff;
  background:linear-gradient(180deg,#fdf8f3 0%,#f8eee6 46%,#f1e2d6 52%);
  box-shadow:0 3px 0 #eadcd3,0 10px 24px rgba(140,100,70,.12)}
#floorCv{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.lay{position:absolute;left:0;top:0;pointer-events:none}
.lay svg{width:100%;height:100%;display:block;overflow:visible}
.dish.fill .water{animation:shimmer .45s 4 alternate}
#gk{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
#skin{position:absolute;left:0;top:0;opacity:0;transition:opacity .9s;pointer-events:none}
#skin svg{width:100%;height:auto;display:block}
.glass{position:absolute;inset:0;z-index:800;pointer-events:none;
  background:linear-gradient(112deg,transparent 0 16%,rgba(255,255,255,.38) 17% 19%,transparent 20% 24%,rgba(255,255,255,.22) 25% 26%,transparent 27%)}
.status{position:absolute;left:10px;top:9px;z-index:900;background:rgba(255,255,255,.88);border-radius:999px;
  padding:3px 11px;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(120,80,60,.08);pointer-events:none}
.bubble{position:absolute;left:50%;top:40px;transform:translateX(-50%);background:#fff;border-radius:16px;
  padding:7px 14px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(120,80,60,.14);max-width:86%;width:max-content;
  text-align:center;transition:opacity .3s;z-index:900;pointer-events:none;line-height:1.45}
.fx{position:absolute;z-index:950;pointer-events:none;font-size:22px;animation:floatUp 1.4s forwards;margin:-12px 0 0 -12px}
.flake{position:absolute;z-index:950;width:9px;height:6px;background:rgba(255,255,255,.95);border-radius:40% 60% 50% 40%;
  box-shadow:0 0 0 1px rgba(190,180,170,.5);animation:flake 1.4s forwards;pointer-events:none}

.who{cursor:pointer}
.avwrap{position:relative;flex:none}
.swapb{position:absolute;right:-4px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--line);
  font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(120,80,60,.15)}
.petgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:340px){.petgrid{grid-template-columns:1fr}}
.petcard{background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:10px 10px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 #efe2da}
.petcard.sel{border-color:var(--accent);background:#fff6f8}
.petcard:active{transform:translateY(3px);box-shadow:0 1px 0 #efe2da}
.petcard .pc-img{width:100%;background:radial-gradient(ellipse 50% 18% at 50% 88%,#efdcc6 0 60%,transparent 100%);border-radius:14px;padding:6px 0}
.petcard .gkbox{width:100%}
.petcard b{font-size:21px;margin-top:2px}
.petcard .sp{font-size:13px;font-weight:700;color:#fff;background:var(--soft);border-radius:999px;padding:1px 10px}
.petcard p{margin:4px 0 0;font-size:13.5px;color:var(--soft);line-height:1.5}
.petcard .cur{margin-top:4px;font-size:12.5px;font-weight:700;color:var(--accent-d)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;padding:12px 18px 4px;flex:none}
.st-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:5px;white-space:nowrap}
.st-top b{font-weight:900}
.st-top em{font-style:normal}.st-top .sh{display:none}
.bar{height:8px;border-radius:99px;background:#f3e9e3;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.st.low .st-top span{color:#e0546e}
.st.low .bar{animation:blinkbar 1.4s infinite}

/* ---------- games ---------- */
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 12px 12px;flex:none}
.game{border-radius:18px;padding:10px 4px 9px;text-align:center;transition:transform .1s;min-width:0}
.game:active{transform:scale(.95)}
.game .em{font-size:28px;line-height:1.1;display:block}
.game b{display:block;font-size:16px;margin-top:2px;white-space:nowrap}
.game small{font-size:12px;color:var(--soft);white-space:nowrap}

/* ---------- care buttons ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px 2px;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:14px;font-weight:700;color:var(--text);
  background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:0 3px 0 #efe2da;min-width:0}
.tab .em{font-size:23px;line-height:1.15}
.tab:active{background:var(--accent-l);transform:translateY(2px);box-shadow:0 1px 0 #efe2da}

/* compact for shorter phones */
@media (max-height:740px){
  .stage{height:clamp(190px,calc(100vh - 300px),560px);height:clamp(190px,calc(100svh - 300px),560px)}
  .tabs{padding-top:8px;gap:7px}.tab{padding:5px 0 4px;font-size:13px}.tab .em{font-size:20px}
  .stats{grid-template-columns:repeat(4,1fr);gap:6px 10px;padding:10px 14px 2px}
  .st-top{font-size:12.5px;margin-bottom:4px}
  .st-top .lg{display:none}.st-top .sh{display:inline}
  .bar{height:7px}
  .game{padding:7px 4px}.game .em{font-size:22px}.game b{font-size:14.5px}.game small{display:none}
  .games{padding:8px 12px 10px;gap:8px}
}
@media (max-height:620px){
  .top{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:5px}
  .avatar{width:36px;height:36px}.avatar svg{width:33px;height:33px}
  .who b{font-size:17px}.who small{font-size:12px}
  .coin{font-size:15px;padding:4px 11px 4px 8px}
  .tab{font-size:12.5px;padding:4px 0 3px}.tab .em{font-size:18px}
  .game{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 2px}
  .game .em{font-size:19px;display:inline}.game b{font-size:14px;margin:0}
}
@media (max-width:350px){
  .game b{font-size:13.5px}.who small{font-size:12px}
  .stats{padding-left:12px;padding-right:12px;gap:6px 8px}
}
/* landscape phones: tank on the left, controls on the right */
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,1fr);grid-template-rows:auto auto auto 1fr;
    align-items:start;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .top{grid-column:2;grid-row:1;padding-left:10px}
  .stage{grid-column:1;grid-row:1/5;position:sticky;top:8px;height:calc(100vh - 16px);height:calc(100svh - 16px);min-height:200px;
    margin:8px 4px 8px max(8px,env(safe-area-inset-left))}
  .stats{grid-column:2;grid-row:2;grid-template-columns:1fr 1fr;padding:6px 12px 2px}
  .stats .st-top .lg{display:inline}.stats .st-top .sh{display:none}
  .tabs{grid-column:2;grid-row:3;padding:8px 10px 2px}
  .games{grid-column:2;grid-row:4;padding:10px}
}

/* ---------- sub page ---------- */
.page{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:560px;background:var(--bg);display:flex;flex-direction:column;z-index:20;
  transform:translateX(102%);transition:transform .28s ease,visibility 0s .28s;visibility:hidden}
.page.show{transform:none;visibility:visible;transition:transform .28s ease}
.phead{display:flex;align-items:center;gap:8px;flex:none;border-bottom:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top))}
.back{width:42px;height:42px;border-radius:50%;font-size:26px;font-weight:700;line-height:1;background:#fff;border:1.5px solid var(--line);flex:none}
.phead h2{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:14px max(16px,env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.center{text-align:center}.soft{color:var(--soft);font-size:14px}
.lead{font-size:16.5px;margin:4px 0 10px;text-align:center;line-height:1.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;background:var(--accent);color:#fff;
  box-shadow:0 4px 0 var(--accent-d);min-height:48px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:#fff;color:var(--text);box-shadow:0 4px 0 #ecdcd4;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.small{font-size:14px;padding:8px 14px;min-height:38px}
.btn:disabled,.btn.off{opacity:.45}
@media (orientation:landscape) and (max-height:560px){.page{max-width:none}.phead{padding-top:6px;padding-bottom:6px}.back{width:38px;height:38px}}

/* d-pad */
.dpad{display:grid;grid-template-columns:repeat(3,var(--dk));grid-template-rows:repeat(3,var(--dk));gap:5px;justify-content:center}
.dbtn{border-radius:16px;background:#fff;border:1.5px solid var(--line);box-shadow:0 4px 0 #ecdcd4;font-size:calc(var(--dk) * .46);touch-action:none}
.dbtn:active,.dbtn.on{transform:translateY(3px);box-shadow:0 1px 0 #ecdcd4;background:var(--accent-l)}
.dbtn.up{grid-column:2;grid-row:1}.dbtn.left{grid-column:1;grid-row:2}.dbtn.right{grid-column:3;grid-row:2}.dbtn.down{grid-column:2;grid-row:3}

/* gecko box on pages */
.gkstage{height:clamp(120px,26dvh,230px);display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(ellipse 42% 12% at 50% 90%,#f1dfca 0 55%,transparent 100%)}
.gkbox{width:min(270px,70vw,calc(clamp(120px,26dvh,230px) * 1.45));aspect-ratio:260/160}
.gkbox.oops{animation:shake .4s}
.gkbox .sgwrap{width:100%;height:100%;transition:transform .3s;transform-origin:66% 92%}
.gkbox .flip{width:100%;height:100%;transition:transform .3s}
.pose-up .sgwrap{transform:rotate(22deg)}
.pose-down .sgwrap{transform:scale(1.08,.82)}
.pose-left .sgwrap{transform:translateX(-12%) scale(1.06,.97)}
.pose-right .flip{transform:scaleX(-1)}
.duo{display:flex;flex-direction:column;align-items:center}
.duo>div{width:100%}
@media (orientation:landscape) and (max-height:560px){
  .duo{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
  .gkstage{height:clamp(100px,42dvh,200px)}
  .gkbox{width:min(260px,calc(clamp(100px,42dvh,200px) * 1.45))}
}

/* yoga */
.seq{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.ac{font-size:26px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:#fff;
  border-radius:14px;border:2px solid var(--line);transition:.2s}
.ac.now{border-color:var(--accent);transform:scale(1.1);box-shadow:0 0 0 4px var(--accent-l)}
.ac.done{background:#e3f6ec;border-color:var(--health);opacity:.7}
.ac.shake{animation:shake .4s}

/* reading */
.passage{background:#fff;border-radius:18px;padding:14px 16px;border:1.5px solid var(--line);line-height:1.9;font-size:17.5px}
.passage h3{margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17.5px}
.speak{background:#eaf5fd;border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.q{font-weight:900;font-size:17.5px;margin:16px 0 10px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;font-size:16.5px;font-weight:700;text-align:left}
.opt.right{background:#e3f6ec;border-color:var(--health)}
.opt.wrong{background:#ffecee;border-color:#f3a7b4;opacity:.7}
.result{margin-top:14px;font-size:16.5px;font-weight:700;text-align:center;line-height:1.7}

/* typing with zhuyin */
.sent{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 14px}
.cb{display:flex;align-items:center;gap:1px;padding:6px 5px 6px 7px;border-radius:12px;background:#fff;border:2px solid var(--line);transition:.15s}
.cb .ch{font-size:30px;font-weight:700;line-height:1}
.zy{position:relative;display:flex;flex-direction:column;font-size:10.5px;line-height:1.08;width:12px;align-items:center;font-weight:500}
.zy i{font-style:normal;display:block}
.zy .tn{position:absolute;right:-6px;font-size:10px}
.zy .nt{font-size:11px;line-height:.6}
.cb.ok{background:#e3f6ec;border-color:var(--health)}
.cb.bad{background:#ffe8ed;border-color:#f3a0b2}
@media (max-width:380px){.cb .ch{font-size:25px}.cb{padding:5px 3px 5px 5px}.sent{gap:4px}}
.type-in{width:100%;font-size:21px;padding:11px 14px;border-radius:16px;border:2px solid #f4d5df;outline:none;text-align:center;background:#fff;-webkit-user-select:text;user-select:text}
.type-in:focus{border-color:var(--accent)}

/* shop / feed */
.list{display:grid;gap:10px}
@media (min-width:640px),(orientation:landscape) and (max-height:560px){.list.two{grid-template-columns:1fr 1fr}}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}
.item.sel{border-color:var(--accent);background:#fff5f8}
.item.dis{opacity:.45}
.item .ic{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center;background:#fbf4ee;border-radius:14px}
.item .ic svg{width:44px;height:44px}
.item .tx{flex:1;min-width:0}
.item .tx b{font-size:16.5px}
.item .tx p{margin:2px 0 0;font-size:13px;color:var(--soft);line-height:1.45}
.buy{border-radius:12px;padding:9px 12px;font-weight:900;font-size:15px;background:var(--accent);color:#fff;white-space:nowrap;flex:none}
.buy.off{opacity:.4}
.sec{font-weight:900;font-size:15px;color:var(--soft);margin:14px 2px 8px}
.bag{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.bag span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.preview{background:#fff;border:1.5px dashed #ecd2c4;border-radius:16px;padding:10px 14px;text-align:center;margin-top:14px;line-height:1.7;font-size:15px}
.d0{color:#3fa97a;font-weight:900}.d1{color:#e08b3a;font-weight:900}.d2{color:#e0546e;font-weight:900}

/* maze */
.mz-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.mz-info{font-size:15px;text-align:center;line-height:1.5}
.board{position:relative;touch-action:none;border-radius:16px;overflow:hidden;box-shadow:0 4px 0 rgba(160,110,70,.25);flex:none}
.board canvas{display:block;width:100%;height:100%}
.ent{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ent svg{width:100%;height:100%;display:block;overflow:visible}
.ent.catch{animation:pop .5s}
@media (orientation:landscape) and (max-height:560px){
  .mz-wrap{display:grid;grid-template-columns:auto auto;grid-template-rows:auto 1fr;grid-template-areas:"board info" "board pad";
    column-gap:22px;row-gap:8px;justify-content:center;align-items:center}
  .mz-info{grid-area:info}.board{grid-area:board}#mzPad{grid-area:pad}
}

/* diary */
.diary p{margin:0;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.5}
.diary time{color:var(--soft);font-size:13px;margin-right:6px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.chips2 span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
.shedbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:14.5px;line-height:1.6}
.shedbar{height:8px;border-radius:99px;background:#f3e9e3;overflow:hidden;margin-top:6px}
.shedbar i{display:block;height:100%;background:#cfc6e8;border-radius:99px}

/* toast & fx */
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--text);color:#fff;
  border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;z-index:100;transition:.3s;max-width:88vw;text-align:center;pointer-events:none}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
#fxl{position:fixed;inset:0;pointer-events:none;z-index:110}
#fxl .g{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:20px;font-weight:900;color:var(--accent-d);
  background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 14px rgba(120,80,60,.15);animation:floatUp2 1.6s forwards;white-space:nowrap}

/* ---------- side-view Butter ---------- */
.sgwrap{width:100%;height:100%;transform-origin:50% 92%}
.flip{width:100%;height:100%;transition:transform .3s}
.sg{width:100%;height:100%;display:block;overflow:visible;transition:filter .8s}
.sg .leg,.sg .tail,.sg .head,.sg .bodyg{transform-box:view-box}
.sg .bodyg{transform-origin:138px 140px;animation:sgBreath 3.2s ease-in-out infinite}
.sg .head{animation:sgHead 3.2s ease-in-out infinite}
.sg .tail{animation:sgTail 3.8s ease-in-out infinite}
.sg .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(var(--lid,.36));animation:blinkS 5s infinite}
.sg .head{transform-origin:110px 112px}
.sg .tongue{transform-box:fill-box;transform-origin:100% 50%}
.sg .closed,.sg .joy,.sg .brow,.sg .mopen,.sg .tongue{display:none}
.walking .sg .leg.a{animation:sgLegA .34s ease-in-out infinite alternate}
.walking .sg .leg.b{animation:sgLegB .34s ease-in-out infinite alternate}
.walking .sgwrap{animation:bob .34s ease-in-out infinite alternate}
.walking .sg .tail{animation:sgTailW .34s ease-in-out infinite alternate}
.sleepy .sg .lid{animation:none;transform:scaleY(.62)}
.sleep .sg .lid{animation:none;transform:scaleY(1)}
.sleep .sg .closed{display:inline}
.sleep .sg .ridge,.happy .sg .ridge{opacity:.6}
.sleep .sg .bodyg{animation:sgBreath 4.6s ease-in-out infinite}
.sleep .sg .tail,.sleep .sg .head{animation:none}
.happy .sg .lid{animation:none;transform:scaleY(1)}
.happy .sg .joy{display:inline}
.happy .sg .closed{display:none}
.happy .sg .tail{animation:wagF .18s ease-in-out 8 alternate}
.happy .sgwrap{animation:hop .55s ease-out}
.angry .sg .lid{animation:none;transform:scaleY(.5)}
.angry .sg .pupil{ry:5}
.angry .sg .closed,.angry .sg .joy{display:none}
.angry .sg .brow,.angry .sg .mopen{display:inline}
.angry .sg .mouth{display:none}
.angry .sg .tail{animation:wagF .11s linear infinite alternate}
.angry .sgwrap{animation:shake .32s 4}
.lick .sg .tongue{display:inline;animation:tongue .2s 8 alternate}
.dull .sg{filter:grayscale(.62) brightness(1.1) contrast(.9)}
.rub .sgwrap{animation:rub .28s ease-in-out infinite alternate}

/* ---------- top-down Butter (maze only) ---------- */
.gkv .g-head{transform-origin:128px 50px}
.gkv .g-tail{transform-origin:72px 50px;animation:tailIdle 3.2s ease-in-out infinite}
.gkv .lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5s infinite}
.walking .gkv .leg.a{animation:legA .36s ease-in-out infinite alternate}
.walking .gkv .leg.b{animation:legB .36s ease-in-out infinite alternate}
.walking .gkv .g-tail{animation:tailWalk .36s ease-in-out infinite alternate}
.running .rv .rl.a{animation:rlegA .12s linear infinite alternate}
.running .rv .rl.b{animation:rlegB .12s linear infinite alternate}
.running .rv .ant{animation:ant .2s linear infinite alternate}
.worm-wiggle{animation:wig 1.2s ease-in-out infinite}

@keyframes sgBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.035)}}
@keyframes sgHead{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}}
@keyframes sgTail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sgTailW{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes sgLegA{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
@keyframes sgLegB{from{transform:rotate(17deg)}to{transform:rotate(-17deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3%)}}
@keyframes wagF{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16%) scale(1.03,.97)}70%{transform:translateY(0) scale(1.05,.94)}}
@keyframes rub{from{transform:rotate(-2.5deg) translateX(-2%)}to{transform:rotate(2.5deg) translateX(2%)}}
@keyframes tongue{from{transform:scaleX(.4)}to{transform:scaleX(1.1)}}
@keyframes legA{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes legB{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes tailIdle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes tailWalk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes blinkS{0%,92%,100%{transform:scaleY(var(--lid,.36))}95%{transform:scaleY(1)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes rlegA{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes rlegB{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
@keyframes ant{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes wig{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-60px)}}
@keyframes floatUp2{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes flake{0%{opacity:0;transform:translate(0,0) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),26px) rotate(170deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes shimmer{from{fill:#a9def5}to{fill:#e0f6ff}}
@keyframes blinkbar{50%{opacity:.5}}
</style>

<script>
/* =========================================================
   資料與存檔
   ========================================================= */
const SAVE_KEY = 'butterGeckoDiary_v1';
const DAY = 86400000, SHED_DAYS = 10;
const DEFAULT = {
  coins: 30, hunger: 60, health: 70, mood: 70, growth: 0,
  inv: { worm: 1, roach: 0, calcium: 0 },
  lastTick: Date.now(), created: Date.now(), lastShed: 0, shedCount: 0,
  diary: [], stats: { fed: 0, yoga: 0, read: 0, type: 0 },
  lastWater: 0, sound: true, recentRead: [], recentType: [], pet: 'butter', pets: {}
};
let S;
const $ = s => document.querySelector(s);
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){
  try{ const raw = localStorage.getItem(SAVE_KEY); S = raw ? Object.assign(clone(DEFAULT), JSON.parse(raw)) : clone(DEFAULT); }
  catch(e){ S = clone(DEFAULT); }
  S.inv = Object.assign({ worm:0, roach:0, calcium:0 }, S.inv);
  S.stats = Object.assign({ fed:0, yoga:0, read:0, type:0 }, S.stats);
  if (!Array.isArray(S.recentRead)) S.recentRead = [];
  if (!Array.isArray(S.recentType)) S.recentType = [];
  if (!S.lastShed) S.lastShed = S.created || Date.now();
  if (!PETS[S.pet]) S.pet = 'butter';
  if (!S.pets || typeof S.pets !== 'object') S.pets = {};
}
const PETS = {
  butter: { id:'butter', name:'奶油', zy:'ㄋㄞˇ ㄧㄡˊ', species:'豹紋守宮', desc:'眼神銳利的小豹紋，橘色條紋上有黃色小顆粒。' },
  choco:  { id:'choco',  name:'巧克力', zy:'ㄑㄧㄠˇ ㄎㄜˋ ㄌㄧˋ', species:'肥尾守宮', desc:'黑黑圓圓的大眼睛，背上一條白線，尾巴胖嘟嘟。' }
};
const P = () => PETS[S.pet] || PETS.butter;
const nm = s => String(s).replaceAll('奶油', P().name).replaceAll('豹紋守宮', P().species);
const PET_FIELDS = ['hunger','health','mood','growth','lastTick','created','lastShed','shedCount','diary','stats','lastWater'];
function freshPet(){ const n = Date.now(); return { hunger:60, health:70, mood:70, growth:0, lastTick:n, created:n, lastShed:n, shedCount:0, diary:[], stats:{ fed:0, yoga:0, read:0, type:0 }, lastWater:0 }; }
function switchPet(id){
  const cur = {}; PET_FIELDS.forEach(k => cur[k] = clone(S[k] === undefined ? null : S[k])); S.pets[S.pet] = cur;
  const nx = S.pets[id] || freshPet(), fr = freshPet();
  PET_FIELDS.forEach(k => S[k] = (nx[k] === undefined || nx[k] === null) ? fr[k] : clone(nx[k]));
  S.pet = id;
  decay(Date.now() - S.lastTick, true); S.lastTick = Date.now();
  if (!S.diary.length) addDiary(`🦎 ${P().name}來到資源班了！請大家多多照顧牠～`);
  save();
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

const FOODS = {
  worm:    { name:'蟲泥',       price:10, hunger:20, growth:3, health:2 },
  roach:   { name:'杜比亞蟑螂', price:25, hunger:50, growth:6, health:5 },
  calcium: { name:'鈣粉',       price:15 }
};
const foodName = (f, cal) => (cal ? '加鈣粉的' : '') + FOODS[f].name;

/* ---------- 讀書關卡（第一個選項是正確答案，顯示時打亂） ---------- */
const READS = [
 {pet:'butter', t:'奶油的老家',p:'豹紋守宮的老家在巴基斯坦、阿富汗和印度西北部。那裡是乾燥的岩石荒地，白天很熱，晚上比較涼。所以奶油喜歡溫暖、乾燥的環境。',q:'豹紋守宮的老家是什麼樣的地方？',o:['乾燥的岩石荒地','下雪的森林','很深的大海'],e:'豹紋守宮住在乾燥、有很多石頭的地方。'},
 {t:'胖胖的尾巴',p:'豹紋守宮的尾巴會儲存脂肪，就像一個小小的便當盒。尾巴胖胖的，代表守宮營養很充足；尾巴變得很細，可能是生病或太久沒吃東西了。',q:'豹紋守宮的尾巴胖胖的，代表什麼？',o:['營養很充足','牠在生氣','牠想睡覺'],e:'尾巴是守宮的「營養倉庫」。'},
 {t:'會眨眼的守宮',p:'大部分的守宮沒有眼皮，要用舌頭舔眼睛來清潔。但是豹紋守宮很特別，牠有眼皮，可以眨眼睛，睡覺時也會閉上眼睛。',q:'豹紋守宮為什麼可以眨眼睛？',o:['因為牠有眼皮','因為牠戴眼鏡','因為牠很愛哭'],e:'有眼皮是豹紋守宮的特色之一。'},
 {t:'夜晚的小探險家',p:'豹紋守宮白天喜歡躲在躲避屋裡睡覺，到了傍晚和晚上才會出來散步、找東西吃。所以白天如果奶油在睡覺，我們要輕聲細語，不要吵醒牠。',q:'豹紋守宮什麼時候最活潑？',o:['傍晚和晚上','中午大太陽時','永遠都不動'],e:'豹紋守宮多在黃昏和夜晚活動。'},
 {t:'換新衣服',p:'守宮長大時會「蛻皮」，把舊的皮脫掉，換上新的皮。蛻皮前，牠的顏色會變得灰灰白白的。蛻完皮後，豹紋守宮常常會把舊皮吃掉喔！',q:'豹紋守宮蛻皮後，舊皮常常會怎麼樣？',o:['被牠吃掉','變成蝴蝶','黏在天花板上'],e:'吃掉舊皮可以回收營養。'},
 {t:'鈣粉的祕密',p:'守宮的骨頭需要鈣質，才能長得又直又強壯。如果長期缺少鈣質，骨頭會變軟，嚴重時會生病。所以餵食時，可以在蟲蟲身上撒一點鈣粉。',q:'為什麼要幫守宮的食物撒鈣粉？',o:['讓骨頭強壯','讓牠變顏色','讓食物變甜'],e:'鈣質能讓守宮的骨骼健康。'},
 {t:'不會爬玻璃',p:'很多壁虎的腳底有特別的皮瓣，可以在牆壁上爬。但是豹紋守宮的腳趾是小爪子，沒有那種皮瓣，所以牠不能在光滑的玻璃上爬來爬去。',q:'豹紋守宮能在光滑的玻璃上爬嗎？',o:['不能','可以，而且很快','只能在晚上爬'],e:'豹紋守宮是住在地面的守宮。'},

let actx;
function beep(type){
  if (!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const f = { ok:[660,990], bad:[320,220], coin:[880,1400], eat:[480,760], up:[520,1040] }[type] || [600,600];
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.setValueAtTime(f[0], t); o.frequency.linearRampToValueAtTime(f[1], t + .15);
    g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.001, t + .26);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .28);
  }catch(e){}
}
function speak(text){
  if (!('speechSynthesis' in window)){ toast('這台裝置不支援朗讀'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(nm(text)); u.lang = 'zh-TW'; u.rate = .85;
  speechSynthesis.speak(u);
}

function pickRandom(len, key, keep){

  const before = stageOf(S.growth);

  }

let L = null;

function drawFloor(){

    ctx.strokeStyle = 'rgba(255,246,228,.6)'; ctx.lineWidth = 1.1 * s;

    ctx.beginPath(); ctx.moveTo(-w * .3, (c.b - .5) * h * .4); ctx.lineTo(w * .3, (c.d - .5) * h * .4); ctx.stroke();

  ctx.fillStyle = g; ctx.fillRect(0, ft, W, (H - ft) * .25);
}

/* =========================================================
   飼養箱：奶油的行為
   ========================================================= */
const G = { u:.38, v:.55, tu:0, tv:0, face:-1, state:'idle', until:0, reason:'', p:0, onArrive:null, inCave:false,
            sleepUntil:0, zzzAt:0, pendingShed:false, pendingDemo:false, shedding:false, justShed:false, seq:0, last:0, px:0, py:0, w:0, h:0 };
let pageOpen = false, mode = null, onPageClose = null, lastPet = 0, lastAngry = 0;
const gs = () => L.gs0 * (0.74 + S.growth * 0.0036);
const ds = v => .84 + .16 * v;

const uFromX = x => { const w = gs(); return clamp01((x - w / 2 - 6) / (L.W - w - 12)); };
const yFromV = v => L.bandTop + v * (L.bandBot - L.bandTop);
const vFromY = y => clamp01((y - L.bandTop) / (L.bandBot - L.bandTop));

function geckoFrame(){

  if (G.inCave){

function walkTo(u, v, cb){ G.tu = clamp01(u); G.tv = clamp01(v); G.state = 'walk'; G.onArrive = cb || null; }

function goSleep(reason){

function wake(msg){

}
function decide(t){
  if (shedDue()) return startShed(false);

  const r = Math.random();

  walkTo(Math.random(), Math.random());
}
const flashT = {};
function flash(cls, ms){
  const g = $('#gk'); g.classList.remove(cls); void g.offsetWidth; g.classList.add(cls);

function update(dt, t){

      const du = G.tu - G.u, dv = G.tv - G.v, k = L.W - gs() - 12, hb = L.bandBot - L.bandTop;
      const dxp = du * k, dyp = dv * hb, d = Math.hypot(dxp, dyp);

      if (d < 1.5){ G.u = G.tu; G.v = G.tv; arrive(); }

      else if (G.reason === 'hungry' && S.hunger >= 20 && !pageOpen) wake('吃飽飽，有精神了！謝謝你 💕');
      else if (G.reason === 'nap' && t > G.sleepUntil) wake('呼啊～睡飽了！');

const DX = [0,1,0,-1], DY = [-1,0,1,0], DIRI = { up:0, right:1, down:2, left:3 };

  const at = (x, y) => cells[y * c + x], st = [at(0,0)]; at(0,0).v = true;

    if (!ns.length){ st.pop(); continue; }

    cur.w[d] = false; nb.w[(d + 2) % 4] = false; nb.v = true; st.push(nb);

    const d = inputDir();
    if (d != null){
      if (!MZ.mz.at(g.cx, g.cy).w[d]){ g.dir = d; g.nx = g.cx + DX[d]; g.ny = g.cy + DY[d]; g.p = 0; g.moving = true; }
      else { if (MZ.run === d) MZ.run = null; g.dir = d; }
      if (MZ.tap === d) MZ.tap = null;
    }
  }
  turnToward(g, dt);
}
function updFood(dt){
  const f = MZ.f, g = MZ.g;
  if (MZ.diff === 0) return;
  if (f.pause > 0){ f.pause -= dt; return; }
  if (f.moving){
    f.p += MZ.speedF * dt;
    if (f.p >= 1){ f.cx = f.nx; f.cy = f.ny; f.p = 0; f.moving = false; if (Math.random() < (MZ.diff === 1 ? .12 : .05)) f.pause = .25 + Math.random() * .6; }
  }
  if (!f.moving && f.pause <= 0){
    const gp = [[g.cx, g.cy], [g.nx, g.ny]], opts = [];
    for (let d = 0; d < 4; d++){
      if (MZ.mz.at(f.cx, f.cy).w[d]) continue;
      const nx = f.cx + DX[d], ny = f.cy + DY[d];
      if (gp.some(p => p[0] === nx && p[1] === ny)) continue;
      opts.push({ d, nx, ny });
    }
    if (!opts.length){ f.pause = .2; return; }
    let pick;
    if (Math.random() < (MZ.diff === 2 ? .75 : .3)){
      const dist = bfs(MZ.mz, g.cx, g.cy);
      pick = opts.reduce((a, o) => dist[o.ny * MZ.mz.c + o.nx] > dist[a.ny * MZ.mz.c + a.nx] ? o : a);
    } else {
      let cand = opts.filter(o => o.d !== (f.dir + 2) % 4); if (!cand.length) cand = opts;
      pick = cand[Math.random() * cand.length | 0];
    }
    f.dir = pick.d; f.nx = pick.nx; f.ny = pick.ny; f.moving = true;
  }
  turnToward(f, dt);
}
function drawEnts(){
  const c = MZ.cell;
  const put = (el, m, wc, hc) => {
    const p = posOf(m), w = wc * c, h = hc * c, x = MZ.pad + (p.x + .5) * c, y = MZ.pad + (p.y + .5) * c;
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.transform = `translate(${x - w/2}px,${y - h/2}px) rotate(${m.ang}deg)`;
  };
  put($('#ge'), MZ.g, 1.75, .875);
  if (MZ.food === 'worm') put($('#fe'), MZ.f, .78, .78); else put($('#fe'), MZ.f, .78, .55);
  $('#ge').classList.toggle('walking', MZ.g.moving);
  if (MZ.food !== 'worm') $('#fe').classList.toggle('running', MZ.f.moving);
}
function mazeLoop(t){
  if (!MZ || MZ.caught || mode !== 'maze') return;
  const dt = Math.min(.05, (t - MZ.last) / 1000); MZ.last = t;
  updGecko(dt);
  if (t > MZ.startAt) updFood(dt);
  drawEnts();
  const a = posOf(MZ.g), b = posOf(MZ.f), hx = a.x + DX[MZ.g.dir] * .3, hy = a.y + DY[MZ.g.dir] * .3;
  if (Math.hypot(a.x - b.x, a.y - b.y) < .55 || Math.hypot(hx - b.x, hy - b.y) < .4){ caught(); return; }
  mzRaf = requestAnimationFrame(mazeLoop);
}
function caught(){
  MZ.caught = true; onPageClose = null; beep('eat');
  $('#fe').style.transition = 'opacity .3s'; $('#fe').style.opacity = 0;
  $('#ge').classList.add('catch'); $('#ge').classList.remove('walking');
  setTimeout(feedResult, 750);
}
function stopMaze(){ cancelAnimationFrame(mzRaf); const pb = $('#pbody'); if (pb) pb.style.overflow = ''; }
function feedResult(){
  if (!MZ || mode !== 'maze') return;
  const { food, cal } = MZ, F = FOODS[food], slow = S.health < 30;
  let gr = F.growth + (cal ? 2 : 0); if (slow) gr = Math.ceil(gr / 2);
  const ch = { hunger: F.hunger + (cal ? 5 : 0), health: F.health + (cal ? 30 : 0), mood: 5, growth: gr };
  S.stats.fed++; addDiary(`🍽️ 奶油在迷宮抓到了${foodName(food, cal)}，吃得好開心！`);
  stopMaze(); mode = 'done';
  changeStats(ch);
  openPage('🎉 抓到了！', `
    <div class="gkstage">${gkHTML('lick')}</div>
    <p class="lead">奶油吃掉了 <b>${foodName(food, cal)}</b>，好好吃～😋</p>
    <div class="preview">🦗 飽足 +${ch.hunger}・🦴 健康 +${ch.health}・💗 心情 +5・🌱 成長 +${gr}
      ${slow ? '<br><span class="d2">鈣質不足，長大得比較慢，記得加鈣粉喔！</span>' : ''}</div>
    <div class="row"><button class="btn" onclick="openFeed()">再餵一次</button><button class="btn ghost" onclick="closePage()">回家</button></div>`);
}

/* =========================================================
   📔 日記
   ========================================================= */
function openDiary(){
  mode = 'diary';
  const dss = daysSinceShed(), left = Math.max(0, Math.ceil(SHED_DAYS - dss));
  const shedMsg = dss >= SHED_DAYS ? '今天就會蛻皮喔！' : left <= 1 ? '明天左右就要蛻皮了，身體會變得灰灰的' : `大約再 ${left} 天會蛻皮`;
  const list = S.diary.length ? S.diary.map(d => `<p><time>${fmtTime(d.t)}</time>${d.m}</p>`).join('') : '<p>還沒有日記，快去照顧奶油吧！</p>';
  openPage('📔 成長日記', `
    <div class="shedbox">🦎 <b>蛻皮週期</b>（約 ${SHED_DAYS} 天一次）・已蛻皮 ${S.shedCount || 0} 次<br>${shedMsg}
      <div class="shedbar"><i style="width:${Math.min(100, dss / SHED_DAYS * 100)}%"></i></div></div>
    <div class="bag"><span>🥣 蟲泥 ${S.inv.worm}</span><span>🪳 杜比亞 ${S.inv.roach}</span><span>🦴 鈣粉 ${S.inv.calcium}</span></div>
    <div class="chips2"><span>餵食 ${S.stats.fed}</span><span>瑜伽 ${S.stats.yoga}</span><span>讀書 ${S.stats.read}</span><span>寫字 ${S.stats.type}</span></div>
    <div class="diary">${list}</div>
    <div class="row">
      <button class="btn ghost small" onclick="toggleSound()">${S.sound ? '🔊 音效開' : '🔇 音效關'}</button>
      <button class="btn ghost small" onclick="openChooser()">🔁 換一隻寵物</button>
      <button class="btn ghost small" onclick="demoShed()">🦎 老師示範蛻皮</button>
      <button class="btn ghost small" onclick="resetGame()">♻️ 重新開始</button>
    </div>`);
}
function openChooser(first){
  if (G.state === 'busy') { toast('等奶油蛻完皮再換喔～'); return; }
  mode = 'choose';
  const card = id => { const p = PETS[id], cur = S.pet === id && !first;
    return `<button class="petcard ${cur ? 'sel' : ''}" onclick="choosePet('${id}')">
      <div class="pc-img">${gkHTML('', LOOKS[id])}</div>
      <b>${p.name}</b><span class="sp">${p.species}</span><p>${p.desc}</p>${cur ? '<span class="cur">✅ 正在照顧</span>' : ''}</button>`; };
  openPage(first ? '🦎 選一隻班寵來照顧' : '🔁 換一隻寵物', `
    <p class="lead">${first ? '資源班有兩隻守宮，你想照顧哪一隻呢？' : '每一隻都有自己的狀態和日記，<br>金幣和背包是大家共用的喔！'}</p>
    <div class="petgrid">${card('butter')}${card('choco')}</div>`, true);
}
function choosePet(id){
  const changed = id !== S.pet;
  if (changed) switchPet(id);
  closePage(); setupPet();
  if (changed || S.diary.length <= 1) setTimeout(() => bubble(`嗨！我是${P().name}，請多多指教～`, 3800), 400);
}
function setupPet(){
  const K = curLook();
  G.seq++; G.inCave = false; G.p = 0; G.state = 'idle'; G.shedding = false; G.justShed = false; G.onArrive = null; G.pendingShed = false;
  G.u = .38; G.v = .55; G.face = -1;
  $('#skin').style.opacity = 0; $('#gk').className = '';
  $('#gkFlip').innerHTML = sideGeckoSVG(null, K);
  $('#avatar').innerHTML = sideGeckoSVG('20 70 96 62', K);
  document.title = `${P().name}養成日記：小守宮的大冒險`;
  if (S.hunger < 20 && L){
    G.reason = 'hungry'; G.inCave = true; G.p = 1; G.state = 'sleep';
    const e = entranceUV(); G.u = e.u; G.v = e.v;
  } else G.until = performance.now() + 1500;
  render();
}
function toggleSound(){ S.sound = !S.sound; save(); openDiary(); }
function demoShed(){ closePage(); setTimeout(() => startShed(true), 500); }
function resetGame(){
  if (confirm('確定要重新開始嗎？\n所有金幣、背包和奶油的成長紀錄都會清除喔！')){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    location.reload();
  }
}

/* =========================================================
   鍵盤
   ========================================================= */
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pageOpen){ closePage(); return; }
  const dir = KEYMAP[e.key]; if (!dir) return;
  if (mode === 'yoga'){ e.preventDefault(); if (!e.repeat) yogaPress(dir); }
  else if (mode === 'maze' && MZ){ e.preventDefault(); MZ.hold = DIRI[dir]; if (!e.repeat) MZ.tap = DIRI[dir]; MZ.run = null; }
});
document.addEventListener('keyup', e => { const dir = KEYMAP[e.key]; if (dir && mode === 'maze' && MZ && MZ.hold === DIRI[dir]) MZ.hold = null; });

/* =========================================================
   啟動
   ========================================================= */
function setAppHeight(){ document.documentElement.style.setProperty('--apph', window.innerHeight + 'px'); }
function onResize(){
  setAppHeight();
  requestAnimationFrame(() => { layoutStage(); if (mode === 'maze' && MZ && !MZ.caught) mazeLayout(); });
}
function init(){
  setAppHeight();
  let firstRun = false; try { firstRun = !localStorage.getItem(SAVE_KEY); } catch(e){}
  load();
  const now = Date.now(), away = now - S.lastTick;
  decay(away, true); S.lastTick = now;
  if (!S.diary.length) addDiary('🦎 奶油來到資源班了！請大家多多照顧牠～');
  save();
  layoutStage();
  setupPet();
  if (G.state === 'sleep') bubble('奶油餓到在躲避屋睡著了…快餵牠吃東西 🦗', 4500);
  else bubble(away > 3600000 ? '你回來了！我好想你～ 💕' : '嗨！我是奶油，點我可以摸摸我喔～', 4200);
  if (firstRun) setTimeout(() => openChooser(true), 600);
  $('#stage').addEventListener('click', onStageTap);
  render();
  requestAnimationFrame(loop);
  setInterval(tick, 10000);
  setInterval(() => { $('#status').textContent = statusText(); }, 1000);
  setInterval(() => { if (!pageOpen && G.state !== 'sleep' && G.state !== 'busy' && G.state !== 'exit') bubble(moodLine(), 4500); }, 16000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (window.ResizeObserver) new ResizeObserver(() => layoutStage()).observe($('#stage'));
}
init();
</script>
