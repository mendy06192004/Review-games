<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>生活大爆炸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: portrait = header, tonight's 10 slots, element buttons (2-row scroller), then the 3D home (bedroom is the main view). Landscape = home fills the left, controls on the right. Rules fold at the bottom. */
:root{
  --bg:#efe9ff; --dot:#ddd3fb; --ink:#2b1d3a; --panel:#ffffff; --muted:#76688a; --soft:#f5f1ff;
  --pink:#ff4f9a; --sun:#ffd23f; --mint:#2fd3a3; --sky:#5bbcff; --grape:#8b5cf6; --red:#ff4d5e;
  --f-ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Baloo 2','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f-ui);color:var(--ink);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:18px 18px;-webkit-tap-highlight-color:transparent}
.app{max-width:1280px;margin:0 auto;padding-block:8px 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:8px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "slots" "items" "stage" "log" "data"}
.side{display:contents}
.slots{grid-area:slots}.items{grid-area:items}.log{grid-area:log}.data{grid-area:data}
@media (orientation:landscape) and (min-width:560px){
  html,body{height:100%}
  .app{height:100%;box-sizing:border-box;padding-block:8px;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "stage side";align-items:stretch}
  .side{display:flex;flex-direction:column;gap:8px;grid-area:side;overflow:auto;min-height:0;padding:2px 5px 6px 2px}
  .stage{aspect-ratio:auto!important;max-height:none!important;height:100%}
}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
svg.i{width:18px;height:18px;display:block}
.head{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{margin:0;font-weight:900;font-size:clamp(19px,4.6vw,26px);line-height:1.05;text-shadow:2px 2px 0 var(--pink);text-wrap:balance}
.logo small{display:block;font-size:.46em;letter-spacing:.12em;color:var(--pink);text-shadow:none;margin-top:3px}
.tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ib{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;padding:0;font-family:var(--f-num);font-weight:800;font-size:13px}
.ib.off{opacity:.4}
.ib:active{transform:translate(2px,2px);box-shadow:none}
.card{background:var(--panel);border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:8px}
.slots{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.dayinfo{flex:1;display:flex;gap:8px;align-items:center}
.dayinfo b{font-family:var(--f-num);font-weight:800;font-size:16px;line-height:1}
.cells{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;min-width:0}
.cell{border:2px dashed #c8bcdc;border-radius:9px;background:var(--soft);aspect-ratio:1/1.2;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.cell img{width:100%;max-width:34px;aspect-ratio:1;object-fit:contain}
.cell b{font-family:var(--f-num);font-size:12px;line-height:1;color:var(--muted)}
.cell.late{background:#e9e6ff}
.cell.cur{border:2.5px solid var(--pink);background:#ffe8f2}
.cell.done{border:2px solid var(--ink);background:#fff}
.cell.zz{border:2px solid var(--ink);background:#dcd8ff}
.sbtn{flex:0 0 auto;display:flex;gap:5px}
.mini{border:2px solid var(--ink);border-radius:10px;background:var(--panel);box-shadow:2px 2px 0 var(--ink);font-size:11px;font-weight:900;padding:2px 6px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.mini svg{width:14px;height:14px}
.mini:disabled{opacity:.35}
.mini:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.items{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:68px;gap:5px;overflow-x:auto;padding:2px 3px 6px 2px;scrollbar-width:thin}
@media (min-width:760px) and (orientation:portrait){.items{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(11,minmax(0,1fr));overflow:visible}}
@media (orientation:landscape) and (min-width:560px){.items{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible}}
.it{position:relative;min-width:0;border:2.5px solid var(--ink);border-radius:12px;background:var(--panel);box-shadow:2px 2px 0 var(--ink);padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;transition:transform .1s;overflow:hidden}
.it img,.it .ph{width:100%;max-width:54px;aspect-ratio:1;object-fit:contain;display:block}
.it .ph{background:var(--soft);border-radius:8px}
.it .nm{font-size:10.5px;font-weight:900;white-space:nowrap;line-height:1.2}
.it .lv{font-family:var(--f-num);font-weight:800;font-size:11px;line-height:1.1;color:var(--grape);min-height:12px}
.it .lv.max{color:#b07800}
.it .why{position:absolute;left:3px;right:3px;top:22px;font-size:10px;font-weight:900;background:#fff;border:1.5px solid var(--ink);border-radius:6px;line-height:1.25;padding:1px 2px;text-align:center}
.it .why:empty{display:none}
.it .out{position:absolute;top:3px;right:3px;width:16px;height:16px}
.it:not(:disabled):hover{transform:translateY(-3px);background:#fff8dd}
.it:not(:disabled):active{transform:translate(2px,2px);box-shadow:none}
.it:disabled{cursor:not-allowed;box-shadow:none;background:var(--soft)}
.it:disabled img{opacity:.35;filter:grayscale(.7)}
.it.used{background:#fff6cf}.it.used img{opacity:.85;filter:none}
.stage{grid-area:stage;position:relative;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;aspect-ratio:1/.95;max-height:72vh;width:100%;background:linear-gradient(180deg,var(--s1),var(--s2));transition:background 1s;--s1:#ffd3b0;--s2:#ffb0cf;touch-action:none}
.stage.tod1{--s1:#c9b9ff;--s2:#ffb0cf}.stage.tod2{--s1:#211d55;--s2:#4a3a8c}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.ft{font-family:var(--f-num),var(--f-ui);font-weight:800;font-size:15px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:ftK 1.3s ease-out forwards}
.ft.big{font-size:21px}.ft.up{color:var(--sun)}.ft.down{color:#a9b2ff}.ft.new{color:#7ff5cf}
@keyframes ftK{0%{opacity:0;margin-top:14px;scale:.4}18%{opacity:1;margin-top:0;scale:1.35}30%{scale:1}80%{opacity:1}100%{opacity:0;margin-top:-34px}}
.bub{font-size:12px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 9px;box-shadow:2px 2px 0 var(--ink);animation:bubK 1.7s ease-out forwards;position:relative}
.bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:9px;height:9px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bub.neg{background:#ffe4ea}.bub.time{background:#e9e6ff}
@keyframes bubK{0%{opacity:0;scale:.3}12%{opacity:1;scale:1.12}20%{scale:1}85%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;max-width:92%}
.banner b{display:inline-block;font-weight:900;font-size:clamp(17px,4.4vw,24px);background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:6px 14px;animation:popK .4s cubic-bezier(.3,1.6,.5,1)}
.banner.combo b{font-family:var(--f-num);font-size:clamp(28px,8vw,46px);background:var(--sun);rotate:-6deg;padding:0 18px}
@keyframes popK{0%{scale:.4;opacity:0}100%{scale:1;opacity:1}}
.narr{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.95);border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px;font-size:13px;font-weight:700;line-height:1.45;pointer-events:none}
.narr:empty{display:none}
.clock{position:absolute;left:8px;top:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
.clock b{font-family:var(--f-num);font-weight:800;font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 9px}
.clock span{font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px}
.camui{position:absolute;right:8px;top:8px;display:flex;gap:5px}
.camui button{height:30px;min-width:30px;border:2px solid var(--ink);border-radius:999px;background:rgba(255,255,255,.92);font-weight:900;font-size:12px;padding:0 8px;box-shadow:2px 2px 0 var(--ink)}
.camui button.on{background:var(--sun)}
.camui button:active{transform:translate(2px,2px);box-shadow:none}
.quake{animation:quakeK .4s}
@keyframes quakeK{20%{translate:-6px 3px}40%{translate:6px -3px}60%{translate:-4px 2px}80%{translate:3px 0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flK .5s}
.wipe{position:absolute;inset:0;background:var(--ink);clip-path:circle(0% at 50% 50%);pointer-events:none;display:grid;place-items:center;z-index:3}
.wipe b{color:#fff;font-weight:900;font-size:clamp(22px,6vw,30px);letter-spacing:.1em;opacity:0}
@keyframes flK{0%{opacity:.9}100%{opacity:0}}
.conf{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;pointer-events:none;animation:fallK 2s linear forwards}
@keyframes fallK{to{transform:translateY(620px) rotate(560deg);opacity:0}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;text-align:center;padding:20px;font-size:14px}
.log h2,.data summary{margin:0 0 6px;font-size:13px;font-weight:900;display:flex;justify-content:space-between;gap:6px}
.log h2 span{font-weight:700;color:var(--muted);font-size:11px}
.log ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:130px;overflow:auto}
.log li{font-size:12px;line-height:1.45;background:var(--soft);border-radius:10px;padding:4px 8px}
.log li.new{animation:popK .35s}
.log .up{color:#0f9e75;font-weight:900}.log .dn{color:var(--red);font-weight:900}
.log li.empty{color:var(--muted);background:none;padding:0}
.data summary{cursor:pointer;list-style:none;margin:0}
.data summary::-webkit-details-marker{display:none}
.data summary::after{content:"▾";font-size:12px}
.data[open] summary::after{content:"▴"}
.rules{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:11.5px;max-height:220px;overflow:auto}
.rules li{background:var(--soft);border-radius:8px;padding:3px 7px}
.rules li.lock{color:var(--muted)}
.small{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.55}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(43,29,58,.5);padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.mbox{width:100%;max-width:540px;max-height:90vh;overflow:auto;background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:16px;animation:popK .35s cubic-bezier(.3,1.6,.5,1)}
.mbox h3{margin:4px 0;font-size:21px;font-weight:900;text-align:center;text-wrap:balance}
.mbox h4{margin:14px 0 6px;font-size:15px;font-weight:900}
.mbox p{margin:6px 0;font-size:14px;line-height:1.6}
.center{text-align:center}
.how{display:grid;gap:6px;margin:12px 0;padding:0;list-style:none;counter-reset:h}
.how li{display:flex;gap:9px;font-size:13.5px;line-height:1.5;background:var(--soft);border-radius:12px;padding:7px 9px}
.how li::before{counter-increment:h;content:counter(h);flex:0 0 22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--f-num);font-weight:800;display:grid;place-items:center;font-size:13px}
.btn{width:100%;border:3px solid var(--ink);border-radius:16px;padding:11px;font-weight:900;font-size:16px;background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.row{display:flex;gap:8px;margin-top:10px}
.fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.fam button{border:2.5px solid var(--ink);border-radius:12px;background:var(--soft);padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.fam button img,.fam button .ph{width:100%;max-width:56px;aspect-ratio:1;object-fit:contain}
.fam button[aria-pressed="true"]{background:#fff6cf;outline:3px solid var(--pink);outline-offset:-1px}
.snap{width:100%;border:2.5px solid var(--ink);border-radius:14px;display:block;background:linear-gradient(180deg,#c9b9ff,#ffb0cf)}
.rank{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 0}
.rank b{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:1;width:64px;height:64px;border:3px solid var(--ink);border-radius:16px;display:grid;place-items:center;background:var(--sun);box-shadow:3px 3px 0 var(--ink);rotate:-6deg}
.rank span{font-family:var(--f-num);font-weight:800;font-size:22px}
.tcard{font-weight:900;font-size:21px;text-align:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;margin:10px auto 4px;box-shadow:3px 3px 0 var(--ink);width:fit-content;max-width:100%}
.radar{display:block;width:100%;max-width:320px;margin:0 auto}
.cons{display:grid;gap:5px;margin:6px 0;padding:0;list-style:none}
.cons li{font-size:13px;line-height:1.45;border-radius:10px;padding:5px 9px;background:var(--soft);border-left:5px solid #b9b0c8}
.cons li.good{border-left-color:var(--mint)}.cons li.bad{border-left-color:var(--red)}
.quad{position:relative;display:grid;grid-template-columns:18px 1fr 1fr;grid-template-rows:1fr 1fr 18px;gap:5px}
.quad .ax{font-size:11px;font-weight:900;color:var(--muted);display:grid;place-items:center}
.quad .ay{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .axx{grid-column:2/4}
.qb{border:2.5px solid var(--ink);border-radius:12px;padding:5px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.qb.qA{background:#ffe3e7}.qb.qB{background:#e1f2ff}.qb.qC{background:#fff4d1}.qb.qD{background:#efeef3}
.qb h5{margin:0;font-size:12px;font-weight:900;display:flex;justify-content:space-between;gap:4px}
.qb h5 span{font-family:var(--f-num);font-weight:800}
.qi{display:flex;flex-wrap:wrap;gap:3px}
.qi div{position:relative;width:38px;text-align:center;font-size:9px;font-weight:900;line-height:1.1}
.qi img,.qi .ph{width:38px;height:38px;object-fit:contain;display:block;background:rgba(255,255,255,.6);border-radius:8px}
.qi div.no img,.qi div.no .ph{opacity:.25;filter:grayscale(1)}
.qi div.no{color:#a39bb0}
.qi i{position:absolute;top:-3px;right:-3px;font-style:normal;font-family:var(--f-num);font-weight:800;font-size:10px;background:var(--ink);color:#fff;border-radius:999px;min-width:16px;line-height:15px}
.tip{text-align:center;font-weight:900;font-size:13px;margin:8px 0 0}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.gal div{border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;font-weight:900;background:var(--soft)}
.gal div.got{background:#fff6cf}
@media (prefers-reduced-motion:reduce){.ft,.bub{animation-duration:.01s}}
</style>

<div class="app">
  <header class="head">
    <h1 class="logo">生活大爆炸<small>國中少女的一個晚上</small></h1>
    <div class="tools">
      <button class="ib" id="bFam" aria-label="選擇家人"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.3" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z" fill="#ffd23f"/><rect x="9.5" y="14" width="5" height="6" fill="#ff8fc0"/></svg></button>
      <button class="ib" id="bLand" aria-label="橫式全螢幕"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.4" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5" fill="#9fd8ff"/><circle cx="18" cy="12" r="1" fill="#2b1d3a"/></svg></button>
      <button class="ib" id="bSpeed" aria-label="動畫速度">1×</button>
      <button class="ib" id="bSfx" aria-label="音效開關"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#ffd23f"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button class="ib off" id="bBgm" aria-label="音樂開關"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.4" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="3" fill="#ff4f9a"/><circle cx="17.5" cy="16" r="3" fill="#ff4f9a"/></svg></button>
      <button class="ib" id="bGal" aria-label="結局圖鑑"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5c3-1.5 5.5-1.5 8 0v15c-2.5-1.5-5-1.5-8 0z" fill="#5bbcff"/><path d="M20 5c-3-1.5-5.5-1.5-8 0v15c2.5-1.5 5-1.5 8 0z" fill="#ff8fc0"/></svg></button>
      <button class="ib" id="bHelp" aria-label="玩法">?</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="loading" id="loading">正在佈置房間…</div>
    <div class="labels" id="labels"></div>
    <div class="clock"><b id="clock">18:00</b><span id="dayTag">晚上</span></div>
    <div class="camui">
      <button id="bZoomOut" aria-label="拉遠">−</button>
      <button id="bZoomIn" aria-label="拉近">＋</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="flash" id="flash"></div>
    <div class="wipe" id="wipe"><b id="wipeT"></b></div>
    <div class="narr" id="narr"></div>
  </section>

  <div class="side">
    <section class="slots card">
      <div class="dayinfo"><b id="dayNo">今晚 0/10</b></div>
      <div class="sbtn">
        <button class="mini" id="bUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6L3.5 11.5 9 17"/><path d="M4 11.5h10a6 6 0 0 1 6 6"/></svg>上一步</button>
        <button class="mini" id="bRestart"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1d3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>重來</button>
      </div>
      <div class="cells" id="cells"></div>
    </section>

function consequences(s){
  const L=s.lv, out=[]; const add=(good,t)=>out.push({good,t});
  if(!L.homework) add(false,'作業沒寫，被老師登記'); else if(L.homework>=6) add(true,'作業被老師稱讚');
  if(L.study>=7) add(true,'小考考了 100 分'); else if(!L.study && !L.cram) add(false,'小考好多題不會');
  if(!L.bag) add(false,'忘了帶課本');
  if(L.bed<=1) add(false,'翻來覆去睡不好，上課打瞌睡'); else if(s.owl) add(false,'熬夜冒出黑眼圈'); else if(L.bed>=4) add(true,'睡得好飽，精神超好');
  if(!L.dinner) add(false,'沒吃晚餐，半夜肚子餓');
  if(s.noise) add(false,`${sleepers(s)}被吵醒，早上臉好臭`);
  if(L.famtalk>=3||L.dinner>=3) add(true,'早餐桌上全家有說有笑');
  if(!L.friend) add(false,'群組已讀不回，朋友有點冷淡'); else if(L.friend>=4) add(true,'朋友約你週末出去');
  if(screenCount(s)>=3) add(false,'螢幕看太久，眼睛好酸');
  if(L.pet>=3) add(true,`${s.fam.includes('dog')?'狗狗':'貓咪'}一早就來黏你`);
  return out.slice(0,6);
}

/* ====================== 音效 ====================== */
let AC=null,master,bgmGain,noiseBuf,sfxOn=true,bgmOn=false,bgmTimer=null,nextT=0,stepN=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.5; master.connect(AC.destination); bgmGain=AC.createGain(); bgmGain.gain.value=.1; bgmGain.connect(master); noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume(); }

function sweep(f1,f2,t,dur,type='sine',vol=.15){ const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.04); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.08); }
function noise(t,dur,{f=1000,f2=null,q=1,type='bandpass',vol=.25}={}){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02); }
const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
function chainNote(step,good){ if(!sfxOn) return; ensureAudio(); if(!AC) return; const t=AC.currentTime; if(good){ const m=72+SCALE[Math.min(step,SCALE.length-1)]; tone(mtof(m),t,.2,'square',.06); tone(mtof(m+12),t+.03,.22,'sine',.09); } else { const m=60-step; tone(mtof(m),t,.3,'triangle',.16); tone(mtof(m-1),t+.05,.3,'sawtooth',.04); } }
function sfx(n){ if(!sfxOn) return; ensureAudio(); if(!AC) return; const t=AC.currentTime;
  switch(n){
    case 'click': tone(880,t,.06,'square',.06); break;
    case 'go': sweep(400,900,t,.12,'triangle',.12); break;
    case 'door': noise(t,.12,{f:300,type:'lowpass',vol:.35}); tone(mtof(76),t+.1,.15,'triangle',.1); break;
    case 'step': noise(t,.04,{f:1800,q:3,vol:.1}); break;
    case 'drop': sweep(900,300,t,.25,'triangle',.12); noise(t+.45,.1,{f:200,type:'lowpass',vol:.4}); break;
    case 'link': sweep(500,1500,t,.25,'sine',.1); break;
    case 'squash': sweep(260,900,t,.15,'square',.05); break;
    case 'deflate': sweep(700,140,t,.22,'sawtooth',.06); break;
    case 'levelup': [76,80,83,88].forEach((m,i)=>tone(mtof(m),t+i*.055,.18,'square',.06)); tone(mtof(95),t+.24,.45,'sine',.16); break;
    case 'evolve': sweep(260,1600,t,.45,'square',.05); [72,79,84,91,96].forEach((m,i)=>tone(mtof(m),t+.3+i*.05,.35,'triangle',.11)); noise(t,.5,{f:600,f2:6000,q:1,vol:.12}); break;
    case 'max': [84,88,91,96,100].forEach((m,i)=>tone(mtof(m),t+.1+i*.06,.3,'triangle',.1)); break;
    case 'leveldown': tone(mtof(64),t,.22,'square',.07); tone(mtof(59),t+.2,.4,'square',.07); break;
    case 'bad': sweep(340,95,t,.45,'sawtooth',.09); break;
    case 'combo': [72,76,79,84,88,91,96].forEach((m,i)=>tone(mtof(m),t+i*.05,.22,'square',.06)); tone(mtof(96),t+.38,.6,'sine',.15); break;
    case 'good': [72,76,79,84].forEach((m,i)=>tone(mtof(m),t+i*.08,.25,'triangle',.15)); break;
    case 'rewind': sweep(1400,200,t,.35,'triangle',.1); break;
    case 'fanfare': [60,64,67,72,67,72,76,79].forEach((m,i)=>tone(mtof(m),t+i*.11,.28,'square',.06)); [72,76,79,84].forEach(m=>tone(mtof(m),t+.95,1.2,'triangle',.1)); break;
    case 'sad': [67,63,60,55].forEach((m,i)=>tone(mtof(m),t+i*.28,.45,'triangle',.14)); break;
    case 'act_homework': case 'act_study': case 'act_diary': for(let i=0;i<6;i++) noise(t+i*.1,.06,{f:3500,q:2,vol:.2}); break;
    case 'act_cram': for(let i=0;i<4;i++) noise(t+i*.12,.1,{f:2600,q:5,vol:.18}); tone(mtof(84),t+.5,.15,'triangle',.1); break;
    case 'act_game': case 'act_tv': for(let i=0;i<8;i++) tone(mtof([72,76,79,83,88,84][(i*5)%6]),t+i*.06,.05,'square',.07); break;
    case 'act_shorts': case 'act_friend': for(let i=0;i<4;i++) sweep(380,1300,t+i*.13,.08,'sine',.14); break;
    case 'act_famtalk': [[81,86],[84,88],[79,84]].forEach((p,i)=>{ tone(mtof(p[0]),t+i*.2,.08,'triangle',.15); tone(mtof(p[1]),t+i*.2+.08,.1,'triangle',.15); }); break;
    case 'act_parcel': noise(t,.35,{f:700,f2:5000,q:3,vol:.25}); tone(mtof(91),t+.4,.4,'sine',.14); break;
    case 'act_chores': for(let i=0;i<4;i++) noise(t+i*.15,.12,{f:2500,q:6,vol:.15}); break;
    case 'act_exercise': case 'act_walk': for(let i=0;i<3;i++) noise(t+i*.2,.16,{f:400,f2:2500,type:'lowpass',vol:.28}); break;
    case 'act_bag': sweep(180,1000,t,.25,'sawtooth',.05); tone(mtof(84),t+.3,.18,'triangle',.14); break;
    case 'act_bed': case 'act_daydream': [72,67,64,60].forEach((m,i)=>tone(mtof(m),t+i*.22,.45,'sine',.13)); break;
    case 'act_plant': for(let i=0;i<5;i++) tone(mtof(88+i*2),t+i*.07,.08,'sine',.1); break;
    case 'act_pet': sweep(700,1100,t,.15,'triangle',.12); sweep(1100,600,t+.15,.25,'triangle',.12); break;
    case 'act_guitar': [64,67,71,76].forEach((m,i)=>{ tone(mtof(m),t+i*.04,.8,'triangle',.08); tone(mtof(m+12),t+i*.04,.5,'sine',.04); }); break;
    case 'act_bath': for(let i=0;i<6;i++) sweep(300+i*80,900+i*80,t+i*.08,.07,'sine',.08); break;
    case 'act_snack': case 'act_dinner': for(let i=0;i<4;i++) noise(t+i*.11,.05,{f:900,q:1,vol:.25}); break;
  } }
const MEL=[72,null,76,79,77,76,74,null,71,null,74,77,76,74,72,null,69,72,76,null,77,76,74,72,74,null,71,74,72,null,null,null];
const BASS=[48,55,53,55,45,52,50,55];
function sched(){ if(!AC) return; const spb=60/112/2; while(nextT<AC.currentTime+.15){ const m=MEL[stepN%MEL.length]; if(m) tone(mtof(m),nextT,spb*.95,'triangle',.5,bgmGain); if(stepN%4===0) tone(mtof(BASS[Math.floor(stepN/4)%8]),nextT,spb*3.6,'sine',.7,bgmGain); if(stepN%2) tone(mtof(100),nextT,.03,'square',.05,bgmGain); nextT+=spb; stepN++; } }
function toggleBGM(){ ensureAudio(); if(!AC) return; bgmOn=!bgmOn; if(bgmOn){ nextT=AC.currentTime+.05; stepN=0; clearInterval(bgmTimer); bgmTimer=setInterval(sched,40); } else clearInterval(bgmTimer); $('bBgm').classList.toggle('off',!bgmOn); }

/* ====================== 啟動 ====================== */
$('bSfx').onclick=()=>{ sfxOn=!sfxOn; $('bSfx').classList.toggle('off',!sfxOn); sfx('click'); };
$('bBgm').onclick=()=>{ toggleBGM(); sfx('click'); };
$('bSpeed').onclick=()=>{ SPEED=SPEED===1?.5:1; $('bSpeed').textContent=SPEED===1?'1×':'2×'; sfx('click'); };
$('bGal').onclick=()=>{ sfx('click'); if(!busy) showGallery(); };
$('bHelp').onclick=()=>{ sfx('click'); if(!busy) showIntro(false); };
$('bFam').onclick=()=>{ sfx('click'); if(!busy) showFamily(false); };
$('bUndo').onclick=undo; $('bRestart').onclick=restart;
$('bLand').onclick=async()=>{ sfx('click');
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }
  catch(e){ narrate('請直接把手機轉成橫向，畫面會自動換成橫式版面'); } };
function hotSave(){}
function start(data){
  if(typeof THREE==='undefined'){ $('loading').textContent='3D 引擎載入失敗，請重新整理頁面。'; return; }
  if(data && data.fam) FAM=data.fam;
  S=fresh(FAM);
  if(data && data.hist){ hist=data.hist.slice(); hist.forEach(x=>doPick(S,x)); }
  initThree(); makeThumbs(); rebuildAll(); setTime(S.picks.length); renderAll(); clearLog();
  if(data && data.hist) narrate('繼續剛剛的進度'); else { narrate('先選一件事'); showIntro(true); }
  window.claude?.hot?.snapshot?.(()=>({hist,fam:FAM}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
