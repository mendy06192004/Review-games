/* Layout: 16-bit handheld RPG. Title screen → setup; rush = paper question card + one buzzer pad per player; duel = fighting-game select grid with a sparring preview, then a sky battlefield with sprites on grass platforms, a pixel FX canvas on top, and a dialog box with a command menu. Single dark night look by design. */
:root{
  --bg:#1c1a3a; --bg2:#2a2757; --bg3:#383373;
  --ink:#141226; --paper:#fbf6e2; --paper2:#e6dbb7; --paper3:#cbbd92;
  --text:#f3f0ff; --muted:#a9a3d8; --sub:#5a5470;
  --gold:#ffd23f; --gold2:#d9901c;
  --p1:#ff6b6b; --p2:#4ea8ff; --p3:#8fd14f;
  --ok:#4cd964; --warn:#ffcc33; --bad:#ff4747; --def:#6fb1ff; --heal:#5ef08a;
  --sky1:#5fb9ea; --sky2:#8fd0f2; --sky3:#bfe6f7; --grass:#5cbb48; --grass2:#3c8d39;
  --font:"Cubic11","DotGothic16",ui-monospace,"PingFang TC","Microsoft JhengHei",monospace;
  --notch:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:none}
*{box-sizing:border-box}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.stars{position:fixed;left:0;top:0;width:2px;height:2px;pointer-events:none;z-index:0;animation:twinkle 2s steps(1) infinite}
@keyframes twinkle{50%{opacity:.6}}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:400;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- pixel primitives ---------- */
.px{border:4px solid var(--ink);clip-path:var(--notch);background:var(--paper);color:var(--ink);
  box-shadow:inset -4px -4px 0 var(--paper2),inset 4px 4px 0 #fff}
.px.dark{background:var(--bg2);color:var(--text);box-shadow:inset -4px -4px 0 var(--ink),inset 4px 4px 0 var(--bg3)}
.pb{border:4px solid var(--ink);clip-path:var(--notch);background:var(--paper);color:var(--ink);padding:8px 14px;
  box-shadow:inset -4px -4px 0 var(--paper3),inset 4px 4px 0 #fff;text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
.pb:hover{background:#fff6c4}
.pb:active{transform:translateY(2px);box-shadow:inset 4px 4px 0 var(--paper3)}
.pb[aria-pressed="true"]{background:var(--gold);box-shadow:inset -4px -4px 0 var(--gold2),inset 4px 4px 0 #fff3b0}
.pb.go{background:var(--gold);font-size:22px;padding:10px 22px;box-shadow:inset -4px -4px 0 var(--gold2),inset 4px 4px 0 #fff3b0}
.pb.ghost{background:var(--bg2);color:var(--text);box-shadow:inset -4px -4px 0 var(--ink),inset 4px 4px 0 var(--bg3);font-size:14px;padding:6px 12px}
.pb.ghost:hover{background:var(--bg3)}
.pb:disabled{opacity:.5;pointer-events:none}
.cur{display:inline-block;width:1em;color:var(--bad);visibility:hidden}
.pb:hover .cur,.pb:focus-visible .cur{visibility:visible;animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .pb{padding:4px 12px;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:0 6px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);line-height:1.5;white-space:nowrap}
.tag.easy{background:#c9f5b8}.tag.hard{background:#ffc0b8}
.spr{display:block;width:calc(var(--pw) * var(--scale,4) * 1px);max-width:none;height:auto}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk .box{width:14px;height:14px;border:3px solid var(--ink);background:#fff;flex:none;position:relative}
.chk[aria-pressed="true"] .box::after{content:"";position:absolute;left:1px;top:-3px;width:5px;height:9px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(40deg)}
.chk[aria-pressed="false"]{background:var(--paper2);color:#6c6688}
.chipc{width:16px;height:16px;border:3px solid var(--ink);flex:none;display:inline-block}

/* ---------- title ---------- */
.title{text-align:center;padding-top:8px}
.title .sub{color:var(--muted);letter-spacing:.2em;font-size:14px}
.title h1{font-size:clamp(33px,7vw,55px);color:var(--gold);margin-top:6px;
  text-shadow:4px 0 0 var(--ink),-4px 0 0 var(--ink),0 4px 0 var(--ink),0 -4px 0 var(--ink),4px 4px 0 var(--ink),6px 8px 0 #c2410c}
.title h1 em{font-style:normal;color:#fff}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:clamp(20px,8vw,90px);margin:18px auto 0;max-width:560px}
.duo .who{display:flex;flex-direction:column;align-items:center;gap:6px}
.duo .who span{font-size:14px;color:var(--muted)}
.duo .vs{font-size:33px;color:var(--bad);text-shadow:3px 3px 0 var(--ink);align-self:center;animation:blink 1s steps(1) infinite}
.idle{animation:idle 1s linear infinite}
.idle.slow{animation-duration:1.4s}
@keyframes idle{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-4px)}}
.flipx{transform:scaleX(-1)}
.ground{height:12px;background:repeating-linear-gradient(90deg,var(--grass) 0 8px,var(--grass2) 8px 12px);margin:0 auto;max-width:620px;border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)}
.lineup{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;max-width:620px;margin:16px auto 0}
.lineup .spr{--scale:2}
.lineup-cap{font-size:13px;color:var(--muted);margin-top:6px}
.press{text-align:center;margin-top:12px;color:var(--gold);animation:blink 1.1s steps(1) infinite;font-size:14px}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
.mode{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px}
.mode h3{font-size:22px}
.mode p{font-size:14px;line-height:1.6;color:#4a4560}
.setup{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.names{display:flex;flex-direction:column;gap:8px}
.names label{display:flex;align-items:center;gap:8px}
.names input{flex:1;min-width:0;font:inherit;background:#fff;border:3px solid var(--ink);padding:5px 8px;color:var(--ink)}
.keys{font-size:12px;color:#6c6688;white-space:nowrap}
.table{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.table div{background:var(--bg);border:2px solid var(--ink);padding:4px 2px;text-align:center;font-size:14px;min-height:36px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.panel h2{font-size:22px}
.setup{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.warn{color:#c0392b!important}
.ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptabs .pb{font-size:15px;padding:5px 12px;display:inline-flex;align-items:center;gap:6px}
.ptabs .pb small{font-size:12px;color:#6c6688}
.presets{gap:6px}.presets .pb{padding:3px 10px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.topic{background:var(--bg);border:3px solid var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.topic.on{border-color:var(--gold2)}
.topic .th{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--text);text-align:left;font-size:15px}
.topic .th .box{width:16px;height:16px;border:3px solid var(--paper);flex:none;position:relative}
.topic .th[data-state="all"] .box{background:var(--gold);border-color:var(--gold)}
.topic .th[data-state="all"] .box::after{content:"";position:absolute;left:2px;top:-2px;width:4px;height:8px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(40deg)}
.topic .th[data-state="some"] .box::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:3px;background:var(--gold)}
.topic .th .gr{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.topic .subs{display:flex;flex-wrap:wrap;gap:4px}
.topic .chk{font-size:13px;padding:2px 8px}
.topic .chk .box{width:12px;height:12px;border-width:2px}
.topic .chk[aria-pressed="true"] .box::after{left:1px;top:-2px;width:4px;height:7px;border-width:0 2px 2px 0}

/* ---------- HUD / timer ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .lbl{font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.timer{flex:1;min-width:120px;height:16px;border:4px solid var(--ink);background:var(--ink);overflow:hidden}
.timer i{display:block;height:100%;width:100%;transform-origin:left;
  background:repeating-linear-gradient(90deg,var(--c,var(--gold)) 0 8px,transparent 8px 10px)}

/* ---------- rush ---------- */
.qcard{margin:14px 0 16px;text-align:center;padding:16px 12px 18px;position:relative}
.qcard .kind{font-size:14px;color:var(--sub)}

function playFX(field,au,tu,name,who,onHit,facing){return new Promise(res=>{

  const PX=3,fr=field.getBoundingClientRect();cv.width=Math.ceil(fr.width/PX);cv.height=Math.ceil(fr.height/PX);cv.style.width=cv.width*PX+'px';cv.style.height=cv.height*PX+'px';

      if(r===1){const a=rnd(1,6),d=rnd(1,4),n=rnd(4,6),v=a+(n-1)*d;
        return {disp:`a_1 = ${a},\\ d = ${d},\\ a_{${n}} = \\,?`,kind:'等差數列：求第 n 項',eq:`a_{${n}} = ${a}+(${n}-1)\\times${d} = ${v}`,ans:I(v),c:[I(a+n*d),I(n*d),I(v+1)]};}
      const t=[1,2,3,4].map(i=>Fr(i,2)),v=Fr(5,2);return {disp:`${t.map(ftex).join(',\\ ')},\\ \\square`,kind:'等差數列：□ = ?',eq:`${t.map(ftex).join(',\\ ')},\\ ${ftex(v)}`,ans:v,c:[I(3),Fr(5,4),I(2),Fr(6,2)]};}},
  /* ---------- 九上：相似形 ---------- */
  simi:{easy(){const k=2,ab=rnd(1,5),bc=rnd(1,6);
      return {disp:`\\begin{aligned} AB &= ${ab},\\ DE = ${ab*k} \\\\ BC &= ${bc},\\ EF = \\,? \\end{aligned}`,kind:'△ABC ∼ △DEF，求對應邊',eq:`EF = ${bc}\\times${k} = ${bc*k}`,ans:I(bc*k),c:[I(bc+ab),I(bc+k),I(bc),I(ab*k)]};},
    hard(){if(chance(.5)){const k=3,ab=rnd(1,4),bc=rnd(1,5);
        return {disp:`\\begin{aligned} AB &= ${ab},\\ DE = ${ab*k} \\\\ BC &= ${bc},\\ EF = \\,? \\end{aligned}`,kind:'△ABC ∼ △DEF，求對應邊',eq:`EF = ${bc}\\times${k} = ${bc*k}`,ans:I(bc*k),c:[I(bc+ab*k-ab),I(bc+k),I(bc*2),I(ab*k)]};}
      const k=2,ab=rnd(1,4),ef=2*rnd(1,5);
      return {disp:`\\begin{aligned} AB &= ${ab},\\ DE = ${ab*k} \\\\ BC &= \\,?,\\ EF = ${ef} \\end{aligned}`,kind:'△ABC ∼ △DEF，求對應邊',eq:`BC = ${ef}\\div${k} = ${ef/k}`,ans:I(ef/k),c:[I(ef*k),I(ef-ab),I(ef/k+1)]};}},
  /* ---------- 九上：圓 ---------- */
  angle:{easy(){const v=pick([40,60,80,100,120]);return {disp:`\\angle AOB = ${deg(v)},\\ \\angle ACB = \\,?`,kind:'圓心角 ∠AOB 和圓周角 ∠ACB 對同一段弧',eq:`\\angle ACB = ${deg(v)}\\div 2 = ${deg(v/2)}`,ans:deg(v/2),c:[deg(v),deg(v*2),deg(180-v),deg(v/2+10)]};},
    hard(){if(chance(.5)){const v=pick([20,25,30,40,45]);return {disp:`\\angle ACB = ${deg(v)},\\ \\angle AOB = \\,?`,kind:'圓心角 ∠AOB 和圓周角 ∠ACB 對同一段弧',eq:`\\angle AOB = ${deg(v)}\\times 2 = ${deg(2*v)}`,ans:deg(2*v),c:[deg(v),deg(v/2),deg(180-v),deg(2*v+10)]};}
      const a=pick([30,40,50,60]);return {disp:`\\angle A = ${deg(a)},\\ \\angle C = ${deg(90)},\\ \\angle B = \\,?`,kind:'AB 是直徑，C 在圓上（直徑所對的圓周角是 90°）',eq:`\\angle B = 180^\\circ - 90^\\circ - ${deg(a)} = ${deg(90-a)}`,ans:deg(90-a),c:[deg(a),deg(180-a),deg(90+a),deg(100-a)]};}},
  circ:{easy(){const r=rnd(1,5),v=2*r;return {disp:`r = ${r},\ L = \,?`,kind:'圓的周長 L = 2πr',eq:`L = 2\pi\times${r} = ${piT(v)}`,ans:piT(v),c:piC(v,[r,r*r,v+1,4*r,v+2])};},
    hard(){if(chance(.5)){const r=rnd(1,5),v=r*r;return {disp:`r = ${r},\ A = \,?`,kind:'圓面積 A = πr²',eq:`A = \pi\times${r}^2 = ${piT(v)}`,ans:piT(v),c:piC(v,[2*r,r,v+1,2*v,v+2,v+3,4*r])};}
      const rr=rnd(1,4),d=2*rr,v=rr*rr;return {disp:`d = ${d},\ A = \,?`,kind:'直徑 d，圓面積 A = πr²',eq:`r = ${rr},\ A = ${piT(v)}`,ans:piT(v),c:piC(v,[d*d,d,2*rr,v+1,v+2,v+3])};}},
  /* ---------- 九下：二次函數 ---------- */
  qfval:{easy(){const x=rnd(-3,3),c=nz(-5,5),v=x*x+c;return {disp:`y = x^2 ${cst(c)},\\ x = ${x},\\ y = \\,?`,kind:'代入求值',eq:`y = ${pn(x)}^2 ${cst(c)} = ${v}`,ans:I(v),c:[I(2*x+c),I(-(x*x)+c),I(v+1),I(x+c)]};},
    hard(){if(chance(.5)){const x=nz(-3,3),c=rnd(0,9),v=-(x*x)+c;return {disp:`y = -x^2 ${cst(c)},\\ x = ${x},\\ y = \\,?`,kind:'代入求值',eq:`y = -${pn(x)}^2 ${cst(c)} = ${v}`,ans:I(v),c:[I(x*x+c),I(-2*x+c),I(v-1),I(-v)]};}
      const x=nz(-3,3),v=2*x*x;return {disp:`y = 2x^2,\\ x = ${x},\\ y = \\,?`,kind:'代入求值',eq:`y = 2\\times${pn(x)}^2 = ${v}`,ans:I(v),c:[I(4*x),I((2*x)**2),I(-v),I(x*x)]};}},
  vertex:{easy(){const h=rnd(1,5),k=rnd(1,5);return {disp:`y = (x-${h})^2 + ${k}`,kind:'頂點坐標是？',eq:`\\text{頂點 } ${pt(h,k)}`.replace('\\text{頂點 } ',''),ans:pt(h,k),c:[pt(-h,k),pt(h,-k),pt(k,h),pt(-h,-k)]};},

  /* ---------- 九下：機率 ---------- */
  prob:{easy(){const ev=pick([['偶數',[2,4,6]],['奇數',[1,3,5]],['大於 4',[5,6]],['小於 3',[1,2]],['3 的倍數',[3,6]],['大於 2',[3,4,5,6]]]),n=ev[1].length;

function makeQuestion(id,lvl,mult=1){
  const g=GEN[id][lvl](),A=qkey(g.ans),out=[A];
  for(const c of shuffle((g.c||[]).slice())){if(c==null)continue;const k=qkey(c);if(/NaN|Infinity|undefined/.test(k))continue;if(!out.includes(k))out.push(k);if(out.length===4)break;}
  let i=1;while(out.length<4&&i<80){let k;if(typeof g.ans==='string')k=`${A}+${i}`;else k=ftex(Fr(g.ans.n+(i%2?1:-1)*Math.ceil(i/2)*g.ans.d,g.ans.d));if(!out.includes(k))out.push(k);i++;}
  const disp=g.disp||(g.q.includes('\\square')?g.q:g.q+' = \\,?');
  const eq=g.eq||(g.q.includes('\\square')?g.q.replace('\\square',A):g.q+' = '+A);
  const S=QT[id];
  return {id,lvl,topic:S.topic,sub:S.name,kind:g.kind||(g.q&&g.q.includes('\\square')?'□ 裡是多少？':'計算結果是？'),disp,eq,opts:shuffle(out),ans:A,time:Math.round(S.t[lvl==='hard'?1:0]*mult),ok:null,who:null};
}

  const tick=now=>{const left=Math.max(0,1-(now-t0)/ms);bar.style.transform=`scaleX(${Math.ceil(left*30)/30})`;
    bar.style.setProperty('--c',left<.3?'var(--bad)':'var(--gold)');if(left<=0){onEnd();return;}raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);}
function stopTimer(){cancelAnimationFrame(raf);}
function fullBar(bar){stopTimer();bar.style.transform='scaleX(1)';bar.style.setProperty('--c','var(--gold)');}

const QDEF=['add','muldiv','mix','eqAdd','eqMul','eqMix','root','inv','est'];

function seg(id,set){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SFX.sel();
  $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));set(b.dataset.v);});}
seg('#segN',v=>{cfg.n=+v;renderNames();});
seg('#segTime',v=>cfg.tm=+v);
function renderQS(){
  if(cfg.tab>=cfg.n)cfg.tab=0;const set=cfg.pt[cfg.tab];
  $('#ptabs').innerHTML=[...Array(cfg.n)].map((_,i)=>`<button type="button" class="pb" role="tab" data-i="${i}" aria-pressed="${i===cfg.tab}"><span class="chipc" style="background:${COLORS[i]}"></span>${esc(cfg.names[i]||DEF_NAMES[i])}<small>${cfg.pt[i].size} 種</small></button>`).join('');
  $('#topics').innerHTML=TOPICS.map(tp=>{const n=tp.subs.filter(([id])=>set.has(id)).length,state=n===0?'none':n===tp.subs.length?'all':'some';
    return `<div class="topic${n?' on':''}"><button type="button" class="th" data-t="${tp.id}" data-state="${state}" aria-pressed="${state==='all'}"><span class="box"></span>${tp.name}<span class="gr">${tp.grade}</span></button>`+
      (tp.subs.length>1?`<div class="subs">${tp.subs.map(([id,nm])=>`<button type="button" class="pb chk" data-s="${id}" aria-pressed="${set.has(id)}"><span class="box"></span>${nm}</button>`).join('')}</div>`:'')+'</div>';}).join('');
  $('#qsCount').textContent=set.size?`${esc(cfg.names[cfg.tab]||DEF_NAMES[cfg.tab])}：已選 ${set.size} 種題型`:'還沒選任何題型';
}
$('#ptabs').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;cfg.tab=+b.dataset.i;SFX.sel();renderQS();});
$('#topics').addEventListener('click',e=>{const set=cfg.pt[cfg.tab];const th=e.target.closest('.th'),ck=e.target.closest('.chk');
  if(th){const tp=TOPICS.find(t=>t.id===th.dataset.t),all=tp.subs.every(([id])=>set.has(id));tp.subs.forEach(([id])=>all?set.delete(id):set.add(id));}
  else if(ck){const id=ck.dataset.s;set.has(id)?set.delete(id):set.add(id);}else return;
  SFX.sel();$('#startMsg').hidden=true;renderQS();});
$('#presets').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g,set=cfg.pt[cfg.tab];set.clear();

function renderNames(){const box=$('#names');box.innerHTML='';
  for(let i=0;i<cfg.n;i++){const lab=document.createElement('label');
    lab.innerHTML=`<span class="chipc" style="background:${COLORS[i]}"></span><input id="name${i}" maxlength="8" aria-label="玩家 ${i+1} 名字">`;

  renderQS();}

$('#start').addEventListener('click',()=>{const miss=BANK.on?null:[...Array(cfg.n).keys()].find(i=>!cfg.pt[i].size);
  if(miss!=null){cfg.tab=miss;renderQS();const m=$('#startMsg');m.hidden=false;m.textContent=`${cfg.names[miss]||DEF_NAMES[miss]} 還沒選題目範圍，請在右邊至少勾一種題型。`;SFX.bad();return;}

function show(id){['#home','#pick','#duel','#end'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0);}
function fillReview(qs,label){const rv=$('#review');rv.innerHTML='';if(!qs.length){rv.innerHTML='<span class="small muted">還沒有作答紀錄。</span>';return;}
  qs.forEach(Q=>{const d=document.createElement('div');if(!Q.ok)d.className='miss';const e=document.createElement('span');tex(e,Q.eq);
    const w=document.createElement('small');w.textContent=label(Q);d.append(e,w);rv.appendChild(d);});}

/* ================= PICK ================= */
let picks=[],pickIdx=0,sel=0,pvBusy=false,pvTok=0;
function startPick(){picks=[];pickIdx=0;sel=0;renderPick();show('#pick');}
function bars(v,max,col){const n=Math.round(v/max*8);return `<span class="seg-bar" style="--c:${col}">${[...Array(8)].map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;}
function renderPick(){
  $('#pickWho').innerHTML=`<span style="color:${COLORS[pickIdx]}">P${pickIdx+1} ${esc(cfg.names[pickIdx])}</span> 請選擇`;
  const ro=$('#roster');ro.innerHTML='';
  CHARS.forEach((c,ci)=>{const b=document.createElement('button');b.type='button';b.className='pb tile';b.setAttribute('aria-pressed',ci===sel);b.setAttribute('aria-label',c.name);
    b.innerHTML=`<span class="chips">${picks.map((p,pi)=>p===ci?`<span class="chipc" style="background:${COLORS[pi]}"></span>`:'').join('')}</span>
      <span class="mini">${imgTag(SPR[c.id],ci===sel?'idle':'')}</span><span class="tn">${c.name}</span><span class="tag">${c.role}</span>`;
    b.addEventListener('click',()=>{if(sel===ci)return;sel=ci;SFX.sel();renderPick();});ro.appendChild(b);});
  renderDetail();
  $('#picked').innerHTML=picks.map((ci,pi)=>`<span class="px"><span style="color:${HEX[pi]};text-shadow:1px 1px 0 #141226">P${pi+1}</span> ${esc(cfg.names[pi])} → ${CHARS[ci].name}</span>`).join('');
}
function renderDetail(){

  d.innerHTML=`<div class="dl">
      <div class="field pfield n3" id="pfield"><div class="cloud" style="top:18px;animation-delay:-9s"></div><div class="cloud" style="top:44px;animation-delay:-22s;animation-duration:40s"></div>
        <div class="units"><div class="unit" id="pvA" style="--dir:1;--pw:${s.w}"><div class="stage"><div class="mover"><div>${imgTag(s,'idle')}</div></div><div class="plat"></div></div></div>
        <div class="unit" id="pvB" style="--dir:-1;--pw:${SP.dummy.w}"><div class="stage"><div class="mover"><div>${imgTag(SP.dummy)}</div></div><div class="plat"></div></div></div></div></div>
      <div class="row between"><span class="small" style="color:var(--sub)">按「試放」看招式特效</span>${c.photo?`<span class="photo"><img src="${PHOTO[c.photo]||IMG[c.photo]}" alt="本尊照片">本尊</span>`:''}</div>
      <button type="button" class="pb go pickbtn" id="confirm"><span class="cur">▶</span>P${pickIdx+1} 決定：${c.name}</button></div>
    <div class="dr"><h3 class="dn">${c.name}</h3><div class="role"><span class="tag">${c.role}</span><span class="tag">${c.title}</span></div>
      <div class="stats"><div><span>生命</span>${bars(c.hp,STAT_MAX.hp,'#4cd964')}<span>${c.hp}</span></div>
        <div><span>攻擊</span>${bars(c.atk,STAT_MAX.atk,'#ff4747')}<span>${c.atk}</span></div>
        <div><span>防禦</span>${bars(c.def,STAT_MAX.def,'#4e8cff')}<span>${c.def}</span></div></div>
      <div class="mlist"><span class="cat">攻擊招式</span>${c.atkM.map((m,mi)=>mv(m,mi,true)).join('')}<span class="cat d">防禦招式</span>${c.defM.map((m,mi)=>mv(m,mi,false)).join('')}</div></div>`;
  $('#confirm').addEventListener('click',()=>{picks[pickIdx]=sel;pickIdx++;SFX.ok();if(pickIdx>=cfg.n)startDuel();else renderPick();});
  d.querySelectorAll('.try').forEach(b=>b.addEventListener('click',()=>preview(c,c[b.dataset.cat][+b.dataset.mi],b.dataset.cat==='defM')));

const DEF_TAG={shield:m=>`防 +${m.p}`,heal:m=>`+${m.p}`,combo:m=>`+${m.h}`,power:()=>'蓄力',guard:()=>'減傷',dodge:()=>'閃避',counter:()=>'反彈'};
async function preview(c,m,isDef){if(pvBusy)return;pvBusy=true;const tok=pvTok;const A=$('#pvA .mover'),B=$('#pvB .mover');
  if(isDef){await playFX($('#pfield'),A,A,m.fx,c.id,()=>{if(tok!==pvTok)return;const heal=['heal','combo'].includes(m.k);floatText($('#pvA'),DEF_TAG[m.k](m),heal?'var(--heal)':'var(--def)');},1);if(tok===pvTok)pvBusy=false;return;}
  if(FX[m.fx].lunge!==false){anim(A,'lunge',500);await wait(200);}
  await playFX($('#pfield'),A,B,m.fx,c.id,()=>{if(tok!==pvTok)return;anim(B,'hurt',600);floatText($('#pvB'),'−'+Math.max(4,Math.round(c.atk*m.p*1.5-4)),'var(--bad)');});
  if(tok===pvTok)pvBusy=false;}
$('#pickBack').addEventListener('click',()=>{if(pickIdx>0){pickIdx--;picks.pop();renderPick();}else show('#home');});

/* ================= DUEL ================= */
let D=null;
const cur=()=>D.f[D.cur];
const alive=()=>D.f.filter(f=>!f.ko);
function startDuel(){
  D={cur:0,round:1,phase:'intro',hist:[],
     f:picks.map((ci,i)=>{const c=CHARS[ci];return {i,c,name:cfg.names[i]||DEF_NAMES[i],hp:c.hp,max:c.hp,def:c.def,st:null,buff:null,ko:false,right:0,wrong:0};})};
  buildField();show('#duel');fullBar($('#dbar'));
  menu('');say(`${D.f.map(f=>f.c.name).join(' VS ')}！魔法決鬥開始！`,()=>setTimeout(beginTurn,700));
}
function buildField(){
  const fld=$('#field');fld.className='field n'+cfg.n;
  fld.innerHTML=`<div class="cloud" style="top:24px;animation-delay:-4s"></div><div class="cloud" style="top:60px;animation-delay:-17s;animation-duration:42s"></div><div class="units" id="units"></div>`;
  const row=$('#units');
  D.f.forEach(f=>{const flip=f.i>=Math.ceil(cfg.n/2);const s=SPR[f.c.id];
    const u=document.createElement('div');u.className='unit';u.id='u'+f.i;u.style.setProperty('--c',COLORS[f.i]);u.style.setProperty('--dir',flip?-1:1);u.style.setProperty('--pw',s.w);u.style.setProperty('--bc',f.c.bc);
    u.innerHTML=`<div class="arrow">▼</div>
      <div class="px stat"><div class="nm"><i></i><b>${esc(f.name)}</b><small>${f.c.name}</small></div>
        <div class="hpbar"><span>HP</span><div class="b"><i></i></div></div>
        <div class="sub"><span class="vhp"></span><span class="vdef"></span><span class="st" hidden></span></div></div>
      <div class="stage"><div class="mover"><div class="${flip?'flipx':''}">${imgTag(s,'idle'+(f.i%2?' slow':''))}</div></div><div class="plat"></div></div>`;
    u.addEventListener('click',()=>pickTarget(f.i));row.appendChild(u);});
  refreshField();
}
function refreshField(){D.f.forEach(f=>{const u=$('#u'+f.i);const pct=Math.max(0,f.hp/f.max*100);const bar=u.querySelector('.hpbar i');
  bar.style.width=pct+'%';bar.className=pct<=25?'low':pct<=50?'mid':'';
  u.querySelector('.vhp').textContent=`${Math.max(0,f.hp)}/${f.max}`;u.querySelector('.vdef').textContent=`防 ${f.def}`;
  const lab=[f.st&&ST_LABEL[f.st],f.buff&&ST_LABEL[f.buff]].filter(Boolean).join('・');const st=u.querySelector('.st');st.hidden=!lab;st.textContent=lab;
  u.classList.toggle('ko',f.ko);u.classList.toggle('turn',D.phase!=='over'&&f.i===D.cur&&!f.ko);});}

let typing=null;
function say(text,cb,texStr){const el=$('#msg');clearInterval(typing);el.textContent='';let i=0;const span=document.createElement('span');el.appendChild(span);
  const done=()=>{clearInterval(typing);typing=null;span.textContent=text;if(texStr){const t=document.createElement('span');t.className='t';el.appendChild(t);tex(t,texStr);}cb&&cb();};
  if(REDUCE){done();return;}
  typing=setInterval(()=>{span.textContent=text.slice(0,++i);if(i%3===0)SFX.blip();if(i>=text.length)done();},26);
  el.onclick=()=>{if(typing)done();};}
function menu(html){$('#menu').innerHTML=html;}

function beginTurn(){
  if(!D)return;if(alive().length<=1)return finishDuel();
  while(D.f[D.cur].ko)D.cur=(D.cur+1)%cfg.n;
  const f=cur();f.st=null;
  D.phase='cmd';$('#turnLbl').textContent=`ROUND ${D.round}`;fullBar($('#dbar'));refreshField();showCmd();
}
function showCmd(){const f=cur();D.phase='cmd';
  say(`${f.name} 的${f.c.name}，要怎麼做？`);
  menu(`<div class="cmds"><button type="button" class="pb cmd atk" data-cat="atkM"><span><span class="cur">▶</span>攻擊</span><small>${f.c.atkM.map(m=>m.n).join('・')}</small></button>
    <button type="button" class="pb cmd def" data-cat="defM"><span><span class="cur">▶</span>防禦</span><small>${f.c.defM.map(m=>m.n).join('・')}</small></button></div>`);
  $('#menu').querySelectorAll('.cmd').forEach(b=>b.addEventListener('click',()=>{SFX.sel();showMoves(b.dataset.cat);}));}
function dmgCalc(att,m,tgt){let d=Math.max(4,Math.round(att.c.atk*m.p*1.5-tgt.def*0.8));if(att.buff==='power')d=Math.round(d*1.6);return d;}
function effText(f,m){
  if(m.k==='atk'||m.k==='burn'){const v=alive().filter(x=>x.i!==f.i).map(t=>dmgCalc(f,m,t));const lo=Math.min(...v),hi=Math.max(...v);return `預估傷害 ${lo===hi?lo:lo+'～'+hi}${f.buff==='power'?'（蓄力中）':''}`;}
  return {shield:`防禦 +${m.p}`,heal:`生命 +${m.p}`,combo:`防禦 +${m.p}・生命 +${m.h}`,guard:'下次傷害 ×0.5',dodge:'下次傷害 0',counter:'反彈 60%',power:'下次攻擊 ×1.6'}[m.k];}
function showMoves(cat){const f=cur();D.phase='moves';D.cat=cat;
  say(cat==='atkM'?'選擇攻擊招式。':'選擇防禦招式。');
  menu(`<div class="mvs">${f.c[cat].map((m,mi)=>`<button type="button" class="pb mv" data-mi="${mi}"><b><span class="cur">▶</span>${mi+1}. ${m.n} <span class="tag ${m.d}">${m.d==='hard'?'困難題':'簡單題'}</span></b><small>${m.desc}</small><small class="eff">${effText(f,m)}</small></button>`).join('')}</div>
    <div class="row"><button type="button" class="pb ghost" id="back">◀ 返回（Esc）</button></div>`);
  $('#menu').querySelectorAll('.mv').forEach(b=>b.addEventListener('click',()=>{SFX.sel();chooseMove(+b.dataset.mi);}));
  $('#back').addEventListener('click',()=>{SFX.sel();showCmd();});}
function chooseMove(mi){const f=cur();const m=f.c[D.cat][mi];if(!m)return;D.move=m;
  const foes=alive().filter(x=>x.i!==f.i);
  if(D.cat==='atkM'&&foes.length>1){D.phase='target';foes.forEach(t=>$('#u'+t.i).classList.add('target'));
    say(`「${m.n}」要打誰？點一位對手。`);menu(`<div class="row"><button type="button" class="pb ghost" id="back">◀ 返回（Esc）</button></div>`);
    $('#back').addEventListener('click',()=>{clearTargets();showMoves(D.cat);});return;}
  D.target=D.cat==='atkM'?foes[0].i:null;askQuestion();}
function clearTargets(){document.querySelectorAll('.unit.target').forEach(x=>x.classList.remove('target'));}
function pickTarget(i){if(!D||D.phase!=='target'||!$('#u'+i).classList.contains('target'))return;SFX.sel();clearTargets();D.target=i;askQuestion();}
/* [題庫模式] 由平台傳入學生選的範圍題目（不含答案），答案改由伺服器驗證 */
const BANK={on:!!(window.GameBridge&&GameBridge.active),qs:[],deck:[]};
if(BANK.on)GameBridge.questions().then(qs=>{BANK.qs=qs;const box=document.querySelector('.qset');
  if(box){[...box.children].slice(1).forEach(c=>{c.hidden=true;});const p=document.createElement('p');p.className='small';
    p.textContent=`題目來自你在平台選的範圍（共 ${qs.length} 題），所有玩家共用。`;box.appendChild(p);}});
function bankQuestion(){if(!BANK.deck.length)BANK.deck=shuffle(BANK.qs.slice());const q=BANK.deck.pop();
  return {id:q.id,text:true,topic:'老師題庫',sub:'',kind:'選出正確答案',disp:q.題幹,eq:'',opts:q.選項,ans:null,time:Math.round(40*cfg.tm),ok:null,who:null};}
const txt=(el,s)=>{el.textContent=s;};
function askQuestion(){
  D.phase='question';const f=cur(),m=D.move,lvl=m.d==='hard'?'hard':'easy';
  const pool=[...cfg.pt[f.i]],Q=BANK.on&&BANK.qs.length?bankQuestion():makeQuestion(pick(pool),lvl,cfg.tm);Q.who=f.name;D.Q=Q;
  say(`${f.c.name} 準備使出「${m.n}」！解開咒文：${Q.topic}`);
  menu(`<div class="spell"><div class="qk">${Q.kind}</div><div class="q" id="sq"></div><div class="dopts" id="dopts"></div></div>`);
  (Q.text?txt:tex)($('#sq'),Q.disp);
  Q.opts.forEach((v,k)=>{const b=document.createElement('button');b.type='button';b.className='pb opt';b.innerHTML=`<kbd>${k+1}</kbd><span></span>`;
    (Q.text?txt:tex)(b.querySelector('span'),v);b.addEventListener('click',()=>duelAnswer(k));$('#dopts').appendChild(b);});
  runTimer($('#dbar'),Q.time*1000,()=>duelAnswer(-1));
}
async function duelAnswer(k){
  if(!D||D.phase!=='question')return;D.phase='resolve';stopTimer();
  const f=cur(),m=D.move,Q=D.Q;D.hist.push(Q);
  if(Q.id){try{const r=await GameBridge.check(Q.id,k);Q.ans=Q.opts[r.答案];Q.eq=null;Q.explain=r.解析;}catch(e){Q.ans=null;}}
  const btns=[...document.querySelectorAll('#dopts .opt')];$('#dopts').classList.add('locked');
  btns.forEach((b,j)=>{if(Q.opts[j]===Q.ans)b.classList.add('right');});
  const u=$('#u'+f.i);
  if(k>=0&&Q.opts[k]===Q.ans){
    Q.ok=true;f.right++;SFX.ok();
    say('咒文正確！',null,Q.eq);await wait(900);
    await cast(f,m);
  }else{
    Q.ok=false;f.wrong++;if(k>=0)btns[k].classList.add('wrong');
    const loss=3*(m.risk||1);f.def=Math.max(0,f.def-loss);
    anim(u.querySelector('.mover'),'hurt',600);anim(u,'hit',500);quake();SFX.bad();buzz();floatText(u,`防 −${loss}`,'var(--bad)');refreshField();
    say(`${k<0?'時間到':'咒文失敗'}！${f.c.name} 的防禦下降了 ${loss}。正解：`,null,Q.eq);
    await wait(2600);
  }
  endTurn();
}
function applyHit(f,m,t){
  const tu=$('#u'+t.i),u=$('#u'+f.i);let dmg=dmgCalc(f,m,t),note='';
  if(f.buff==='power'){f.buff=null;note+='蓄力爆發！';}
  if(t.st==='dodge'){dmg=0;note+=`${t.c.name} 閃開了！`;}
  else if(t.st==='guard'){dmg=Math.max(1,Math.round(dmg*.5));note+='防守擋下一半傷害！';}
  const reflected=t.st==='counter'&&dmg>0?Math.round(dmg*.6):0;
  t.st=null;
  if(dmg>0){t.hp=Math.max(0,t.hp-dmg);anim(tu.querySelector('.mover'),'hurt',600);SFX.hit();floatText(tu,`−${dmg}`,'var(--bad)');}
  else floatText(tu,'MISS','#fff');
  let msg=`${f.c.name} 的「${m.n}」！${note}${dmg>0?`${t.c.name} 受到 ${dmg} 點傷害。`:''}`;
  if(m.d==='hard'&&dmg>0&&t.st!=='guard')msg+='效果拔群！';
  if(m.k==='burn'&&dmg>0){t.def=Math.max(0,t.def-4);floatText(tu,'防 −4','var(--gold)',350);msg+=' 防禦 −4！';}
  if(reflected){f.hp=Math.max(0,f.hp-reflected);setTimeout(()=>{anim(u.querySelector('.mover'),'hurt',600);floatText(u,`−${reflected}`,'#ff8a3d');},450);msg+=` 反彈 ${reflected} 點傷害！`;}
  refreshField();return msg;
}
function applyDef(f,m,u){
  if(m.k==='shield'){f.def+=m.p;SFX.shield();floatText(u,`防 +${m.p}`,'var(--def)');return `${f.c.name} 使出「${m.n}」！防禦提升到 ${f.def}。`;}
  if(m.k==='heal'){const g=Math.min(f.max,f.hp+m.p)-f.hp;f.hp+=g;floatText(u,`+${g}`,'var(--heal)');return `${f.c.name} 使出「${m.n}」！回復了 ${g} 生命。`;}
  if(m.k==='combo'){const g=Math.min(f.max,f.hp+m.h)-f.hp;f.hp+=g;f.def+=m.p;floatText(u,`+${g}`,'var(--heal)');floatText(u,`防 +${m.p}`,'var(--def)',350);return `${f.c.name} 使出「${m.n}」！防禦 +${m.p}，回復 ${g} 生命。`;}
  if(m.k==='power'){f.buff='power';floatText(u,'蓄力','var(--bad)');return `${f.c.name} 使出「${m.n}」！下一次攻擊威力 ×1.6。`;}
  f.st=m.k;floatText(u,ST_LABEL[m.k],'var(--def)');
  return `${f.c.name} 使出「${m.n}」！`+{guard:'下次受到的傷害減半。',dodge:'下一次攻擊會落空。',counter:'攻擊牠的人會被反彈傷害。'}[m.k];
}
async function cast(f,m){
  const u=$('#u'+f.i),mv=u.querySelector('.mover');
  if(D.cat==='defM'){let msg='';
    await playFX($('#field'),mv,mv,m.fx,f.c.id,()=>{msg=applyDef(f,m,u);},f.i>=Math.ceil(cfg.n/2)?-1:1);
    refreshField();say(msg);await wait(1800);return;}
  const t=D.f[D.target],tmv=$('#u'+t.i+' .mover');
  if(FX[m.fx].lunge!==false){anim(mv,'lunge',500);await wait(200);}
  let msg='';
  await playFX($('#field'),mv,tmv,m.fx,f.c.id,()=>{msg=applyHit(f,m,t);});
  say(msg);await wait(2000);
  for(const x of [t,f]){if(x.hp<=0&&!x.ko){x.ko=true;SFX.ko();refreshField();say(`${x.name} 的${x.c.name} 倒下了！`);await wait(1700);}}
}
function endTurn(){if(!D)return;if(alive().length<=1)return finishDuel();
  let n=D.cur;do{n=(n+1)%cfg.n;}while(D.f[n].ko);if(n<=D.cur)D.round++;D.cur=n;beginTurn();}
function finishDuel(){stopTimer();clearInterval(typing);if(!D)return;D.phase='over';
  const ranked=[...D.f].sort((a,b)=>(a.ko-b.ko)||(b.hp/b.max-a.hp/a.max)||(b.right-a.right));const top=ranked[0];
  $('#endEyebrow').textContent='數學齊打交 · YOU WIN';
  $('#winTitle').textContent=alive().length===1?`${top.name} 的${top.c.name}獲勝！`:`${top.name} 暫時領先`;
  setSpr($('#winSpr'),SPR[top.c.id]);
  $('#podium').innerHTML=ranked.map((p,r)=>`<div class="px rank" style="background:${r===0?'#fff3b0':''}"><span class="no">${r+1}</span>${imgTag(SPR[p.c.id])}
    <span class="nm"><span style="color:${HEX[p.i]};text-shadow:1px 1px 0 #141226">P${p.i+1}</span> ${esc(p.name)}・${p.c.name}${p.ko?'（倒下）':''}</span><span class="sc">答對 ${p.right}　錯 ${p.wrong}</span></div>`).join('');
  fillReview(D.hist,Q=>(Q.ok?'○ ':'× ')+Q.who+'・'+Q.topic);D=null;SFX.win();show('#end');}
$('#dquit').addEventListener('click',()=>finishDuel());

/* ================= END / KEYS ================= */
$('#again').addEventListener('click',()=>startPick());
$('#home2').addEventListener('click',()=>show('#home'));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;const key=e.key.toLowerCase();
  if(!$('#pick').hidden){  }else if(!$('#pick').hidden){
    const cols=innerWidth>760?5:5;let n=sel;
    if(key==='arrowright')n=(sel+1)%CHARS.length;else if(key==='arrowleft')n=(sel+CHARS.length-1)%CHARS.length;
    else if(key==='arrowdown')n=(sel+cols)%CHARS.length;else if(key==='arrowup')n=(sel+CHARS.length-cols)%CHARS.length;
    else if(key==='enter'){e.preventDefault();$('#confirm').click();return;}else return;
    e.preventDefault();sel=n;SFX.sel();renderPick();
  }else if(!$('#duel').hidden&&D){
    if(key==='escape'){if(D.phase==='moves')showCmd();else if(D.phase==='target'){clearTargets();showMoves(D.cat);}return;}
    const k='1234'.indexOf(key);if(k<0)return;e.preventDefault();
    if(D.phase==='cmd'&&k<2)showMoves(k===0?'atkM':'defM');
    else if(D.phase==='moves'&&k<2)chooseMove(k);
    else if(D.phase==='question')duelAnswer(k);
  }
});
renderNames();
})();
</script>
