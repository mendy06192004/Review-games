<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed walnut counter canvas for hands-on steps; slim progress bar on top, barista speech under it, control slab at the bottom. Single warm evening look, by choice. */
:root{
  --walnut:#2a1e17; --oat:#f2e7d5; --oat-dim:#c9b79c; --crema:#e2a867; --sage:#a9bb9c; --ember:#c96a43;

  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
/* Fallbacks for the Tailwind utilities used here, so layout holds even if the CDN is slow or blocked */
*,*:before,*:after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0}
h1,h2,p,ol,dl,dd{margin:0}ol{padding:0;list-style:none}
.mx-auto{margin-left:auto;margin-right:auto}.flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}.justify-center{justify-content:center}
.gap-2{gap:.5rem}.gap-2\.5{gap:.625rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-5{gap:1.25rem}.gap-6{gap:1.5rem}.gap-x-4{column-gap:1rem}.gap-x-5{column-gap:1.25rem}.gap-y-2{row-gap:.5rem}.gap-y-3{row-gap:.75rem}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.text-center{text-align:center}.w-full{width:100%}
@media (min-width:640px){.sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:768px){.md\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
body{background:var(--walnut);color:var(--oat);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.disp{font-family:var(--f-display);text-wrap:balance}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

.scrim{background:radial-gradient(120% 90% at 50% 30%,rgba(42,30,23,.8),rgba(20,14,10,.96));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sStep,#sFinal{padding-top:calc(env(safe-area-inset-top,0px) + 66px)}
.btn{font-family:var(--f-body);border-radius:999px;padding:.8rem 1.4rem;font-weight:700;letter-spacing:.06em;transition:transform .15s,background .2s,opacity .2s;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.chip:focus-visible,.pick:focus-visible,.mini:focus-visible,.lcdbox:focus-visible{outline:2px solid var(--crema);outline-offset:3px}
.btn-main{background:var(--crema);color:#2a1a10}
.btn-ghost{background:rgba(242,231,213,.08);color:var(--oat);border:1px solid rgba(242,231,213,.18)}
.card{background:linear-gradient(160deg,rgba(255,240,220,.07),rgba(255,240,220,.025));border:1px solid rgba(242,231,213,.14);border-radius:22px;padding:18px;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s;display:flex;gap:16px;align-items:center}

.pick{border:1px solid rgba(242,231,213,.16);border-radius:18px;padding:12px 10px;background:rgba(242,231,213,.04);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;transition:all .2s;min-width:0}

.pk-sub{font-size:12px;color:var(--crema)}

/* top bar */
#topbar{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(22,16,12,.92),rgba(22,16,12,0));pointer-events:none}

.ic{width:42px;height:42px;border-radius:14px;background:rgba(25,20,17,.8);border:1px solid rgba(242,231,213,.12);display:grid;place-items:center;color:var(--oat);cursor:pointer;flex:none}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

#say{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);max-width:520px;margin:0 auto}
#stageCard{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);max-width:520px;margin:0 auto;background:rgba(25,20,17,.82);border:1px solid rgba(242,231,213,.12);border-radius:18px;padding:10px 14px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#stageTag{font-family:var(--f-display);color:var(--crema);font-size:15px}
#stageMain{font-size:14px;line-height:1.5;margin-top:2px}
#segs{display:flex;gap:4px;margin-top:8px}
#segs i{flex:1;height:4px;border-radius:4px;background:rgba(242,231,213,.12);overflow:hidden;position:relative}
#segs i b{position:absolute;inset:0;width:0;background:var(--crema);border-radius:4px}
#panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(460px,calc(100% - 24px));
  background:linear-gradient(180deg,#24201d,var(--slab));border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.lcdbox{background:#0e0c0b;border-radius:14px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px;border:1px solid rgba(255,220,174,.06);text-align:left;min-width:0;color:inherit}
.lcdbox .lbl{font-family:var(--f-data);font-size:10px;letter-spacing:.2em;color:rgba(255,220,174,.45);display:flex;justify-content:space-between;gap:6px}
.lcdbox .val{font-family:var(--f-data);font-variant-numeric:tabular-nums;color:var(--lcd);font-size:clamp(22px,6.4vw,30px);font-weight:500;line-height:1.1;text-shadow:0 0 12px rgba(255,190,120,.35);white-space:nowrap}
.lcdbox .val small{font-size:.5em;margin-left:3px;opacity:.7}

.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--oat-dim);line-height:1.5}
.meter{height:8px;border-radius:8px;background:rgba(242,231,213,.1);overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--crema);border-radius:8px;transition:width .15s}
#gauge{position:absolute;left:12px;top:52%;transform:translateY(-50%);width:44px;display:flex;flex-direction:column;align-items:center;gap:6px}
#gTrack{width:14px;height:150px;border-radius:10px;background:rgba(25,20,17,.75);border:1px solid rgba(242,231,213,.15);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
#gFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#9fc4d6,#e9f4f8);border-radius:10px}
#gLock{position:absolute;left:-2px;right:-2px;height:2px;background:var(--crema);display:none}
#gauge .t{font-size:11px;color:var(--oat-dim);text-align:center}
#finishBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 128px)}
#toast{position:fixed;z-index:40;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translate(-50%,-6px);background:rgba(242,231,213,.96);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* counter + cards */
.scene{border-radius:24px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.45);background:#3b2a20}
.scene svg{display:block;width:100%;height:auto}
.mcard{background:var(--paper);color:var(--ink);border-radius:6px 18px 18px 18px;padding:16px 18px;box-shadow:0 14px 30px rgba(0,0,0,.35);transform:rotate(-1.2deg);position:relative}
.mcard:before{content:"";position:absolute;top:-8px;left:22px;width:46px;height:16px;background:rgba(169,187,156,.75);transform:rotate(-4deg)}
.fcard{background:var(--paper);color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.fcard .tear{border-top:2px dashed rgba(51,37,28,.18);margin:0 18px;position:relative}
.fcard .tear:before,.fcard .tear:after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#1d1511}
.fcard .tear:before{left:-30px}.fcard .tear:after{right:-30px}
.bar{height:6px;border-radius:6px;background:rgba(51,37,28,.1);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ink);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.stat dt{font-size:11px;letter-spacing:.12em;color:rgba(51,37,28,.55)}
.stat dd{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500}
.fk{font-size:11px;letter-spacing:.2em;color:rgba(51,37,28,.55)}
.trivia{background:#efe2cb;border-radius:16px;padding:14px 16px}
.eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
.steam path{animation:steam 3.2s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-12px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-4deg)}to{opacity:1;transform:rotate(-1.2deg)}}
.popin{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.rise,.popin,.eyes,.breathe,.steam path{animation:none}.steam path{opacity:.4}.card,.btn,.pick{transition:none}}
</style>

<canvas id="cv" aria-label="咖啡工作檯"></canvas>

<div id="topbar" hidden>

<!-- Barista select -->

    <header class="flex flex-col items-center gap-3 text-center rise">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">

    </div>
  </div>
</section>

<!-- HTML steps -->
<section id="sStep" class="layer scrim" hidden>

  <div class="mx-auto flex flex-col gap-4" style="max-width:440px;padding-bottom:40px" id="finalWrap"></div>

<script>
(()=>{
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* =================== DATA =================== */
const BARISTAS=[

const TRIVIA=[
  ['悶蒸氣泡從哪來？','咖啡豆烘焙後會保留大量二氧化碳。熱水一碰到粉，氣體被擠出來，粉層就像漢堡麵包一樣鼓起。豆子越新鮮，泡泡越多。'],
  ['為什麼要悶蒸？','先用少量水讓二氧化碳排掉，後面的熱水才能順利接觸咖啡粉。跳過悶蒸，氣體會擋住水流，萃取容易不均勻。'],
  ['粉水比黃金定律','手沖常見的粉水比落在 1:15 到 1:17。水越少越濃郁厚實，水越多越清爽，可以從 1:15 開始依口味微調。'],
  ['金杯準則','精品咖啡協會（SCA）建議萃取率約 18–22%，濃度 TDS 約 1.15–1.35%。低於這個範圍常偏酸、單薄，高於則容易苦澀。'],
  ['水溫怎麼選？','水溫越高萃取越快。淺焙豆常用 92–96°C 帶出花果調；深焙豆用 85–90°C，可以避免苦味過重。'],
  ['4:6 沖煮法的由來','由日本咖啡師粕谷哲提出，他在 2016 年世界盃沖煮大賽奪冠。總水量的前 40% 調整酸甜，後 60% 調整濃淡。'],
  ['V60 名字的意思','Hario V60 的 V 是錐形，60 是錐角 60 度。內壁的螺旋肋骨讓濾紙與杯壁間留出空氣通道，水流得更順。'],
  ['為什麼不要沖濾紙？','水直接打在濾紙邊，會沿著紙面流下而沒經過粉層，這叫「旁流（bypass）」，會讓咖啡變淡。'],
  ['研磨度的影響','磨得越細，萃取越快、流速越慢；磨得越粗則相反。沖起來太苦就調粗一點，太酸就調細一點。'],
  ['為什麼要現磨？','咖啡磨成粉後表面積大增，香氣散失得很快。沖煮前才研磨，香氣最完整。'],
  ['為什麼要拍平粉面？','粉面不平時，水會往低處流，造成有的地方萃取過度、有的不足。輕拍濾杯讓粉面平整，萃取更均勻。'],
  ['手磨的節奏','手搖磨豆維持穩定、不急的轉速，研磨顆粒會比較一致。轉太快容易產生較多細粉，讓咖啡多了雜味。'],
  ['水質也是風味','一杯咖啡絕大部分是水。水中適量的鈣、鎂離子能幫助帶出風味；用純水沖出來的咖啡反而容易平淡。'],
  ['圓豆是什麼？','咖啡櫻桃裡通常有兩顆對生的種子。偶爾只長出一顆，形狀圓滾，稱為圓豆（Peaberry）。'],

let ac=null,soundOn=true,noiseBuf=null,pourCh=null,boilCh=null;
function audioInit(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.03*w)/1.03;d[i]=l*3+w*.25}
    pourCh=chain('bandpass',900,.8);boilCh=chain('lowpass',360,.7);
  }catch(e){ac=null}
}
function chain(type,f,q){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=0;s.connect(fl).connect(g).connect(ac.destination);s.start();return{f:fl,g}}
function setGain(ch,v,tc=.08){if(ac&&ch)ch.g.gain.setTargetAtTime(soundOn?v:0,ac.currentTime,tc)}
function blip(f0,f1,dur,vol){if(!ac||!soundOn)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.5);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
function tick(f,vol,dur){if(!ac||!soundOn)return;const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=1.4;const g=ac.createGain(),t=ac.currentTime;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(ac.destination);s.start(t,Math.random()*1.5,dur+.05)}

function plate(g,x,y,s){

function paintRig(paper){
  const d=DRIPPERS[S.dripper],[c,g]=off(W,H);
  const flange=()=>{g.beginPath();if(d.pleat){for(let a=0;a<=TAU+.001;a+=TAU/200){const r=R*(1+.04*Math.cos(a*20));const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;a?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}else g.arc(cx,cy,R,0,TAU)};
  g.save();g.shadowColor='rgba(20,10,5,.55)';g.shadowBlur=24;g.shadowOffsetY=10;g.fillStyle=d.rim[1];flange();g.fill();g.restore();
  if(d.tab){g.fillStyle=d.tab;g.beginPath();g.roundRect(cx-R*1.26,cy-R*.17,R*.36,R*.34,R*.12);g.fill()}
  const fg=g.createRadialGradient(cx-R*.3,cy-R*.4,R*.1,cx,cy,R);fg.addColorStop(0,d.rim[0]);fg.addColorStop(1,d.rim[1]);g.fillStyle=fg;flange();g.fill();
  if(d.pleat){g.strokeStyle='rgba(60,80,50,.22)';g.lineWidth=1;for(let k=0;k<20;k++){const a=(k+.5)/20*TAU;g.beginPath();g.moveTo(cx+Math.cos(a)*R*.2,cy+Math.sin(a)*R*.2);g.lineTo(cx+Math.cos(a)*R*1.03,cy+Math.sin(a)*R*1.03);g.stroke()}}
  g.strokeStyle='rgba(60,40,20,.22)';g.lineWidth=1.2;g.beginPath();g.arc(cx,cy,R*.93,0,TAU);g.stroke();
  if(!paper){
    const ig=g.createRadialGradient(cx,cy,R*.05,cx,cy,R*.9);ig.addColorStop(0,'rgba(0,0,0,.45)');ig.addColorStop(1,'rgba(0,0,0,.05)');g.fillStyle=ig;g.beginPath();g.arc(cx,cy,R*.9,0,TAU);g.fill();
    g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;
    if(S.dripper==='v60'){for(let k=0;k<12;k++){const a0=k/12*TAU;g.beginPath();for(let t=0;t<=1;t+=.05){const a=a0+t*1.2,r=R*(.88-.66*t);const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;t?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
    else if(S.dripper==='kono'){for(let k=0;k<12;k++){const a=k/12*TAU;g.beginPath();g.moveTo(cx+Math.cos(a)*R*.18,cy+Math.sin(a)*R*.18);g.lineTo(cx+Math.cos(a)*R*.42,cy+Math.sin(a)*R*.42);g.stroke()}}
    if(d.flat){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(cx,cy,R*.36,0,TAU);g.fill();g.fillStyle='#120c08';for(let k=0;k<3;k++){const a=k/3*TAU-Math.PI/2;g.beginPath();g.arc(cx+Math.cos(a)*R*.12,cy+Math.sin(a)*R*.12,R*.035,0,TAU);g.fill()}}
    else{g.fillStyle='#120c08';g.beginPath();g.arc(cx,cy,R*.1,0,TAU);g.fill()}
  }else{
    const pr=R*.9;g.beginPath();
    for(let a=0;a<=TAU+.01;a+=TAU/160){const r=pr*(1+(d.flat?.03:.012)*Math.sin(a*(d.flat?20:24)));const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;a?g.lineTo(x,y):g.moveTo(x,y)}
    const pg=g.createRadialGradient(cx,cy,bedR*.8,cx,cy,pr);pg.addColorStop(0,'#cdbd9f');pg.addColorStop(.35,'#e9dec9');pg.addColorStop(1,'#f8f1e3');g.fillStyle=pg;g.fill();
    g.strokeStyle='rgba(140,110,70,.12)';g.lineWidth=1;const n=d.flat?20:28;
    for(let k=0;k<n;k++){const a=k/n*TAU;g.beginPath();g.moveTo(cx+Math.cos(a)*bedR*1.02,cy+Math.sin(a)*bedR*1.02);g.lineTo(cx+Math.cos(a)*pr*.98,cy+Math.sin(a)*pr*.98);g.stroke()}
    if(!d.flat){g.strokeStyle='rgba(140,110,70,.22)';g.lineWidth=2;g.beginPath();g.moveTo(cx+bedR*.7,cy-bedR*.7);g.lineTo(cx+pr*.68,cy-pr*.68);g.stroke()}
  }
  return c;
}
function buildBed(){
  const s=bedR*2,[c,g]=off(s,s);bedCv=c;const rnd=mulberry(5);g.fillStyle='#7a5235';g.fillRect(0,0,s,s);

  for(let i=0;i<n;i++){const t=rnd();g.fillStyle=t<.3?'#5b3b26':t<.6?'#8a5f3e':t<.85?'#6a4630':'#a07450';g.globalAlpha=.55+rnd()*.45;g.fillRect(rnd()*s,rnd()*s,.6+rnd()*1.4,.6+rnd()*1.4)}
  g.globalAlpha=1;const sh=g.createRadialGradient(s/2,s/2,s*.1,s/2,s/2,s/2);sh.addColorStop(0,'rgba(0,0,0,.18)');sh.addColorStop(.6,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(40,20,8,.35)');g.fillStyle=sh;g.fillRect(0,0,s,s);

function beanCol(){return S.bean?ROAST[S.bean.roast].color:'#6e4024'}
function drawBean(g,x,y,rot,k,col){

function buildJar(){

const P={down:false,tx:0,ty:0,x:0,y:0,force:0,hold:0,mode:'時長',lock:null,forceSeen:false,fVals:new Set(),rMin:1e9,rMax:0,raw:-1,isTouch:false};
function readTouch(t){
  const f=t.force||0;
  if(f>0&&f<1&&f!==.5){P.fVals.add(Math.round(f*50));if(P.fVals.size>3)P.forceSeen=true}
  if(P.forceSeen){P.mode='壓力';P.raw=clamp((f-.04)/.62,0,1);return}
  const r=t.radiusX||0;if(r>0){P.rMin=Math.min(P.rMin,r);P.rMax=Math.max(P.rMax,r)}
  if(P.rMax-P.rMin>3){P.mode='面積';P.raw=clamp((r-P.rMin)/(P.rMax-P.rMin),0,1);return}
  P.mode='時長';P.raw=-1;
}
const M=()=>MODES[screen];
cv.addEventListener('touchstart',e=>{const m=M();if(!m)return;e.preventDefault();const t=e.changedTouches[0];P.isTouch=true;P.down=true;P.hold=0;readTouch(t);audioInit();m.down&&m.down(t.clientX,t.clientY,true)},{passive:false});
cv.addEventListener('touchmove',e=>{const m=M();if(!m)return;e.preventDefault();const t=e.touches[0];if(!t)return;readTouch(t);m.move&&m.move(t.clientX,t.clientY,true)},{passive:false});
const tEnd=e=>{if(e.touches&&e.touches.length)return;P.down=false;const m=M();m&&m.up&&m.up()};
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
cv.addEventListener('mousedown',e=>{const m=M();if(!m||P.isTouch)return;P.down=true;P.hold=0;P.raw=-1;audioInit();m.down&&m.down(e.clientX,e.clientY,false)});
addEventListener('mousemove',e=>{if(P.isTouch)return;const m=M();m&&m.move&&m.move(e.clientX,e.clientY,false)});
addEventListener('mouseup',()=>{if(P.isTouch||!P.down)return;P.down=false;const m=M();m&&m.up&&m.up()});

addEventListener('keydown',e=>{if(screen!=='brew')return;if(e.key==='ArrowUp'||e.key==='ArrowDown'){P.lock=clamp((P.lock??.3)+(e.key==='ArrowUp'?.08:-.08),0,1);updLock()}});

const Wg={};
const weighGeo=()=>({bx:cx+R*.1,by:cy+R*.2,br:R*.62,jx:cx-R*.92,jy:cy-R*.92,jr:R*.5});
function weighEnter(){
  Object.assign(Wg,{beans:[],fly:[],weight:0,acc:0,holding:false,ht:0,scoop:0});buildJar();
  say(L().weigh);
  panel(`<div class="grid grid-cols-2 gap-2.5">
    <div class="lcdbox"><span class="lbl"><span>WEIGHT</span><span>咖啡豆</span></span><span class="val" id="wgW">0.0<small>g</small></span><span class="sub" id="wgS">目標 ${doseOf().toFixed(1)}g</span></div>
    <div class="flex flex-col gap-2 justify-center"><button class="mini" id="wgOut" style="padding:9px 12px">取出 1 顆</button><span class="hint">按住＝連續舀豆<br>輕點＝放一顆</span></div></div>
    <button class="btn btn-main" id="wgOk" disabled>就這個重量・去磨豆</button>`);
  $('#wgOut').onclick=()=>{const b=Wg.beans.pop();if(!b)return;Wg.weight-=b.w;const g=weighGeo();Wg.fly.push({x0:b.x,y0:b.y,x1:g.jx,y1:g.jy,t:0,w:0,rot:b.rot,back:true});beanClick()};
  $('#wgOk').onclick=()=>{const dose=doseOf(),err=Math.abs(Wg.weight-dose),tol=.2*S.barista.tolMul;
    S.weighed=Math.round(Wg.weight*10)/10;S.weighQ=err<=tol?1-.2*err/tol:Math.max(0,.8-(err-tol)/1.2);
    toast(err<=tol?L().weighGood:L().weighOff,2200);go('grind')};
}
function spawnBean(){const g=weighGeo();const gx=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
  let x1=g.bx+gx()*g.br*.38,y1=g.by+gx()*g.br*.38;const d=Math.hypot(x1-g.bx,y1-g.by);if(d>g.br*.7){x1=g.bx+(x1-g.bx)*g.br*.7/d;y1=g.by+(y1-g.by)*g.br*.7/d}
  Wg.fly.push({x0:g.bx-g.br*.5,y0:g.by-g.br*.62,x1,y1,t:0,w:rand(.12,.18),rot:rand(0,TAU),back:false})}
const MODES={};
MODES.weigh={enter:weighEnter,
  down(){Wg.holding=true;Wg.ht=0;spawnBean()},up(){Wg.holding=false},
  update(dt){
    Wg.scoop=lerp(Wg.scoop,Wg.holding?1:0,Math.min(1,dt*10));
    if(Wg.holding){Wg.ht+=dt;if(Wg.ht>.3){const rate=P.raw>=0&&P.mode==='壓力'?6+22*P.raw:8+16*clamp((Wg.ht-.3)/2,0,1);Wg.acc+=rate*dt;while(Wg.acc>=1){Wg.acc--;spawnBean()}}}
    for(const f of Wg.fly){f.t+=dt/.24;if(f.t>=1&&!f.done){f.done=true;if(!f.back){Wg.beans.push({x:f.x1,y:f.y1,rot:f.rot,w:f.w});Wg.weight+=f.w;beanClick()}}}
    Wg.fly=Wg.fly.filter(f=>!f.done);
    const w=Math.max(0,Wg.weight),dose=doseOf();
    $('#wgW').innerHTML=w.toFixed(1)+'<small>g</small>';
    const diff=w-dose;$('#wgS').textContent=Math.abs(diff)<=.2*S.barista.tolMul?`目標 ${dose.toFixed(1)}g・剛剛好`:diff>0?`目標 ${dose.toFixed(1)}g・多了 ${diff.toFixed(1)}g`:`目標 ${dose.toFixed(1)}g・還差 ${(-diff).toFixed(1)}g`;
    $('#wgOk').disabled=w<dose-1.5;
  },
  draw(){
    const g=weighGeo(),col=beanCol();ctx.drawImage(woodCv,0,0,W,H);plate(ctx,g.bx,g.by,R*1.85);
    ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;ctx.fillStyle='#e9dfcf';ctx.beginPath();ctx.arc(g.bx,g.by,g.br,0,TAU);ctx.fill();ctx.restore();
    const og=ctx.createRadialGradient(g.bx-g.br*.3,g.by-g.br*.35,g.br*.1,g.bx,g.by,g.br);og.addColorStop(0,'#fbf6ee');og.addColorStop(1,'#d8ccb8');ctx.fillStyle=og;ctx.beginPath();ctx.arc(g.bx,g.by,g.br,0,TAU);ctx.fill();
    const ig=ctx.createRadialGradient(g.bx+g.br*.2,g.by+g.br*.2,g.br*.1,g.bx,g.by,g.br*.86);ig.addColorStop(0,'#efe5d4');ig.addColorStop(1,'#c9b99e');ctx.fillStyle=ig;ctx.beginPath();ctx.arc(g.bx,g.by,g.br*.86,0,TAU);ctx.fill();
    for(const b of Wg.beans)drawBean(ctx,b.x,b.y,b.rot,1,col);
    for(const f of Wg.fly){const t=clamp(f.t,0,1),x=lerp(f.x0,f.x1,t),y=lerp(f.y0,f.y1,t)-Math.sin(t*Math.PI)*R*.12;drawBean(ctx,x,y,f.rot+t*3,1+(1-t)*.5,col)}
    ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=16;ctx.shadowOffsetY=8;ctx.drawImage(jarCv,g.jx-g.jr-4,g.jy-g.jr-4,g.jr*2+8,g.jr*2+8);ctx.restore();
    // scoop
    const s=Wg.scoop,tx=lerp(g.jx+g.jr*.1,g.bx-g.br*.5,s),ty=lerp(g.jy+g.jr*.1,g.by-g.br*.62,s),ang=Math.atan2(g.jy-ty,g.jx-tx)+(s<.5?Math.PI*.25:0);
    ctx.save();ctx.translate(tx,ty);ctx.rotate(ang);
    ctx.strokeStyle='#9a6c45';ctx.lineWidth=R*.05;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(R*.14,0);ctx.lineTo(R*.62,0);ctx.stroke();
    ctx.fillStyle='#b88a5c';ctx.beginPath();ctx.ellipse(0,0,R*.16,R*.12,0,0,TAU);ctx.fill();ctx.fillStyle='#8f6640';ctx.beginPath();ctx.ellipse(0,0,R*.12,R*.085,0,0,TAU);ctx.fill();
    if(s>.5){for(let i=0;i<5;i++)drawBean(ctx,Math.cos(i*1.3)*R*.05,Math.sin(i*1.9)*R*.04,i,.9,col)}
    ctx.restore();
  }};

  const EY=clamp(19.6+(tt-mid)/40*1.4+(avgF-.45)*2.5-bypassF*9+(E/100-.7)*2+(ratio-15)*.25+gd.ey+(S.temp-tmid)*.18+(1-dr.drain)*1.5+(1-S.steady)*.5,15,25);
  const vAcid=rc.variant==='bright'?.8:rc.variant==='sweet'?-.6:0,vSweet=rc.variant==='sweet'?.6:0,bloomQ=Math.min(1,G.aromaCount/80);
  const rAcid=S.bean.roast==='light'?.6:S.bean.roast==='dark'?-.9:0,rBody=S.bean.roast==='dark'?.7:S.bean.roast==='light'?-.2:.2;
  const radar={酸質:clamp(2.8+(20-EY)*.55+vAcid+dr.acid+rAcid,.5,5),甜感:clamp(1.2+E/100*1.8+(1-Math.abs(EY-20)/3)*1.6+vSweet,.5,5),
    醇厚:clamp(2.2+(EY-19.5)*.5+(15-ratio)*.3+avgF*.6+dr.body+rBody,.5,5),乾淨度:clamp(4.6-bypassF*18-loss*8-(1-E/100)*1.6-(1-S.steady)*.8,.5,5),
    香氣:clamp(1.8+bloomQ*2.2+(S.barista.id==='ting'?.8:0)+dr.aroma,.5,5)};
  const taste=EY<18.5?'萃取稍嫌不足，口感明亮偏酸、輕盈如茶':EY<=22?'萃取落在甜蜜點，酸甜平衡、尾韻回甘':'萃取偏高，醇厚濃郁，帶一點可可般的苦韻';
  return{E,F,P:Pp,score,aromaBonus,ratio,EY,tt,radar,taste,loss,poured:G.poured,spill:G.spill+G.bypass};
}

  const b=S.barista;$('#gAvatar').innerHTML=avatar(b.id);$('#gName').textContent=b.name;$('#gTitle').textContent=b.title;$('#gQuote').textContent=b.quote;
  const ok=!!b.unlock46;$('#rFour').disabled=!ok;$('#lock46').textContent=ok?'庠和獨家':'僅限庠和';if(!ok&&S.recipeId==='fourSix')S.recipeId='three';syncRecipeUi();
}
function syncRecipeUi(){
  $('#rThree').setAttribute('aria-pressed',S.recipeId==='three');$('#rFour').setAttribute('aria-pressed',S.recipeId==='fourSix');$('#variantRow').hidden=S.recipeId!=='fourSix';
  $$('#variantRow .mini').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.variant));
}
$('#rThree').onclick=()=>{S.recipeId='three';syncRecipeUi()};
$('#rFour').onclick=()=>{if(S.barista.unlock46){S.recipeId='fourSix';syncRecipeUi()}};
$('#variantRow').addEventListener('click',e=>{const b=e.target.closest('.mini');if(!b)return;S.variant=b.dataset.v;syncRecipeUi()});
$('#gBack').onclick=()=>go('select');
$('#gStart').onclick=()=>{S.recipe=buildRecipe(S.recipeId,S.variant);newCup();go('bean')};

/* =================== LOOP =================== */
let T=0,lastT=performance.now();
addEventListener('resize',()=>{resize();if(screen==='filter'||screen==='brew')buildGear()});
resize();
const idleSteam=[];
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;if(P.down)P.hold+=dt;
  const m=MODES[screen];
  try{
    if(m){m.update(dt);m.draw()}
    else{ctx.drawImage(woodCv,0,0,W,H);if(Math.random()<dt*3)idleSteam.push({x:cx+rand(-.5,.5)*R,y:cy,r:R*.3,life:0});
      for(const p of idleSteam){p.life+=dt;p.y-=dt*14;const a=Math.sin(Math.min(1,p.life/4)*Math.PI)*.06,sg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);sg.addColorStop(0,`rgba(255,250,240,${a})`);sg.addColorStop(1,'rgba(255,250,240,0)');ctx.fillStyle=sg;ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2)}
      while(idleSteam.length&&idleSteam[0].life>4)idleSteam.shift()}
  }catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__palm={S,go,G,Gr,Fl,Bo,Wg};
})();
</script>
