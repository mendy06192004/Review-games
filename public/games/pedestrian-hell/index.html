/* ========== 音效（WebAudio，全部合成） ========== */

function tone(f,d,type,v,slide,delay){

  }
  const z=P?zoneOf(P.x):0;
  if(z!==this.mood){this.mood=z}
  const M=MUS[this.mood];
  const target=this.vol*this.duck;
  this.gain.gain.setTargetAtTime(G.state==='dying'?0:target,a.currentTime,.4);
  while(this.next<a.currentTime+.18){
    this.play(this.step,this.next,M);
    this.next+=60/M.bpm/4;this.step++;
  }
};
Music.note=function(f,t,d,type,v,lp){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=g;
  if(lp){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);fl.connect(g)}else o.connect(g);
  g.connect(this.gain);o.start(t);o.stop(t+d+.05);
};
Music.hit=function(t,d,v,hp,lp){
  const a=AC;if(!this.nz){const n=a.sampleRate;this.nz=a.createBuffer(1,n,a.sampleRate);const c=this.nz.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1}
  const s=a.createBufferSource();s.buffer=this.nz;
  const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(this.gain);s.start(t,Math.random()*.5,d+.02);
};
Music.kick=function(t){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
  g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+.25);
};
Music.play=function(step,t,M){
  const bar=Math.floor(step/16), s=step%16, chord=M.prog[bar%4];
  const root=M.root+chord, third=root+(M.minor&&bar%4!==2?3:4), fifth=root+7;
  const pent=M.minor?[0,3,5,7,10]:[0,2,4,7,9];
  const beat=60/M.bpm;
  // 低音
  if(s===0||s===6||s===8||(s===11&&M.drum>0)||(s===14&&M.drum===2))
    this.note(mf(root-24+(s===6||s===14?12:0)),t,beat*(s===0?1.4:.7),'triangle',.13,500);
  // 和弦琶音（撥弦）
  if(M.drum>0||s%4===0){
    const arp=[root+12,third+12,fifth+12,third+12];
    if(s%2===0&&(M.drum===2||s%4===0))this.note(mf(arp[(s/2|0)%4]),t,beat*.9,'triangle',.05,2200);
  }
  // 旋律：以五聲音階隨機漫步，同一小節編號會得到同一段，聽起來像有在重複
  const r=(n)=>hash(n*13.17+this.seed+(this.mood*31));
  if(s%2===0&&r(bar*16+s)<M.mel&&!(s===0&&r(bar)<.2)){
    const idx=Math.floor(r(bar*16+s+99)*5), oct=r(bar*16+s+7)<.28?24:12;
    const m=root+pent[idx]+oct;
    this.note(mf(m),t,beat*(r(bar*16+s+3)<.35?1.1:.55),M.minor?'sine':'triangle',.06,3000);
    if(!M.minor&&s%4===0)this.note(mf(m+12),t,beat*.4,'sine',.014);
  }
  // 鼓
  if(M.drum>0){
    if(s===0||s===8||(M.drum===2&&s===10))this.kick(t);
    if(s%4===2)this.hit(t,.05,.03,6500);
    if(M.drum===2&&s%2===1)this.hit(t,.03,.012,8000);
    if(s===4||s===12)this.hit(t,.09,.045,1800);
  }
  // 氣氛長音
  if(M.pad&&s===0){
    [root,third,fifth].forEach(n=>{
      const a=AC,o=a.createOscillator(),g=a.createGain();
      o.type='sine';o.frequency.value=mf(n);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+beat*1.5);g.gain.linearRampToValueAtTime(0,t+beat*4);
      o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+beat*4+.1);
    });
  }
};
Music.start=function(){
  const a=ac();if(!a)return;
  if(!this.gain){this.gain=a.createGain();this.gain.gain.value=0;this.gain.connect(a.destination)}
  this.on=true;this.step=0;this.next=a.currentTime+.1;
  if(!this.timer)this.timer=setInterval(()=>Music.tick(),50);
};
Music.stop=function(){if(this.gain&&AC)this.gain.gain.setTargetAtTime(0,AC.currentTime,.2);this.on=false};

function laneSet(o){return o.lanes}
function canPlace(o){
  const w=world, solid=o.h>=100;
  const x0=o.x-o.w/2-80, x1=o.x+o.w/2+80;
  const blocked=new Set(solid?o.lanes:[]);
  for(const q of w.obs){
    const gap=Math.abs(q.x-o.x)-(q.w+o.w)/2;
    if(gap<0)  { if(q.lanes.some(l=>o.lanes.includes(l)))return false; }
    if(gap<84 && q.lanes.some(l=>o.lanes.includes(l)))return false;   // 同道保持可落地的間距
    if(q.h>=100 && q.x+q.w/2>=x0 && q.x-q.w/2<=x1) q.lanes.forEach(l=>blocked.add(l));
  }
  for(const s of w.shops){ if(Math.abs(s.x-o.x)<190 && o.lanes.some(l=>l<2))return false }
  return blocked.size<3;
}
function addOb(type,x,lane,extra){
  const d=OB[type], o=Object.assign({type,x,lane,w:d.w,h:d.h,lanes:d.lanes||[lane],solid:d.h>=100,done:false,seed:Math.random()*100},extra||{});
  if(type==='cover')o.broken=extra&&extra.broken!=null?extra.broken:false;
  if(type==='manhole'||type==='cover'||type==='gap')o.flat=true;
  o.ys=o.lanes.map(l=>LY[l]);o.hh=o.solid?34:(o.flat?13:20);
  if(type==='elbox'){o.ys=[Y_SW1-8];o.hh=18;o.edge=true}
  if(type==='carL2'||type==='truckL2'){ // 違停：停在路邊，只有輪胎有碰撞體積
    o.ys=[Y_SW1+22];o.hh=15;
    o.parts=type==='carL2'?[{dx:-35,w:30},{dx:35,w:30}]:[{dx:-60,w:28},{dx:32,w:28},{dx:60,w:28}];
  }
  if(type==='carP'){o.col=pick(['#f2f2f2','#2d3a4a','#b32a2a','#d8d2c2','#37603f','#222']);}
  if(type==='carL2'){o.col=pick(['#f2f2f2','#2d3a4a','#b32a2a','#d8d2c2','#37603f','#222']);}
  if(!canPlace(o))return null;
  world.obs.push(o); return o;
}
function pickType(lane,b){
  const z=b.zone, r=Math.random();
  if(lane===0){
    const t=[['step',.2],['cable',.07],['scooterP',.17+z*.03],['box',.12],['bucket',.07],['sign',.1],['plant',.07],['stall',z>=1?.1+z*.02:0]];
    return roulette(t);
  }
  if(lane===1){
    if(!b.sw) return roulette([['scooterRow',.3],['cone',.22],['box',.18],['bucket',.18],['elbox',.12]]);
    return roulette([['step',.1],['root',.08],['tree',.1],['pole',.12],['elbox',.08],['hydrant',.05],['cone',.06],
      ['barrier',.06],['cover',.14],['manhole',.1],['gap',z>=2?.04:0],['scooterRow',.07],['bikeP',.06],['sign',.04]]);
  }
  return roulette([['carL2',.35],['cone',.2],['truckL2',z>=2?.15:0],['garbage',z>=3?.08:0],['barrier',.1],['scooterRow',.12]]);
}
function roulette(t){
  let s=0;t.forEach(a=>s+=a[1]);let r=Math.random()*s;
  for(const a of t){r-=a[1];if(r<=0)return a[0]}return t[0][0];
}
function fillBlock(b){
  const d=b.x0/LEN, dens=lerp(250,112,d);
  let x=b.x0+ri(200,320);
  while(x<b.x1-220){
    const r=Math.random();
    const lane=b.sw?(r<.36?0:r<.88?1:2):(r<.5?0:r<.72?1:2);
    const type=pickType(lane,b);
    const extra={};
    if(type==='cover'){extra.broken=chance([.12,.25,.4,.5,.55][b.zone])}
    addOb(type,x,lane,extra);
    x+=rnd(dens*.7,dens*1.3);
  }
}
function fillCoins(b){
  const n=(chance(.8)?1:0)+(chance(.25)?1:0);
  for(let i=0;i<n;i++){
    const x=rnd(b.x0+120,b.x1-120), lane=chance(.18)?2:(chance(.5)?1:0);
    const solidHere=world.obs.some(o=>o.solid&&o.lanes.includes(lane)&&Math.abs(o.x-x)<o.w/2+30);
    if(solidHere)continue;
    const r=Math.random(), v=r<.8?10:50;
    world.coins.push({x,lane,v:lane===2&&v===10?50:v,got:false,ph:Math.random()*6});
  }
}

let _bi=0;
function blockAt(x){
  const B=world.blocks, c=B[_bi];
  if(c&&x>=c.x0&&x<c.x1)return c;
  for(let i=0;i<B.length;i++){if(x>=B[i].x0&&x<B[i].x1){_bi=i;return B[i]}}
  return null;
}
function interAt(x,m){
  m=m||0;
  for(const it of world.inters){if(x>=it.x0-m&&x<=it.x1+m)return it}
  return null;
}

function die(cause){
  if(P.dead)return;
  P.dead=true;P.hp=0;
  if(cause==='hunger')cause=P.money<30?'poor':'hungry';
  SFX.die();
  G.state='dying';G.ending=1.6;G.cause=cause;
}
function finishEnd(win){
  G.state='over';
  const secs=Math.round(G.time), m=Math.floor(secs/60), s=String(secs%60).padStart(2,'0');
  const dist=Math.round(P.x/PXM);
  let title,lead,fact,rank='',kicker;
  if(win){
    const score=P.hp+P.money/10-P.hits*6-P.fines/20+Math.max(0,420-G.time)/8;
    rank=score>=125?'S':score>=90?'A':score>=55?'B':'C';
    title='平安到家！';kicker='任務完成';
    lead={S:'你是行人之神。連紅綠燈都向你敬禮。',A:'很穩。這條路對你來說只是日常。',B:'有驚無險。明天還要再走一次。',C:'活著回到家，已經是勝利了。'}[rank];
    fact='在臺灣，走路回家本來不該是一場冒險。騎樓與人行道的暢通、轉彎車的禮讓、路口的視線，都是可以被改善的。';
  }else{
    const d=DEATH[G.cause]||DEATH.lane;
    title=d.t;lead=d.l;fact=d.f;kicker='遊戲結束 · 距離家還有 '+Math.round((LEN-P.x)/PXM)+' 公尺';
    rank='';
  }
  $('endKicker').textContent=kicker;$('endTitle').textContent=title;
  $('endRank').textContent=rank;$('endRank').style.display=rank?'':'none';
  $('endLead').textContent=lead;$('endFact').textContent=fact;
  const st=[['走過距離',dist+' m'],['花費時間',m+':'+s],['受傷次數',P.hits],['等紅燈',Math.round(P.waitT)+' 秒'],
    ['剩餘血量',Math.max(0,Math.round(P.hp))],['剩餘錢包','NT$'+P.money],['撿到零錢','NT$'+P.coinsGot],['罰單','NT$'+P.fines]];
  $('endStats').innerHTML=st.map(a=>'<div>'+a[0]+'<b>'+a[1]+'</b></div>').join('');
  $('endStats').style.gridTemplateColumns='repeat(4,1fr)';
  $('end').hidden=false;
  if(win)SFX.win();
}

/* ========== 受傷 ========== */
function hurt(dmg,cause,o){
  o=o||{};
  if(P.dead||P.inv>0)return;
  if(P.vest>0)dmg*=.7;
  if(o.veh)dmg*=P.vmul;
  dmg=Math.max(1,Math.round(dmg));
  P.hp-=dmg;P.hits++;P.inv=o.inv||2.2;P.lastCause=cause;
  P.down=o.down!=null?o.down:1.1;
  if(o.fly){P.fly={t:0,dur:.65,vx:o.fly,h:o.h||60}}
  G.shake=o.shake||8;G.flash=.35;
  ftext(P.x,P.y-70,'-'+dmg,'#ff5a4a');
  (o.sfx||SFX.hit)();
  if(P.hp<=0)die(cause);
}

/* ========== 交通工具 ========== */
function seeP(base){
  return clamp(base+(P.vest>0?.25:0)+(P.tol>1?.2:0)-nightA()*.25,.05,.97);
}
function mkLane(kind,x,lane,dir,speed,o){
  const k=VK[kind], y0=LANE5[lane];
  const v=Object.assign({mode:'lane',kind,x,y:y0,baseY:y0,baseLane:lane,ty:y0,dir,cruise:speed,vx:dir*speed,sees:true,
    col:pick(CARCOL),rc:pick(RIDERCOL),dmg:k.dmg,hx:k.hx,hy:k.hy,len:k.len,stopT:0,age:0,decor:false,cued:false,rear:false},o||{});
  V.push(v);return v;
}
function laneClear(L,xa,xb){
  if(xa>xb){const t=xa;xa=xb;xb=t}
  for(const o of world.obs){ if(o.solid&&o.lanes.includes(L)&&o.x+o.w/2>xa&&o.x-o.w/2<xb)return false }
  return true;
}
function pickKind(z,stream){
  const r=Math.random();
  if(z>=2&&r>.9)return 'truck';
  if(z>=1&&r>.84)return 'bus';
  if(r>.6)return 'scooter';
  return 'car';
}
function spawnTraffic(dt){
  const sp=G.spawn, d=P.x/LEN, z=zoneOf(P.x), blk=blockAt(P.x), inInter=interAt(P.x,0);
  // 慢車道：對向來車
  sp.lane2-=dt;
  if(sp.lane2<=0){
    sp.lane2=rnd(.7,1.3)*lerp(6.5,2.8,d);
    const r=Math.random(); let kind=r<.6?'scooter':r<.86?'car':(z>=1&&r<.94?'bus':(z>=2?'truck':'car'));
    if(z>=2&&chance(.2))kind='delivery';
    const spd=(kind==='scooter'||kind==='delivery'?rnd(150,230):rnd(120,180))*(1+d*.25);
    const v=mkLane(kind,cam.x+VW+140,2,-1,spd,{sees:chance(seeP(.8))});
    if(blk&&!blk.sw&&chance(.4)){v.baseY=v.ty=v.y=LY[1]+34}
  }
  // 沒有人行道的巷弄：同向來車，從背後來
  if(blk&&!blk.sw){
    sp.same-=dt;
    if(sp.same<=0){
      sp.same=rnd(.8,1.4)*lerp(8,3.2,d);
      const kind=chance(.7)?'scooter':'car';
      const v=mkLane(kind,cam.x-150,2,1,kind==='scooter'?rnd(190,260):rnd(150,200),{sees:chance(seeP(.45)),rear:true});
      if(chance(.4)){v.baseY=v.ty=v.y=LY[1]+34}
    }
  }
  // 機車偶爾騎上騎樓／人行道：大多是停車後騎士離開，少數直接穿過
  if(z>=1&&blk&&blk.sw){
    sp.cut-=dt;
    if(sp.cut<=0){
      sp.cut=rnd(.8,1.3)*lerp(26,13,d);
      if(chance(.82))spawnParker();else spawnRider();
    }
  }
  // 腳踏車
  if(P.x>3000&&blk){
    sp.bike-=dt;
    if(sp.bike<=0){
      const sch=P.x>SCHOOL[0]&&P.x<SCHOOL[1];
      sp.bike=sch?rnd(2.4,4.2):rnd(9,15);
      const dir=chance(.5)?-1:1, L=chance(.5)?0:1, sx=dir<0?cam.x+VW+100:cam.x-120;
      if(laneClear(L,Math.min(sx,P.x)-60,Math.max(sx,P.x)+500))
        mkLane('bike',sx,L,dir,rnd(90,130),{sees:chance(seeP(.55)),rear:dir>0,col:pick(['#ff7a1a','#3b8de0','#2fbf74']),student:sch||chance(.15),kid:chance(.4)});
    }
  }
  // 快車道裝飾車流
  sp.dec3-=dt;
  if(sp.dec3<=0){sp.dec3=rnd(.8,2.2);const k=pickKind(z,true);mkLane(k,cam.x+VW+180,3,-1,rnd(160,260),{decor:true})}
}

function spawnParker(){
  const L=chance(.7)?1:0, tx=P.x+rnd(220,380), sx=cam.x+VW+120, bk=blockAt(tx);
  if(!bk||!bk.sw)return;
  if(!canPlace({x:tx,w:60,h:999,lanes:[L],type:'scooterP'}))return;
  if(!laneClear(L,tx-50,sx+50))return;
  mkLane('scooter',sx,L,-1,rnd(95,130),{sees:chance(seeP(.9)),parker:{tx,L,state:'ride',t:0,rw:0}});
}
function spawnRider(){
  const dir=chance(.5)?-1:1, L=chance(.75)?1:0, sx=dir<0?cam.x+VW+120:cam.x-140;
  if(!laneClear(L,Math.min(sx,P.x)-60,Math.max(sx,P.x)+500))return;
  mkLane('scooter',sx,L,dir,rnd(190,250),{sees:chance(seeP(.5)),rear:dir>0,cut:true});
  SFX.vroom();
}
function updLane(v,dt){
  v.age+=dt;
  if(!v.decor){
    let ty=v.baseY;
    if(v.baseLane===2){
      for(const o of world.obs){
        if(!o.solid||!o.lanes.includes(2))continue;
        if(Math.abs(o.x-v.x)<o.w/2+v.hx+36){ty=FAR_W-8;break}
      }
    }
    v.ty=ty;
    v.y+=clamp(v.ty-v.y,-90*dt,90*dt);
  }
  let want=v.cruise*v.dir;
  const pk=v.parker;
  if(pk){
    if(pk.state==='ride'){
      const dist=v.x-pk.tx;
      want=dist<=3?0:-Math.min(v.cruise,Math.sqrt(2*260*dist)+10);
      if(dist<=3&&Math.abs(v.vx)<8){pk.state='park';pk.t=0}
    }else{
      want=0;pk.t+=dt;
      if(pk.t>.5)pk.rw=Math.min(1,(pk.t-.5)/1.5);
      if(pk.t>2.3){addOb('scooterP',Math.round(v.x),pk.L);v.dead=true;return}
    }
  }
  if(v.sees&&!v.decor&&!P.dead&&!(pk&&pk.state==='park')){
    const ahead=(P.x-v.x)*v.dir;
    if(ahead>0&&ahead<v.hx+135*P.tol&&Math.abs(P.y-v.y)<34*(P.tol>1?1.3:1))want=0;
  }
  if(want===0&&Math.abs(v.vx)<12&&!pk){
    v.stopT+=dt;
    if(v.stopT>1.5){ // 停太久就繞開
      if(v.baseLane===2)v.baseY=FAR_W-8; else if(v.baseLane<2){v.baseLane=2;v.baseY=LY[2]}
      v.stopT=0;
    }
  }else v.stopT=0;
  v.vx+=clamp(want-v.vx,-1000*dt,320*dt);
  v.x+=v.vx*dt;
  if(v.decor){laneHit(v);return}
  // 提示音
  const dx=(P.x-v.x)*v.dir;
  if(!v.cued&&dx>0&&dx<420){
    v.cued=true;
    if(v.kind==='bike')setTimeout(SFX.bell,10);
    else if(v.kind==='scooter'||v.kind==='delivery')SFX.vroom();
    else if(v.kind==='car'&&!v.sees)SFX.horn();
  }
  laneHit(v);
}
function laneHit(v){
  if(!P.dead&&P.inv<=0&&Math.abs(v.vx)>40&&Math.abs(P.x-v.x)<v.hx+9+P.pad&&Math.abs(P.y-v.y)<v.hy+7){
    const rear=v.dir===1&&P.face===1;
    let cause=v.kind==='bike'?'bike':rear?'rear':v.baseLane<2||(v.y<LY[2]-30)?'sidewalk':'lane';
    if(v.kind!=='bike'&&v.baseLane===2&&!rear)cause='lane';
    const dmg=v.dmg*(v.parker?.5:1)*(rear?1.2:1)*clamp(Math.abs(v.vx)/180,.7,1.4)*rnd(.9,1.1);
    hurt(dmg,cause,{veh:1,fly:Math.sign(v.vx)*(140+dmg*3),down:1.3,h:50,shake:v.kind==='bike'?3:8});
  }
}

/* ---- 路徑車輛（路口專用） ---- */
function mkPath(kind,pts,speed,o){
  const cum=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const k=VK[kind];
  const v=Object.assign({mode:'path',kind,pts,cum,L:cum[cum.length-1],s:0,cruise:speed,spd:speed,willYield:false,
    col:pick(CARCOL),rc:pick(RIDERCOL),dmg:k.dmg,len:k.len,x:pts[0][0],y:pts[0][1],dx:0,dy:1,hx:20,hy:20,
    cued:false,age:0,hold:false,stopAt:null,said:0},o||{});
  V.push(v);pathPlace(v);return v;
}
function pathPlace(v){
  const s=clamp(v.s,0,v.L);let i=1;
  while(i<v.pts.length-1&&v.cum[i]<s)i++;
  const a=v.pts[i-1],b=v.pts[i],seg=v.cum[i]-v.cum[i-1]||1,t=(s-v.cum[i-1])/seg;
  v.x=a[0]+(b[0]-a[0])*t;v.y=a[1]+(b[1]-a[1])*t;
  v.dx=(b[0]-a[0])/seg;v.dy=(b[1]-a[1])/seg;
  if(Math.abs(v.dx)>Math.abs(v.dy)){v.hx=v.len/2;v.hy=VK[v.kind].hy}else{v.hx=v.kind==='scooter'||v.kind==='delivery'?15:VK[v.kind].hy+6;v.hy=v.len*.42}
}
function pathAt(v,s){
  s=clamp(s,0,v.L);let i=1;
  while(i<v.pts.length-1&&v.cum[i]<s)i++;
  const a=v.pts[i-1],b=v.pts[i],seg=v.cum[i]-v.cum[i-1]||1,t=(s-v.cum[i-1])/seg;
  return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
}
function updPath(v,dt,it){
  v.age+=dt;
  let want=v.cruise;
  if(v.willYield&&!P.dead){
    const r=(v.kind==='bus'||v.kind==='truck'?34:26)+(v.kind==='scooter'?-6:0);
    for(let d=24;d<=190;d+=22){
      const p=pathAt(v,v.s+d);
      if(Math.hypot((p[0]-P.x)*.9,(p[1]-P.y))<r+24){want=0;if(!v.said){v.said=1.6;}break}
    }
  }
  if(v.hold&&v.stopAt!=null){
    const dist=v.stopAt-v.s;
    want=Math.min(want,dist<=2?0:Math.sqrt(2*420*dist));
  }
  v.spd+=clamp(want-v.spd,-760*dt,240*dt);
  v.s+=v.spd*dt;
  if(v.said>0)v.said-=dt;
  pathPlace(v);
  if(!v.cued){
    const dd=Math.hypot(v.x-P.x,v.y-P.y);
    if(dd<520&&v.spd>60){v.cued=true;if(v.kind==='scooter'||v.kind==='delivery')SFX.vroom();else if(!v.willYield&&!v.stream)SFX.horn()}
  }
  // 路口放行標記（通過人行穿越道）
  if(v.stream&&!v.passed){
    if(v.dy>.7&&v.y>384)v.passed=true; else if(v.dy<-.7&&v.y<146)v.passed=true; else if(Math.abs(v.dx)>.7&&(v.x<it.x0-70||v.x>it.x1+70))v.passed=true;
  }
  if(v.pair&&!v.pair.released&&v.s>v.cum[3]){v.pair.hold=false;v.pair.released=true}
  if(!P.dead&&P.inv<=0&&v.spd>35&&Math.abs(P.x-v.x)<v.hx+9+P.pad&&Math.abs(P.y-v.y)<v.hy+7){
    const dmg=v.dmg*clamp(v.spd/170,.8,1.4)*rnd(.9,1.1);
    const cause=v.blind?'blind':'turn';
    hurt(dmg,cause,{veh:1,fly:(P.x>=v.x?1:-1)*(120+dmg*2.5),down:1.6,h:75,shake:12});
  }
}

const redDur=it=>[5,7,9,11,12][it.zone]+rnd(-1,1);
const greenDur=it=>[7,6.6,6.2,6,5.8][it.zone];
const laneX=(it,n)=>it.x0+({SB1:60,SB2:135,NA:212,NB:287})[n];
const pRE=it=>{const x=laneX(it,'NB');return [[it.x1+620,366],[x+110,366],[x+52,360],[x+14,326],[x,284],[x,200],[x,-20]]};
const pLW=it=>{const x=laneX(it,'NA');return [[it.x0-620,FAR_E],[x-130,FAR_E],[x-60,FAR_E-10],[x-16,FAR_E-60],[x,400],[x,330],[x,240],[x,-20]]};
const pSR=it=>{const x=laneX(it,'SB1');return [[x,-20],[x,200],[x,290],[x-8,330],[x-44,364],[x-110,366],[it.x0-640,366]]};
const pSL=it=>{const x=laneX(it,'SB2');return [[x,-20],[x,420],[x+14,468],[x+70,FAR_E],[it.x1+640,FAR_E]]};
const pBL=it=>{const x=laneX(it,'NB');return [[it.x1+760,334],[x+250,334],[x-20,334],[x-60,322],[x-76,290],[x-76,200],[x-76,-20]]};

function yieldRoll(z,bonus){
  let p=[.95,.84,.66,.55,.45][z]+(P.vest>0?.22:0)+(P.tol>1?.22:0)-nightA()*.14+(bonus||0);
  return chance(clamp(p,.05,.97));
}
function stripClear(it){
  return !V.some(v=>v.inter===it.id&&v.stream&&!v.passed);
}
function mkHazards(it){
  const z=it.zone, hz=[];
  if(z===0){ if(chance(.55))hz.push({t:rnd(1,2.2),k:'RE',polite:true}); }
  else{
    if(chance([0,.65,.8,.88,.95][z]))hz.push({t:rnd(.6,2),k:'RE'});
    if(z>=2&&chance([0,0,.5,.6,.7][z]))hz.push({t:rnd(1.8,3.6),k:'RE'});
    if(z>=2&&chance(.5))hz.push({t:rnd(.8,3),k:'SR'});
    if(z>=3&&chance([0,0,0,.55,.75][z]))hz.push({t:rnd(.5,1.2),k:'BLIND'});
  }
  return hz;
}
function runHazard(it,h){
  const z=it.zone;
  if(h.k==='RE'){
    const kind=h.polite?'car':pickKind(z);
    mkPath(kind,pRE(it),rnd(170,215)+z*8,{inter:it.id,willYield:h.polite?true:yieldRoll(z)});
  }else if(h.k==='LW'){
    mkPath(pickKind(z),pLW(it),rnd(215,255)+z*8,{inter:it.id,willYield:yieldRoll(z,-.05)});
  }else if(h.k==='SR'){
    mkPath(chance(.6)?'car':'scooter',pSR(it),rnd(120,160),{inter:it.id,willYield:yieldRoll(z,-.05)});
  }else if(h.k==='BLIND'){
    const v1=mkPath('bus',pRE(it),150,{inter:it.id,willYield:true,hold:true,stopAt:0,blind:true});
    v1.stopAt=v1.cum[1];
    it.hz.push({t:rnd(2.1,2.5),k:'BLIND2',ref:v1});
  }else if(h.k==='BLIND2'){
    SFX.vroom();
    mkPath('scooter',pBL(it),300,{inter:it.id,willYield:false,blind:true,pair:h.ref});
  }
}
function updInter(it,dt){
  const near=Math.abs(P.x-it.cx)<1250;
  if(!near){ if(it.phase!=='idle'){it.phase='idle';V=V.filter(v=>v.inter!==it.id)} return }
  if(it.phase==='idle'){it.phase='red';it.t=rnd(2.5,redDur(it));it.flow=.2;it.hz=[]}
  it.t-=dt;
  if(it.phase==='red'){
    it.flow-=dt;
    if(it.flow<=0){spawnStream(it);it.flow=rnd(.8,1.6)}
    if(it.t<=0){it.phase='clear'}
  }else if(it.phase==='clear'){
    if(stripClear(it)){
      it.phase='green';it.t=greenDur(it);it.hz=mkHazards(it);SFX.green();
      for(const n of ['SB1','SB2']){
        if(chance(.7)){const v=mkPath(pickKind(it.zone),[[laneX(it,n),-20],[laneX(it,n),600]],200,{inter:it.id,queue:true,hold:true,stopAt:186});v.s=chance(.5)?0:20}
      }
    }
  }else if(it.phase==='green'||it.phase==='flash'){
    for(let i=it.hz.length-1;i>=0;i--){ const h=it.hz[i]; h.t-=dt; if(h.t<=0){it.hz.splice(i,1);if(it.phase==='green'||h.k==='BLIND2')runHazard(it,h)} }
    if(it.phase==='green'&&it.t<=0){it.phase='flash';it.t=3}
    else if(it.phase==='flash'&&it.t<=0){
      it.phase='red';it.t=redDur(it);it.flow=1;
      V.forEach(v=>{if(v.inter===it.id&&v.queue){v.hold=false;v.stream=true;v.cruise=230}});
    }
  }
}
function spawnStream(it){
  const z=it.zone, ln=pick(['SB1','SB2','NA','NB']), x=laneX(it,ln);
  if(V.some(v=>v.inter===it.id&&v.stream&&v.lane===ln&&v.s<170))return;
  let pts=ln[0]==='S'?[[x,-20],[x,600]]:[[x,590],[x,-20]];
  if(ln==='SB1'&&chance(.25))pts=pSR(it); else if(ln==='SB2'&&chance(.2))pts=pSL(it);
  mkPath(pickKind(z),pts,rnd(190,260)*(1+z*.04),{inter:it.id,stream:true,lane:ln,willYield:false});
}
const pedState=it=>it.phase==='green'?'green':it.phase==='flash'?'flash':'red';

/* ========== 玩家 ========== */
function solidAt(lane,x,pad){
  for(const o of world.obs){ if(o.solid&&o.lanes.includes(lane)&&Math.abs(x-o.x)<o.w/2+pad)return o }
  return null;
}
// 實心障礙是否擋住 (x,y)：以腳底 y 判斷
function solidBoxes(o){return o.parts?o.parts.map(p=>({cx:o.x+p.dx,hw:p.w/2})):[{cx:o.x,hw:o.w/2}]}
function solidBlock(x,y,pad){
  for(const o of world.obs){
    if(!o.solid||Math.abs(x-o.x)>=o.w/2+pad)continue;
    if(!o.ys.some(yy=>Math.abs(y-yy)<o.hh))continue;
    if(solidBoxes(o).some(b=>Math.abs(x-b.cx)<b.hw+pad))return o;
  }
  return null;
}
function updPlayer(dt){
  P.anim+=dt;
  if(P.inv>0)P.inv-=dt;
  if(P.spdT>0)P.spdT-=dt;
  if(P.vest>0)P.vest-=dt;
  if(P.fly){
    const f=P.fly;f.t+=dt;const k=f.t/f.dur;
    if(k>=1){P.fly=null;P.z=0;P.vz=0}
    else{P.x+=f.vx*dt*(1-k*.7);P.z=Math.sin(Math.PI*k)*f.h}
  }
  if(P.down>0&&!P.fly)P.down-=dt;
  const can=!P.dead&&P.down<=0&&!P.fly;
  const z=zoneOf(P.x);
  // 飢餓
  if(!P.dead){
    P.hp-=[.3,.36,.42,.5,.58][z]*dt;
    if(P.hp<=0){P.lastCause='hunger';die('hunger')}
  }
  if(P.jumpBuf>0)P.jumpBuf-=dt;
  if(edge.jump)P.jumpBuf=.16;
  const pad=10+P.pad;
  if(can){
    let dir=(keys.right?1:0)-(keys.left?1:0);
    if(G.auto&&!keys.left&&!keys.right){
      dir=1;
      const nit=world.inters.find(i=>i.x0-P.x>-4&&i.x0-P.x<46);
      if(nit&&!(nit.phase==='green'&&nit.t>3))dir=0;       // 自動走遇到紅燈會停
    }
    const sp=WALK*P.spdM*(P.spdT>0?1.25:1);
    P.vx=dir*sp;
    if(dir){P.face=dir;P.x+=P.vx*dt}
    // 上下微調（和左右一樣是連續移動）
    const dyk=(keys.down?1:0)-(keys.up?1:0);
    if(dyk){
      const ny=clamp(P.y+dyk*VY*P.spyM*dt,YMIN,YMAX);
      if(!solidBlock(P.x,ny,pad)&&!pedHit(P.x,ny)){P.y=ny}
      else if(!G.bumpT||G.time-G.bumpT>1.5){G.bumpT=G.time;SFX.deny()}
    }
    if(P.jumpBuf>0&&P.z===0){
      if(P.noJump){P.jumpBuf=0;if(!G.nojT||G.time-G.nojT>3){G.nojT=G.time;toast('推著嬰兒車，沒辦法跳','#ffd',1.4)}}
      else{P.vz=JV*P.jv;SFX.jump();P.jumpBuf=0}
    }
  }else P.vx=0;
  edge.up=edge.down=edge.jump=0;
  // 跳躍重力
  if(!P.fly){
    P.z+=P.vz*dt;
    if(P.z>0)P.vz-=GRAV*dt; else if(P.z<=0){if(P.vz<-200)SFX.land();P.z=0;P.vz=0}
  }
  P.lane=laneOfY(P.y);
  // 障礙（腳底碰到才算）
  for(const o of world.obs){
    if(Math.abs(P.x-o.x)>o.w/2+30)continue;
    if(!o.ys.some(yy=>Math.abs(P.y-yy)<o.hh))continue;
    if(o.solid){
      for(const b of solidBoxes(o)){ if(Math.abs(P.x-b.cx)<b.hw+pad)P.x=P.x<b.cx?b.cx-b.hw-pad:b.cx+b.hw+pad }
      continue;
    }
    if(!(Math.abs(P.x-o.x)<o.w/2+3+P.pad*.5))continue;
    if(o.h>0){
      if(P.z<o.h-8&&P.inv<=0&&!P.fly&&!P.dead){
        hurt((3+o.h*.22)*P.tripMul,'trip',{down:0,inv:1,sfx:SFX.trip,shake:7});
        ftext(P.x,P.y-92,'絆到了！','#ffd36a');
      }
    }else if(!o.done&&P.z<4&&Math.abs(P.x-o.x)<o.w/2-8&&!P.dead){
      if(o.type==='gap'||o.broken){o.done=true;hurt((o.type==='gap'?20:13)*P.tripMul,'manhole',{down:0,inv:1.2,sfx:SFX.trip,shake:8});toast('水溝蓋是壞的！','#ff9',1.8)}
      else if(!o.clank){o.clank=true;SFX.clank()}
    }
  }
  pedPush();
  // 零錢
  for(const c of world.coins){
    if(c.got||Math.abs(LY[c.lane]-P.y)>26)continue;
    if(Math.abs(c.x-P.x)<20){c.got=true;P.money+=c.v;P.coinsGot+=c.v;SFX.coin();ftext(c.x,LY[c.lane]-60,'+'+c.v,'#ffd84a')}
  }
  P.x=clamp(P.x,20,LEN-100);
}

/* ========== 規則：迷路、警察、紅綠燈、商店 ========== */
function updRules(dt){
  const z=zoneOf(P.x);
  // 警察：在有人行道的路段長時間走車道
  const blk=blockAt(P.x), it0=interAt(P.x,0);
  if(P.fineCd>0)P.fineCd-=dt;
  if(P.lane>=2&&blk&&blk.sw&&P.fineCd<=0){
    P.laneTime+=dt;
    if(P.laneTime>4&&!P.warned){P.warned=true;toast('行人別一直走在車道上！','#ffb347',2.4)}
    if(P.laneTime>8){
      const pay=Math.min(300,P.money);P.money-=pay;P.fines+=pay;
      P.laneTime=0;P.warned=false;P.fineCd=14;
      P.cop={x:P.x+110,t:3.2};SFX.fine();
      toast('警察開單：行人佔用車道，罰款 NT$300','#ff6a5a',3.4);
    }
  }else{P.laneTime=Math.max(0,P.laneTime-dt*1.5);if(P.laneTime<3)P.warned=false}
  if(P.cop){P.cop.t-=dt;if(P.cop.t<=0)P.cop=null}
  // 路口
  const cur=it0&&P.x>it0.x0+40&&P.x<it0.x1-40?it0:null;
  if(cur&&!P.curInter){
    P.enterPhase=cur.phase;
    if(cur.phase==='red'||cur.phase==='clear')toast('行人紅燈！快回去等！','#ff6a5a',2.4);
    else if(cur.phase==='flash')toast('綠燈閃爍，不要再開始穿越。','#ffd24a',2.2);
  }
  if(!cur&&P.curInter){
    const it=P.curInter;
    if((P.enterPhase==='red'||P.enterPhase==='clear')&&it.cop&&!it.fined){
      it.fined=true;const pay=Math.min(300,P.money);P.fines+=pay;P.money-=pay;SFX.fine();
      toast('闖紅燈被警察攔下：罰款 NT$'+pay,'#ff6a5a',3.4);
    }
  }
  P.curInter=cur;
  // 等紅燈計時
  const nit=world.inters.find(i=>i.phase!=='idle'&&P.x<i.x0+10&&i.x0-P.x<200);
  if(nit&&(nit.phase==='red'||nit.phase==='clear')&&Math.abs(P.vx)<5)P.waitT+=dt;
  // 區域橫幅
  const zi=Math.floor(P.x/ZLEN);
  if(zi>G.zoneShown&&zi<5){G.zoneShown=zi;G.banner={t:3.4,z:zi}}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  // 提示
  const h=world.hints[G.hintI];
  if(h&&P.x>=h.x){toast(h.t,'#fff',4);G.hintI++}
  // 商店
  G.nearShop=null;
  if(P.lane<2&&!P.dead&&P.down<=0)for(const s of world.shops){ if(Math.abs(P.x-s.x)<105){G.nearShop=s;break} }
  if(edge.act){
    edge.act=0;
    if(G.nearShop)openShop(G.nearShop);
  }
  // 回到家
  if(P.x>=LEN-105&&!P.dead){G.state='won';G.ending=1.2;SFX.win()}
}

/* ========== 商店 ========== */
function openShop(s){
  G.state='shop';G.shopDef=s;
  const d=s.def;
  $('shopName').textContent=d.name;$('shopSay').textContent=d.say;
  renderShop();
  $('shop').hidden=false;SFX.tick();
}
function renderShop(){
  const d=G.shopDef.def;
  $('shopWallet').textContent='錢包 NT$'+P.money;
  const box=$('shopItems');box.innerHTML='';
  d.items.forEach((it,i)=>{
    const row=document.createElement('div');row.className='item';
    row.innerHTML='<div class="n">'+it.n+'　<span style="color:var(--yel)">NT$'+it.p+'</span></div><div class="d">'+it.d+'</div>';
    const b=document.createElement('button');b.className='btn';b.textContent='買';b.disabled=P.money<it.p;
    b.onclick=()=>buy(it);row.appendChild(b);box.appendChild(row);
  });
}
function buy(it){
  if(P.money<it.p){SFX.deny();return}
  P.money-=it.p;
  if(it.hp)P.hp=Math.min(P.maxHp,P.hp+it.hp);
  if(it.vest)P.vest=it.vest;
  if(it.spd)P.spdT=it.spd;
  SFX.buy();renderShop();
  ftext(P.x,P.y-80,it.hp?'+'+it.hp:'OK','#7dffa8');
}
function closeShop(){
  if(G.state!=='shop')return;
  G.state='play';$('shop').hidden=true;G.shopDef=null;
}

/* ========== 主更新 ========== */
function updateGame(dt){
  if(G.state==='dying'||G.state==='won'){
    G.ending-=dt;
    cam.shake=Math.max(0,cam.shake-dt*30);
    if(G.ending<=0)finishEnd(G.state==='won');
    // 讓畫面繼續動一下
    updPlayerAnim(dt);
    return;
  }
  if(G.state!=='play')return;
  G.time+=dt;
  updPlayer(dt);
  if(G.state!=='play')return;
  updRules(dt);
  spawnTraffic(dt);
  updPeople(dt);
  for(const it of world.inters)updInter(it,dt);
  const itOf=id=>world.inters[id];
  for(let i=V.length-1;i>=0;i--){
    const v=V[i];
    if(v.mode==='lane'){updLane(v,dt);if(v.dead)V.splice(i,1);else if(Math.abs(v.x-P.x)>1500||(v.decor&&(v.x<cam.x-400||v.x>cam.x+VW+400)))V.splice(i,1)}
    else{
      const it=itOf(v.inter);
      updPath(v,dt,it);
      if(v.s>=v.L||it.phase==='idle')V.splice(i,1);
    }
  }
  // 浮動文字、橫幅
  for(let i=FX.length-1;i>=0;i--){FX[i].t-=dt;FX[i].y-=26*dt;if(FX[i].t<=0)FX.splice(i,1)}
  for(let i=G.toasts.length-1;i>=0;i--){G.toasts[i].t-=dt;if(G.toasts[i].t<=0)G.toasts.splice(i,1)}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*28);
  if(G.flash>0)G.flash-=dt;
  cam.x=clamp(P.x-260,0,LEN-VW+120);
}
function updPlayerAnim(dt){
  P.anim+=dt;
  if(P.fly){P.fly.t+=dt;const k=P.fly.t/P.fly.dur;if(k>=1){P.fly=null;P.z=0}else{P.x+=P.fly.vx*dt*(1-k*.7);P.z=Math.sin(Math.PI*k)*P.fly.h}}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*28);
  if(G.flash>0)G.flash-=dt;
  for(let i=FX.length-1;i>=0;i--){FX[i].t-=dt;FX[i].y-=26*dt;if(FX[i].t<=0)FX.splice(i,1)}
  cam.x=clamp(P.x-260,0,LEN-VW+120);
}

/* ---------- 開局：圍欄、抽菸阿伯、垃圾車、百元鈔 ---------- */
function placeFences(){
  world.blocks.forEach(b=>b.bld.forEach(bd=>{
    bd.fenced=bd.x>1400&&chance(.28);
    if(!bd.fenced)return;
    bd.fstyle=ri(0,2);
    const a=addOb('fence',bd.x+30,0,{style:bd.fstyle}), c=addOb('fence',bd.x+bd.w-30,0,{style:bd.fstyle});
    if(!a&&!c)bd.fenced=false;
  }));
}
function placeEvents(){
  // 垃圾車（後段固定出現兩次）
  for(const base of [30400,38600]){
    for(let dx=0;dx<1400;dx+=60){
      const x=base+dx;
      if(interAt(x,320))continue;
      if(addOb('garbage',x,2))break;
    }
  }
}
function initPeople(){
  const w=world;
  w.peds=[];w.smokers=[];
  // 抽菸阿伯
  for(const b of w.blocks){
    if(!b.sw||b.x0<2600||!chance(.34))continue;
    const x=rnd(b.x0+160,b.x1-160),lane=chance(.55)?1:0;
    if(w.obs.some(o=>o.solid&&o.lanes.includes(lane)&&Math.abs(o.x-x)<o.w/2+40))continue;
    if(w.shops.some(s=>Math.abs(s.x-x)<180))continue;
    if(w.smokers.some(s=>Math.abs(s.x-x)<500))continue;
    w.smokers.push({x,lane,y:LY[lane],dir:chance(.5)?1:-1,seed:Math.random()*50});
  }
  // 唯一一張百元鈔（在慢車道，被車風吹著跑）
  w.bill={x:15600,y:LY[2],vx:0,vy:0,ang:.3,got:false,fl:0,seen:false};
  // 快車道上的紅包（誘惑你去撿）
  w.envs=[];
  for(const bx of [17400,33300]){
    let x=bx;while(interAt(x,260))x+=120;
    w.envs.push({x,y:FAR_W-2,got:false,ph:Math.random()*6});
  }
  // 提示
  const hs=w.hints;
  hs.push({x:SCHOOL[0]-260,t:'前面是放學時間。學生很多，也有人騎腳踏車。'});
  if(w.smokers[0])hs.push({x:w.smokers[0].x-520,t:'前面有人在抽菸。離他遠一點，不然會一直被菸燻到。'});
  hs.push({x:w.bill.x-760,t:'慢車道上好像有一張百元鈔，被車風吹得到處跑……'});
  const g=w.obs.find(o=>o.type==='garbage');
  if(g)hs.push({x:g.x-900,t:'聽到垃圾車的音樂了。居民會一個接一個出來倒垃圾。'});
  hs.sort((a,b)=>a.x-b.x);
  P.ghost=null;G.spawn.ped=1;G.jT=0;
}

function pedColors(type){
  if(type==='elder')return {shirt:pick(['#a9b8a0','#c9b79a','#9fb0c4','#c7a5a5']),pants:pick(['#3a3a3a','#5a4a3a']),hair:'#e1e1e4',cane:chance(.6),hunch:1,glasses:chance(.5)};
  if(type==='kid')return {shirt:pick(PCOL.kidShirt),pants:pick(['#3a5a9a','#2a2a40','#7a4a8a']),hair:pick(PCOL.hair),cap:'#f2c21c',bag:'back',bagc:pick(['#e0432e','#2f78c4','#3aa05a']),s:.72};
  if(type==='student')return {shirt:'#f2f2f2',pants:pick(['#233a6a','#2a2a3a','#5a6a4a']),hair:pick(PCOL.hair),bag:'back',bagc:pick(['#2f4a8a','#333','#7a2f2f']),uniform:1,skirt:chance(.4),s:.92};
  return {shirt:pick(PCOL.shirt),pants:pick(PCOL.pants),hair:pick(PCOL.hair),skirt:chance(.22),bag:chance(.3)?'back':null,bagc:'#444'};
}
function spawnPed(school,xOverride,dirOverride){
  const dir=dirOverride||(chance(.55)?-1:1);
  const x=xOverride!=null?xOverride:(dir<0?cam.x+VW+60+rnd(0,160):cam.x-70-rnd(0,120));
  const blk=blockAt(x);
  if(!blk||interAt(x,70))return null;
  const lane=blk.sw?(chance(.42)?0:1):0;
  if(solidAt(lane,x,34))return null;
  const type=school?roulette([['kid',.3],['student',.42],['adult',.14],['elder',.14]]):roulette([['adult',.58],['elder',.24],['kid',.1],['student',.08]]);
  const d=PEDDEF[type];
  const p=Object.assign({type,x,lane,y:LY[lane],dir,sp:rnd(d.sp[0],d.sp[1]),hw:d.hw,ph:Math.random()*6,moving:1,turnCd:0,stopT:0,hidden:false},pedColors(type));
  world.peds.push(p);return p;
}
function pedAtLane(lane,x){
  for(const p of world.peds){ if(!p.hidden&&Math.abs(p.y-LY[lane])<24&&Math.abs(p.x-x)<p.hw+14)return p }
  return null;
}
// 腳對腳：玩家與路人的腳底距離夠近才算擋住；自己微調上下就算閃過
function pedHit(x,y){
  for(const p of world.peds){ if(!p.hidden&&Math.abs(p.y-y)<13&&Math.abs(p.x-x)<p.hw+11+P.pad)return p }
  return null;
}
function pedPush(){
  if(P.fly||P.dead)return;
  for(const p of world.peds){
    if(p.hidden||Math.abs(P.y-p.y)>=13||Math.abs(P.x-p.x)>=p.hw+11+P.pad)continue;
    P.x=P.x<p.x?p.x-p.hw-11-P.pad:p.x+p.hw+11+P.pad;
    if(!G.pedT||G.time-G.pedT>5){G.pedT=G.time;toast('前面有人，往旁邊閃一下','#ffd',1.6)}
  }
}
function updDumper(p,dt){
  if(p.st==='hide'){p.t-=dt;p.hidden=true;p.moving=0;if(p.t<=0){p.hidden=false;p.st='go';p.x=p.dx;p.y=Y_ARC0+14;p.has=true}return}
  p.hidden=false;
  if(p.st==='go'||p.st==='back'){
    const tx=p.st==='go'?p.tx:p.dx, ty=p.st==='go'?p.ty:Y_ARC0+14;
    const ddx=tx-p.x, ddy=ty-p.y, d=Math.hypot(ddx,ddy);
    if(d<4){
      if(p.st==='go'){p.st='throw';p.t=0;p.moving=0}else{p.st='hide';p.t=rnd(1.2,5);p.hidden=true}
    }else{
      p.x+=ddx/d*p.sp*dt;p.y+=ddy/d*p.sp*dt;
      p.dir=ddx>=0?1:-1;p.ph+=dt*p.sp*.2;p.moving=1;
    }
  }else if(p.st==='throw'){
    p.t+=dt;if(p.t>.9){p.st='back';p.has=false;SFX.land()}
  }
}
function spawnDumpers(o){
  o.dumpers=true;
  const n=ri(10,13);
  for(let i=0;i<n;i++){
    const type=roulette([['adult',.5],['elder',.3],['kid',.08],['student',.12]]);
    const d=PEDDEF[type];
    const p=Object.assign({type,dump:true,ob:o,x:o.x,y:Y_ARC0+14,lane:1,dir:1,sp:rnd(d.sp[0],d.sp[1])*1.25+12,hw:d.hw,ph:Math.random()*6,moving:0,
      st:'hide',t:rnd(0,5),hidden:true,has:false,
      dx:o.x+rnd(-360,300),tx:o.x-rnd(112,150),ty:LY[2]+rnd(8,22)},pedColors(type));
    p.bag='trash';
    world.peds.push(p);
  }
}

/* ---------- 每幀更新 ---------- */
function updPeople(dt){
  const sp=G.spawn, z=zoneOf(P.x);
  const school=P.x>SCHOOL[0]&&P.x<SCHOOL[1];
  // 一般路人
  sp.ped-=dt;
  const cnt=world.peds.reduce((n,p)=>n+(p.dump?0:1),0);
  const target=school?15:[5,8,6,5,3][z];
  if(sp.ped<=0&&cnt<target){
    sp.ped=school?rnd(.35,.9):rnd(1.2,2.8);
    const first=spawnPed(school);
    if(first&&school&&chance(.5)){const q=spawnPed(school,first.x+first.dir*-1*rnd(26,44)*-1,first.dir);if(q)q.sp=first.sp*rnd(.92,1.06)}
  }
  // 垃圾車：靠近時居民出來倒垃圾
  let gNear=null;
  for(const o of world.obs){
    if(o.type!=='garbage')continue;
    if(!o.dumpers&&Math.abs(o.x-P.x)<1500)spawnDumpers(o);
    if(Math.abs(o.x-P.x)<900)gNear=o;
  }
  Music.duck=gNear?.4:1;
  if(gNear&&G.time>G.jT){
    G.jT=G.time+7.5;
    [76,75,76,75,76,71,74,72,69].forEach((m,i)=>tone(mf(m),.22,'square',.04,0,i*.2));
  }
  // 移動
  for(let i=world.peds.length-1;i>=0;i--){
    const p=world.peds[i];
    if(p.dump){updDumper(p,dt);continue}
    p.turnCd-=dt;
    if(p.stopT>0){p.stopT-=dt;p.moving=0}
    else{
      p.moving=1;
      const ax=p.x+p.dir*(p.hw+16);
      if(p.turnCd<=0){
        let turn=false;
        for(const o of world.obs){
          if(!o.solid||!o.lanes.includes(p.lane)||Math.abs(o.x-p.x)>260)continue;
          if(Math.abs(ax-o.x)<o.w/2+4){turn=true;break}
        }
        if(!turn&&interAt(ax,22))turn=true;
        if(turn){p.dir*=-1;p.turnCd=1.2}
      }
      if(p.type==='student'&&school&&chance(dt*.12))p.stopT=rnd(1.5,3.5);
      p.x+=p.dir*p.sp*dt;p.ph+=dt*p.sp*.2;
    }
    p.off=p.off||0;
    if(P.avoid&&Math.abs(p.x-P.x)<130&&Math.abs(p.y-P.y)<42){p.off=clamp(p.off+(p.y>=P.y?1:-1)*dt*130,-46,46)}
    else p.off*=Math.max(0,1-dt*.6);
    p.y+=clamp(clamp(LY[p.lane]+p.off,YMIN,YMAX)-p.y,-70*dt,70*dt);
    if(p.x<cam.x-760||p.x>cam.x+VW+760)world.peds.splice(i,1);
  }
  // 抽菸阿伯：近距離持續小幅扣血
  let inSmoke=false;
  if(!P.dead){
    for(const s of world.smokers){
      if(Math.abs(s.x-P.x)>110)continue;
      if(Math.hypot(P.x-s.x,(P.y-s.y)*.8)<86){inSmoke=true;break}
    }
  }
  if(inSmoke){
    P.hp-=1.7*dt;P.smokeT=(P.smokeT||0)+dt;
    if(P.smokeT>1){P.smokeT=0;ftext(P.x,P.y-86,'咳！','#b9d3a0')}
    if(!G.smokeToast){G.smokeToast=1;toast('二手菸！快離開，血量會一直掉','#d6e8b8',2.4)}
    if(P.hp<=0){P.lastCause='smoke';die('smoke')}
  }
  P.smokeA=clamp((P.smokeA||0)+(inSmoke?dt*1.8:-dt*1.2),0,1);
  // 放學時段提示（離開）
  if(school!==!!G.inSchool){
    G.inSchool=school;
    if(school)toast('放學時間：路上全是學生','#a8dcff',3);
    else if(P.x>SCHOOL[1])toast('學生人潮散去了','#ddd',2);
  }
  // 紅包與鬼
  for(const e of world.envs){
    if(e.got||P.dead)continue;
    if(Math.abs(e.x-P.x)<24&&Math.abs(e.y-P.y)<28&&P.z<30){
      e.got=true;SFX.coin();
      const kind=chance(.5)?'f':'m';
      P.ghost={kind,t:30,tick:1,x:P.x-P.face*70,y:P.y-8};
      ftext(P.x,P.y-80,'冥婚紅包！','#c9d6ff');
      toast('撿到紅包……'+(kind==='f'?'有個女鬼':'有個男鬼')+'跟上來了','#c9d6ff',3);
      setTimeout(()=>SFX.ghost(),350);
    }
  }
  const gh=P.ghost;
  if(gh&&!P.dead){
    gh.t-=dt;gh.tick-=dt;
    const tx=P.x-P.face*52, ty=P.y-6+Math.sin(G.time*2.3)*5;
    gh.x+=(tx-gh.x)*Math.min(1,dt*3.2);gh.y+=(ty-gh.y)*Math.min(1,dt*3.2);
    if(gh.tick<=0){
      gh.tick+=1;P.hp-=2;SFX.ghost();ftext(P.x,P.y-92,'-2','#9fc4ff');
      if(P.hp<=0){P.lastCause='ghost';die('ghost')}
    }
    if(gh.t<=0){P.ghost=null;toast('鬼走了……下次別亂撿紅包','#ddd',2.4)}
  }
  // 百元鈔：被車風吹著跑
  const b=world.bill;
  if(!b.got){
    for(const v of V){
      if(v.mode!=='lane'||v.decor||Math.abs(v.vx)<40)continue;
      if(Math.abs(v.y-b.y)<46&&Math.abs(v.x-b.x)<v.hx+30){
        b.vx+=(v.vx*.85-b.vx)*Math.min(1,dt*9);
        b.vy+=rnd(-170,170)*dt*5;
        b.fl=1;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.vx*=Math.max(0,1-dt*1.5);b.vy*=Math.max(0,1-dt*2.2);
    b.y=clamp(b.y,LY[2]-34,LY[2]+30);
    b.x=clamp(b.x,12000,LEN-300);
    b.fl=Math.max(0,b.fl-dt*1.3);
    b.ang+=(b.vx*.004+Math.sin(G.time*13)*b.fl*.6)*dt*6;
    if(!b.seen&&Math.abs(b.x-P.x)<520){b.seen=true;toast('慢車道上有一張 100 元！但車子很多……','#ffb0a0',3)}
    if(!P.dead&&P.z<34&&Math.abs(b.x-P.x)<24&&Math.abs(b.y-P.y)<28){
      b.got=true;P.money+=100;P.coinsGot+=100;SFX.coin();SFX.buy();
      ftext(P.x,P.y-70,'+100','#ff6a5a');toast('撿到那張 100 元了！','#ffd24a',2.2);
    }
  }
}

/* ========== 繪製：人 ========== */
function drawPerson(x,y,dir,o){
  const s=o.s||1,ph=o.ph||0,mv=o.moving?1:0,sw=mv?Math.sin(ph)*5:0,skin=o.skin||'#f2c9a0';
  ctx.save();ctx.translate(x,y);
  shadow(0,1,13*s,4*s,.35);
  ctx.scale(dir*s,s);ctx.lineCap='round';
  if(o.skirt&&!o.belly){ctx.strokeStyle=skin;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-3,-20);ctx.lineTo(-3+sw,-5);ctx.moveTo(3,-20);ctx.lineTo(3-sw,-5);ctx.stroke()}
  else{ctx.strokeStyle=o.pants||'#334';ctx.lineWidth=6.5;ctx.beginPath();ctx.moveTo(-3,-23);ctx.lineTo(-3+sw,-5);ctx.moveTo(3,-23);ctx.lineTo(3-sw,-5);ctx.stroke()}
  RR(-8+sw,-5,9,5,2.5,o.shoe||'#f0f0f0',true);RR(-1-sw,-5,9,5,2.5,o.shoe||'#f0f0f0',true);
  ctx.save();ctx.translate(0,-22);ctx.rotate((o.hunch||0)*.17);ctx.translate(0,22);
  if(o.bag==='back')RR(-18,-49,11,24,4,o.bagc||'#444',true);
  RR(-9,-51,18,30,5,o.shirt||'#4f7fc0',true);
  if(o.skirt&&!o.belly)POLY([[-9,-28],[9,-28],[12,-14],[-12,-14]],o.pants||'#334');
  if(o.uniform){R(-3,-51,6,7,'#fff',false);ctx.fillStyle='#233a6a';ctx.fillRect(-1,-51,2,10)}
  if(o.belly){ctx.fillStyle=mix(o.shirt,'#ffffff',.2);ctx.beginPath();ctx.ellipse(5,-32,9,10,0,0,6.3);ctx.fill();ctx.strokeStyle='rgba(24,16,12,.8)';ctx.lineWidth=1.2;ctx.stroke()}
  // 手臂
  const ax=3-sw*.6, ay=-28;
  if(o.smoking){
    ctx.strokeStyle=skin;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(2,-45);ctx.lineTo(10,-38);ctx.lineTo(8,-55);ctx.stroke();
  }else{
    ctx.strokeStyle=o.shirt;ctx.lineWidth=5.5;ctx.beginPath();ctx.moveTo(1,-46);ctx.lineTo(ax,ay);ctx.stroke();C(ax,ay-1,3,skin);
  }
  if(o.bag==='trash'&&o.has){
    ctx.strokeStyle='#cfd3d6';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+1,ay+6);ctx.stroke();
    C(ax+1,ay+13,7,'#2a2a2e',true);R(ax-1,ay+5,4,3,'#2a2a2e',false);
  }
  // 頭
  C(2,-60,8.6,skin,true);
  ctx.fillStyle=o.hair||'#222';ctx.beginPath();ctx.arc(1,-62,9.2,Math.PI,0);ctx.fill();
  if(!o.cap&&o.type!=='elder'){ctx.beginPath();ctx.moveTo(-8,-62);ctx.quadraticCurveTo(-11,-52,-6,-52);ctx.lineTo(-4,-60);ctx.fill()}
  if(o.type==='elder'){ctx.beginPath();ctx.arc(1,-63,8,Math.PI*1.05,Math.PI*1.7);ctx.fill()}
  if(o.cap){ctx.fillStyle=o.cap;ctx.beginPath();ctx.arc(1,-63,9.8,Math.PI,0);ctx.fill();R(4,-64,12,3,o.cap,false);ctx.strokeStyle='rgba(24,16,12,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(1,-63,9.8,Math.PI,0);ctx.stroke()}
  C(6,-60,1.4,'#1c1c20');
  if(o.glasses){ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(6,-60,3.2,0,6.3);ctx.stroke()}
  if(o.smoking){R(7,-57,7,2,'#f4f4f0',false);C(14.5,-56,1.5,'#ff6a2a')}
  ctx.restore();
  if(o.cane){ctx.strokeStyle='#6b4a2a';ctx.lineWidth=2.6;ctx.beginPath();ctx.moveTo(10,-27);ctx.lineTo(13,0);ctx.stroke();ctx.beginPath();ctx.moveTo(8,-28);ctx.lineTo(12,-28);ctx.stroke()}
  ctx.restore();
}
function drawPed(p){
  drawPerson(p.x-cam.x,p.y,p.dir,p);
  if(p.dump&&p.st==='throw'&&p.has!==undefined){
    const k=clamp(p.t/.7,0,1),o=p.ob,hx=p.x-cam.x+p.dir*8,hy=p.y-34,tx=o.x-112-cam.x,ty=LY[2]-60;
    if(p.t<.7){
      const bx=hx+(tx-hx)*k, by=hy+(ty-hy)*k-Math.sin(k*Math.PI)*30;
      C(bx,by,7,'#2a2a2e',true);
    }
  }
}
function drawSmoker(s){
  const x=s.x-cam.x,y=s.y,t=G.time+s.seed;

  const g=ctx.createRadialGradient(x,y-20,6,x,y-20,92);

  drawPerson(x,y,s.dir,{shirt:'#ece8da',pants:'#5b6a7a',hair:'#8a8a8e',skin:'#e8b88c',belly:1,smoking:1,s:1.02,shoe:'#8a7a5a',glasses:0,moving:0,hunch:0});
  for(let i=0;i<7;i++){

}

function drawGhost(gh){
  const x=gh.x-cam.x,y=gh.y,f=gh.kind==='f',t=G.time;
  const fade=Math.min(1,gh.t/1.5);
  ctx.save();ctx.globalAlpha=(.62+.12*Math.sin(t*5))*fade;
  const gl=ctx.createRadialGradient(x,y-40,4,x,y-40,60);gl.addColorStop(0,'rgba(150,190,255,.38)');gl.addColorStop(1,'rgba(150,190,255,0)');
  ctx.fillStyle=gl;ctx.fillRect(x-62,y-100,124,124);
  const dir=Math.sign(P.x-gh.x)||1; // 面向玩家
  ctx.translate(x,y);ctx.scale(dir,1);
  // 長袍（下擺飄動）
  const robe=f?'#eef2fa':'#586a8c';
  ctx.beginPath();ctx.moveTo(-12,-52);ctx.quadraticCurveTo(-18,-20,-16,-2);
  for(let i=0;i<=4;i++){ctx.lineTo(-16+i*8,-2+((i%2)?7:0)+Math.sin(t*6+i)*2)}
  ctx.quadraticCurveTo(18,-20,12,-52);ctx.closePath();
  const gr=ctx.createLinearGradient(0,-52,0,6);gr.addColorStop(0,robe);gr.addColorStop(1,mix(robe,'#9fb4e8',.5));
  ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='rgba(30,40,70,.6)';ctx.lineWidth=1.2;ctx.stroke();
  if(!f){R(-4,-48,8,30,'#b3221c',false);}
  // 手臂向前伸
  ctx.strokeStyle=robe;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(8,-46);ctx.lineTo(24,-40+Math.sin(t*4)*3);ctx.stroke();
  C(25,-40+Math.sin(t*4)*3,3.2,'#dfe8f4');
  // 頭
  if(f){
    ctx.fillStyle='#14141c';ctx.beginPath();ctx.ellipse(0,-56,13,15,0,0,6.3);ctx.fill();

}

/* ========== 實體排序繪製 ========== */
function drawEntities(){
  const L=[];

  for(const b of world.blocks){
    if(b.x1-cam.x<-20||b.x0-cam.x>VW+20)continue;
    for(const bd of b.bld){ if(bd.x-cam.x>-30&&bd.x-cam.x<VW+30)L.push({y:Y_ARC1,f:()=>drawPillar(bd.x-cam.x)}) }
  }
  for(const s of world.shops)if(vis(s.x))L.push({y:Y_ARC1-6,f:()=>drawShopFront(s)});
  for(const o of world.obs){
    if(!vis(o.x,320))continue;
    const Y=o.ys[0];
    L.push({y:o.flat?Y-120:Y+(o.type==='carP'?8:0),f:()=>drawOb(o,o.x-cam.x,Y)});
  }
  for(const e of world.envs)if(!e.got&&vis(e.x,200))L.push({y:e.y,f:()=>drawEnvelope(e)});
  if(P.ghost)L.push({y:P.y-1,f:()=>drawGhost(P.ghost)});
  for(const p of world.peds)if(!p.hidden&&vis(p.x,200))L.push({y:p.y,f:()=>drawPed(p)});
  for(const s of world.smokers)if(vis(s.x,200))L.push({y:s.y,f:()=>drawSmoker(s)});
  if(world.bill&&!world.bill.got&&vis(world.bill.x,200))L.push({y:world.bill.y,f:()=>drawBill(world.bill)});
  for(const c of world.coins){
    if(c.got||!vis(c.x))continue;
    L.push({y:LY[c.lane]-1,f:()=>{
      const x=c.x-cam.x,Y=LY[c.lane]-16-Math.abs(Math.sin(G.time*3+c.ph))*5,k=Math.abs(Math.cos(G.time*3+c.ph));
      shadow(x,LY[c.lane]+1,9,3,.3);
      ctx.save();ctx.translate(x,Y);ctx.scale(.35+.65*k,1);
      C(0,0,10,c.v>=100?'#e24a3a':c.v>=50?'#f2b21c':'#d7d8da',true);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(0,0,7,0,6.3);ctx.stroke();
      ctx.restore();T(String(c.v>=100?'百':c.v),x,Y,c.v>=100?10:9,'#3a2a08','center',900);
    }});
  }
  for(const it of world.inters){
    if(it.x1-cam.x<-80||it.x0-cam.x>VW+80)continue;

    if(it.cop)L.push({y:Y_ARC1+30,f:()=>drawCop(it.x0-cam.x-62,Y_ARC1+30)});
  }
  for(const v of V){
    if(v.x-cam.x<-260||v.x-cam.x>VW+260)continue;
    L.push({y:v.mode==='path'&&Math.abs(v.dy)>=Math.abs(v.dx)?v.y+v.hy*.6:v.y,f:()=>drawVehicle(v)});
  }
  if(P.cop)L.push({y:LY[1]+2,f:()=>drawCop(P.cop.x-cam.x,LY[1]+2)});
  L.push({y:P.y+.5,f:drawPlayer});
  L.sort((a,b)=>a.y-b.y);
  for(const e of L)e.f();
}

/* ========== 電線與警示 ========== */
function drawWires(){
  const poles=world.obs.filter(o=>o.type==='pole'&&o.x-cam.x>-900&&o.x-cam.x<VW+900);
  ctx.lineWidth=1.6;
  for(let i=0;i<poles.length-1;i++){
    const a=poles[i],b=poles[i+1];if(b.x-a.x>1100)continue;
    const ya=LY[1]-164,xa=a.x-cam.x,xb=b.x-cam.x;
    for(let k=-1;k<=1;k++){
      ctx.strokeStyle='rgba(20,18,16,.8)';ctx.beginPath();ctx.moveTo(xa+k*11,ya);
      ctx.quadraticCurveTo((xa+xb)/2+k*11,ya+34+k*3,xb+k*11,ya);ctx.stroke();
    }
  }
  for(const it of world.inters){
    const sx=it.x0-cam.x;if(sx<-400||sx>VW+400)continue;
    ctx.strokeStyle='rgba(20,18,16,.8)';ctx.beginPath();ctx.moveTo(sx-24,110);ctx.quadraticCurveTo(sx+170,150,sx+364,110);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx-24,118);ctx.quadraticCurveTo(sx+170,156,sx+364,118);ctx.stroke();
  }
}
function drawOverhead(){
  drawWires();
  const t=G.time;
  for(const v of V){
    if(v.decor||(v.kind!=='scooter'&&v.kind!=='delivery'&&v.kind!=='car'&&v.kind!=='bike'))continue;
    const dir=v.mode==='lane'?v.dir:Math.sign(v.dx||0);
    const sx=v.x-cam.x;
    if(v.mode==='lane'&&Math.abs(v.vx)<20)continue;
    const wy=clamp(v.y-40,Y0+30,Y0+380);
    if(sx<-30&&sx>-520&&dir>0)warnArrow(12,wy,1,t);
    else if(sx>VW+30&&sx<VW+480&&dir<0)warnArrow(VW-12,wy,-1,t);
  }
}
function warnArrow(x,y,dir,t){
  const k=.55+.45*Math.abs(Math.sin(t*9));
  ctx.save();ctx.globalAlpha=k;
  const pts=dir>0?[[x+20,y-16],[x-4,y],[x+20,y+16]]:[[x-20,y-16],[x+4,y],[x-20,y+16]];
  POLY(pts,dir>0?'#ff4a3a':'#ffb020');
  ctx.restore();
  T('!',x+(dir>0?12:-12),y,16,'#fff','center',900);
}

/* ========== 夜色與光影 ========== */
function drawNight(){
  const na=nightA(),t=todT();
  if(t>.05){ctx.fillStyle='rgba(255,150,70,'+(Math.sin(clamp(t*1.9,0,Math.PI))*.1)+')';ctx.fillRect(0,Y0-10,W,H)}
  if(na<.02)return;
  ctx.fillStyle='rgba(8,12,40,'+na+')';ctx.fillRect(0,Y0-10,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const k=na/.62;
  const glow=(x,y,r,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,214,130,'+a+')');g.addColorStop(1,'rgba(255,214,130,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)};
  for(const o of world.obs){
    if(o.type!=='pole'||o.x-cam.x<-200||o.x-cam.x>VW+200)continue;
    glow(o.x-cam.x,LY[1]-160,150,.34*k);glow(o.x-cam.x,LY[1]-10,76,.2*k);
  }
  for(const s of world.shops){const x=s.x-cam.x;if(x>-200&&x<VW+200){glow(x,Y_FACE+40,170,.3*k);glow(x,Y_ARC1-10,110,.16*k)}}
  for(const it of world.inters){
    const x=it.x0-cam.x;if(x<-400||x>VW+400)continue;
    glow(x-22,Y_SW1-90,60,.3*k);glow(x+362,Y_SW1-90,60,.3*k);
  }
  for(const v of V){
    const x=v.x-cam.x;if(x<-200||x>VW+200)continue;
    if(v.mode==='lane'&&Math.abs(v.vx)<10&&!v.decor)continue;
    const dir=v.mode==='lane'?v.dir:(v.dx>=0?1:-1);
    if(v.mode==='path'&&Math.abs(v.dy)>Math.abs(v.dx)){if(v.dy>0)glow(x,v.y+v.hy+20,80,.28*k);continue}
    glow(x+dir*(v.len/2+34),v.y-14,70,.32*k);
  }
  for(const b of world.blocks){if(b.x1-cam.x>0&&b.x0-cam.x<VW)drawBlockLitWindows(b)}
  ctx.restore();
}

/* ========== HUD ========== */
function heart(x,y,s,c){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s,y-s*.5,x-s*.3,y-s*.9,x,y-s*.3);ctx.bezierCurveTo(x+s*.3,y-s*.9,x+s,y-s*.5,x,y+s*.35+s*.55);ctx.fillStyle=c;ctx.fill()}
function panel(x,y,w,h){RR(x,y,w,h,9,'rgba(20,14,11,.74)',false);ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;RRpath(x+.5,y+.5,w-1,h-1,9);ctx.stroke()}

function drawHUD(){

  panel(10,10,230,66);

  const hpc=P.hp>P.maxHp*.5?'#35c46f':P.hp>P.maxHp*.25?'#f2b21c':'#e8402f';

  C(30,54,9,'#f2b21c',true);T('$',30,54,11,'#5a3a00','center',900);
  T('NT$ '+P.money,46,54,17,'#ffd84a','left',900);
  if(P.vest>0){RR(150,45,72,17,5,'#c9f23a',false);T('背心 '+Math.ceil(P.vest)+'s',186,53.5,10,'#223','center',900)}
  else if(P.spdT>0)T('咖啡 '+Math.ceil(P.spdT)+'s',222,54,10,'#ffb','right',700);
  const z=zoneOf(P.x);
  panel(W-226,10,216,48);
  T(ZONES[z].name,W-216,26,16,'#ffd84a','left',900);
  T('離家 '+Math.max(0,Math.round((LEN-P.x)/PXM))+' 公尺',W-216,46,13,'#eee','left',700);
  T(['白天','午後','黃昏','傍晚','深夜'][z]||'',W-22,26,12,'#bba98c','right',700);
  const bx=256,bw=W-256-240,by=22;

  for(const it of world.inters)R(bx+bw*it.cx/LEN-1,by-3,2,12,'#e8402f',false);

  C(bx+bw*P.x/LEN,by+3,5,'#35c46f',true);T('家',bx+bw+8,by+3,11,'#fff','center',900);
  const nit=world.inters.find(i=>i.phase!=='idle'&&i.x1>P.x-30&&i.x0-P.x<400);
  if(nit){
    const st=pedState(nit),blink=Math.floor(G.time*3)%2===0;
    const cx=bx+bw/2,cy=62;

  }

    RR(W/2-210,100,420,86,10,'rgba(15,10,8,.82)',false);

  let ty=H-24;

    const t=G.toasts[i],a=clamp(Math.min(t.t,t.max-t.t+.4)*3,0,1);
    ctx.font='700 15px '+FONT;const w=ctx.measureText(t.text).width+30;
    ctx.globalAlpha=a;RR(W/2-w/2,ty-15,w,30,8,'rgba(15,10,8,.84)',false);T(t.text,W/2,ty,15,t.color,'center',700);ctx.globalAlpha=1;
    ty-=36;
  }
  if(G.state==='dying'){ctx.fillStyle='rgba(120,10,6,.35)';ctx.fillRect(0,0,W,H)}
}

/* ========== 總繪製 ========== */
let patsReady=false;
function draw(){
  if(!patsReady){makePatterns();patsReady=true}
  const S=cv.width/W;
  ctx.setTransform(S*ZOOM,0,0,S*ZOOM,0,-Y0*S*ZOOM);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawSky();
  for(const b of world.blocks){ if(b.x1-cam.x>-20&&b.x0-cam.x<VW+20)drawBlockFacades(b) }
  drawHome();
  for(const s of world.shops)drawShopBack(s);
  drawGround();
  drawEntities();
  drawOverhead();
  drawNight();
  ctx.restore();
  ctx.setTransform(S,0,0,S,0,0);
  drawHUD();
}

/* ========== 主迴圈與啟動 ========== */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(G){
    if(G.state==='shop'){ if(edge.act){edge.act=0;closeShop()} }
    else if(G.state==='title'){
      cam.x=(cam.x+55*dt)%6000+2300*0; P.x=cam.x+260; G.time+=dt;
    }
    else updateGame(dt);
    if(world)draw();
  }
  requestAnimationFrame(frame);
}
$('btnAuto').onclick=()=>toggleAuto();
$('btnPause2').onclick=()=>togglePause();
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').classList.toggle('on',muted)};
$('btnStart').onclick=()=>startGame();
$('btnAgain').onclick=()=>showTitle();
$('btnLeave').onclick=closeShop;
$('btnResume').onclick=togglePause;
$('btnQuit').onclick=()=>showTitle();
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&G&&G.state==='shop')closeShop();
  if(e.key==='Enter'&&G&&(G.state==='over'))showTitle();
});

function showTitle(){
  startGame();G.state='title';
  $('title').hidden=false;$('end').hidden=true;$('pause').hidden=true;
  cam.x=2200;P.x=2460;
  if(selChar)applyChar(P,selChar);
}
function buildChars(){
  const box=$('chars'),ids=['m','f','kid','dad','mom'];
  const main=ctx;
  ids.forEach(id=>{
    const b=document.createElement('button');b.className='charbtn';b.type='button';b.dataset.id=id;
    const c=document.createElement('canvas');c.width=96;c.height=132;

    ctx=g;
    ctx.save();ctx.translate(id==='dad'||id==='mom'?16:44,122);ctx.scale(id==='dad'||id==='mom'?1.1:1.45,id==='dad'||id==='mom'?1.1:1.45);
    shadow(0,1,16,5,.4);

    ctx.restore();
    ctx=main;
    const sp=document.createElement('span');sp.textContent=({m:'男大生',f:'女大生',kid:'小孩',dad:'爸爸',mom:'媽媽'})[id];

  });
}
function boot(){
  buildChars();
  resize();
  startGame();
  G.state='title';
  $('title').hidden=false;
  cam.x=2200;P.x=2460;
  requestAnimationFrame(frame);
}
if(document.fonts&&document.fonts.load){
  Promise.race([
    Promise.all([document.fonts.load('900 20px "Noto Sans TC"',GLYPHS),document.fonts.load('700 20px "Noto Sans TC"',GLYPHS)]),
    new Promise(r=>setTimeout(r,2500))
  ]).then(boot,boot);
}else boot();
