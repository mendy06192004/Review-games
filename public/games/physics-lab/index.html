<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>理化實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one fixed 16:9 lab-bench stage (1280x720) scaled to fit any landscape screen; canvas play field with an HTML HUD on top */
:root{
  --paper:#E8F3EF; --grid:#D3E7E0; --ink:#1D2B4A; --ink-soft:#4A5878;
  --coral:#FF7657; --sun:#FFC83D; --sea:#22AFC0; --leaf:#46B97A; --grape:#7A63F2;
  --frame:#16213B;
  --f-main:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--frame);color:var(--ink);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  font-family:var(--f-main);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#wrap{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:22px;background:var(--paper)}
canvas{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#game{touch-action:none}
#fx{pointer-events:none;z-index:40}
button{font-family:var(--f-main);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

#hud{position:absolute;left:0;right:0;top:0;height:84px;z-index:12;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--ink);color:#fff}
.hbtn{height:58px;min-width:58px;border:0;border-radius:18px;background:rgba(255,255,255,.12);color:#fff;font-size:24px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;transition:transform .15s}
.hbtn:active{transform:scale(.94)}
.hbtn svg{width:30px;height:30px}
.hbtn.hint{background:var(--sun);color:var(--ink);padding:0 22px}
.hud-title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hud-title small{font-size:17px;opacity:.7;font-weight:700;letter-spacing:.08em}
.hud-title b{font-size:30px;font-weight:900;white-space:nowrap}
#dots{flex:1;display:flex;justify-content:center;align-items:center;gap:12px}
.dot{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .3s,box-shadow .3s}
.dot.done{background:var(--leaf)}
.dot.now{background:var(--sun);box-shadow:0 0 0 5px rgba(255,200,61,.3)}

#banner{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:11;width:max-content;max-width:1100px;pointer-events:none;
  background:#fff;color:var(--ink);font-size:25px;font-weight:700;line-height:1.4;padding:11px 30px;border-radius:26px;text-align:center;
  box-shadow:0 6px 0 rgba(29,43,74,.12);text-wrap:balance}
#banner.good{background:var(--leaf);color:#fff}
#banner.try{background:var(--sun);color:var(--ink)}
#banner.warn{background:var(--coral);color:#fff}
#banner.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.9)}60%{transform:translateX(-50%) scale(1.04)}100%{transform:translateX(-50%) scale(1)}}

.screen{position:absolute;inset:0;z-index:20}
.lab-bg{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.big-btn{border:0;border-radius:24px;background:var(--coral);color:#fff;font-size:34px;font-weight:900;padding:20px 54px;box-shadow:0 8px 0 #D9573B;transition:transform .12s,box-shadow .12s;letter-spacing:.06em}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #D9573B}
.btn2{border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);font-size:26px;font-weight:900;padding:14px 30px;box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn2:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}

#scrTitle{display:grid;grid-template-columns:1fr 450px;align-items:center;gap:30px;padding:0 80px}
.t-eyebrow{display:inline-block;background:var(--ink);color:#fff;font-size:20px;font-weight:700;letter-spacing:.2em;padding:6px 16px;border-radius:10px}
#scrTitle h1{font-size:104px;font-weight:900;margin:18px 0 10px;letter-spacing:.03em;line-height:1.05;color:var(--ink);white-space:nowrap}
#scrTitle h1 span{color:var(--coral)}
.t-sub{font-size:27px;font-weight:700;color:var(--ink-soft);margin:0 0 26px}
.chips{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap;max-width:620px}
.chip{font-size:21px;font-weight:900;padding:7px 16px;border-radius:14px;color:#fff}
.title-art svg{width:450px;height:450px;display:block}
.bub{animation:rise 3.2s ease-in infinite}
.bub:nth-child(2){animation-delay:1s}.bub:nth-child(3){animation-delay:2s}.bub:nth-child(4){animation-delay:.5s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.orbit{transform-origin:210px 200px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#scrLevels{display:flex;flex-direction:column;padding:24px 50px 30px}
.lv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.lv-head h2{font-size:46px;font-weight:900;margin:0;display:flex;align-items:center;gap:14px}
.lv-head h2 small{font-size:22px;color:var(--ink-soft);font-weight:700}
.total{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:900;background:var(--ink);color:#fff;padding:8px 20px;border-radius:18px;font-variant-numeric:tabular-nums}
.total svg{width:32px;height:32px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:18px;flex:1;min-height:0}
.card{border:4px solid var(--ink);border-radius:24px;background:#fff;padding:0;display:flex;flex-direction:column;overflow:hidden;text-align:left;color:var(--ink);box-shadow:0 8px 0 var(--ink);transition:transform .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(7px);box-shadow:0 1px 0 var(--ink)}
.card-art{height:118px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--ink)}
.card-art svg{width:96px;height:96px}
.card-body{padding:10px 16px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.card-body small{font-size:16px;font-weight:900;letter-spacing:.1em;color:var(--ink-soft)}
.card-body b{font-size:24px;font-weight:900;line-height:1.2}
.card-body span{font-size:16px;font-weight:700;color:var(--ink-soft)}
.card-stars{display:flex;gap:4px;margin-top:auto}
.card-stars svg{width:28px;height:28px}
.ghost-btn{border:0;background:transparent;color:var(--ink);padding:4px}
.ghost-btn svg{width:42px;height:42px}

#scrResult{display:flex;align-items:center;justify-content:center;background:rgba(22,33,59,.55)}
.res-card{width:740px;background:#fff;border:5px solid var(--ink);border-radius:36px;padding:32px 40px 34px;text-align:center;box-shadow:0 14px 0 var(--ink);animation:cardIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.res-eyebrow{margin:0;font-size:22px;font-weight:900;letter-spacing:.12em;color:var(--ink-soft)}
.res-card h2{font-size:56px;font-weight:900;margin:6px 0 10px}
.res-stars{display:flex;justify-content:center;gap:18px;margin:6px 0 14px}
.res-stars svg{width:106px;height:106px;transform:scale(.6);opacity:.35;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.res-stars svg:nth-child(2){transform:scale(.6) translateY(-14px)}
.res-stars svg.on{transform:scale(1);opacity:1}
.res-stars svg:nth-child(2).on{transform:scale(1.15) translateY(-14px)}
#resMsg{font-size:27px;font-weight:700;margin:0 0 16px}
.learn{background:var(--paper);border-radius:20px;padding:14px 22px;font-size:22px;font-weight:700;line-height:1.5;margin-bottom:24px;text-align:left;display:flex;gap:14px;align-items:baseline}
.learn b{flex:none;background:var(--leaf);color:#fff;border-radius:10px;padding:2px 12px;font-size:20px}
.res-btns{display:flex;justify-content:center;gap:18px}

#rotate{position:fixed;inset:0;z-index:100;background:var(--frame);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
#rotate svg{width:150px;height:150px}
#rotate p{font-size:24px;font-weight:900;margin:0}
.rot-phone{transform-origin:75px 75px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.bub,.orbit,.rot-phone,.res-card,#banner.pop{animation:none}}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="game" aria-label="理化實驗室遊戲畫面"></canvas>

    <div id="hud" hidden>
      <button class="hbtn" id="btnBack" aria-label="回到實驗選單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
      </button>
      <div class="hud-title"><small id="hudLevel">力學實驗</small><b id="hudName">密度大對決</b></div>
      <div id="dots"></div>
      <button class="hbtn hint" id="btnHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>

          <span class="chip" style="background:var(--sea)">密度</span>

          <span class="chip" style="background:#3E9BD6">透鏡</span>

          <span class="chip" style="background:var(--leaf)">聲音</span>
          <span class="chip" style="background:#E0A21B">電路</span>

            <ellipse cx="210" cy="200" rx="185" ry="60" transform="rotate(-24 210 200)"/>

          <path d="M150 262 h120" stroke="#fff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
          <g fill="#FFFFFF" fill-opacity=".85">
            <circle class="bub" cx="180" cy="320" r="9"/>

            <circle class="bub" cx="205" cy="300" r="7"/>
            <circle class="bub" cx="255" cy="310" r="6"/>
          </g>
          <path d="M178 70 h64 v18 h-8 v70 l78 150 a26 26 0 0 1 -23 38 H131 a26 26 0 0 1 -23 -38 l78 -150 v-70 h-8 z" fill="none" stroke="#1D2B4A" stroke-width="9" stroke-linejoin="round"/>
          <g fill="#FFC83D"><path d="M66 96 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/><path d="M350 300 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/></g>
          <circle cx="92" cy="300" r="14" fill="#FF7657"/>

    <section id="scrLevels" class="screen lab-bg" hidden>
      <div class="lv-head">
        <h2><button class="ghost-btn" id="btnHome" aria-label="回到首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>選擇實驗 <small>每個實驗都可以單獨玩</small></h2>
        <div class="total"><svg viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9.3 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.3 9 9" fill="#FFC83D"/></svg><span id="totalStars">0</span>&nbsp;/ 30</div>
      </div>

  <p>請把平板或手機轉成橫向</p>
</div>

<script>
(function(){
'use strict';
const W=1280,H=720;
const $=s=>document.querySelector(s);
const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const C={paper:'#E8F3EF',grid:'#D3E7E0',ink:'#1D2B4A',inkSoft:'#4A5878',coral:'#FF7657',sun:'#FFC83D',sea:'#22AFC0',leaf:'#46B97A',grape:'#7A63F2'};
const canvas=$('#game'),ctx=canvas.getContext('2d');
const fx=$('#fx'),fctx=fx.getContext('2d');

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function txt(c,s,x,y,size,color,weight,align,base){c.font=(weight||700)+' '+size+'px '+FONT;c.fillStyle=color;c.textAlign=align||'center';c.textBaseline=base||'middle';c.fillText(s,x,y)}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb=a=>'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const mixc=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/L,0,1);return dist(px,py,ax+dx*t,ay+dy*t)}
function gauss(A,b){const N=b.length;for(let i=0;i<N;i++){let mx=i;for(let k=i+1;k<N;k++)if(Math.abs(A[k][i])>Math.abs(A[mx][i]))mx=k;[A[i],A[mx]]=[A[mx],A[i]];[b[i],b[mx]]=[b[mx],b[i]];for(let k=i+1;k<N;k++){const f=A[k][i]/A[i][i];if(!f)continue;for(let j=i;j<N;j++)A[k][j]-=f*A[i][j];b[k]-=f*b[i]}}const x=new Array(N).fill(0);for(let i=N-1;i>=0;i--){let s=b[i];for(let j=i+1;j<N;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i]}return x}
let T=0,SHAKE=0;

function paperBg(c){c.fillStyle=C.paper;c.fillRect(0,0,W,H);c.strokeStyle=C.grid;c.lineWidth=1;c.beginPath();for(let x=0;x<=W;x+=40){c.moveTo(x+.5,0);c.lineTo(x+.5,H)}for(let y=0;y<=H;y+=40){c.moveTo(0,y+.5);c.lineTo(W,y+.5)}c.stroke()}
function bench(c){c.fillStyle='#CBE0D8';c.fillRect(0,690,W,30)}
function glowArrow(c,x1,y1,x2,y2,col){col=col||C.sun;const a=Math.atan2(y2-y1,x2-x1),L=Math.hypot(x2-x1,y2-y1),p=(Math.sin(T*6)+1)/2;c.save();c.translate(x1,y1);c.rotate(a);c.shadowColor=col;c.shadowBlur=14+p*14;c.strokeStyle=col;c.lineWidth=11;c.lineCap='round';c.setLineDash([3,22]);c.lineDashOffset=-T*70;c.beginPath();c.moveTo(0,0);c.lineTo(L-40,0);c.stroke();c.setLineDash([]);c.fillStyle=col;const e=L-8+p*8;c.beginPath();c.moveTo(e,0);c.lineTo(e-40,-25);c.lineTo(e-40,25);c.closePath();c.fill();c.restore()}
function glowRing(c,x,y,r,col){col=col||C.sun;const p=(Math.sin(T*6)+1)/2;c.save();c.strokeStyle=col;c.lineWidth=7;c.shadowColor=col;c.shadowBlur=22;c.globalAlpha=.55+.45*p;c.beginPath();c.arc(x,y,r+p*7,0,Math.PI*2);c.stroke();c.restore()}
function glowBox(c,b,col){col=col||C.sun;const p=(Math.sin(T*6)+1)/2;c.save();c.strokeStyle=col;c.lineWidth=7;c.shadowColor=col;c.shadowBlur=22;c.globalAlpha=.55+.45*p;rr(c,b.x-8-p*4,b.y-8-p*4,b.w+16+p*8,b.h+16+p*8,(b.r||16)+8);c.stroke();c.restore()}
function btn(c,b,label,o){o=o||{};c.save();if(o.disabled)c.globalAlpha=.4;rr(c,b.x,b.y+6,b.w,b.h,b.r||16);c.fillStyle=C.ink;c.fill();rr(c,b.x,b.y,b.w,b.h,b.r||16);c.fillStyle=o.fill||'#fff';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();
  if(o.icon)o.icon(c,b.x+b.w/2,b.y+b.h/2);if(label)txt(c,label,b.x+b.w/2,b.y+b.h/2+1,o.size||24,o.color||C.ink,900);c.restore()}

const parts=[];
function emit(n,x,y,o){o=o||{};for(let i=0;i<n;i++){const a=o.angle!=null?o.angle+(Math.random()-.5)*(o.spread!=null?o.spread:Math.PI*2):Math.random()*Math.PI*2;const sp=(o.speed||300)*(.4+Math.random()*.8);const j=o.jitter||0;parts.push({x:x+(Math.random()-.5)*j,y:y+(Math.random()-.5)*j,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.g!=null?o.g:900,life:(o.life||1)*(.7+Math.random()*.6),age:0,size:(o.size||8)*(.6+Math.random()*.8),color:Array.isArray(o.colors)?o.colors[Math.random()*o.colors.length|0]:(o.colors||C.sun),type:o.type||'conf',rot:Math.random()*6,vr:(Math.random()-.5)*12,drag:o.drag!=null?o.drag:.985})}}
function confetti(x,y,n){emit(n||70,x,y,{type:'conf',angle:-Math.PI/2,spread:2.4,speed:700,g:950,life:2.2,size:13,colors:[C.coral,C.sun,C.sea,C.leaf,C.grape]})}
function sparkle(x,y,n){emit(n||16,x,y,{type:'star',speed:260,g:120,life:.9,size:16,colors:['#FFFFFF',C.sun]})}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;if(p.age>=p.life){parts.splice(i,1);continue}p.vy+=p.g*dt;const d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
function drawParts(c){for(const p of parts){const k=p.age/p.life;c.globalAlpha=k>.7?(1-k)/.3:1;c.save();c.translate(p.x,p.y);switch(p.type){
  case 'conf':c.rotate(p.rot);c.fillStyle=p.color;c.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);break;
  case 'dot':c.fillStyle=p.color;c.beginPath();c.arc(0,0,p.size/2*(1-k*.5),0,7);c.fill();break;
  case 'bubble':c.strokeStyle=p.color;c.lineWidth=2.5;c.beginPath();c.arc(0,0,p.size/2,0,7);c.stroke();break;
  case 'smoke':c.globalAlpha*=.8;c.fillStyle=p.color;c.beginPath();c.arc(0,0,p.size/2*(1+k*2),0,7);c.fill();break;
  case 'fire':c.fillStyle=p.color;c.beginPath();c.arc(0,0,Math.max(.5,p.size/2*(1-k)),0,7);c.fill();break;
  case 'drop':c.fillStyle=p.color;c.strokeStyle='rgba(29,43,74,.3)';c.lineWidth=1.5;c.beginPath();c.ellipse(0,0,p.size*.4,p.size*.6,Math.atan2(p.vy,p.vx)-Math.PI/2,0,7);c.fill();c.stroke();break;
  case 'spark':c.strokeStyle=p.color;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(0,0);c.lineTo(-p.vx*.04,-p.vy*.04);c.stroke();break;
  case 'star':{c.rotate(p.rot);c.fillStyle=p.color;const s=p.size/2;c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(0,0,s,0);c.quadraticCurveTo(0,0,0,s);c.quadraticCurveTo(0,0,-s,0);c.quadraticCurveTo(0,0,0,-s);c.fill();break}
 }c.restore()}c.globalAlpha=1}

let AC=null,noiseBuf=null,soundOn=true;
function ensureAudio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,t,dur,type,vol,f2){if(!AC||!soundOn||!(vol>0))return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';const s=AC.currentTime+t;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+dur);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.05)}catch(e){}}
function noise(t,dur,freq,vol,type){if(!AC||!soundOn||!noiseBuf)return;try{const s=AC.currentTime+t,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=noiseBuf;src.loop=true;f.type=type||'lowpass';f.frequency.value=freq;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+dur);src.connect(f);f.connect(g);g.connect(AC.destination);src.start(s);src.stop(s+dur+.05)}catch(e){}}

function halfH(id,r){return {wood:r*.75,foam:r*.75,ice:r*.85,iron:r,stone:r*.95,coin:r*.9+5}[id]}
function drawObj(c,id,x,y,r,rot){c.save();c.translate(x,y);c.rotate(rot||0);
  switch(id){
  case 'wood':{const w=r*2,h=r*1.5;rr(c,-w/2,-h/2,w,h,10);c.fillStyle='#CF9156';c.fill();c.lineWidth=4;c.strokeStyle='#8E5A2B';c.stroke();c.strokeStyle='rgba(120,70,30,.45)';c.lineWidth=3;c.beginPath();for(let i=-1;i<=1;i++){c.moveTo(-w/2+12,i*h*.25);c.bezierCurveTo(-w/6,i*h*.25-8,w/6,i*h*.25+8,w/2-12,i*h*.25)}c.stroke();break}
  case 'iron':{const g=c.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,'#EEF2F7');g.addColorStop(.45,'#8B95A5');g.addColorStop(1,'#3F4858');c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.lineWidth=3;c.strokeStyle='#323a48';c.stroke();break}
  case 'foam':{const w=r*2,h=r*1.5;rr(c,-w/2,-h/2,w,h,14);c.fillStyle='#FFFFFF';c.fill();c.lineWidth=4;c.strokeStyle='#B9C8DA';c.stroke();c.fillStyle='#DCE6F0';[[-.6,-.4],[-.2,.15],[.3,-.35],[.6,.3],[-.55,.4],[.05,-.1],[.25,.45],[-.25,-.5]].forEach(([a,b])=>{c.beginPath();c.arc(a*w/2,b*h/2,5,0,7);c.fill()});break}
  case 'stone':{const pts=[[-1,-.2],[-.7,-.75],[-.1,-.95],[.6,-.7],[1,-.1],[.8,.6],[.1,.88],[-.65,.72]];c.beginPath();pts.forEach(([a,b],i)=>i?c.lineTo(a*r,b*r):c.moveTo(a*r,b*r));c.closePath();c.fillStyle='#8A8174';c.fill();c.lineWidth=4;c.lineJoin='round';c.strokeStyle='#5E574D';c.stroke();c.fillStyle='rgba(255,255,255,.2)';c.beginPath();c.ellipse(-r*.3,-r*.35,r*.28,r*.14,-.4,0,7);c.fill();break}
  case 'ice':{const s=r*1.7;rr(c,-s/2,-s/2,s,s,12);c.fillStyle='rgba(196,236,249,.95)';c.fill();c.lineWidth=4;c.strokeStyle='#5DB8D8';c.stroke();c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(-s*.32,-s*.12);c.lineTo(-s*.12,-s*.32);c.moveTo(-s*.32,s*.1);c.lineTo(-s*.04,-s*.18);c.stroke();break}
  case 'coin':{c.fillStyle='#A65C22';c.beginPath();c.ellipse(0,5,r,r*.9,0,0,7);c.fill();c.fillStyle='#E39A4F';c.beginPath();c.ellipse(0,0,r,r*.9,0,0,7);c.fill();c.strokeStyle='#B8692B';c.lineWidth=4;c.beginPath();c.ellipse(0,0,r*.7,r*.62,0,0,7);c.stroke();txt(c,'1',0,2,r*.85,'#9A5420',900);break}
  }c.restore()}
function GameDensity(){
  const TK={x:560,y:250,w:640,h:430},WT=345,BOT=TK.y+TK.h-12,MID=490,HOLD={x:280,y:450};
  const order=shuffle(Object.keys(OBJ));
  const S={rounds:order.length,round:0,placed:[],cur:null,drag:null,zone:null,hintLv:0,wrong:0,taught:false};
  const hh=o=>halfH(o.id,o.r);
  function newRound(){const id=order[S.round],o=OBJ[id];S.cur=Object.assign({id},o,{x:HOLD.x,y:-80,vy:0,st:'fall',rot:0});S.hintLv=0;S.wrong=0;setDots(S.round);
    setInstruction('「'+o.name+'」的密度是 '+o.d+'。把它拖進水槽：會浮在水面，還是沉到水底？')}
  const inTank=(x,y)=>x>TK.x-10&&x<TK.x+TK.w+10&&y>TK.y-70&&y<TK.y+TK.h;
  S.start=newRound;
  S.update=dt=>{const o=S.cur;if(!o)return;const rest=HOLD.y-hh(o);
    if(o.st==='fall'){o.vy+=1800*dt;o.y+=o.vy*dt;if(o.y>=rest){o.y=rest;if(o.vy>260){o.vy*=-.35;sfx.pop()}else{o.vy=0;o.st='ready'}}}
    else if(o.st==='back'){const k=Math.min(1,dt*9);o.x=lerp(o.x,HOLD.x,k);o.y=lerp(o.y,rest,k);o.rot=lerp(o.rot,0,k);if(dist(o.x,o.y,HOLD.x,rest)<2){o.x=HOLD.x;o.y=rest;o.rot=0;o.st='ready'}}
    else if(o.st==='settle'){o.t+=dt/o.dur;const k=Math.min(1,o.t);o.x=lerp(o.x0,o.tx,ease(k));o.y=lerp(o.y0,o.ty,o.sink?k*k*(3-2*k):ease(k));
      if(o.sink&&o.y>WT&&Math.random()<dt*24)emit(1,o.x+(Math.random()-.5)*o.r,o.y-o.r*.4,{type:'bubble',g:-420,speed:30,angle:-Math.PI/2,spread:.5,life:.9,size:9,colors:'rgba(255,255,255,.95)'});
      if(k>=1){o.ty0=o.ty;S.placed.push(o);S.cur=null;wait(1.4,()=>{S.round++;if(S.round>=S.rounds)finishLevel();else newRound()})}}};
  S.down=(x,y)=>{const o=S.cur;if(!o||o.st!=='ready')return;if(dist(x,y,o.x,o.y)<o.r+34){S.drag={dx:o.x-x,dy:o.y-y};o.st='drag';S.taught=true;sfx.click()}};
  S.move=(x,y)=>{if(!S.drag)return;const o=S.cur;o.x=clamp(x+S.drag.dx,40,W-40);o.y=clamp(y+S.drag.dy,190,H-30);o.rot=Math.sin(T*9)*.06;S.zone=inTank(o.x,o.y)?(o.y<MID?'float':'sink'):null};
  S.up=()=>{if(!S.drag)return;S.drag=null;const o=S.cur,z=S.zone;S.zone=null;if(!z){o.st='back';return}
    const truth=o.d<1?'float':'sink';
    if(z===truth){const i=S.placed.length;o.tx=640+i*74;o.ty=truth==='float'?WT-hh(o)+2*hh(o)*o.d:BOT-hh(o);o.x0=o.x;o.y0=o.y;o.t=0;o.dur=truth==='float'?.9:1.4;o.sink=truth==='sink';o.st='settle';o.rot=0;
      emit(22,clamp(o.x,TK.x+30,TK.x+TK.w-30),WT,{type:'drop',angle:-Math.PI/2,spread:1.7,speed:420,g:1100,colors:['#8FD8E6','#FFFFFF','#4FBCD0'],size:12,life:.8});
      sfx.splash();wait(.25,sfx.good);
      say('答對了！'+o.name+'的密度 '+o.d+(o.d<1?' 比水的 1 小，所以浮在水面。':' 比水的 1 大，所以沉到水底。'),'good',3200)}
    else{S.wrong++;G.mistakes++;S.hintLv=Math.max(S.hintLv,Math.min(2,S.wrong));o.st='back';sfx.soft();
      say(S.wrong===1?'再想想看：'+o.d+' 比 1 大，還是比 1 小？':'密度比 1 小會浮，比 1 大會沉。跟著發光的箭頭試試看！','try',3800)}};
  S.hint=()=>{const o=S.cur;if(!o||o.st==='settle'||o.st==='fall')return false;S.hintLv=Math.min(2,S.hintLv+1);
    say(S.hintLv===1?'比一比：'+o.d+' 和水的密度 1，誰比較大？':'看發光的箭頭！'+o.d+(o.d<1?' 比 1 小，會浮起來。':' 比 1 大，會沉下去。'),'try',3800);return true};
  function waterPath(c){c.beginPath();c.moveTo(TK.x,WT);for(let x=TK.x;x<=TK.x+TK.w;x+=16)c.lineTo(x,WT+Math.sin(x*.03+T*2.2)*4);c.lineTo(TK.x+TK.w,TK.y+TK.h);c.lineTo(TK.x,TK.y+TK.h);c.closePath()}
  function tag(c,x,y,label,up,col){rr(c,x,y,132,46,14);c.fillStyle=col;c.fill();txt(c,label,x+78,y+24,21,'#fff',900);c.save();c.translate(x+22,y+23);if(!up)c.rotate(Math.PI);c.fillStyle='#fff';c.beginPath();c.moveTo(0,-12);c.lineTo(10,2);c.lineTo(3,2);c.lineTo(3,12);c.lineTo(-3,12);c.lineTo(-3,2);c.lineTo(-10,2);c.closePath();c.fill();c.restore()}

      else txt(c,'水的密度是 1',280,645,19,C.inkSoft,700)}
    else txt(c,'下一個物體來囉',280,595,22,C.inkSoft,700);

    if(S.zone){c.fillStyle='rgba(255,200,61,.32)';if(S.zone==='float')c.fillRect(TK.x,TK.y,TK.w,MID-TK.y);else c.fillRect(TK.x,MID,TK.w,TK.y+TK.h-MID)}
    const wg=c.createLinearGradient(0,WT,0,TK.y+TK.h);wg.addColorStop(0,'rgba(120,212,226,.55)');wg.addColorStop(1,'rgba(30,150,175,.6)');
    waterPath(c);c.fillStyle=wg;c.fill();
    S.placed.forEach((p,i)=>{const bob=p.sink?0:Math.sin(T*2+i)*3;drawObj(c,p.id,p.tx,p.ty0+bob,p.r,p.sink?0:Math.sin(T*1.6+i)*.04)});
    if(o&&o.st==='settle')drawObj(c,o.id,o.x,o.y,o.r,0);
    waterPath(c);c.fillStyle='rgba(60,170,195,.3)';c.fill();
    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=4;c.beginPath();for(let x=TK.x;x<=TK.x+TK.w;x+=16){const y=WT+Math.sin(x*.03+T*2.2)*4;x===TK.x?c.moveTo(x,y):c.lineTo(x,y)}c.stroke();
    c.setLineDash([10,12]);c.strokeStyle='rgba(29,43,74,.18)';c.lineWidth=3;c.beginPath();c.moveTo(TK.x+20,MID);c.lineTo(TK.x+TK.w-20,MID);c.stroke();c.setLineDash([]);
    c.restore();
    rr(c,TK.x,TK.y,TK.w,TK.h,26);c.lineWidth=7;c.strokeStyle=C.ink;c.stroke();
    c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(TK.x+22,TK.y+40);c.lineTo(TK.x+22,TK.y+150);c.stroke();
    tag(c,1056,268,'浮在水面',true,C.sea);tag(c,1056,620,'沉到水底',false,'#5E6E8E');
    rr(c,770,212,220,34,17);c.fillStyle=C.ink;c.fill();txt(c,'水的密度 = 1 g/cm³',880,229,19,'#fff',700);
    if(o&&(o.st==='ready'||o.st==='back')){
      if(S.hintLv>=2){const fl=o.d<1,zy=fl?395:590;glowArrow(c,o.x+o.r+12,o.y,820,zy);glowRing(c,1122,fl?291:643,58)}
      if(!S.taught&&o.st==='ready'&&S.round===0){glowArrow(c,o.x+70,o.y-40,TK.x-24,330,C.sea);txt(c,'拖曳我',o.x+150,o.y-112,26,C.sea,900)}}

function GameLever(){

  const toLocal=(x,y)=>{const c=Math.cos(S.th),s=Math.sin(S.th),dx=x-CX,dy=y-CY;return [dx*c+dy*s,-dx*s+dy*c]};

    rr(c,820,604,420,76,18);c.fillStyle='rgba(255,255,255,.75)';c.fill();c.lineWidth=3;c.strokeStyle='rgba(29,43,74,.3)';c.stroke();txt(c,'砝碼盒',806,642,20,C.inkSoft,900,'right');
    const avail=S.n-used()-(S.drag&&S.drag.from==='tray'?1:0);for(let i=0;i<avail;i++){const [x,y]=trayPos(i);weight(c,x,y,C.sea)}

    {laser:[150,640],target:[980,640],walls:[[560,480,80,225],[760,360,80,345]],path:[[430,640],[640,270],[1080,330]]}

  const OFF=[48,-40,36];

  const mod180=a=>((a%180)+180)%180;

  function trace(){const p=S.p;let px=p.laser[0],py=p.laser[1],dx=1,dy=0,last=-1,hitT=false;const pts=[[px,py]],hits=[];
    for(let n=0;n<14;n++){let best=Infinity,bi=null;
      S.mirrors.forEach((m,i)=>{if(i===last)return;const a=m.ang*Math.PI/180,sx=Math.cos(a),sy=Math.sin(a);const t=raySeg(px,py,dx,dy,m.x,m.y,sx,sy,54);if(t!=null&&t<best){best=t;bi={k:'m',i,sx,sy}}});

      const tt=rayCircle(px,py,dx,dy,p.target[0],p.target[1],40);if(tt!=null&&tt<best){best=tt;bi={k:'t'}}

    {target:2,lock:['turns','bats','core'],st:{turns:2,bats:1,core:true},text:'按下「開關」，讓電流通過線圈，變成電磁鐵！'},
    {target:4,lock:['bats','core'],st:{turns:1,bats:1,core:true},text:'只能改變「線圈圈數」。想辦法吸起 4 個迴紋針！'},
    {target:6,lock:['core'],st:{turns:1,bats:1,core:true},text:'改變線圈和電池，吸起 6 個迴紋針！'},
    {target:3,lock:[],st:{turns:1,bats:1,core:false},text:'沒有鐵芯時磁力很弱。想辦法吸起 3 個迴紋針！'},
    {q:true,lock:['turns','bats','core'],st:{turns:3,bats:2,core:true,on:true},text:'電磁鐵吸著很多迴紋針。按「開關」把電源關掉，看看會發生什麼事！'}
  ];
  const B={tm:{x:960,y:250,w:76,h:60},tp:{x:1150,y:250,w:76,h:60},bm:{x:960,y:370,w:76,h:60},bp:{x:1150,y:370,w:76,h:60},core:{x:960,y:470,w:266,h:58},sw:{x:300,y:610,w:250,h:66},yes:{x:640,y:610,w:180,h:66},no:{x:840,y:610,w:180,h:66}};
  const NX=600;
  const S={rounds:RD.length,round:0};
  function load(){S.rd=RD[S.round];S.turns=S.rd.st.turns;S.bats=S.rd.st.bats;S.core=S.rd.st.core;S.on=!!S.rd.st.on;S.solved=false;S.wrong=0;S.hintLv=0;S.asked=false;
    S.clips=Array.from({length:10},(_,i)=>({px:NX-160+(i%5)*80+(i>4?40:0),py:650-(i>4?20:0),att:false,rot:(Math.random()-.5)*.8}));S.clips.forEach(k=>{k.x=k.px;k.y=k.py});
    setDots(S.round);setInstruction(S.rd.text);attach()}
  S.start=load;
  const str=()=>S.on?S.turns*S.bats*(S.core?1:.25):0;
  const nClips=()=>Math.min(10,Math.floor(str()+1e-9));
  function attach(){const n=nClips();S.clips.forEach((k,i)=>{const was=k.att;k.att=i<n;if(k.att&&!was)wait(i*.06,sfx.clink)})}
  function changed(){attach();const r=S.rd;if(r.q){if(!S.on&&!S.asked){S.asked=true;sfx.pop();setInstruction('迴紋針都掉下來了！沒有通電的時候，電磁鐵還有磁性嗎？')}return}
    if(S.on&&nClips()>=r.target&&!S.solved){S.solved=true;wait(.5,()=>{sfx.good();confetti(NX,500,50)});say('成功吸起 '+nClips()+' 個！線圈越多、電池越多（電流越大）、有鐵芯，電磁鐵的磁力就越強。','good',4800);nextRound(S,load,4.2)}
    else if(S.on&&!S.solved)say('吸起 '+nClips()+' 個，目標是 '+r.target+' 個。再讓磁力強一點！','try',2400)}
  S.update=dt=>{S.clips.forEach((k,i)=>{const tx=k.att?NX+(i%2?14:-14):k.px,ty=k.att?505+Math.floor(i/2)*30:k.py;const sp=Math.min(1,dt*(k.att?10:6));k.x=lerp(k.x,tx,sp);k.y=lerp(k.y,ty,sp)})};
  const lk=k=>S.rd.lock.includes(k);
  S.down=(x,y)=>{if(S.solved)return;
    if(hit(B.sw,x,y)){if(S.rd.q&&S.asked)return;S.on=!S.on;sfx.click();changed();return}
    if(!lk('turns')&&hit(B.tm,x,y)&&S.turns>1){S.turns--;sfx.pop();changed()}
    if(!lk('turns')&&hit(B.tp,x,y)&&S.turns<4){S.turns++;sfx.pop();changed()}
    if(!lk('bats')&&hit(B.bm,x,y)&&S.bats>1){S.bats--;sfx.pop();changed()}
    if(!lk('bats')&&hit(B.bp,x,y)&&S.bats<3){S.bats++;sfx.pop();changed()}
    if(!lk('core')&&hit(B.core,x,y)){S.core=!S.core;sfx.pop();changed()}
    if(S.rd.q&&S.asked){if(hit(B.no,x,y)){S.solved=true;sfx.good();confetti(NX,500,50);say('答對了！電磁鐵「通電才有磁性」，斷電就沒有了，所以可以用開關控制，像廢鐵場的電磁起重機。','good',5200);nextRound(S,load,4.6)}
      else if(hit(B.yes,x,y)){S.wrong++;G.mistakes++;S.hintLv=Math.max(S.hintLv,Math.min(2,S.wrong));sfx.soft();say('看看迴紋針：關掉電源後，它們還黏在鐵釘上嗎？','try',3600)}}};
  S.hint=()=>{if(S.solved)return false;S.hintLv=Math.min(2,S.hintLv+1);say(S.hintLv===1?(S.rd.q?'看看關掉電源以後，迴紋針怎麼了？':'線圈越多、電池越多，磁力越強；加上鐵芯會更強。'):'按發光的按鈕。','try',4000);return true};
  function hintBtn(){if(S.rd.q)return S.asked?B.no:B.sw;if(!S.on)return B.sw;if(!S.core&&!lk('core'))return B.core;if(S.turns<4&&!lk('turns'))return B.tp;if(S.bats<3&&!lk('bats'))return B.bp;return null}
  S.draw=c=>{paperBg(c);bench(c);const s=str();
    if(s>0){c.save();c.strokeStyle='rgba(122,99,242,'+Math.min(.6,s*.07)+')';c.lineWidth=3;c.setLineDash([8,8]);c.lineDashOffset=-T*30;for(let k=1;k<=3;k++){c.beginPath();c.ellipse(NX,350,40+k*40,150+k*12,0,0,7);c.stroke()}c.restore();txt(c,'磁場',NX+170,250,18,C.grape,900)}
    if(S.core){c.fillStyle='#8B95A5';rr(c,NX-14,220,28,240,6);c.fill();c.beginPath();c.moveTo(NX-14,458);c.lineTo(NX,484);c.lineTo(NX+14,458);c.closePath();c.fill();rr(c,NX-26,208,52,16,5);c.fillStyle='#6F7B8E';c.fill();txt(c,'鐵釘（鐵芯）',NX-50,200,17,C.inkSoft,900,'right')}
    else{c.save();c.setLineDash([6,6]);c.strokeStyle='rgba(29,43,74,.35)';c.lineWidth=3;rr(c,NX-14,220,28,240,6);c.stroke();c.restore();txt(c,'空心（沒有鐵芯）',NX-50,200,17,C.inkSoft,900,'right')}
    const loops=S.turns*4;for(const [a0,a1,col] of [[0,Math.PI,'#C26A2B'],[Math.PI,Math.PI*2,'#E39A4F']])for(let i=0;i<loops;i++){const y=250+i*(190/loops);c.strokeStyle=col;c.lineWidth=6;c.beginPath();c.ellipse(NX,y,26,7,0,a0,a1);c.stroke()}
    txt(c,(S.turns*10)+' 圈',NX+44,350,20,'#C26A2B',900,'left');
    c.strokeStyle=C.ink;c.lineWidth=5;c.lineJoin='round';c.beginPath();c.moveTo(NX-26,250);c.lineTo(250,250);c.lineTo(250,420);c.moveTo(NX-26,440);c.lineTo(400,440);c.lineTo(400,560);c.lineTo(250,560);c.lineTo(250,520);c.stroke();
    rr(c,150,420,200,100,16);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();for(let i=0;i<S.bats;i++){const bx=172+i*58;rr(c,bx,436,40,68,8);c.fillStyle='#2A3658';c.fill();rr(c,bx,436,40,22,8);c.fillStyle=C.coral;c.fill()}txt(c,'電池 × '+S.bats,250,540,18,C.inkSoft,900);
    S.clips.forEach(k=>{c.save();c.translate(k.x,k.y);c.rotate(k.att?0:k.rot+Math.PI/2);c.strokeStyle='#7F93AE';c.lineWidth=4;rr(c,-9,-15,18,30,9);c.stroke();rr(c,-4,-9,8,20,4);c.stroke();c.restore()});
    rr(c,940,200,306,350,22);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();
    txt(c,'線圈圈數',1093,228,19,C.inkSoft,900);txt(c,(S.turns*10)+' 圈',1093,280,28,C.ink,900);btn(c,B.tm,null,{icon:plusIcon(true),disabled:lk('turns')||S.turns<=1});btn(c,B.tp,null,{icon:plusIcon(false),disabled:lk('turns')||S.turns>=4});
    txt(c,'電池數量',1093,348,19,C.inkSoft,900);txt(c,S.bats+' 顆',1093,400,28,C.ink,900);btn(c,B.bm,null,{icon:plusIcon(true),disabled:lk('bats')||S.bats<=1});btn(c,B.bp,null,{icon:plusIcon(false),disabled:lk('bats')||S.bats>=3});
    btn(c,B.core,S.core?'拿出鐵芯':'放入鐵芯',{disabled:lk('core'),size:22});
    btn(c,B.sw,S.on?'開關：開（通電中）':'開關：關',{fill:S.on?C.leaf:'#fff',color:S.on?'#fff':C.ink,size:23});
    rr(c,40,200,190,110,18);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();txt(c,'吸起迴紋針',135,226,18,C.inkSoft,900);txt(c,nClips()+(S.rd.target?' / '+S.rd.target:'')+' 個',135,268,32,C.ink,900);
    if(S.rd.q&&S.asked){btn(c,B.yes,'還有磁性',{size:24});btn(c,B.no,'沒有了',{size:24})}
    if(S.hintLv>=2&&!S.solved){const b=hintBtn();if(b)glowBox(c,b)}
  };
  return S;
}

const REAG={
  vinegar:{name:'食醋',ph:3,liq:'#E8C77E',cap:'#8E5A2B'},lemon:{name:'檸檬汁',ph:2,liq:'#F4E26A',cap:'#E0A21B'},soda:{name:'汽水',ph:3,liq:'#9C5A33',cap:'#E5383B'},
  bakingsoda:{name:'小蘇打水',ph:9,liq:'#EEF0EA',cap:'#2FA3A8'},soap:{name:'肥皂水',ph:10,liq:'#D8CCF4',cap:'#7A63F2'},lime:{name:'石灰水',ph:12,liq:'#E4EAEE',cap:'#5B6A8E'},
  salt:{name:'食鹽水',ph:7,liq:'#D3ECF6',cap:'#22AFC0'},water:{name:'清水',ph:7,liq:'#CFE8F5',cap:'#4A90C9'},sugar:{name:'糖水',ph:7,liq:'#F6EFD9',cap:'#FF7657'}

const PH=['#E5383B','#EE4B3B','#F26B3A','#F7913D','#F9B93F','#E8D44A','#7CC35A','#4DB28A','#2FA3A8','#2E86C9','#3F63C9','#5B4BC4','#6E3DB0','#5A2C8F'];
const phHex=p=>PH[clamp(Math.round(p),1,14)-1];
const colorName=p=>p<=3?'紅色':p<=5?'橘色':p<=6?'黃色':p===7?'綠色':p<=9?'藍綠色':p<=11?'藍色':'藍紫色';
const catOf=p=>p<7?'acid':p>7?'base':'neutral';
const CATN={acid:'酸性',base:'鹼性',neutral:'中性'};

  rr(c,-20,-h/2-8,40,46,8);c.fillStyle='rgba(255,255,255,.75)';c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();

  c.save();rr(c,-w/2,-h/2+30,w,h-30,24);c.clip();c.fillStyle=r.liq;c.fillRect(-w/2,-h/2+30+(h-30)*.3,w,h);c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-w/2,-h/2+30+(h-30)*.3,w,6);c.restore();
  rr(c,-w/2,-h/2+30,w,h-30,24);c.lineWidth=4;c.strokeStyle=C.ink;c.stroke();

  c.restore()}
function GameAcid(){
  const RD=[
    {target:'acid',opts:['vinegar','bakingsoda','salt']},{target:'base',opts:['lemon','soap','water']},{target:'neutral',opts:['soda','salt','lime']},
    {target:'acid',opts:['bakingsoda','sugar','lemon']},{target:'base',opts:['vinegar','sugar','lime']},{target:'neutralize',opts:['lemon','bakingsoda','soda']}
  ];
  const TB={x:430,top:230,bot:600},SLOTS=[850,1010,1170],SHELF=560,PX=516,PY=150;
  const DRY=hex('#F3E3A6');
  const S={rounds:RD.length,round:0,level:0,levelT:0,liq:hex('#D3ECF6'),liqTarget:null,paper:DRY.slice(),paperT:DRY.slice(),rate:3,ph:null,mx:0,fizz:0};
  const phX=p=>120+(p-.5)*(640/14);
  const INST={acid:'把會讓試紙變「紅色」的物質，拖進試管裡！',base:'把會讓試紙變「藍色」的物質，拖進試管裡！',neutral:'找出讓試紙保持「綠色」的中性物質，拖進試管裡！',neutralize:'試管裡是食醋（酸性，紅色）。加入哪一個，可以讓它中和、變回綠色？'};
  const CLUE={acid:'線索：吃起來酸酸的',base:'線索：摸起來滑滑的，像肥皂',neutral:'線索：不酸也不滑，像水一樣',neutralize:'線索：酸要加「鹼」來中和'};
  const correctId=()=>S.rd.target==='neutralize'?'bakingsoda':S.rd.opts.find(id=>catOf(REAG[id].ph)===S.rd.target);
  function setInitTube(){if(S.rd.target==='neutralize'){S.levelT=.6;S.liqTarget=hex(REAG.vinegar.liq);S.paperT=hex(phHex(3));S.ph=3}else{S.levelT=0;S.paperT=DRY.slice();S.ph=null}S.rate=3}
  function load(){S.rd=RD[S.round];S.bottles=shuffle(S.rd.opts).map((id,i)=>({id,x:SLOTS[i],y:SHELF-75,hx:SLOTS[i],hy:SHELF-75,ang:0,st:'home'}));S.hintLv=0;S.wrong=0;S.busy=false;S.fizz=0;S.drag=null;
    setInitTube();if(S.rd.target==='neutralize'){S.level=.6;S.liq=hex(REAG.vinegar.liq);S.paper=S.paperT.slice();S.mx=phX(3)}setDots(S.round);setInstruction(INST[S.rd.target])}

    wait(.5,()=>{S.levelT=neu?.85:.6;S.liqTarget=neu?mixc(S.liq,hex(r.liq),.5):hex(r.liq)});

      say(r.name+'是'+CATN[catOf(r.ph)]+(tg==='neutralize'?'，加進醋裡還是酸性。':'，試紙變成'+colorName(ph)+'。')+want,'try',4600);
      wait(2.8,()=>{setInitTube();S.busy=false})}}
  S.update=dt=>{S.level=lerp(S.level,S.levelT,Math.min(1,dt*2.4));if(S.liqTarget)S.liq=mixc(S.liq,S.liqTarget,Math.min(1,dt*4));S.paper=mixc(S.paper,S.paperT,Math.min(1,dt*S.rate));

    if(S.fizz>0){S.fizz-=dt;const sy=TB.bot-S.level*240;for(let k=0;k<3;k++)emit(1,TB.x+(Math.random()-.5)*70,TB.bot-30-Math.random()*40,{type:'bubble',g:-520,speed:40,angle:-Math.PI/2,spread:.6,life:Math.max(.2,(TB.bot-sy)/420),size:9,colors:'rgba(255,255,255,.95)'});if(Math.random()<dt*14)emit(2,TB.x+(Math.random()-.5)*60,sy,{type:'bubble',g:-160,speed:90,angle:-Math.PI/2,spread:1.4,life:.6,size:12,colors:'rgba(255,255,255,.9)'})}
    for(const b of S.bottles){if(b.st==='return'){const k=Math.min(1,dt*7);b.x=lerp(b.x,b.hx,k);b.y=lerp(b.y,b.hy,k);b.ang=lerp(b.ang,0,k);if(dist(b.x,b.y,b.hx,b.hy)<1.5&&Math.abs(b.ang)<.01){b.x=b.hx;b.y=b.hy;b.ang=0;b.st='home'}}
      else if(b.st==='pour'){b.t+=dt;const k=Math.min(1,b.t/.45);b.x=lerp(b.sx,PX,ease(k));b.y=lerp(b.sy,PY,ease(k));b.ang=lerp(0,-1.9,ease(k));
        if(b.t>.45&&b.t<1.45){const mx=b.x+95*Math.sin(b.ang),my=b.y-95*Math.cos(b.ang);if(Math.random()<dt*50)emit(1,mx,my,{type:'drop',angle:Math.PI/2,spread:.25,speed:120,g:1400,life:.5,size:13,colors:REAG[b.id].liq})}}}};
  S.down=(x,y)=>{if(S.busy)return;for(let i=S.bottles.length-1;i>=0;i--){const b=S.bottles[i];if(b.st==='home'&&Math.abs(x-b.x)<62&&y>b.y-110&&y<b.y+80){S.drag={b,dx:b.x-x,dy:b.y-y};b.st='drag';sfx.click();return}}};

  S.hint=()=>{if(S.busy)return false;S.hintLv=Math.min(2,S.hintLv+1);say(S.hintLv===1?CLUE[S.rd.target]:'看發光的瓶子！把它拖進試管試試看。','try',3800);return true};
  function tubePath(c){c.beginPath();c.moveTo(TB.x-50,TB.top);c.lineTo(TB.x-50,TB.bot-50);c.arc(TB.x,TB.bot-50,50,Math.PI,0,true);c.lineTo(TB.x+50,TB.top)}

    if(tg==='neutralize'){[[130,PH[1]],[230,PH[6]]].forEach(([x,col])=>{c.fillStyle=col;c.beginPath();c.arc(x,320,36,0,7);c.fill();c.lineWidth=4;c.strokeStyle=C.ink;c.stroke()});c.fillStyle=C.ink;c.beginPath();c.moveTo(168,310);c.lineTo(190,320);c.lineTo(168,330);c.closePath();c.fill();
      txt(c,'紅色 → 綠色',180,392,28,C.ink,900);txt(c,'酸鹼中和',180,430,22,C.inkSoft,700)}
    else{const col={acid:PH[1],base:PH[9],neutral:PH[6]}[tg];c.save();c.shadowColor=col;c.shadowBlur=18;c.fillStyle=col;c.beginPath();c.arc(180,316,44,0,7);c.fill();c.restore();c.lineWidth=4;c.strokeStyle=C.ink;c.beginPath();c.arc(180,316,44,0,7);c.stroke();
      txt(c,'試紙變'+{acid:'紅色',base:'藍色',neutral:'綠色'}[tg],180,392,28,C.ink,900);rr(c,130,414,100,36,12);c.fillStyle=col;c.fill();txt(c,CATN[tg],180,432,22,'#fff',900)}
    if(S.hintLv>=1){rr(c,50,494,260,44,14);c.fillStyle='#FFF1C7';c.fill();txt(c,CLUE[tg],180,516,18,'#8A5A00',900)}

const ATOM={H:{c:'#FFFFFF',r:11,n:'氫'},O:{c:'#FF5A5A',r:15,n:'氧'},C:{c:'#3D4250',r:15,n:'碳'},N:{c:'#4C7BF0',r:15,n:'氮'},Mg:{c:'#9FC9B5',r:16,n:'鎂'},Ca:{c:'#E9B44C',r:17,n:'鈣'},Cl:{c:'#6CCB5F',r:15,n:'氯'}};
const MOL={
  H2:[['H',-11,0],['H',11,0]],O2:[['O',-13,0],['O',13,0]],H2O:[['O',0,-4],['H',-18,10],['H',18,10]],Mg:[['Mg',0,0]],MgO:[['Mg',-14,0],['O',15,0]],
  CH4:[['C',0,0],['H',-16,-14],['H',16,-14],['H',-16,14],['H',16,14]],CO2:[['O',-27,0],['C',0,0],['O',27,0]],N2:[['N',-13,0],['N',13,0]],NH3:[['N',0,-4],['H',-19,10],['H',19,10],['H',0,20]],
  H2O2:[['O',-13,0],['O',13,0],['H',-28,-12],['H',28,12]],CaCO3:[['Ca',-28,0],['C',4,0],['O',4,-24],['O',28,10],['O',-8,22]],HCl:[['H',-14,0],['Cl',8,0]],CaCl2:[['Cl',-28,0],['Ca',0,0],['Cl',28,0]]
};
const lightAtom=e=>!(e==='C'||e==='N'||e==='O');
function drawMol(c,f,x,y,s){for(const [e,dx,dy] of MOL[f]){const a=ATOM[e];c.beginPath();c.arc(x+dx*s,y+dy*s,a.r*s,0,7);c.fillStyle=a.c;c.fill();c.lineWidth=2.5;c.strokeStyle=C.ink;c.stroke();if(a.r>=15)txt(c,e,x+dx*s,y+dy*s+1,12*s,lightAtom(e)?C.ink:'#fff',900)}}
function drawFormula(c,f,x,y,size,col,coef){const tok=[];if(coef!=null)tok.push({s:String(coef),z:size*1.1,dy:0,col:coef===1?'rgba(29,43,74,.3)':C.coral,gap:8});
  f.replace(/([A-Z][a-z]?)(\d*)/g,(m,e,n)=>{tok.push({s:e,z:size,dy:0,col});if(n)tok.push({s:n,z:size*.62,dy:size*.3,col});return m});
  let w=0;tok.forEach(t=>{c.font='900 '+t.z+'px '+FONT;t.w=c.measureText(t.s).width;w+=t.w+(t.gap||0)});let cx=x-w/2;tok.forEach(t=>{txt(c,t.s,cx,y+t.dy,t.z,t.col,900,'left');cx+=t.w+(t.gap||0)})}
function GameChem(){
  const RD=[
    {r:['Mg','O2'],p:['MgO'],sol:[2,1,2],name:'鎂帶燃燒'},{r:['H2','O2'],p:['H2O'],sol:[2,1,2],name:'氫氣燃燒生成水'},{r:['CH4','O2'],p:['CO2','H2O'],sol:[1,2,1,2],name:'甲烷（天然氣）燃燒'},
    {r:['H2O2'],p:['H2O','O2'],sol:[2,2,1],name:'雙氧水分解製造氧氣'},{r:['N2','H2'],p:['NH3'],sol:[1,3,2],name:'氮氣和氫氣合成氨'},{r:['CaCO3','HCl'],p:['CaCl2','H2O','CO2'],sol:[1,2,1,1,1],name:'大理石加鹽酸製造二氧化碳'}
  ];
  const S={rounds:RD.length,round:0};
  function load(){S.rd=RD[S.round];S.sp=[...S.rd.r.map(f=>({f,side:0})),...S.rd.p.map(f=>({f,side:1}))];S.co=S.sp.map(()=>1);S.hintLv=0;S.solved=false;S.react=0;
    const n=S.sp.length,colW=n>=5?190:n===4?215:240,symW=n>=5?50:64,total=n*colW+(n-1)*symW,x0=640-total/2;
    S.sp.forEach((s,i)=>{s.cx=x0+i*(colW+symW)+colW/2;s.up={x:s.cx-66,y:500,w:60,h:56};s.dn={x:s.cx+6,y:500,w:60,h:56}});
    S.syms=[];for(let i=0;i<n-1;i++)S.syms.push({x:x0+i*(colW+symW)+colW+symW/2,s:i===S.rd.r.length-1?'arrow':'+'});
    S.els=[];S.sp.forEach(s=>MOL[s.f].forEach(([e])=>{if(!S.els.includes(e))S.els.push(e)}));
    setDots(S.round);setInstruction('「'+S.rd.name+'」：按上下箭頭調整係數，讓左右兩邊每種原子一樣多！')}
  S.start=load;
  function counts(){const L={},R={};S.els.forEach(e=>{L[e]=0;R[e]=0});S.sp.forEach((s,i)=>MOL[s.f].forEach(([e])=>{(s.side?R:L)[e]+=S.co[i]}));return {L,R}}
  function check(){const {L,R}=counts();if(!S.els.every(e=>L[e]===R[e]))return;const g=S.co.reduce((a,b)=>gcd(a,b));
    if(g>1){say('原子數平衡了！不過係數還可以約分成更簡單的整數喔。','try',3600);return}
    S.solved=true;S.react=.001;sfx.good();const ar=S.syms.find(q=>q.s==='arrow');confetti(ar.x,330,60);sparkle(ar.x,330,20);
    say('平衡了！反應前後每種原子的數量都一樣，這就是「質量守恆」。','good',4400);nextRound(S,load,3.8)}
  S.update=dt=>{if(S.react>0)S.react=Math.min(1,S.react+dt)};
  S.down=(x,y)=>{if(S.solved)return;S.sp.forEach((s,i)=>{if(hit(s.up,x,y)&&S.co[i]<4){S.co[i]++;tone(500+S.co[i]*80,0,.1,'triangle',.12);check()}else if(hit(s.dn,x,y)&&S.co[i]>1){S.co[i]--;tone(500+S.co[i]*80,0,.1,'triangle',.12);check()}})};
  S.hint=()=>{if(S.solved)return false;S.hintLv=Math.min(2,S.hintLv+1);const {L,R}=counts();const e=S.els.find(k=>L[k]!==R[k])||S.els[0];
    say(S.hintLv===1?'看看「'+ATOM[e].n+'」原子：左邊 '+L[e]+' 個，右邊 '+R[e]+' 個，要一樣多喔！':'按發光的箭頭。','try',4200);return true};
  S.draw=c=>{paperBg(c);bench(c);const nr=S.rd.r.length;
    const rx=(S.sp[0].cx+S.sp[nr-1].cx)/2,px=(S.sp[nr].cx+S.sp[S.sp.length-1].cx)/2;
    rr(c,rx-80,198,160,30,12);c.fillStyle=C.coral;c.fill();txt(c,'反應物',rx,213,18,'#fff',900);rr(c,px-80,198,160,30,12);c.fillStyle=C.sea;c.fill();txt(c,'生成物',px,213,18,'#fff',900);
    S.sp.forEach((s,i)=>{const k=S.co[i];const pulse=s.side&&S.react>0?1+.12*Math.sin(S.react*Math.PI):1;for(let j=0;j<k;j++)drawMol(c,s.f,s.cx,262+j*52,pulse);
      drawFormula(c,s.f,s.cx,468,34,C.ink,k);btn(c,s.up,null,{icon:triIcon(true),disabled:k>=4});btn(c,s.dn,null,{icon:triIcon(false),disabled:k<=1})});
    S.syms.forEach(q=>{if(q.s==='arrow'){c.save();if(S.react>0){c.shadowColor=C.sun;c.shadowBlur=30}c.fillStyle=C.ink;c.fillRect(q.x-22,326,34,8);c.beginPath();c.moveTo(q.x+24,330);c.lineTo(q.x+6,314);c.lineTo(q.x+6,346);c.closePath();c.fill();c.restore()}else txt(c,'+',q.x,330,40,C.ink,900)});
    const {L,R}=counts();const bw=Math.min(210,1180/S.els.length-12),tot=S.els.length*(bw+12)-12,bx0=640-tot/2;const bad=S.els.find(k=>L[k]!==R[k]);
    S.els.forEach((e,i)=>{const x=bx0+i*(bw+12),ok=L[e]===R[e];rr(c,x,594,bw,84,16);c.fillStyle=ok?'#DDF3E6':'#fff';c.fill();c.lineWidth=4;c.strokeStyle=ok?C.leaf:C.coral;c.stroke();
      c.beginPath();c.arc(x+32,636,ATOM[e].r,0,7);c.fillStyle=ATOM[e].c;c.fill();c.lineWidth=2.5;c.strokeStyle=C.ink;c.stroke();txt(c,e,x+32,637,12,lightAtom(e)?C.ink:'#fff',900);
      txt(c,ATOM[e].n+'原子',x+62,614,17,C.inkSoft,900,'left');txt(c,L[e]+(ok?' ＝ ':' ≠ ')+R[e],x+62,650,26,ok?'#23854F':'#C2482A',900,'left');
      if(S.hintLv>=1&&!S.solved&&e===bad)glowBox(c,{x,y:594,w:bw,h:84})});
    if(S.hintLv>=2&&!S.solved){const i=S.co.findIndex((v,j)=>v!==S.rd.sol[j]);if(i>=0)glowBox(c,S.co[i]<S.rd.sol[i]?S.sp[i].up:S.sp[i].dn)}
    txt(c,'左邊數字 ＝ 反應前，右邊數字 ＝ 反應後',1240,214,16,C.inkSoft,700,'right')};
  return S;
}

let best=LV.map(()=>0);
try{const s=JSON.parse(localStorage.getItem('lab-game-stars-v2')||'null');if(Array.isArray(s)&&s.length===LV.length)best=s.map(n=>clamp(n|0,0,3))}catch(e){}
function saveBest(){try{localStorage.setItem('lab-game-stars-v2',JSON.stringify(best))}catch(e){}}

/* ---------- screens ---------- */
function show(id){['scrTitle','scrLevels','scrResult'].forEach(s=>$('#'+s).hidden=s!==id);const play=id===null;$('#hud').hidden=!play;$('#banner').hidden=!play}
function renderLevels(){const box=$('#cards');box.innerHTML='';LV.forEach((L,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',L.name);
  b.innerHTML='<div class="card-art" style="background:'+L.bg+'">'+L.icon+'</div><div class="card-body"><small>'+L.cat+'</small><b>'+L.name+'</b><span>'+L.sub+'</span><div class="card-stars">'+[0,1,2].map(k=>STAR_SVG(k<best[i]?'#FFC83D':'#E3E8EF')).join('')+'</div></div>';
  b.addEventListener('click',()=>{ensureAudio();sfx.click();startLevel(i)});box.appendChild(b)});$('#totalStars').textContent=best.reduce((a,b)=>a+b,0)}
function startLevel(i){G.level=i;G.mistakes=0;G.hints=0;tasks=[];parts.length=0;SHAKE=0;clearBanner();scene=LV[i].make();
  $('#hudLevel').textContent=LV[i].cat+'實驗';$('#hudName').textContent=LV[i].name;buildDots(scene.rounds);show(null);scene.start()}
function goLevels(){scene=null;tasks=[];clearBanner();renderLevels();show('scrLevels')}
function finishLevel(){const pen=G.mistakes+G.hints;const st=pen<=1?3:pen<=4?2:1;const i=G.level;if(st>best[i]){best[i]=st;saveBest()}setDots(scene?scene.rounds:0);wait(.5,()=>showResult(st))}
function showResult(st){const i=G.level;clearBanner();show('scrResult');$('#resLevel').textContent=LV[i].cat+'實驗 · '+LV[i].name;
  const all=best.every(b=>b===3);
  $('#resTitle').textContent=st===3?'滿星完成！':st===2?'很棒，完成了！':'完成實驗！';
  $('#resMsg').textContent=st===3?(all?'十個實驗全部滿星，你是理化小博士！':'太厲害了，每一題都想得很清楚！'):st===2?'再挑戰一次，拿下滿星吧！':'多玩幾次，你會越來越厲害！';
  $('#resLearn').textContent=LV[i].learn;
  const box=$('#resStars');box.innerHTML=[0,1,2].map(()=>STAR_SVG('#FFC83D')).join('');
  [...box.children].forEach((el,k)=>{if(k<st)setTimeout(()=>{el.classList.add('on');sfx.star(k);confetti(470+k*170,270,26)},500+k*420)});
  setTimeout(()=>{if(st===3){sfx.fanfare();confetti(200,720,80);confetti(1080,720,80);confetti(640,140,60)}},500+st*420)}

$('#btnStart').addEventListener('click',()=>{ensureAudio();sfx.good();goLevels()});
$('#btnHome').addEventListener('click',()=>{sfx.click();show('scrTitle')});
$('#btnBack').addEventListener('click',()=>{sfx.click();goLevels()});
$('#btnHint').addEventListener('click',()=>{ensureAudio();if(scene&&scene.hint&&scene.hint()){G.hints++;sfx.click()}});
$('#btnMenu').addEventListener('click',()=>{sfx.click();goLevels()});
$('#btnRetry').addEventListener('click',()=>{sfx.click();startLevel(G.level)});
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const sb=$('#btnSound');sb.innerHTML=SPK_ON;sb.addEventListener('click',()=>{soundOn=!soundOn;sb.innerHTML=soundOn?SPK_ON:SPK_OFF;if(soundOn){ensureAudio();sfx.click()}});

/* ---------- input ---------- */
let activePtr=null;
function toLocal(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
canvas.addEventListener('pointerdown',e=>{if(activePtr!==null)return;activePtr=e.pointerId;ensureAudio();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const p=toLocal(e);if(scene&&scene.down)scene.down(p.x,p.y);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==activePtr)return;const p=toLocal(e);if(scene&&scene.move)scene.move(p.x,p.y);e.preventDefault()});
function endPtr(e){if(e.pointerId!==activePtr)return;activePtr=null;const p=toLocal(e);if(scene&&scene.move)scene.move(p.x,p.y);if(scene&&scene.up)scene.up(p.x,p.y)}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function fit(){const r=$('#wrap').getBoundingClientRect();if(!r.width||!r.height)return;const s=Math.min(r.width/W,r.height/H);
  $('#stage').style.transform='translate('+((r.width-W*s)/2)+'px,'+((r.height-H*s)/2)+'px) scale('+s+')';
  const dpr=Math.min(window.devicePixelRatio||1,2);for(const [cv,cx] of [[canvas,ctx],[fx,fctx]]){cv.width=Math.max(1,Math.round(W*s*dpr));cv.height=Math.max(1,Math.round(H*s*dpr));cx.setTransform(s*dpr,0,0,s*dpr,0,0)}
  let coarse=false;try{coarse=matchMedia('(pointer:coarse)').matches}catch(e){}
  $('#rotate').hidden=!(coarse&&window.innerHeight>window.innerWidth)}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
try{new ResizeObserver(fit).observe($('#wrap'))}catch(e){}
fit();

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;runTasks(dt);
  ctx.save();ctx.clearRect(0,0,W,H);if(SHAKE>0){SHAKE=Math.max(0,SHAKE-dt);const m=SHAKE*18;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m)}
  if(scene){scene.update(dt);scene.draw(ctx)}else paperBg(ctx);ctx.restore();
  updateParts(dt);fctx.clearRect(0,0,W,H);drawParts(fctx);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
renderLevels();show('scrTitle');
window.__lab={startLevel,get scene(){return scene},G,LV,tick:(n,dt)=>{for(let i=0;i<n;i++){T+=dt;runTasks(dt);if(scene){scene.update(dt);scene.draw(ctx)}updateParts(dt);drawParts(fctx)}}};
})();
</script>

</body></html>
