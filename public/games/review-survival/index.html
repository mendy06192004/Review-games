<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>複習生存大作戰</title><link data-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap"><link data-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap"><style id="appcss">/* 16:9 舞台（1600×900）等比縮放到螢幕；明亮筆記本風格，刻意單一配色 */
:root{
  --ink:#1f2233; --paper:#fffaf0; --card:#ffffff; --muted:#646a85; --line:#dbe7f5;
  --sun:#ffd23f; --pink:#ff6b8b; --mint:#5ee6a8; --sky:#6ec3ff; --grape:#8b6cff; --red:#e5484d; --green:#2f9e44;
  --night:#171830;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body)}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;background:var(--paper);border-radius:6px;user-select:none;-webkit-user-select:none}
#cv{position:absolute;left:0;top:0;width:1600px;height:900px;touch-action:none}
:focus-visible{outline:6px solid var(--sky);outline-offset:3px}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(23,24,48,.66);z-index:20;padding:28px}
.layer.clear{background:transparent}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:30px 36px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.btn{border:4px solid var(--ink);border-radius:16px;padding:12px 26px;font-weight:900;font-size:26px;background:var(--sun);box-shadow:5px 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.25}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.white{background:#fff}.btn.grape{background:var(--grape);color:#fff}
.btn.small{font-size:20px;padding:8px 16px;border-width:3px;box-shadow:4px 4px 0 var(--ink);border-radius:12px}
.btn.big{font-size:38px;padding:16px 40px}
.lbl{font-family:var(--f-display);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;margin:0 0 10px}
.lbl .n{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px}
.muted{color:var(--muted)}
/* HUD */
#hud{position:absolute;left:18px;right:18px;top:14px;display:flex;gap:12px;align-items:center;z-index:10;pointer-events:none}
.chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-weight:900;font-size:24px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.hpbar{width:240px;height:22px;background:#3d3f5c;border:3px solid var(--ink);border-radius:11px;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ef476f,#ff9bb3);transition:width .25s}
#skills{display:flex;gap:8px}
#skills .chip{font-size:20px;padding:4px 10px}
#pauseBtn{pointer-events:auto;margin-left:auto}
/* 開始畫面 */
.start{display:grid;grid-template-columns:520px 1fr;gap:28px;width:100%;height:100%;padding:8px}
.start .left,.start .right{background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:26px 30px;display:flex;flex-direction:column;min-width:0;min-height:0}
.logo{font-family:var(--f-display);font-size:62px;line-height:1.02;margin:0;color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);letter-spacing:2px;text-wrap:balance}
.logo small{display:block;font-size:34px;color:var(--pink);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);margin-top:10px;letter-spacing:4px}
.tagline{font-size:18px;font-weight:700;line-height:1.5;margin:10px 0 10px;color:var(--ink)}
.seg{display:flex;gap:10px}
.seg .btn{flex:1;font-size:22px;padding:8px 6px;background:#fff}
.seg .btn[aria-pressed="true"]{background:var(--pink)}
.mons{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:19px;font-weight:700}
.mons li{display:flex;gap:10px;align-items:baseline}
.mons b{color:var(--red);white-space:nowrap}
.left .grow{flex:1}
.left .actions{display:flex;flex-direction:column;gap:12px}
.left .row{display:flex;gap:10px}
.left .row .btn{flex:1}
#best{font-weight:800;color:var(--muted);font-size:18px;text-align:center;min-height:24px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 20px;font-size:24px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink);position:relative}
.tab[aria-pressed="true"]{background:var(--sun)}
.tab .dot{position:absolute;top:-10px;right:-10px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;font-size:15px;padding:0 7px;line-height:22px}
.lessons{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;padding:4px 10px 10px 4px;margin-bottom:12px;border-top:3px dashed var(--line);padding-top:12px}
.les{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:9px 12px;font-size:20px;font-weight:800;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;line-height:1.3;min-height:58px}
.les .box{flex:none;width:28px;height:28px;border:3px solid var(--ink);border-radius:7px;display:grid;place-items:center;background:#fff}
.les .box .ic{width:20px;height:20px}
.les[aria-pressed="true"]{background:#d3f9e4}
.les[aria-pressed="true"] .box{background:var(--green);color:#fff}
.les .t{flex:1;min-width:0}
.les .k{font-size:14px;color:var(--muted);font-weight:700;display:block}
.les .c{flex:none;font-size:16px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px}
.les.empty{opacity:.5}
.les.empty .c{background:#aab}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.tchip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 16px;font-size:20px;font-weight:900;cursor:pointer}
.tchip[aria-pressed="true"]{color:#fff}
.summary{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:900}
.summary .warn{color:var(--red)}
/* 答題 */
.quiz{width:1180px}
.hit{background:#ffe5ec;border:3px dashed var(--red);border-radius:14px;padding:10px 16px;font-weight:800;color:#b3123f;margin-bottom:14px;font-size:22px}
.qmeta{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tag{display:inline-block;padding:4px 16px;border-radius:999px;color:#fff;font-weight:900;border:3px solid var(--ink);font-size:20px}
.tag.les2{background:#fff;color:var(--ink)}
.qtext{font-size:38px;font-weight:900;line-height:1.5;margin:4px 0 22px;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{text-align:left;font-size:30px;background:#fff;display:flex;gap:14px;align-items:flex-start;line-height:1.4}
.opt .k{background:var(--ink);color:#fff;border-radius:10px;min-width:42px;height:42px;display:inline-grid;place-items:center;font-size:24px;flex:none}
.opt.correct{background:var(--mint)!important}
.opt.wrong{background:#ff9aac!important}
.hint-line{text-align:center;color:var(--muted);font-weight:700;margin-top:16px;font-size:18px}
.big-title{font-family:var(--f-display);font-size:58px;text-align:center;margin:0}
.dmg{text-align:center;font-size:28px;font-weight:900;color:var(--red);margin:8px 0 16px}
.answer{background:#d3f9e4;border:4px solid var(--green);border-radius:16px;padding:14px 18px;font-weight:900;font-size:30px;margin-bottom:14px;line-height:1.5}
.scaffold{background:#fff3b0;border:4px solid #e09f3e;border-radius:16px;padding:14px 18px;font-weight:700;font-size:27px;line-height:1.6}
.scaffold b{color:#9c6644}
.centerrow{display:flex;justify-content:center;gap:16px;margin-top:22px}
.mini{background:#e8f4ff;border:3px dashed var(--sky);border-radius:14px;padding:10px 16px;font-weight:700;font-size:21px;line-height:1.55;margin:6px 0 16px}
.buffs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.buff{border:4px solid var(--ink);border-radius:20px;padding:20px 16px;background:#fff;box-shadow:6px 6px 0 var(--ink);text-align:center;cursor:pointer;position:relative;transition:transform .12s}
.buff:hover,.buff:focus-visible{transform:translateY(-6px) rotate(-1deg)}
.buff .nm{font-family:var(--f-display);font-size:32px;margin:6px 0}
.buff .lv{display:inline-block;font-size:18px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:2px 12px;margin-bottom:8px}
.buff .ds{font-size:21px;line-height:1.5;font-weight:700}
.buff .key{position:absolute;top:10px;left:14px;font-size:18px;font-weight:900;color:var(--muted)}
/* 結算 */
.over{width:1300px;max-height:860px;display:flex;flex-direction:column}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:14px 0}
.stat{background:#eef1ff;border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center;font-weight:800;font-size:20px}
.stat .v{font-family:var(--f-display);font-size:42px;color:var(--grape);font-variant-numeric:tabular-nums}
.rank{text-align:center;font-size:28px;font-weight:900;color:var(--red)}
.review{flex:1;min-height:0;overflow-y:auto;border:3px solid var(--ink);border-radius:16px;padding:6px 18px;background:#fff}
.review .it{border-bottom:2px dashed #ccd;padding:10px 0;font-size:20px;line-height:1.55;font-weight:700}
.review .it:last-child{border-bottom:none}
.review .a{color:var(--green)}.review .h{color:#9c6644;font-size:18px}
#btnTeacher{display:none!important}
/* 教師後台 */
.admin{width:100%;height:100%;display:flex;flex-direction:column;padding:22px 26px;gap:14px}
.admin-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.admin-head h2{font-family:var(--f-display);font-size:40px;margin:0 12px 0 0}
.status{font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;border:3px solid var(--ink);background:#fff}
.status.dirty{background:#ffe3a3}
.status.ok{background:#d3f9e4}
.admin-body{flex:1;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:18px}
.filters{display:flex;flex-direction:column;gap:12px;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:16px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:18px}
.field select,.field input,.field textarea{border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:20px;background:#fff;font-weight:600}
.field textarea{resize:vertical;min-height:84px;line-height:1.5}
.qlist{background:#fff;border:4px solid var(--ink);border-radius:20px;overflow-y:auto;padding:8px 14px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:2px dashed #d5dbe8;padding:12px 4px}
.qrow:last-child{border-bottom:none}
.qrow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qrow .pill{font-size:15px;font-weight:900;border-radius:999px;padding:1px 10px;border:2px solid var(--ink);background:#fff}
.qrow .pill.st{background:#ffe3a3}
.qrow .pill.del{background:#ffc9d2}
.qrow .q{font-size:20px;font-weight:800;line-height:1.45}
.qrow .ans{font-size:17px;color:var(--green);font-weight:800}
.qrow.deleted .q{text-decoration:line-through;color:var(--muted)}
.qrow .ops{display:flex;gap:8px}
.edit{width:1100px;max-height:860px;overflow-y:auto}
.edit .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--red);font-weight:900;font-size:20px;min-height:28px}
.pin{width:620px;text-align:center}
.pin input{font-size:46px;text-align:center;letter-spacing:16px;width:320px;border:4px solid var(--ink);border-radius:16px;padding:8px}
#toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:22px;padding:12px 24px;border-radius:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:1200px;text-align:center}
#toast.show{opacity:1}
#rotate{position:fixed;inset:0;z-index:99;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;font-family:var(--f-display);font-size:26px}
#rotate .phone{width:84px;height:84px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* v3：自繪圖示與新元件 */
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-0.15em}
.btn .ic{margin-right:6px}
.red{color:#e5484d;display:inline-flex}.gold{color:#f59f00;display:inline-flex}.grn{color:var(--green);display:inline-flex}
.gl{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-family:var(--f-display);font-size:18px;font-weight:900;border:2px solid var(--ink);margin-right:8px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px}
.tchip{display:inline-flex;align-items:center}
.seal{display:grid;place-items:center;width:96px;height:96px;margin:0 auto;border-radius:22px;background:var(--c,#b3261e);color:#fff;font-family:var(--f-display);font-size:58px;font-weight:900;border:4px solid var(--ink);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35);transform:rotate(-4deg)}
.seal.sm{width:46px;height:46px;font-size:28px;border-radius:12px;border-width:3px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);margin:0}
.seal.xs{width:30px;height:30px;font-size:18px;border-radius:8px;border-width:2px;box-shadow:none;margin:0;transform:none;background:var(--c)}
.chip.skill{padding:4px 10px 4px 6px;font-size:19px}
.buff{border-top:14px solid var(--c,#b3261e);background:linear-gradient(180deg,color-mix(in srgb,var(--c,#b3261e) 14%,#fff),#fff 60%)}
.buff .nm{font-family:var(--f-display);font-size:34px;margin:12px 0 6px}
.buff .mean{margin-top:10px;font-size:17px;line-height:1.5;color:var(--muted);font-weight:700;border-top:2px dashed #d5dbe8;padding-top:8px;text-align:left}
.buff .key{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;top:12px;left:12px}
.maps{display:grid;gap:8px}
.mapi{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.mapi b{font-family:var(--f-display);font-size:21px;white-space:nowrap}
.mapi span:last-child{color:var(--muted)}
.swatch{width:64px;height:64px;border-radius:16px;border:4px solid var(--ink);flex:none;background-image:radial-gradient(rgba(0,0,0,.1) 2px,transparent 2px);background-size:12px 12px}
.swatch.sm{width:34px;height:34px;border-radius:9px;border-width:3px}
.mapcard{width:1240px}
.maphead{display:flex;align-items:center;gap:20px}
.mapeyebrow{font-weight:900;color:var(--muted);letter-spacing:4px;font-size:18px}
.mapsub{font-weight:800;font-size:22px;color:var(--grape)}
.mapdesc{font-size:22px;font-weight:700;line-height:1.6;margin:12px 0 16px}
.mons{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.mon{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center}
.mon img{width:96px;height:96px;display:block;margin:0 auto}
.mon .n{font-weight:900;font-size:18px;line-height:1.3}
.mon .s{font-size:15px;color:var(--muted);font-weight:700}
.sks{display:flex;flex-wrap:wrap;gap:10px}
.sk{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px 5px 5px;font-weight:900;font-size:19px}
.hit{display:flex;align-items:center;gap:14px}
.hit img{width:72px;height:72px;flex:none;background:#fff;border-radius:14px;border:3px solid var(--red)}
.answer,.scaffold,.mini{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.answer .ic,.scaffold .ic,.mini .ic{margin-top:4px}
.stat .ic{display:block;margin:0 auto 4px;width:28px;height:28px}
#best .ic{margin-right:6px}
.qmeta .ic{width:22px;height:22px}

#skills{position:absolute;left:0;top:806px;max-width:1290px;flex-wrap:wrap}
.maps{gap:4px}.mapi{font-size:16px}.mapi b{font-size:19px}
.start .left .lbl{margin-bottom:8px}
.logo small{font-size:28px;margin-top:6px}

/* v4：道具、掉落物、圖鑑、匯入 */
.stats{grid-template-columns:repeat(6,1fr)}
.left .row .btn{font-size:18px;padding:8px 10px}
.lrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:40px;align-items:center}
.lchip{display:inline-flex;align-items:center;gap:8px;background:#f8f1e3;border:3px solid #5c3d2e;border-radius:12px;padding:4px 12px 4px 4px;font-weight:900;font-size:18px}
.lchip.rare{background:#fff3bf;border-color:#e8590c}
.lchip.new{background:var(--sun);border-color:var(--ink);padding:6px 14px}
#lootPop{position:absolute;right:20px;top:96px;width:430px;background:#fbf5e6;border:4px solid #5c3d2e;border-radius:18px;box-shadow:6px 6px 0 rgba(31,34,51,.85);padding:14px 18px;z-index:15;opacity:0;transform:translateX(30px);transition:opacity .3s,transform .3s;pointer-events:none}
#lootPop.show{opacity:1;transform:none}
#lootPop .lp-eyebrow{font-weight:900;color:#9c6644;letter-spacing:3px;font-size:15px}
#lootPop .lp-head{display:flex;align-items:center;gap:12px;margin:6px 0}
#lootPop b{font-family:var(--f-display);font-size:24px}
#lootPop p{margin:0;font-size:17px;line-height:1.6;font-weight:700;color:#3b2a20}
.imp{width:1240px;max-height:870px;display:flex;flex-direction:column}
.impfile{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--muted)}
.impsum{font-size:22px;font-weight:800;margin:8px 0}
.impsum b{color:var(--grape);font-size:26px}.impsum .warn{color:var(--red)}
#impPrev{flex:1;min-height:180px;max-height:380px;border:4px solid var(--ink);border-radius:18px}
.imphelp{font-size:16px;font-weight:700;line-height:1.6;margin:10px 0 0}
.imphelp b{color:var(--ink)}
.codex{width:1480px;height:860px;display:flex;flex-direction:column}
.codex-head{display:flex;align-items:center;gap:16px}
.codex-body{flex:1;min-height:0;overflow-y:auto;padding-right:8px}
.cx-map{margin-bottom:16px}
.cx-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;margin-bottom:8px}
.cx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cx-card{background:#fbf5e6;border:3px solid #5c3d2e;border-radius:16px;padding:10px 14px}
.cx-card.rare{background:#fff6d6;border-color:#e8590c;box-shadow:0 0 0 3px rgba(250,176,5,.35)}
.cx-card.locked{background:#f1f3f5;border-color:#adb5bd;border-style:dashed;color:#868e96}
.cx-top{display:flex;align-items:center;gap:10px}
.cx-name{font-weight:900;font-size:19px;line-height:1.3}
.cx-src{font-size:14px;font-weight:700;color:var(--muted)}

// ================= 基本工具 =================
const $ = id => document.getElementById(id);

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*clamp(t,0,1); }

const store = {

};
let toastT = 0;

// ================= 課次與題庫 =================
function parseLesson(s){ const i=s.indexOf('='); const t=i<0?s:s.slice(0,i); const keys=i<0?[t.replace(/^(自學|語常)：/,'')]:s.slice(i+1).split('|'); return {t,keys}; }
const LES = {}; const KNOWN_KEYS = new Set(['通用']);
for(const v of VERS){ LES[v]={}; for(const vol of VOLS){ LES[v][vol]=LESSONS[v][vol].map(parseLesson); LES[v][vol].forEach(l=>l.keys.forEach(k=>KNOWN_KEYS.add(k))); } }
const DEFAULT_Q = RAW.map((r,i)=>({id:'d'+i, l:r[0], c:T[r[1]], q:r[2], a:r[3], w:[r[4],r[5],r[6]], h:r[7]}));
const DEFAULT_BY_ID = Object.fromEntries(DEFAULT_Q.map(q=>[q.id,q]));
const LS_DRAFT='cnsv3-draft', LS_SEL='cnsv3-sel', LS_BEST='cnsv3-best';
let DATA={pin:'1234', overrides:{}, added:[], updated:0};
try{ const el=$('bankData'); if(el && el.textContent.trim()) DATA=Object.assign(DATA, JSON.parse(el.textContent)); }catch(e){}
const PUBLISHED_UPDATED=DATA.updated;
{ const d=store.get(LS_DRAFT,null); if(d && d.updated>DATA.updated) DATA=d; }
let BANK=[];
function rebuildBank(){ const out=[]; for(const q of DEFAULT_Q){ const o=DATA.overrides[q.id]; if(o===null) continue; out.push(o?{...o,id:q.id}:q); } for(const q of DATA.added) out.push(q); BANK=out; }
rebuildBank();
function customKeys(){ const s=new Set(); for(const q of BANK) if(!KNOWN_KEYS.has(q.l)) s.add(q.l); return [...s]; }

// ================= 遙控器／鍵盤的方向鍵導覽 =================
const LAYERS=['scrNewPin','scrEdit','scrImport','scrPin','scrAdmin','scrCodex','scrMap','scrQuiz','scrWrong','scrBuff','scrPause','scrOver','scrStart'];
function topLayer(){ for(const id of LAYERS){ const el=$(id); if(el && !el.hidden) return el; } return null; }
function focusables(root){ return [...root.querySelectorAll('button:not([disabled]),select,input:not([type=file]),textarea')].filter(e=>{ if(e.closest('[hidden]')) return false; const r=e.getBoundingClientRect(); return r.width>0&&r.height>0; }); }
function navMove(dir){
  const layer=topLayer(); if(!layer) return;
  const els=focusables(layer); if(!els.length) return;
  const cur=document.activeElement;
  if(!layer.contains(cur)||cur===document.body){ els[0].focus(); return; }
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null, bs=Infinity;
  for(const e of els){ if(e===cur) continue; const q=e.getBoundingClientRect(), dx=q.left+q.width/2-cx, dy=q.top+q.height/2-cy; let main,cross;
    if(dir==='left'){main=-dx;cross=Math.abs(dy);} else if(dir==='right'){main=dx;cross=Math.abs(dy);} else if(dir==='up'){main=-dy;cross=Math.abs(dx);} else {main=dy;cross=Math.abs(dx);}
    if(main<=6) continue; const s=main+cross*2.2; if(s<bs){bs=s;best=e;} }
  if(best){ best.focus(); best.scrollIntoView({block:'nearest',inline:'nearest'}); }
}
function focusFirst(id,sel){ requestAnimationFrame(()=>{ const root=$(id); const el=sel?root.querySelector(sel):focusables(root)[0]; if(el) el.focus(); }); }
function show(id){ $(id).hidden=false; } function hide(id){ $(id).hidden=true; }

  st.style.transform=`translate(-50%,-50%) scale(${SCALE})`;
  const k=Math.min(2.5, Math.max(0.5, SCALE*(window.devicePixelRatio||1)));
  if(Math.abs(k-K)>0.01 || cv.width!==Math.round(W*K)){ K=k; cv.width=Math.round(W*K); cv.height=Math.round(H*K); floorPattern=null; }
  $('rotate').hidden=!(vh>vw*1.05 && !rotateDismissed);
}

// ================= 開始選單 =================
const SEL=Object.assign({ver:'康軒', vol:'7上', lessons:[], types:TYPES.map(t=>t.id), general:true, custom:[], diff:'normal', map:'random'}, store.get(LS_SEL,{}));

function lessonKeysSelected(){ const ks=new Set(); for(const id of selLessons){ const [v,vol,i]=id.split('|'); const l=LES[v]&&LES[v][vol]&&LES[v][vol][+i]; if(l) l.keys.forEach(k=>ks.add(k)); } if(SEL.general) ks.add('通用'); for(const c of SEL.custom) ks.add(c); return ks; }
/* [題庫模式] 由平台傳入學生選的範圍題目（不含答案），答案改由伺服器驗證 */
let BANK_POOL=null;
if(window.GameBridge&&GameBridge.requireBank('複習生存大作戰')) GameBridge.questions().then(qs=>{
  BANK_POOL=qs.map(q=>({id:q.id,l:'通用',c:'閱讀理解',q:q.題幹,a:null,w:[],h:'',bankOpts:q.選項}));
  const r=document.querySelector('.start .right');

  try{ renderMenu(); }catch(e){}
});
function currentPool(){ if(BANK_POOL) return BANK_POOL; const ks=lessonKeysSelected(), ts=new Set(SEL.types); return BANK.filter(q=>ks.has(q.l)&&ts.has(q.c)); }
function countFor(keys){ const ts=new Set(SEL.types); let n=0; for(const q of BANK) if(keys.includes(q.l)&&ts.has(q.c)) n++; return n; }
function focusSame(container,v){ const el=[...container.children].find(c=>c.dataset.v===v); if(el && document.activeElement && document.activeElement!==document.body) el.focus(); }

function renderStatus(){ const s=$('adStatus'); if(draftDirty()){ s.className='status dirty'; s.textContent='有尚未同步的變更'; } else { s.className='status ok'; s.textContent='已與分享連結同步'; } }
function openPin(){ $('pinInput').value=''; $('pinErr').textContent=''; show('scrPin'); focusFirst('scrPin','#pinInput'); }
function checkPin(){ if($('pinInput').value===String(DATA.pin||'1234')){ hide('scrPin'); openAdmin(); } else { $('pinErr').textContent='密碼不正確，請再試一次'; $('pinInput').select(); } }
function lessonOptionsHTML(selected){
  let h='<option value="通用">通用練習題</option>';
  const cks=customKeys(); if(cks.length) h+='<optgroup label="自訂題組">'+cks.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')+'</optgroup>';
  h+='<option value="__custom">＋ 建立新的自訂題組…</option>';
  for(const v of VERS) for(const vol of VOLS){ h+=`<optgroup label="${v} ${vol}">`; for(const l of LES[v][vol]){ const t=l.t.replace(/^(自學|語常)：/,''); for(const k of l.keys) h+=`<option value="${esc(k)}">${esc(t)}${l.keys.length>1?'／'+esc(k):''}</option>`; } h+='</optgroup>'; }
  return h.replace(`value="${esc(selected)}"`,`value="${esc(selected)}" selected`);
}
function openAdmin(){
  $('fVer').innerHTML='<option value="">全部版本</option>'+VERS.map(v=>`<option>${v}</option>`).join('');
  $('fVol').innerHTML='<option value="">全部冊次</option>'+VOLS.map(v=>`<option>${v}</option>`).join('');
  $('fType').innerHTML='<option value="">全部題型</option>'+TYPES.map(t=>`<option>${t.id}</option>`).join('');
  fillLessonFilter(); renderStatus(); renderList(); show('scrAdmin'); focusFirst('scrAdmin','#adAdd');
}
function fillLessonFilter(){
  const v=$('fVer').value, vol=$('fVol').value, keep=$('fLes').value;
  let h='<option value="">全部課次</option><option value="通用">通用練習題</option>';
  for(const c of customKeys()) h+=`<option value="${esc(c)}">自訂：${esc(c)}</option>`;
  const seen=new Set();
  for(const vv of VERS){ if(v&&vv!==v) continue; for(const vo of VOLS){ if(vol&&vo!==vol) continue; for(const l of LES[vv][vo]){ const t=l.t.replace(/^(自學|語常)：/,''); const val=l.keys.join('|'); if(seen.has(val)) continue; seen.add(val); h+=`<option value="${esc(val)}">${(v&&vol)?'':vv+vo+' '}${esc(t)}</option>`; } } }
  $('fLes').innerHTML=h; if([...$('fLes').options].some(o=>o.value===keep)) $('fLes').value=keep;
}
function filterKeys(){ const v=$('fVer').value, vol=$('fVol').value, les=$('fLes').value; if(les) return new Set(les.split('|')); if(!v&&!vol) return null; const s=new Set(); for(const vv of VERS){ if(v&&vv!==v) continue; for(const vo of VOLS){ if(vol&&vo!==vol) continue; LES[vv][vo].forEach(l=>l.keys.forEach(k=>s.add(k))); } } return s; }
function renderList(){
  const ks=filterKeys(), ty=$('fType').value, st=$('fState').value, kw=$('fKey').value.trim();
  let rows=[];
  if(st==='del') rows=DEFAULT_Q.filter(q=>DATA.overrides[q.id]===null).map(q=>({q,state:'del'}));
  else for(const q of BANK){ const state=q.id.startsWith('c')?'new':(DATA.overrides[q.id]?'mod':''); if(st&&st!==state) continue; rows.push({q,state}); }
  rows=rows.filter(({q})=>(!ks||ks.has(q.l))&&(!ty||q.c===ty)&&(!kw||(q.q+q.a+q.w.join('')+q.h).includes(kw)));
  $('fCount').textContent=`符合 ${rows.length} 題（全部 ${BANK.length} 題）`;
  const list=$('qList'); list.innerHTML='';
  if(!rows.length){ list.innerHTML='<p style="font-size:22px;font-weight:800;text-align:center;margin:40px">沒有符合的題目。按「新增題目」來出一題吧！</p>'; return; }
  for(const {q,state} of rows.slice(0,300)){
    const d=document.createElement('div'); d.className='qrow'+(state==='del'?' deleted':'');
    const ty2=TYPES.find(t=>t.id===q.c)||TYPES[0];
    d.innerHTML=`<div><div class="meta"><span class="pill" style="background:${ty2.color};color:#fff">${esc(q.c)}</span><span class="pill">${esc(lessonLabel(q.l))}</span>${state==='new'?'<span class="pill st">新增</span>':state==='mod'?'<span class="pill st">已修改</span>':state==='del'?'<span class="pill del">已刪除</span>':''}</div><div class="q"></div><div class="ans"></div></div><div class="ops"></div>`;
    d.querySelector('.q').textContent=q.q; d.querySelector('.ans').textContent='正解：'+q.a+'　誤：'+q.w.join('／');
    const ops=d.querySelector('.ops');
    const mk=(html,cls,fn)=>{ const b=document.createElement('button'); b.className='btn small '+cls; b.innerHTML=html; b.onclick=fn; ops.appendChild(b); return b; };
    if(state==='del') mk(ic('undo')+'復原','mint',()=>{ delete DATA.overrides[q.id]; touchData(); renderList(); toast('已復原這題'); });
    else {
      mk(ic('edit')+'編輯','white',()=>openEditor(q));
      if(state==='mod') mk(ic('undo')+'原版','white',()=>{ delete DATA.overrides[q.id]; touchData(); renderList(); toast('已改回內建版本'); });
      const del=mk(ic('trash')+'刪除','white',()=>{
        if(del.dataset.arm!=='1'){ del.dataset.arm='1'; del.textContent='確定刪除？'; del.classList.replace('white','pink'); setTimeout(()=>{ if(del.isConnected){ del.dataset.arm=''; del.innerHTML=ic('trash')+'刪除'; del.classList.replace('pink','white'); } },3000); return; }
        if(q.id.startsWith('c')) DATA.added=DATA.added.filter(x=>x.id!==q.id); else DATA.overrides[q.id]=null;
        touchData(); renderList(); toast('已刪除（內建題目可在「已刪除」中復原）');
      });
    }
    list.appendChild(d);
  }
}
let editing=null;
function openEditor(q){
  editing=q||null; $('edTitle').textContent=q?'編輯題目':'新增題目';
  const fl=$('fLes').value; const defL=q?q.l:(fl?fl.split('|')[0]:'通用');
  $('edLes').innerHTML=lessonOptionsHTML(defL);
  $('edType').innerHTML=TYPES.map(t=>`<option ${q&&q.c===t.id?'selected':''}>${t.id}</option>`).join('');
  if(!q && $('fType').value) $('edType').value=$('fType').value;
  $('edQ').value=q?q.q:''; $('edA').value=q?q.a:''; for(let i=0;i<3;i++) $('edW'+i).value=q?q.w[i]:'';
  $('edH').value=q?q.h:''; $('edCustom').value=''; $('edCustomWrap').hidden=true; $('edErr').textContent='';
  show('scrEdit'); focusFirst('scrEdit','#edQ');
}
function saveEditor(){
  let l=$('edLes').value;
  if(l==='__custom'){ l=$('edCustom').value.trim(); if(!l){ $('edErr').textContent='請輸入自訂題組名稱'; return; } }
  const q={l,c:$('edType').value,q:$('edQ').value.trim(),a:$('edA').value.trim(),w:[0,1,2].map(i=>$('edW'+i).value.trim()),h:$('edH').value.trim()};
  if(!q.q){ $('edErr').textContent='請輸入題目'; return; }
  if(!q.a||q.w.some(x=>!x)){ $('edErr').textContent='正確答案和三個錯誤選項都要填'; return; }
  if(new Set([q.a,...q.w]).size<4){ $('edErr').textContent='四個選項不能重複'; return; }
  if(editing && !editing.id.startsWith('c')) DATA.overrides[editing.id]=q;
  else if(editing){ const i=DATA.added.findIndex(x=>x.id===editing.id); if(i>=0) DATA.added[i]={...q,id:editing.id}; }
  else DATA.added.push({...q,id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)});
  touchData(); hide('scrEdit'); fillLessonFilter(); renderList(); toast(editing?'已更新這題':'已新增一題'); focusFirst('scrAdmin','#adAdd');
}
function buildDoc(){
  const SC='script', head=document.head.querySelector('style'), reset=head?head.textContent:'';
  const fonts=[...document.querySelectorAll('link[data-fonts]')].map(l=>l.outerHTML).join('');
  const json=JSON.stringify(DATA).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>國文生存大作戰</title>'+fonts
    +'<style id="appcss">'+$('appcss').textContent+'</style><div id="stage"></div>'
    +'<'+SC+' id="bankData" type="application/json">'+json+'</'+SC+'>'
    +'<'+SC+' id="app">'+$('app').textContent+'</'+SC+'></body></html>';
}
async function publishBank(){
  const btn=$('adPublish');
  if(!artifactCap){ toast(readOnly?'這個連結是唯讀的：變更只存在這台裝置。請用老師自己的帳號開啟遊戲來同步。':'目前不是在分享連結中開啟：變更只存在這台裝置。可用「匯出」備份題庫。',5200); return; }
  btn.disabled=true; btn.textContent='同步中…';
  try{ await artifactCap.publish(buildDoc()); toast('已同步！所有開啟這個連結的裝置都會更新題庫。',4000); }
  catch(err){ const c=err&&err.code;
    if(c==='conflict') toast('剛好有其他裝置同步了新版本，頁面會重新載入；你的變更仍保留在這台裝置的草稿裡。',5200);
    else if(['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].includes(c)){ readOnly=true; artifactCap=null; toast('這個帳號沒有編輯權限，變更只存在這台裝置。',5200); }
    else if(c==='too_large') toast('題庫太大，無法同步。請刪除一些題目後再試。',5200);
    else if(c==='rate_limited') toast('同步太頻繁了，請等一下再按。',4000);
    else toast('同步失敗，請稍後再試一次。',4000); }
  finally{ btn.disabled=false; btn.innerHTML=ic('save')+'儲存並同步'; }
}
async function exportBank(){
  const payload=JSON.stringify({app:'國文生存大作戰',v:3,exported:new Date().toISOString(),overrides:DATA.overrides,added:DATA.added},null,1);
  const filename=`國文生存題庫_${new Date().toISOString().slice(0,10)}.json`;
  let dl=null; try{ dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null; }catch(e){}
  if(dl){ try{ await dl.save({filename,data:new Blob([payload],{type:'application/json'})}); toast('已匯出題庫'); }catch(e){ if(e&&e.code!=='user_declined') toast('匯出沒有完成'); } return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); toast('已匯出題庫'); }catch(e){ toast('這個環境不支援下載'); }
}
function importBank(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(!d||typeof d.overrides!=='object'||!Array.isArray(d.added)) throw 0;
    const okQ=q=>q&&typeof q.q==='string'&&typeof q.a==='string'&&Array.isArray(q.w)&&q.w.length===3&&typeof q.l==='string';
    const ov={}; for(const k in d.overrides){ if(DEFAULT_BY_ID[k]&&(d.overrides[k]===null||okQ(d.overrides[k]))) ov[k]=d.overrides[k]; }
    const ad=d.added.filter(okQ).map(q=>({id:String(q.id||('c'+Math.random().toString(36).slice(2))),l:q.l,c:TYPES.some(t=>t.id===q.c)?q.c:'閱讀理解',q:q.q,a:q.a,w:q.w.map(String),h:String(q.h||'')}));
    DATA.overrides=ov; DATA.added=ad; touchData(); fillLessonFilter(); renderList();
    toast(`已匯入：${ad.length} 題新增、${Object.keys(ov).length} 題修改或刪除。記得按「儲存並同步」。`,5200);
  }catch(e){ toast('這不是國文生存大作戰的題庫檔，請確認檔案。',4200); } };
  r.readAsText(file);
}

function boot(){
  $('stage').innerHTML=STAGE_HTML;
  cv=$('cv'); ctx=cv.getContext('2d');
  const rot=document.createElement('div'); rot.id='rotate'; rot.hidden=true;
  rot.innerHTML='<svg class="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><div>請把手機或平板轉成橫向來玩</div><button class="btn small white" id="rotOk">直接繼續</button>';
  document.body.appendChild(rot);
  $('rotOk').onclick=()=>{ rotateDismissed=true; fitStage(); };
  fitStage(); window.addEventListener('resize',fitStage);

  window.addEventListener('keydown',e=>{
    const k=e.key, lk=k.toLowerCase(), t=e.target, typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
    if(G && G.state==='play'){ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault(); keys[lk]=true; if(k==='p'||k==='P'||k==='Escape') togglePause(); return; }
    if(typing){ if(k==='Escape') t.blur(); if(k==='Enter'&&t.id==='pinInput'){ e.preventDefault(); checkPin(); } if(k==='Enter'&&t.id==='newPin'){ e.preventDefault(); $('newPinOk').click(); } return; }
    const dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(dirs[k]){ e.preventDefault(); navMove(dirs[k]); return; }
    if(!G) return;
    if(G.state==='quiz' && /^[1-4]$/.test(k)) chooseAnswer(+k-1);
    else if(G.state==='buff' && /^[1-3]$/.test(k)) pickBuff(+k-1);
    else if(G.state==='feedback' && (k==='Enter'||k===' ')){ e.preventDefault(); closeWrong(); }
    else if(G.state==='paused' && (lk==='p'||k==='Escape')) togglePause();
  });
  window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
  window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; if(G&&G.state==='play') togglePause(); });
  const toStage=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
  cv.addEventListener('pointerdown',e=>{ const s=toStage(e); touch.active=true; touch.sx=s.x; touch.sy=s.y; });
  cv.addEventListener('pointermove',e=>{ if(touch.active){ const s=toStage(e); touch.sx=s.x; touch.sy=s.y; } });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,()=>touch.active=false));

  for(const b of $('diffSeg').children) b.onclick=()=>{ SEL.diff=b.dataset.d; saveSel(); renderMenu(); };
  $('btnStart').onclick=()=>{ const pool=currentPool(); if(!pool.length) return; newGame({diff:SEL.diff,pool,map:SEL.map}); };
  $('mapGo').onclick=startPlay;
  $('btnVolAll').onclick=()=>{ LES[SEL.ver][SEL.vol].forEach((l,i)=>selLessons.add(`${SEL.ver}|${SEL.vol}|${i}`)); saveSel(); renderMenu(); };
  $('btnClear').onclick=()=>{ selLessons.clear(); SEL.custom=[]; saveSel(); renderMenu(); };
  $('btnFull').onclick=()=>{ const d=document.documentElement; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(d.requestFullscreen) d.requestFullscreen().catch(()=>toast('這個瀏覽器不支援全螢幕，可改用電視或瀏覽器的全螢幕功能')); else toast('這個瀏覽器不支援全螢幕'); };
  $('btnTeacher').onclick=openPin;
  $('pinOk').onclick=checkPin; $('pinCancel').onclick=()=>{ hide('scrPin'); focusFirst('scrStart','#btnTeacher'); };
  $('wBtn').onclick=closeWrong;

// ================= 世界、地圖、怪物、招式 =================
const W = 1600, H = 900;          // 螢幕（舞台）大小
const WW = 4800, WH = 3600;       // 世界大小
const FONT = '"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
let ctx = null, cv = null, K = 1;

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); }
function eyes(x,y,gap,sz,look){ // 卡通眼睛
  ctx.fillStyle='#fff'; circ(x-gap,y,sz); ctx.fill(); circ(x+gap,y,sz); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='#1f2233'; circ(x-gap,y,sz); ctx.stroke(); circ(x+gap,y,sz); ctx.stroke();
  ctx.fillStyle='#1f2233'; const lx=(look||0)*sz*0.35; circ(x-gap+lx,y+sz*0.15,sz*0.5); ctx.fill(); circ(x+gap+lx,y+sz*0.15,sz*0.5); ctx.fill();
}
function brows(x,y,gap,len){ ctx.strokeStyle='#1f2233'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x-gap-len,y-len*0.5); ctx.lineTo(x-gap+len*0.6,y); ctx.moveTo(x+gap+len,y-len*0.5); ctx.lineTo(x+gap-len*0.6,y); ctx.stroke(); }
function glyphText(ch,x,y,size,color,stroke){ ctx.font=`900 ${size}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; if(stroke){ ctx.lineWidth=size*0.18; ctx.strokeStyle=stroke; ctx.strokeText(ch,x,y); } ctx.fillStyle=color; ctx.fillText(ch,x,y); }

// ---------- 地圖生成 ----------
const CELL = 200;
function buildGrid(obs){
  const g=new Map();
  obs.forEach((o,i)=>{
    const x0=o.c?o.x-o.r:o.x, y0=o.c?o.y-o.r:o.y, x1=o.c?o.x+o.r:o.x+o.w, y1=o.c?o.y+o.r:o.y+o.h;
    for(let cx=Math.floor(x0/CELL);cx<=Math.floor(x1/CELL);cx++) for(let cy=Math.floor(y0/CELL);cy<=Math.floor(y1/CELL);cy++){ const k=cx+','+cy; if(!g.has(k)) g.set(k,[]); g.get(k).push(o); }
  });
  return g;
}
function nearObs(x,y){
  const out=[], cx=Math.floor(x/CELL), cy=Math.floor(y/CELL), seen=new Set();
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){ const a=G.grid.get((cx+i)+','+(cy+j)); if(a) for(const o of a){ if(!seen.has(o)){ seen.add(o); out.push(o); } } }
  return out;
}
function resolveObs(o, r){
  let hit=false;
  for(const ob of nearObs(o.x,o.y)){
    if(ob.c){
      const dx=o.x-ob.x, dy=o.y-ob.y, d=Math.hypot(dx,dy), m=r+ob.r;
      if(d<m){ hit=true; if(d<0.01){ o.x+=m; } else { o.x=ob.x+dx/d*m; o.y=ob.y+dy/d*m; } }
    } else {
      const cx=clamp(o.x,ob.x,ob.x+ob.w), cy=clamp(o.y,ob.y,ob.y+ob.h), dx=o.x-cx, dy=o.y-cy, d=Math.hypot(dx,dy);
      if(d<r){
        hit=true;
        if(d>0.01){ o.x=cx+dx/d*r; o.y=cy+dy/d*r; }
        else { const l=o.x-ob.x, rt=ob.x+ob.w-o.x, t=o.y-ob.y, b=ob.y+ob.h-o.y, m=Math.min(l,rt,t,b);
          if(m===l) o.x=ob.x-r; else if(m===rt) o.x=ob.x+ob.w+r; else if(m===t) o.y=ob.y-r; else o.y=ob.y+ob.h+r; }
      }
    }
  }

function pointBlocked(x,y,pad=0){

function genMap(map){
  const obs=[], decor=[], cx=WW/2, cy=WH/2;

  const CW=480, CH=400;
  for(let gx=0;gx<WW/CW;gx++) for(let gy=0;gy<WH/CH;gy++){
    const x0=gx*CW, y0=gy*CH, jx=rand(-40,40), jy=rand(-40,40), r=Math.random();
    if(GEN2[map.id]){ GEN2[map.id](x0,y0,jx,jy,r,add,decor); continue; }

      else if(r<0.62) add({x:x0+170+jx,y:y0+190+jy,w:150,h:38,k:'bench'});
      else if(r<0.7) add({x:x0+120+jx,y:y0+120+jy,w:24,h:170,k:'goal'});
      if(Math.random()<0.7) decor.push({x:x0+rand(40,440),y:y0+rand(40,360),k:pick(['flower','leaf','line']),a:rand(0,6.28)});
    } else {

}

function makeFloor(map){

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  if(!ENEMIES[e.type].fly){ ctx.fillStyle='rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(0,e.r*0.85,e.r*0.75,e.r*0.25,0,0,7); ctx.fill(); }
  else { ctx.fillStyle='rgba(0,0,0,.08)'; ctx.beginPath(); ctx.ellipse(6,e.r+12,e.r*0.6,e.r*0.18,0,0,7); ctx.fill(); }
  ctx.scale(1.15,1.15); ctx.strokeStyle='#1f2233'; ctx.lineWidth=2; ctx.lineJoin='round';
  drawEnemyBody(e);
  ctx.restore();
  if(G && G.freezeT>0){ ctx.fillStyle='rgba(165,216,255,.45)'; circ(e.x,e.y,e.r+4); ctx.fill(); glyphText('呆',e.x+e.r,e.y-e.r,16,'#1c7ed6','#fff'); }
  if(e.maxHp>1 && e.hp<e.maxHp){ ctx.fillStyle='#1f2233'; ctx.fillRect(e.x-26,e.y-e.r-24,52,7); ctx.fillStyle='#ef476f'; ctx.fillRect(e.x-25,e.y-e.r-23,50*(e.hp/e.maxHp),5); }
  if(e.flash>0){ ctx.fillStyle='rgba(255,255,255,.6)'; circ(e.x,e.y,e.r); ctx.fill(); }
}
function enemyThumb(type, size=120){
  const c=document.createElement('canvas'); c.width=size*2; c.height=size*2;
  const old=ctx; ctx=c.getContext('2d'); ctx.setTransform(2,0,0,2,0,0);
  const d=ENEMIES[type], s=Math.min(2.2, (size*0.36)/d.r);
  ctx.translate(size/2,size/2); ctx.scale(s,s); ctx.strokeStyle='#1f2233'; ctx.lineWidth=2; ctx.lineJoin='round';
  const e={type,x:0,y:0,r:d.r,t:0.3,ang:-0.5,look:0.5,ch:'曰',segs:d.seg?Array.from({length:4},(_,i)=>({x:-(i+1)*d.r*0.9,y:Math.sin(i)*4,a:0})):null};
  drawEnemyBody(e);
  ctx=old; return c.toDataURL();
}

// ================= 音樂與音效（Web Audio 即時合成，不需音檔） =================
const LS_AUDIO='cnsv3-audio';
const AU={ctx:null, master:null, music:null, sfx:null, duck:null, on:Object.assign({music:true,sfx:true},store.get(LS_AUDIO,{})), theme:null, timer:0, next:0, step:0, bar:0, seed:1, lastPop:0, popN:0, intense:0};
function auSave(){ store.set(LS_AUDIO,AU.on); }
function auInit(){
  try{
    if(!AU.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      const c=new AC(); AU.ctx=c;
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.connect(c.destination);
      AU.master=c.createGain(); AU.master.gain.value=0.9; AU.master.connect(comp);
      AU.duck=c.createGain(); AU.duck.gain.value=1; AU.duck.connect(AU.master);
      AU.music=c.createGain(); AU.music.gain.value=AU.on.music?0.34:0; AU.music.connect(AU.duck);
      AU.sfx=c.createGain(); AU.sfx.gain.value=AU.on.sfx?0.6:0; AU.sfx.connect(AU.master);
    }
    if(AU.ctx.state==='suspended') AU.ctx.resume();
    return true;
  }catch(e){ return false; }
}
function auToggle(kind){ AU.on[kind]=!AU.on[kind]; auSave(); if(AU.ctx){ const g=kind==='music'?AU.music:AU.sfx; g.gain.setTargetAtTime(AU.on[kind]?(kind==='music'?0.34:0.6):0,AU.ctx.currentTime,0.05); } renderAudioBtns(); if(kind==='sfx'&&AU.on.sfx) sfx('click'); }
function auDuck(v){ if(AU.ctx) AU.duck.gain.setTargetAtTime(v,AU.ctx.currentTime,0.12); }
const mtof=m=>440*Math.pow(2,(m-69)/12);

// ---------- 樂器 ----------
function tone(dest,t,f,dur,o={}){
  const c=AU.ctx, osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(f,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30,f*o.slide),t+dur);
  if(o.vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=o.vib; lg.gain.value=f*0.012; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t+dur+0.05); }
  const v=o.vol??0.3, a=o.a??0.005, rel=o.rel??dur;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+rel);
  let node=osc;
  if(o.lp){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=o.lp; osc.connect(fl); node=fl; }
  node.connect(g); g.connect(dest); osc.start(t); osc.stop(t+a+rel+0.05);
}
let NOISE=null;
function noiseBuf(){ if(NOISE) return NOISE; const c=AU.ctx, b=c.createBuffer(1,c.sampleRate*0.5,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return NOISE=b; }
function noise(dest,t,dur,o={}){
  const c=AU.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=noiseBuf(); f.type=o.ft||'highpass'; f.frequency.value=o.f||6000; if(o.q) f.Q.value=o.q;
  if(o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep,t+dur);
  g.gain.setValueAtTime(o.vol??0.15,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
}
const INST={

 wood:(d,t,v)=>tone(d,t,880,0.06,{type:'sine',vol:v*0.4,rel:0.06,slide:0.9}),

};
// 各地圖主題：bpm、根音、音階、主旋律樂器、節奏型
const THEMES={
 menu:      {bpm:96, root:60, scale:[0,2,4,7,9], lead:'bell',  bassP:[0,null,7,null], drum:'soft',  prog:[0,5,3,4]},

const CHORD_STEPS=[0,2,4,5,7,9,11];
function rng(){ AU.seed=(AU.seed*16807)%2147483647; return AU.seed/2147483647; }
function auMusic(name){
  if(!AU.ctx) return;
  if(AU.theme===name) return;
  AU.theme=name; AU.step=0; AU.bar=0; AU.seed=[...name].reduce((a,c)=>a+c.charCodeAt(0)*31,7)||7; AU.mel=null;
  AU.next=AU.ctx.currentTime+0.1;
  if(!AU.timer) AU.timer=setInterval(auTick,30);
}
function auStop(){ AU.theme=null; }
function makeMelody(th){ // 每 4 小節換一段旋律（同一首歌會有變化）
  const out=[]; let idx=2+(rng()*3|0);
  for(let i=0;i<32;i++){
    if(rng()<(th.bpm>110?0.28:0.38)){ out.push(null); continue; }
    idx=clamp(idx+[-2,-1,-1,0,1,1,2][rng()*7|0],0,9); out.push(idx);
  }
  return out;
}
function auTick(){
  const c=AU.ctx; if(!c||!AU.theme) return;
  const th=THEMES[AU.theme]||THEMES.menu, spb=60/(th.bpm*(1+AU.intense*0.04))/2; // 八分音符
  while(AU.next<c.currentTime+0.15){
    const t=AU.next, st=AU.step%32, beat=st%8;
    if(st===0){ if(!AU.mel||AU.bar%4===0) AU.mel=makeMelody(th); AU.bar++; }
    const chordDeg=th.prog[(st/8|0)%4], chordRoot=th.root+CHORD_STEPS[chordDeg];
    const d=AU.music, v=1;
    // 低音
    if(st%2===0){ const bp=th.bassP[(st/2|0)%4]; if(bp!=null) INST.bass(d,t,mtof(chordRoot-24+bp),spb*1.8,0.32*v); }
    // 和弦墊底（每小節一次）
    if(beat===0){ for(const iv of [0,4,7]) tone(d,t,mtof(chordRoot-12+iv),spb*7.5,{type:'sine',vol:0.045,a:0.08,rel:spb*7}); }
    // 主旋律
    const m=AU.mel[st]; if(m!=null){ const deg=th.scale[m%5], oct=Math.floor(m/5); INST[th.lead](d,t,mtof(th.root+deg+12*oct),spb*(th.lead==='flute'?1.9:1),0.32); }
    // 節奏
    const dr=th.drum, I=AU.intense;
    if(dr==='pop'){ if(beat%4===0) INST.kick(d,t,0.5); if(beat===4) INST.snare(d,t,0.6); if(st%2===0) INST.hat(d,t,0.6); }
    else if(dr==='rock'){ if(beat===0||beat===3||beat===4&&I) INST.kick(d,t,0.6); if(beat===2||beat===6) INST.snare(d,t,0.7); INST.hat(d,t,0.5); }
    else if(dr==='soft'){ if(beat===0) INST.kick(d,t,0.3); if(st%2===1) INST.hat(d,t,0.3); if(I&&beat===4) INST.snare(d,t,0.3); }
    else if(dr==='wood'){ if(beat===0||beat===5) INST.wood(d,t,0.5); if(I&&beat%2===0) INST.wood(d,t,0.25); if(beat===0&&st%16===0) tone(d,t,mtof(th.root-24),1.2,{type:'sine',vol:0.25,rel:1.1}); }
    else if(dr==='lofi'){ if(beat===0||beat===5) INST.kick(d,t,0.45); if(beat===4) INST.snare(d,t+spb*0.08,0.4); if(st%2===0) INST.hat(d,t+(beat%4===2?spb*0.15:0),0.4); }
    else if(dr==='tick'){ INST.tick(d,t,beat%2?0.4:0.8); if(beat===0||beat===4) INST.kick(d,t,0.5); if(I&&(beat===2||beat===6)) INST.snare(d,t,0.4); }
    AU.next+=spb; AU.step++;
  }
}

function sfx(name,arg){

    case 'correct': [72,76,79,84].forEach((n,i)=>tone(d,t+i*0.07,mtof(n),0.25,{type:'triangle',vol:0.25,rel:0.3})); tone(d,t+0.28,mtof(88),0.5,{type:'sine',vol:0.18,rel:0.6}); break;
    case 'wrong': tone(d,t,mtof(64),0.18,{type:'sawtooth',vol:0.12,lp:1200,rel:0.2}); tone(d,t+0.18,mtof(58),0.4,{type:'sawtooth',vol:0.12,lp:900,rel:0.45,slide:0.92}); break;
    case 'buff': [79,84,88,91].forEach((n,i)=>tone(d,t+i*0.05,mtof(n),0.3,{type:'sine',vol:0.18,rel:0.4})); noise(d,t,0.3,{vol:0.05,f:8000}); break;
    case 'pop': { const now=c.currentTime; if(now-AU.lastPop<0.05) return; AU.lastPop=now; tone(d,t,rand(500,900),0.08,{type:'sine',vol:0.12,slide:0.4,rel:0.08}); break; }
    case 'bigpop': tone(d,t,180,0.4,{type:'sine',vol:0.35,slide:0.3,rel:0.4}); noise(d,t,0.3,{vol:0.2,f:600,ft:'lowpass'}); break;
    case 'pickup': tone(d,t,mtof(84),0.08,{type:'square',vol:0.1,lp:4000,rel:0.08}); tone(d,t+0.08,mtof(91),0.25,{type:'square',vol:0.1,lp:4000,rel:0.25}); break;
    case 'loot': tone(d,t,mtof(96),0.2,{type:'sine',vol:0.12,rel:0.25}); break;
    case 'rare': [84,88,91,96,100].forEach((n,i)=>tone(d,t+i*0.06,mtof(n),0.4,{type:'sine',vol:0.14,rel:0.5})); break;
    case 'safe': noise(d,t,0.5,{vol:0.14,f:300,sweep:5000,ft:'bandpass',q:2}); tone(d,t,mtof(72),0.6,{type:'sine',vol:0.1,rel:0.6,slide:1.5}); break;
    case 'boom': tone(d,t,90,0.9,{type:'sine',vol:0.5,slide:0.25,rel:0.9}); noise(d,t,0.8,{vol:0.35,f:1200,ft:'lowpass',sweep:100}); break;
    case 'stage': [60,64,67,72].forEach((n,i)=>tone(d,t+i*0.09,mtof(n),0.2,{type:'square',vol:0.1,lp:2500,rel:0.2})); INST.snare(d,t,0.6); INST.snare(d,t+0.09,0.5); INST.snare(d,t+0.18,0.7); break;
    case 'power': tone(d,t,mtof(60),0.6,{type:'sawtooth',vol:0.1,lp:2000,slide:2,rel:0.6}); tone(d,t+0.3,mtof(84),0.5,{type:'sine',vol:0.15,rel:0.5}); break;
    case 'block': tone(d,t,mtof(88),0.15,{type:'square',vol:0.1,lp:3000,rel:0.15}); noise(d,t,0.1,{vol:0.12,f:3000}); break;
    case 'heal': [72,79,84].forEach((n,i)=>tone(d,t+i*0.08,mtof(n),0.4,{type:'sine',vol:0.15,rel:0.45})); break;
    case 'freeze': tone(d,t,mtof(96),0.6,{type:'sine',vol:0.12,rel:0.7,vib:12}); noise(d,t,0.4,{vol:0.06,f:9000}); break;
    case 'over': [67,64,60,55].forEach((n,i)=>tone(d,t+i*0.25,mtof(n),0.4,{type:'triangle',vol:0.22,rel:0.5})); break;
    case 'revive': [60,67,72,79,84].forEach((n,i)=>tone(d,t+i*0.08,mtof(n),0.4,{type:'triangle',vol:0.2,rel:0.5})); break;
    case 'open': tone(d,t,mtof(72),0.12,{type:'sine',vol:0.12,rel:0.15}); tone(d,t+0.1,mtof(79),0.2,{type:'sine',vol:0.12,rel:0.25}); break;

}

// ================= 遊戲引擎 =================
const DIFFS = { easy:{spawn:1.3,dmg:0.7,spd:0.85}, normal:{spawn:1,dmg:1,spd:1}, hard:{spawn:0.78,dmg:1.3,spd:1.15} };
const keys = {};
const touch = {active:false, sx:0, sy:0};
let G = null, lastSettings = null, floorPattern = null;

function newGame(settings){

    flash:{a:0,c:'#fff'}, shake:0, spawnT:0.8, stage:1, banner:null,
    correct:0, answered:0, kills:0, wrongLog:[], lastHit:null,

    shield:0, freezeT:0, decoy:null, revived:false, orbitA:0, curQ:null, answering:false, buffOpts:[], hudKey:'',
    pickups:[], drops:[], fx:{}, got:{}, pickT:7, safeT:0, powTier:0, cdm:1, newLoot:0,

function startPlay(){ if(!G || G.state!=='intro') return; hide('scrMap'); G.state='play'; auInit(); auMusic(G.map.id); sfx('stage'); blurActive(); showBanner(`${G.map.name}：撐得越久越好！`); }
function blurActive(){ if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur(); }
function speedMul(){ return (1 + Math.min(G.t/180, 1.2)) * G.diff.spd; }
function skLv(kind){ let lv=0; for(const id in G.sk) if(SKILLS[id].kind===kind) lv+=G.sk[id]; return lv; }
function powMul(){ return 1+G.powTier*0.35+(G.fx.power>0?1:0); }
function cdMul(){ return Math.max(0.5, 1/(1+G.t/240)); }
function playerR(){ return G.fx.shrink>0?12:20; }
function skOf(kind){ for(const id in G.sk) if(SKILLS[id].kind===kind && G.sk[id]>0) return SKILLS[id]; return null; }

// ---------- 生成 ----------
function spawnPoint(fly, r){
  const c=G.cam, m=70;
  for(let tries=0;tries<12;tries++){
    const side=Math.random()*4|0; let x,y;
    if(side===0){x=rand(c.x-m,c.x+W+m);y=c.y-m;} else if(side===1){x=c.x+W+m;y=rand(c.y-m,c.y+H+m);}
    else if(side===2){x=rand(c.x-m,c.x+W+m);y=c.y+H+m;} else {x=c.x-m;y=rand(c.y-m,c.y+H+m);}
    x=clamp(x,r,WW-r); y=clamp(y,r,WH-r);
    if(Math.hypot(x-G.player.x,y-G.player.y)<320) continue;
    if(fly || !pointBlocked(x,y,r)) return {x,y};
  }
  return null;
}
function makeEnemy(type,x,y){
  const d=ENEMIES[type], p=G.player;
  const hp = d.hp<=1 ? 1 : d.hp + Math.floor(G.t/60);
  const e={type,x,y,r:d.r,hp,maxHp:hp,spd:d.spd*rand(0.88,1.12),ang:Math.atan2(p.y-y,p.x-x),t:rand(0,10),kx:0,ky:0,hitCD:0,life:0,flash:0,turnT:rand(1.5,3),side:Math.random()<0.5?1:-1,state:'go',st:0,look:0};
  if(d.beh==='bounce'){ const a=e.ang+rand(-0.6,0.6); e.vx=Math.cos(a); e.vy=Math.sin(a); }
  if(d.beh==='spiral'){ e.orbR=Math.hypot(p.x-x,p.y-y); e.orbA=Math.atan2(y-p.y,x-p.x); }
  if(d.seg) e.segs=Array.from({length:d.seg},()=>({x,y,a:0}));
  if(type==='guaizi') e.ch=pick(['曰','兮','焉','哉','乎','矣','也','耳']);
  G.enemies.push(e); return e;
}
function spawnEnemy(){
  const pool=G.roster.filter(r=>G.t>=r.at).map(r=>r.id);
  let tot=pool.reduce((s,id)=>s+ENEMIES[id].w,0), r=Math.random()*tot, type=pool[0];
  for(const id of pool){ r-=ENEMIES[id].w; if(r<=0){ type=id; break; } }
  const d=ENEMIES[type], sp=spawnPoint(d.fly,d.r); if(!sp) return;
  const n=d.group||1;
  for(let i=0;i<n;i++) makeEnemy(type, sp.x+rand(-30,30), sp.y+rand(-30,30));
}

// ---------- 特效 ----------
function burst(x,y,color,n=14,spd=200,size=5){ for(let i=0;i<n;i++){ const a=rand(0,Math.PI*2), s=rand(spd*0.3,spd); G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.4,0.8),max:0.8,c:color,s:rand(size*0.6,size*1.4)}); } }
function textParts(x,y,txt,color,n=10){ for(let i=0;i<n;i++) G.parts.push({x:x+rand(-34,34),y:y+rand(-22,22),vx:rand(-30,30),vy:rand(-130,-60),life:rand(0.8,1.3),max:1.3,c:color,s:rand(18,28),txt}); }
function ring(x,y,color,maxR,life=0.6,w=7){ G.rings.push({x,y,r:6,maxR,life,max:life,c:color,w}); }
function floatText(x,y,txt,color,size=24){ G.texts.push({x,y,txt,c:color,s:size,life:1.2,max:1.2}); }
function showBanner(txt){ G.banner={txt,life:2.4,max:2.4}; }

function damageEnemy(e,n,fx,fy,kb=240){
  if(e.dead) return;
  e.hp-=n*powMul(); e.flash=0.12;
  const a=Math.atan2(e.y-fy,e.x-fx), k=ENEMIES[e.type].tank?kb*0.3:kb;
  e.kx+=Math.cos(a)*k; e.ky+=Math.sin(a)*k;
  if(e.hp<=0) killEnemy(e,true);
}
function killEnemy(e,count){
  e.dead=true; if(count) G.kills++;
  const d=ENEMIES[e.type]; sfx(d.tank?'bigpop':'pop');
  burst(e.x,e.y,d.color==='#f8f9fa'?'#ced4da':d.color, d.tank?26:12, 230, 5);
  if(d.child){ for(let i=0;i<2;i++){ const c=makeEnemy(d.child,e.x+rand(-14,14),e.y+rand(-14,14)); c.kx=rand(-200,200); c.ky=rand(-200,200); } }
  if(Math.random()<0.2) floatText(e.x,e.y-12,pick(['退散！','走開！','KO！','拜拜～']),'#1f2233',20);
  if(count){
    // 打倒後震開周圍，留出逃生空間（越後期越大）
    const R=(d.tank?260:120)*(1+G.powTier*0.08), K2=d.tank?560:360;
    for(const o of G.enemies){ if(o.dead||o===e) continue; const dx=o.x-e.x, dy=o.y-e.y, dd=Math.hypot(dx,dy); if(dd<R){ const k=(1-dd/R)*K2*(ENEMIES[o.type].tank?0.4:1); o.kx+=dx/(dd||1)*k; o.ky+=dy/(dd||1)*k; } }
    if(d.tank) ring(e.x,e.y,'#ffffff',R,0.45,8);
    // 掉落收藏品
    const lid=LOOT_OF[e.type]||e.type;
    if(LOOT[lid] && G.drops.length<40){ const ch=LOOT[lid].rare?1:(G.fx.lucky>0?0.4:0.16); if(Math.random()<ch) G.drops.push({id:lid,x:e.x,y:e.y,life:16,vx:rand(-80,80),vy:rand(-80,80),bob:rand(0,6)}); }
  }
}

// ---------- 主更新 ----------
function update(dt){
  G.t+=dt;
  const p=G.player, sk=G.sk;
  const stage=1+Math.floor(G.t/30);
  if(stage>G.stage){ G.stage=stage; sfx('stage'); AU.intense=Math.min(3,stage/4|0); showBanner(`壓力升級！第 ${stage} 波來襲！`); }
  for(const r of G.roster){ if(!r.shown && G.t>=r.at && r.at>0){ r.shown=true; floatText(p.x,p.y-90,`新的壓力出現：${ENEMIES[r.id].name}`,'#b3123f',24); } }

  // 玩家移動
  let mx=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
  let my=((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
  if(touch.active){ const tx=touch.sx+G.cam.x, ty=touch.sy+G.cam.y, dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy); if(d>14){ mx=dx/d; my=dy/d; } }
  const len=Math.hypot(mx,my); if(len>0){ mx/=len; my/=len; p.dirX=mx; p.dirY=my; }
  p.r=playerR();
  const spd=255*(1+0.08*skLv('speed'))*(G.fx.shrink>0?1.35:1)*(G.fx.haste>0?1.5:1);
  p.x+=mx*spd*dt; p.y+=my*spd*dt; resolveObs(p,p.r);
  p.moving=len>0; if(mx) p.face=Math.sign(mx);
  if(p.inv>0) p.inv-=dt;
  for(const k in G.fx){ if(G.fx[k]>0){ G.fx[k]-=dt; if(G.fx[k]<=0){ G.fx[k]=0; floatText(p.x,p.y-60,`${FX_INFO[k]}結束`,'#646a85',20); } } }
  if(G.fx.ghost>0) p.inv=Math.max(p.inv,0.05);
  const tier=Math.floor(G.t/45);
  if(tier>G.powTier){ G.powTier=tier; sfx('power'); ring(p.x,p.y,'#ffd23f',220,0.8,12); floatText(p.x,p.y-110,`招式威力提升 ×${powMul().toFixed(2).replace(/0$/,'')}！越戰越強！`,'#e8590c',30); }
  // 安全圈：答題後 2 秒，周圍的壓力進不來
  if(G.safeT>0){ G.safeT-=dt; const SR=260; for(const e of G.enemies){ if(e.dead) continue; const dx=e.x-p.x, dy=e.y-p.y, dd=Math.hypot(dx,dy)||1, lim=SR+e.r; if(dd<lim){ e.x=p.x+dx/dd*lim; e.y=p.y+dy/dd*lim; e.kx+=dx/dd*120; e.ky+=dy/dd*120; } } }
  updateItems(dt);
  p.trailT-=dt;
  if(skLv('speed')>0 && p.moving && p.trailT<=0){ p.trailT=0.035; p.trail.push({x:p.x,y:p.y,life:0.3}); }
  p.trail.forEach(o=>o.life-=dt); p.trail=p.trail.filter(o=>o.life>0);
  G.cam.x=clamp(p.x-W/2,0,WW-W); G.cam.y=clamp(p.y-H/2,0,WH-H);

  // 生成
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=Math.max(0.34,1.2-G.t*0.007)*G.diff.spawn;
    const n=1+Math.floor(G.t/70);
    for(let i=0;i<n;i++) if(G.enemies.length<160) spawnEnemy();
  }
  if(G.freezeT>0) G.freezeT-=dt;
  if(G.decoy){ G.decoy.t-=dt; if(G.decoy.t<=0){ burst(G.decoy.x,G.decoy.y,'#4dabf7',16,180,4); G.decoy=null; } }

  // 怪物
  const mul=speedMul(), frozen=G.freezeT>0;
  const auraSk=skOf('aura'), auraLv=auraSk?sk[auraSk.id]:0, auraR=90+20*auraLv, auraSlow=Math.min(0.55,0.2+0.06*auraLv);
  for(const e of G.enemies){
    if(e.dead) continue;
    e.t+=dt; e.life+=dt; if(e.hitCD>0) e.hitCD-=dt; if(e.flash>0) e.flash-=dt;
    const d=ENEMIES[e.type];
    const tgt=G.decoy||p;
    const dx=tgt.x-e.x, dy=tgt.y-e.y, dist=Math.hypot(dx,dy)||1;
    e.look=clamp(dx/dist,-1,1);
    let sp=e.spd*mul;
    if(auraLv && Math.hypot(p.x-e.x,p.y-e.y)<auraR+e.r) sp*=(1-auraSlow);
    if(frozen) sp=0;
    let vx=0, vy=0;
    switch(d.beh){
      case 'dash': vx=Math.cos(e.ang)*sp; vy=Math.sin(e.ang)*sp; if(e.life>2 && dist>1500) e.dead=true; break;
      case 'zig': { e.ang=lerpAngle(e.ang,Math.atan2(dy,dx),dt*1.2); const z=Math.sin(e.t*3.2)>0?1.3:-1.3; vx=(Math.cos(e.ang)+Math.cos(e.ang+Math.PI/2)*z)*sp; vy=(Math.sin(e.ang)+Math.sin(e.ang+Math.PI/2)*z)*sp; break; }
      case 'home': case 'split': case 'swarm': vx=dx/dist*sp; vy=dy/dist*sp; e.ang=Math.atan2(dy,dx); break;
      case 'spin': vx=dx/dist*sp; vy=dy/dist*sp; break;
      case 'wobble': vx=dx/dist*sp+Math.cos(e.t*1.8)*40; vy=dy/dist*sp+Math.sin(e.t*2.6)*50; break;
      case 'bounce':
        e.turnT-=dt;
        if(e.turnT<=0){ e.turnT=rand(1.5,3); const a=Math.atan2(dy,dx)+rand(-1,1); e.vx=Math.cos(a); e.vy=Math.sin(a); }
        vx=e.vx*sp; vy=e.vy*sp; break;
      case 'snake': { const a=Math.atan2(dy,dx)+Math.sin(e.t*3)*0.7; vx=Math.cos(a)*sp; vy=Math.sin(a)*sp; break; }
      case 'blink':
        e.st+=dt; vx=dx/dist*sp*0.6; vy=dy/dist*sp*0.6;
        if(e.st>3.2 && dist<900 && !frozen){ e.st=0; burst(e.x,e.y,'#f03e3e',10,150,4); const a=rand(0,6.28), nx=tgt.x+Math.cos(a)*190, ny=tgt.y+Math.sin(a)*190; if(!pointBlocked(nx,ny,e.r)){ e.x=nx; e.y=ny; } burst(e.x,e.y,'#f03e3e',10,150,4); e.st=-0.6; }
        if(e.st<0){ vx=0; vy=0; }
        break;
      case 'spiral': { e.orbA+=dt*(sp/Math.max(80,e.orbR))*1.4; e.orbR=Math.max(0,e.orbR-sp*0.45*dt); const nx=tgt.x+Math.cos(e.orbA)*e.orbR, ny=tgt.y+Math.sin(e.orbA)*e.orbR; vx=(nx-e.x)/dt; vy=(ny-e.y)/dt; const vm=Math.hypot(vx,vy), cap=sp*2.2; if(vm>cap){ vx*=cap/vm; vy*=cap/vm; } break; }
      case 'charge':
        e.st+=dt;
        if(e.state==='go'){ vx=dx/dist*sp; vy=dy/dist*sp; if(dist<380 && e.st>1.2){ e.state='wind'; e.st=0; } }
        else if(e.state==='wind'){ if(e.st>0.9){ e.state='dash'; e.st=0; e.ang=Math.atan2(dy,dx); } }
        else { vx=Math.cos(e.ang)*sp*3.6; vy=Math.sin(e.ang)*sp*3.6; if(e.st>0.75){ e.state='go'; e.st=0; } }
        break;
      case 'pause':
        e.st+=dt;
        if(e.state==='rest'){ if(e.st>1.1){ e.state='go'; e.st=0; } }
        else { vx=dx/dist*sp; vy=dy/dist*sp; if(e.st>1.8){ e.state='rest'; e.st=0; } }
        break;
      case 'swoop':
        e.st+=dt;
        if(e.state!=='dive'){ const a=Math.atan2(e.y-tgt.y,e.x-tgt.x)+dt*1.6, R=260; const nx=tgt.x+Math.cos(a)*R, ny=tgt.y+Math.sin(a)*R; const ax=nx-e.x, ay=ny-e.y, am=Math.hypot(ax,ay)||1; vx=ax/am*sp; vy=ay/am*sp; if(e.st>2.2 && dist<420){ e.state='dive'; e.st=0; e.ang=Math.atan2(dy,dx); } }
        else { vx=Math.cos(e.ang)*sp*2.4; vy=Math.sin(e.ang)*sp*2.4; if(e.st>1){ e.state='go'; e.st=0; } }
        break;
      case 'hop': {
        e.st+=dt; const per=0.85;
        if(e.st>per){ e.st=0; e.ang=Math.atan2(dy,dx); }
        const ph=e.st/per; e.hopH=Math.sin(Math.min(1,ph/0.6)*Math.PI)*18;
        if(ph<0.6){ vx=Math.cos(e.ang)*sp*1.6; vy=Math.sin(e.ang)*sp*1.6; }
        break; }
    }
    if(frozen){ vx=0; vy=0; }
    e.x+=(vx+e.kx)*dt; e.y+=(vy+e.ky)*dt;
    const f=Math.pow(0.03,dt); e.kx*=f; e.ky*=f;
    if(!d.fly){
      const hit=resolveObs(e,e.r);
      if(hit && (vx||vy)){ const a=Math.atan2(vy,vx)+e.side*Math.PI/2; e.x+=Math.cos(a)*sp*0.8*dt; e.y+=Math.sin(a)*sp*0.8*dt; resolveObs(e,e.r);
        if(d.beh==='bounce'){ e.vx=-e.vx; e.vy=-e.vy; } }
    } else { e.x=clamp(e.x,-200,WW+200); e.y=clamp(e.y,-200,WH+200); }
    if(e.segs){ let px=e.x, py=e.y; for(const s of e.segs){ const ddx=px-s.x, ddy=py-s.y, dd=Math.hypot(ddx,ddy), gap=e.r*1.1; if(dd>gap){ s.x=px-ddx/dd*gap; s.y=py-ddy/dd*gap; } s.a=Math.atan2(ddy,ddx)+Math.PI/2; px=s.x; py=s.y; } }
    if(dist>2600 && e.life>4) e.dead=true; // 太遠的就回收
  }

  updateSkills(dt);

  // 碰撞
  if(p.inv<=0){
    for(const e of G.enemies){
      if(e.dead) continue;
      let hitMe=Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r*0.75;
      if(!hitMe && e.segs) hitMe=e.segs.some(s=>Math.hypot(s.x-p.x,s.y-p.y)<e.r*0.8+p.r*0.6);
      if(hitMe){
        if(G.shield>0){
          G.shield--; killEnemy(e,true); p.inv=0.35; sfx('block');
          const s=skOf('shield'); ring(p.x,p.y,s?s.color:'#4cc9f0',100,0.5,9); burst(p.x,p.y,s?s.color:'#4cc9f0',18,250,5);
          floatText(p.x,p.y-56,`${s?s.name:'護盾'}擋下了！`,'#0b4f8a',22);
        } else { e.dead=true; burst(p.x,p.y,ENEMIES[e.type].color,20,270,6); openQuiz(e); break; }
      }
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
}

// ---------- 招式運作 ----------
function tick(id,interval,dt){ if(!id.endsWith('_d')) interval*=G.cdm; G.timers[id]=(G.timers[id]??Math.min(1,interval))-dt; if(G.timers[id]<=0){ G.timers[id]+=interval; return true; } return false; }
function enemiesNear(x,y,R){ return G.enemies.filter(e=>!e.dead && Math.hypot(e.x-x,e.y-y)<R).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y)); }
function onScreen(e){ return e.x>G.cam.x-20 && e.x<G.cam.x+W+20 && e.y>G.cam.y-20 && e.y<G.cam.y+H+20; }
function fire(x,y,a,o){ G.proj.push(Object.assign({x,y,vx:Math.cos(a)*o.speed,vy:Math.sin(a)*o.speed,life:o.life||1.2,dmg:1,pierce:0,hit:new Set()},o)); }
function updateSkills(dt){
  const p=G.player; G.cdm=cdMul();
  for(const id in G.sk){
    const lv=G.sk[id]; if(!lv) continue;
    const s=SKILLS[id];
    switch(s.kind){
      case 'shot': {
        const arrow=s.style==='arrow', iv=(arrow?3.4:3.2)-0.35*(lv-1), range=arrow?620:380;
        if(tick(id,iv,dt)){
          const n=lv>=5?2:1, ts=enemiesNear(p.x,p.y,range).filter(onScreen).slice(0,n);
          if(!ts.length){ G.timers[id]=0.3; break; }
          ts.forEach((t,i)=>fire(p.x,p.y,Math.atan2(t.y-p.y,t.x-p.x),{speed:arrow?820:560,life:arrow?1:1.1,target:arrow?null:t,pierce:arrow?1+Math.floor(lv/2):0,ch:s.chars?s.chars[(G.t*3+i|0)%s.chars.length]:'',style:arrow?'arrow':'glyph',color:s.color}));
        }
        break; }
      case 'orbit': {
        G.orbitA+=dt*(1.6+0.2*lv);
        const n=Math.min(lv,4), R=62+lv*5;
        for(let i=0;i<n;i++){
          const a=G.orbitA+i*Math.PI*2/n, bx=p.x+Math.cos(a)*R, by=p.y+Math.sin(a)*R;
          for(const e of G.enemies){ if(e.dead||e.hitCD>0) continue; if(Math.hypot(e.x-bx,e.y-by)<e.r+16){ e.hitCD=1.4; damageEnemy(e,1,p.x,p.y,160); burst(bx,by,s.color,6,140,3); } }
        }
        break; }
      case 'pulse': {
        if(tick(id,10-1.1*(lv-1),dt)){
          const R=(90+lv*20)*(1+G.powTier*0.12);
          G.rings.push({x:p.x,y:p.y,r:6,maxR:R,life:0.6,max:0.6,c:s.color,w:10,style:s.style,g:s.rg});
          for(const e of G.enemies) if(!e.dead && Math.hypot(e.x-p.x,e.y-p.y)<R+e.r) damageEnemy(e,1,p.x,p.y,220);
        }
        break; }
      case 'nova': {
        if(tick(id,7-0.8*(lv-1),dt)){
          const n=3+lv, off=rand(0,6.28);
          for(let i=0;i<n;i++) fire(p.x,p.y,off+i*Math.PI*2/n,{speed:430,life:0.75,ch:s.chars,style:'glyph',color:s.color});
          ring(p.x,p.y,s.color,60,0.3,5);
        }
        break; }
      case 'cone': {
        if(tick(id,4-0.45*(lv-1),dt)){
          const n=2+lv, base=Math.atan2(p.dirY,p.dirX), spread=0.55;
          for(let i=0;i<n;i++){ const a=base+(n===1?0:(i/(n-1)-0.5)*spread*2); fire(p.x,p.y,a,{speed:520,life:0.55,ch:s.chars[i%s.chars.length],style:'glyph',color:s.color}); }
        }
        break; }
      case 'trail': {
        if(p.moving && tick(id+'_d',0.07,dt)) G.inkTrail.push({x:p.x,y:p.y,life:0.9+0.35*lv,max:0.9+0.35*lv,r:12+lv*2,c:s.color,g:s.glyph});
        if(tick(id,0.25,dt)){
          for(const m of G.inkTrail) for(const e of G.enemies){ if(e.dead||e.hitCD>0) continue; if(Math.hypot(e.x-m.x,e.y-m.y)<e.r+m.r){ e.hitCD=0.9; damageEnemy(e,1,m.x,m.y,40); } }
        }
        break; }
      case 'pool': {
        if(tick(id,7-0.8*(lv-1),dt)){
          const ts=enemiesNear(p.x,p.y,600); const t=ts.length?ts[Math.random()*Math.min(4,ts.length)|0]:null;
          const x=t?t.x:p.x+rand(-200,200), y=t?t.y:p.y+rand(-200,200);
          G.pools.push({x,y,r:60+12*lv,life:3,max:3,tick:0,c:s.color,style:s.style,g:s.glyph});
        }
        break; }
      case 'mine': {
        if(tick(id,5-0.6*(lv-1),dt) && G.mines.length<2+lv) G.mines.push({x:p.x+rand(-40,40),y:p.y+rand(-40,40),life:14,arm:0.6,R:80+10*lv,c:s.color,g:s.glyph,lv});
        break; }
      case 'strike': {
        if(tick(id,6-0.8*(lv-1),dt)){
          const vis=G.enemies.filter(e=>!e.dead&&onScreen(e)); shuffle(vis);
          for(const e of vis.slice(0,lv>=4?2:1)){ G.bolts.push({x:e.x,y:e.y,life:0.35,max:0.35}); damageEnemy(e,2,e.x,e.y-10,80); burst(e.x,e.y,'#fab005',10,200,4); }
          if(!vis.length) G.timers[id]=0.5;
        }
        break; }
      case 'aura': {
        if(lv>=3 && tick(id,1,dt)) for(const e of G.enemies) if(!e.dead && Math.hypot(e.x-p.x,e.y-p.y)<90+20*lv+e.r) damageEnemy(e,1,p.x,p.y,30);
        break; }
    }
  }
  // 子彈
  for(const pr of G.proj){
    pr.life-=dt;
    if(pr.target && !pr.target.dead){ const a=lerpAngle(Math.atan2(pr.vy,pr.vx),Math.atan2(pr.target.y-pr.y,pr.target.x-pr.x),dt*6), sp=Math.hypot(pr.vx,pr.vy); pr.vx=Math.cos(a)*sp; pr.vy=Math.sin(a)*sp; }
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
    if(pointBlocked(pr.x,pr.y)){ pr.life=0; burst(pr.x,pr.y,pr.color,6,120,3); continue; }
    for(const e of G.enemies){
      if(e.dead||pr.hit.has(e)) continue;
      if(Math.hypot(e.x-pr.x,e.y-pr.y)<e.r+9){ pr.hit.add(e); damageEnemy(e,pr.dmg,pr.x-pr.vx,pr.y-pr.vy,170); burst(pr.x,pr.y,pr.color,6,130,3); if(pr.pierce>0) pr.pierce--; else { pr.life=0; break; } }
    }
  }
  G.proj=G.proj.filter(pr=>pr.life>0);
  // 地面區域
  for(const pl of G.pools){
    pl.life-=dt; pl.tick-=dt;
    if(pl.tick<=0){ pl.tick=0.6; for(const e of G.enemies) if(!e.dead && Math.hypot(e.x-pl.x,e.y-pl.y)<pl.r+e.r*0.5) damageEnemy(e,1,pl.x,pl.y,60); }
  }
  G.pools=G.pools.filter(pl=>pl.life>0);
  for(const m of G.mines){
    m.life-=dt; if(m.arm>0){ m.arm-=dt; continue; }
    if(G.enemies.some(e=>!e.dead && Math.hypot(e.x-m.x,e.y-m.y)<e.r+18)){
      m.life=0; ring(m.x,m.y,m.c,m.R,0.45,10); textParts(m.x,m.y,m.g||'花',m.c,5);
      for(const e of G.enemies) if(!e.dead && Math.hypot(e.x-m.x,e.y-m.y)<m.R+e.r) damageEnemy(e,(m.lv||1)>=4?2:1,m.x,m.y,260);
    }
  }
  G.mines=G.mines.filter(m=>m.life>0);
  for(const m of G.inkTrail) m.life-=dt; G.inkTrail=G.inkTrail.filter(m=>m.life>0);
  for(const b of G.bolts) b.life-=dt; G.bolts=G.bolts.filter(b=>b.life>0);
}

function updateFx(dt){
  for(const o of G.parts){ o.life-=dt; o.x+=o.vx*dt; o.y+=o.vy*dt; const f=Math.pow(0.15,dt); o.vx*=f; o.vy*=f; }
  G.parts=G.parts.filter(o=>o.life>0); if(G.parts.length>900) G.parts.splice(0,G.parts.length-900);
  for(const r of G.rings){ r.life-=dt; r.r=r.maxR*(1-Math.pow(Math.max(0,r.life)/r.max,2)); }
  G.rings=G.rings.filter(r=>r.life>0);
  for(const t of G.texts){ t.life-=dt; t.y-=44*dt; } G.texts=G.texts.filter(t=>t.life>0);
  for(const b of G.beams) b.life-=dt; G.beams=G.beams.filter(b=>b.life>0);
  if(G.flash.a>0) G.flash.a=Math.max(0,G.flash.a-dt*1.6);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt);
  if(G.banner){ G.banner.life-=dt; if(G.banner.life<=0) G.banner=null; }
}


// ---------- 地圖道具與掉落物 ----------
function spawnPickup(){
  const list=MAP_PICKUPS[G.map.id]; if(!list) return;
  const p=G.player;
  for(let tries=0;tries<20;tries++){
    const a=rand(0,6.28), d=rand(260,620), x=clamp(p.x+Math.cos(a)*d,60,WW-60), y=clamp(p.y+Math.sin(a)*d,60,WH-60);
    if(pointBlocked(x,y,26)) continue;
    // 補血類在血少時比較容易出現
    let id=pick(list); if(p.hp<p.maxHp*0.4 && Math.random()<0.5){ const h=list.find(k=>PICKUPS[k].eff==='heal'); if(h) id=h; }
    G.pickups.push({id,x,y,life:18,max:18,bob:rand(0,6)}); return;
  }
}
function applyPickup(it){
  const d=PICKUPS[it.id], p=G.player;
  sfx({heal:'heal',freeze:'freeze',bomb:'boom'}[d.eff]||'pickup');
  burst(it.x,it.y,d.color,18,240,5); ring(p.x,p.y,d.color,150,0.5,9);
  floatText(p.x,p.y-80,`${d.name}！`,d.color,30); floatText(p.x,p.y-48,d.desc,'#1f2233',18);
  switch(d.eff){
    case 'heal': { const amt=Math.min(d.amt,p.maxHp-p.hp); p.hp+=amt; textParts(p.x,p.y,'+',d.color,10); break; }
    case 'freeze': G.freezeT=Math.max(G.freezeT,d.dur); G.flash={a:0.3,c:'#d0ebff'}; break;
    case 'bomb': { const R=360; ring(p.x,p.y,d.color,R,0.6,14); G.shake=0.35; for(const e of G.enemies){ if(e.dead) continue; const dd=Math.hypot(e.x-p.x,e.y-p.y); if(dd<R+e.r){ if(ENEMIES[e.type].tank) damageEnemy(e,2,p.x,p.y,600); else killEnemy(e,true); } } G.enemies=G.enemies.filter(e=>!e.dead); break; }
    default: G.fx[d.eff]=Math.max(G.fx[d.eff]||0,d.dur);
  }
}
function collectDrop(dr){

  else floatText(dr.x,dr.y-20,L.name,'#5c3d2e',18);

let lootPopT=0;

function updateItems(dt){
  const p=G.player;

  for(const it of G.pickups){ it.life-=dt; if(Math.hypot(it.x-p.x,it.y-p.y)<p.r+26){ it.life=0; applyPickup(it); } }
  G.pickups=G.pickups.filter(it=>it.life>0);

    dr.life-=dt; dr.x+=dr.vx*dt; dr.y+=dr.vy*dt; const f=Math.pow(0.02,dt); dr.vx*=f; dr.vy*=f;

// ---------- 答題 ----------
function drawQuestion(){ if(G.deck.length===0) G.deck=shuffle(G.pool.slice()); return G.deck.pop(); }
function lessonLabel(key){ if(key==='通用') return '通用練習'; if(!KNOWN_KEYS.has(key)) return '自訂：'+key; return key; }
function openQuiz(e){
  G.state='quiz'; G.lastHit=e.type; sfx('hit'); auDuck(0.35);
  G.shake=ENEMIES[e.type].tank?0.6:0.25; G.flash={a:0.35,c:'#ef476f'};
  const q=drawQuestion();
  if(q.bankOpts){ G.curQ={q,shown:q.bankOpts.slice(),ans:null}; }
  else{ const opts=[q.a,...q.w], order=shuffle([0,1,2,3]); G.curQ={q,shown:order.map(i=>opts[i]),ans:order.indexOf(0)}; }
  G.answering=false;
  const ty=TYPES.find(t=>t.id===q.c)||TYPES[0];
  $('hitImg').src=enemyThumb(e.type,96);
  $('hitMsg').textContent=`被「${ENEMIES[e.type].name}」撞到了！它說：「${pick(ENEMIES[e.type].taunts)}」答對才能化解！`;
  $('qTag').innerHTML=`<span class="gl" style="background:#fff;color:${ty.color}">${ty.glyph}</span>${esc(q.c)}`; $('qTag').style.background=ty.color;
  $('qLes').innerHTML=ic('book')+esc(lessonLabel(q.l));

  G.curQ.shown.forEach((txt,i)=>{ const b=document.createElement('button'); b.className='btn opt'; const k=document.createElement('span'); k.className='k'; k.textContent=i+1; const s=document.createElement('span'); s.textContent=txt; b.appendChild(k); b.appendChild(s); b.onclick=()=>chooseAnswer(i); box.appendChild(b); });
  show('scrQuiz'); focusFirst('scrQuiz','.opt');
}
async function chooseAnswer(i){
  if(!G||G.state!=='quiz'||G.answering) return;
  G.answering=true;
  const btns=[...$('qOpts').children]; btns.forEach(b=>b.disabled=true);
  if(G.curQ.q.bankOpts){ try{ const r=await GameBridge.check(G.curQ.q.id,i); G.curQ.ans=r.答案; G.curQ.q.a=G.curQ.q.bankOpts[r.答案]; G.curQ.q.h=r.解析||''; }
    catch(e){ G.answering=false; btns.forEach(b=>b.disabled=false); return; } }
  G.answered++;
  btns[G.curQ.ans].classList.add('correct');
  const ok=i===G.curQ.ans; if(!ok) btns[i].classList.add('wrong'); sfx(ok?'correct':'wrong');
  setTimeout(()=>{ hide('scrQuiz'); if(ok){ G.correct++; showBuffs(); } else wrongAnswer(); }, ok?600:950);
}
function wrongAnswer(){
  const p=G.player, q=G.curQ.q, tank=ENEMIES[G.lastHit].tank;
  const dmg=Math.round((12+Math.min(G.t/10,25))*G.diff.dmg*(tank?1.5:1));
  p.hp=Math.max(0,p.hp-dmg);
  G.shake=0.5; G.flash={a:0.6,c:'#d00000'};
  burst(p.x,p.y,'#d00000',24,290,6); floatText(p.x,p.y-56,`-${dmg}`,'#d00000',30);
  if(!G.wrongLog.includes(q)) G.wrongLog.push(q);
  G.deck.splice(Math.max(0,G.deck.length-3-(Math.random()*3|0)),0,q);
  G.state='feedback';
  $('wDmg').textContent=`生命值 -${dmg}（剩 ${p.hp} / ${p.maxHp}）`+(tank?'　大型壓力怪，傷害 ×1.5！':'');
  $('wAns').innerHTML=ic('check')+'<span></span>'; $('wAns').lastChild.textContent='正確答案：'+q.a;
  $('wHint').innerHTML=ic('ladder')+'<b>鷹架提示：</b>'; $('wHint').appendChild(document.createTextNode(q.h||'再讀一次題目，找出關鍵字。'));
  $('wBtn').textContent=(p.hp<=0 && !(skLv('revive')&&!G.revived))?'查看成績':'我懂了，繼續戰鬥！';

}
function closeWrong(){
  if(!G||G.state!=='feedback') return;
  hide('scrWrong');
  const p=G.player;
  if(p.hp<=0){
    if(skLv('revive') && !G.revived){ G.revived=true; sfx('revive'); p.hp=Math.round(p.maxHp*0.4); const s=skOf('revive'); resume(); ring(p.x,p.y,s.color,220,0.9,14); textParts(p.x,p.y,'生',s.color,10); showBanner(`${s.name}！再站起來！`); return; }
    gameOver();
  } else resume();
}
function resume(){
  G.state='play'; blurActive(); auDuck(1); sfx('safe');
  const p=G.player; p.inv=2.0; G.safeT=2;
  ring(p.x,p.y,'#ffffff',280,0.5,10); G.flash={a:0.25,c:'#fff'};
  // 清空身邊的小怪，大怪推到安全圈外
  for(const e of G.enemies){ if(e.dead) continue; const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<280){ if(ENEMIES[e.type].tank){ const a=Math.atan2(e.y-p.y,e.x-p.x); e.x=p.x+Math.cos(a)*(300+e.r); e.y=p.y+Math.sin(a)*(300+e.r); } else killEnemy(e,true); } }
  G.enemies=G.enemies.filter(e=>!e.dead);
}
function showBuffs(){
  G.state='buff';
  let avail=G.map.skills.map(id=>SKILLS[id]).filter(s=>G.sk[s.id]<s.max && !(s.kind==='shield'&&G.shield>=3) && !(s.minT&&G.t<s.minT) && !(s.kind==='decoy'&&G.decoy));
  const opts=[];
  while(opts.length<3 && avail.length){ let r=Math.random()*avail.reduce((a,s)=>a+s.w,0), ch=avail[0]; for(const s of avail){ r-=s.w; if(r<=0){ ch=s; break; } } opts.push(ch); avail=avail.filter(s=>s!==ch); }

const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

    c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);

async function readXlsx(buf){

    const rel=tags(rels,'Relationship').find(r=>r.getAttribute('Id')===rid);
    if(rel){ let t=rel.getAttribute('Target'); t=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,''); if(z.has(t)) sheetPath=t; }
  }catch(e){}
  const sx=xmlDoc(await z.text(sheetPath)), rows=[];
  for(const r of tags(sx,'row')){
    const row=[];
    for(const c of tags(r,'c')){
      const ref=c.getAttribute('r')||'', m=ref.match(/^[A-Z]+/); let ci=row.length;
      if(m){ ci=0; for(const ch of m[0]) ci=ci*26+ch.charCodeAt(0)-64; ci--; }
      const t=c.getAttribute('t'); let v='';
      if(t==='inlineStr') v=tags(c,'t').map(x=>x.textContent).join('');
      else { const vv=tags(c,'v')[0]; v=vv?vv.textContent:''; if(t==='s') v=ss[+v]??''; else if(t==='b') v=v==='1'?'TRUE':'FALSE'; }

    }
