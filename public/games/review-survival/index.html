}
function readCsv(buf){
  let s=new TextDecoder('utf-8').decode(buf); if(s.includes('\uFFFD')){ try{ s=new TextDecoder('big5').decode(buf); }catch(e){} }
  s=s.replace(/^\uFEFF/,''); const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<s.length;i++){ const ch=s[i];
    if(q){ if(ch==='"'){ if(s[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','||ch==='\t'){ row.push(cell); cell=''; } else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(ch!=='\r') cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function readDocx(buf){
  const z=unzip(buf), doc=xmlDoc(await z.text('word/document.xml'));
  const body=tags(doc,'w:body')[0]; const lines=[], tables=[];
  const ptext=p=>{ let s=''; for(const n of p.getElementsByTagName('*')){ if(n.tagName==='w:t') s+=n.textContent; else if(n.tagName==='w:tab') s+='\t'; else if(n.tagName==='w:br'||n.tagName==='w:cr') s+='\n'; } return s; };
  for(const el of body.children){
    if(el.tagName==='w:p') lines.push(ptext(el));
    else if(el.tagName==='w:tbl'){ const rows=[]; for(const tr of tags(el,'w:tr')){ rows.push(tags(tr,'w:tc').map(tc=>tags(tc,'w:p').map(ptext).join('\n').trim())); } tables.push(rows); lines.push(...rows.map(r=>r.join('\t'))); }
  }
  return {text:lines.join('\n'), tables};
}
async function readPdf(buf){
  let lib;
  try{ lib=await import(PDFJS_URL); }catch(e){ throw new Error('pdflib'); }
  lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const pdf=await lib.getDocument({data:new Uint8Array(buf),cMapUrl:PDFJS_CMAPS,cMapPacked:true}).promise;
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const tc=await (await pdf.getPage(i)).getTextContent();
    let lastY=null, line='';
    for(const it of tc.items){ if(!('str' in it)) continue; const y=it.transform?Math.round(it.transform[5]):lastY;
      if(lastY!==null && Math.abs(y-lastY)>2){ out.push(line); line=''; } line+=it.str; if(it.hasEOL){ out.push(line); line=''; lastY=null; continue; } lastY=y; }
    if(line) out.push(line);
  }
  return out.join('\n');
}

// ---------- 轉成題目 ----------
function matchType(s){
  s=String(s||'').trim(); if(!s) return null;
  if(TYPES.some(t=>t.id===s)) return s; if(T[s]) return T[s];
  if(/修辭/.test(s)) return '修辭辨析'; if(/閱讀|理解|文意/.test(s)) return '閱讀理解'; if(/國學|常識|文學|作者|文化/.test(s)) return '國學常識';
  if(/成語|詞/.test(s)) return '詞義成語'; if(/字音|字形|注音|國字|音|形/.test(s)) return '字音字形'; return null;
}
function matchLesson(s){
  s=String(s||'').replace(/[〈〉《》「」\s]/g,'').trim(); if(!s) return null;
  if(KNOWN_KEYS.has(s)) return s;
  for(const v of VERS) for(const vol of VOLS) for(const l of LES[v][vol]){ const t=l.t.replace(/^(自學|語常)：/,'').replace(/\s/g,''); if(t===s||t.replace(/[，、．]/g,'')===s.replace(/[，、．]/g,'')) return l.keys[0]; }
  for(const v of VERS) for(const vol of VOLS) for(const l of LES[v][vol]){ const t=l.t.replace(/^(自學|語常)：/,''); if(s.length>=2 && t.includes(s)) return l.keys[0]; }
  return s.slice(0,20);
}
const HEAD_RX={id:/^(編號|id|代號)$/i, l:/課次|課名|單元|標籤|題組|課/, c:/題型|類型|類別/, q:/題目|題幹|問題/, a:/正確答案|正解|答案/, w:/錯誤|誤答|誘答/, h:/提示|解析|鷹架|說明/, opt:/^(選項)?\s*[\(（]?([A-DＡ-Ｄ])[\)）]?$/};
function rowsToQuestions(rows){
  const res={qs:[],skip:[]}; if(!rows.length) return res;
  let hi=rows.slice(0,6).findIndex(r=>r.some(c=>HEAD_RX.q.test(String(c))));
  let map={};
  if(hi>=0){ rows[hi].forEach((c,i)=>{ c=String(c).trim(); const m=c.match(HEAD_RX.opt);
      if(HEAD_RX.id.test(c)) map.id=i; else if(HEAD_RX.q.test(c)) map.q=i; else if(HEAD_RX.w.test(c)) (map.w=map.w||[]).push(i); else if(HEAD_RX.a.test(c)) map.a=i;
      else if(HEAD_RX.h.test(c)) map.h=i; else if(HEAD_RX.c.test(c)) map.c=i; else if(HEAD_RX.l.test(c)) map.l=i; else if(m) (map.opt=map.opt||{})[m[2].replace(/[Ａ-Ｄ]/,x=>String.fromCharCode(x.charCodeAt(0)-0xFEE0))]=i; }); }
  else { hi=-1; map={id:0,l:1,c:2,q:3,a:4,w:[5,6,7],h:8}; if(rows[0].length<8) return res; }
  rows.slice(hi+1).forEach((r,ri)=>{
    const g=i=>i==null?'':String(r[i]??'').trim();
    const q=g(map.q); if(!q) return;
    let a=g(map.a), w=(map.w||[]).map(g).filter(Boolean);
    if(map.opt && /^[A-DＡ-Ｄ]$/i.test(a)){ const L=a.toUpperCase().replace(/[Ａ-Ｄ]/,x=>String.fromCharCode(x.charCodeAt(0)-0xFEE0)); const all=['A','B','C','D'].map(k=>g(map.opt[k])); a=all['ABCD'.indexOf(L)]; w=all.filter((x,i)=>i!=='ABCD'.indexOf(L)&&x); }
    const item={id:g(map.id),l:matchLesson(g(map.l)),c:matchType(g(map.c)),q,a,w:w.slice(0,3),h:g(map.h),row:hi+2+ri};
    if(!a||item.w.length<3){ res.skip.push(`第 ${item.row} 列：答案或錯誤選項不足`); return; }
    if(new Set([a,...item.w]).size<4){ res.skip.push(`第 ${item.row} 列：選項重複`); return; }
    res.qs.push(item);
  });
  return res;
}
function textToQuestions(text){
  const res={qs:[],skip:[]};
  let t=String(text).replace(/\r/g,'').replace(/[Ａ-Ｄ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/（/g,'(').replace(/）/g,')').replace(/：/g,':').replace(/\u3000/g,' ');
  // 文件最後的答案表：答案：1.B 2.C 3.A …
  const key={};
  t=t.split('\n').filter(line=>{ if(/^\s*(答案|解答|參考答案)/.test(line)){ const pairs=[...line.matchAll(/(\d{1,3})\s*[\.、．:]?\s*\(?\s*([A-D])\s*\)?/g)]; if(pairs.length>=2){ pairs.forEach(m=>key[+m[1]]=m[2]); return false; } } return true; }).join('\n');
  // 考卷寫法「( B )1. 題目」
  t=t.replace(/\(\s*([A-D])\s*\)\s*(\d{1,3})\s*[\.、．]/g,'\n$2. 〔答$1〕');
  const parts=t.split(/(?:^|\n)\s*(\d{1,3})\s*[\.、．]\s*(?=\S)/);
  let sticky={l:null,c:null};
  const takeMeta=(s,apply)=>s.replace(/^\s*(課次|課名|單元|題型)\s*:\s*(.+)$/gm,(m,k,v)=>{ if(k==='題型') apply.c=matchType(v); else apply.l=matchLesson(v); return ''; });
  { const pre={...sticky}; takeMeta(parts[0]||'',pre); sticky=pre; }
  for(let i=1;i<parts.length;i+=2){
    const num=+parts[i]; let b=parts[i+1]||''; const cur={...sticky};
    const firstOpt=b.search(/\(\s*A\s*\)|(?:^|\s)A\s*[\.、．]/);
    // 題目後面的課次／題型套用到下一題起
    const next={...sticky};
    if(firstOpt>=0){ const head=b.slice(0,firstOpt), tail=b.slice(firstOpt); b=takeMeta(head,cur)+takeMeta(tail,next); } else b=takeMeta(b,cur);
    if(next.l!==sticky.l||next.c!==sticky.c) sticky={l:next.l,c:next.c}; else if(cur.l!==sticky.l||cur.c!==sticky.c) sticky={...cur};
    let ans=key[num]||null;
    b=b.replace(/〔答([A-D])〕/,(m,x)=>{ ans=x; return ''; });
    let h='';
    b=b.replace(/(?:^|\n|\s)(?:提示|解析|詳解|說明|鷹架)\s*:\s*([\s\S]*)$/,(m,x)=>{ h=x.replace(/\s*\n\s*/g,'').trim(); return ''; });
    b=b.replace(/(?:^|\n|\s)(?:答案|正解|解答|Ans)\s*:?\s*\(?\s*([A-D])\s*\)?[^\n]*/i,(m,x)=>{ ans=ans||x; return ''; });
    let marks=[...b.matchAll(/\(\s*([A-D])\s*\)/g)];
    if(new Set(marks.map(m=>m[1])).size<4) marks=[...b.matchAll(/(?:^|\s)([A-D])\s*[\.、．]/g)];
    const pos={}; for(const m of marks) if(pos[m[1]]==null) pos[m[1]]=m;
    if(['A','B','C','D'].some(k=>!pos[k])){ res.skip.push(`第 ${num} 題：找不到 (A)～(D) 四個選項`); continue; }
    const seq=['A','B','C','D'].map(k=>pos[k]);
    const q=b.slice(0,seq[0].index).replace(/\s+/g,' ').trim();
    const opts=seq.map((m,j)=>b.slice(m.index+m[0].length, j<3?seq[j+1].index:undefined).replace(/\s+/g,' ').trim());
    if(!ans){ res.skip.push(`第 ${num} 題：沒有標示答案`); continue; }
    if(!q||opts.some(o=>!o)){ res.skip.push(`第 ${num} 題：題目或選項是空的`); continue; }
    if(new Set(opts).size<4){ res.skip.push(`第 ${num} 題：選項重複`); continue; }
    const ai='ABCD'.indexOf(ans);
    res.qs.push({id:'',l:cur.l,c:cur.c,q,a:opts[ai],w:opts.filter((x,j)=>j!==ai),h,row:num});
  }
  return res;
}

// ---------- 匯入流程（先預覽再確認） ----------
let IMP=null;
async function importAny(file){
  const name=file.name||'檔案', ext=(name.match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase();
  if(ext==='json') return importBank(file);
  if(ext==='xls'||ext==='doc'){ toast('這是舊版 Office 格式，請先「另存新檔」成 .xlsx 或 .docx 再匯入。',5200); return; }
  toast('讀取中…',8000);
  let res;
  try{
    const buf=await file.arrayBuffer();
    if(ext==='xlsx'||ext==='xlsm') res=rowsToQuestions(await readXlsx(buf));
    else if(ext==='csv') res=rowsToQuestions(readCsv(buf));
    else if(ext==='docx'){ const d=await readDocx(buf); const tb=d.tables.find(tb=>tb.slice(0,3).some(r=>r.some(c=>HEAD_RX.q.test(c))));
      res=tb?rowsToQuestions(tb):textToQuestions(d.text); }
    else if(ext==='pdf') res=textToQuestions(await readPdf(buf));
    else if(ext==='txt') res=textToQuestions(new TextDecoder().decode(buf));
    else { toast('只能匯入 Excel（.xlsx／.csv）、Word（.docx）、PDF 或 .json 題庫檔',5200); return; }
  }catch(e){ toast(e&&e.message==='pdflib'?'讀取 PDF 需要連上網路，請確認網路後再試一次。':'檔案讀取失敗，請確認檔案沒有損壞或加密。',5200); return; }
  $('toast').classList.remove('show');
  openImport(name,res);
}
function openImport(name,res){
  const base=name.replace(/\.[^.]+$/,'').slice(0,20)||'匯入題組';
  const ex=new Set(BANK.map(q=>q.q+'\u0001'+q.a));
  let upd=0, add=0, dup=0, same=0; const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
  for(const q of res.qs){ q.upd=!!(q.id && (DEFAULT_BY_ID[q.id]||DATA.added.some(x=>x.id===q.id)));
    if(q.upd){ const c=byId[q.id]; if(c && (q.l||c.l)===c.l && (q.c||c.c)===c.c && q.q===c.q && q.a===c.a && q.w.join('\u0001')===c.w.join('\u0001') && (q.h||'')===(c.h||'')){ q.upd=false; q.dup=true; q.same=true; same++; continue; } }
    q.dup=!q.upd && ex.has(q.q+'\u0001'+q.a); if(q.upd) upd++; else if(q.dup) dup++; else add++; }
  IMP={name,base,res};
  $('impFile').textContent=name;
  $('impSum').innerHTML=`解析到 <b>${res.qs.length}</b> 題：新增 <b>${add}</b> 題、更新 <b>${upd}</b> 題`+(same?`，<b>${same}</b> 題沒有變動`:'')+(dup?`，<b>${dup}</b> 題與題庫重複會略過`:'')+(res.skip.length?`；另有 <b class="warn">${res.skip.length}</b> 題格式不完整無法匯入`:'');
  const noL=res.qs.filter(q=>!q.l).length, noC=res.qs.filter(q=>!q.c).length;
  $('impLesWrap').hidden=!noL; $('impTypeWrap').hidden=!noC;
  $('impLesN').textContent=noL; $('impTypeN').textContent=noC;
  $('impLes').innerHTML=lessonOptionsHTML('__custom'); $('impCustom').value=base; $('impCustomWrap').hidden=false;
  $('impType').innerHTML=TYPES.map(t=>`<option ${t.id==='閱讀理解'?'selected':''}>${t.id}</option>`).join('');
  const sk=$('impSkip'); sk.hidden=!res.skip.length; sk.textContent=res.skip.length?'無法匯入：'+res.skip.slice(0,6).join('；')+(res.skip.length>6?`……等 ${res.skip.length} 題`:''):'';
  const pv=$('impPrev'); pv.innerHTML='';
  if(!res.qs.length){ pv.innerHTML='<p style="font-size:20px;font-weight:800;margin:20px">沒有找到可以匯入的題目。請參考下方的格式說明，或先匯出 Excel 當作範本。</p>'; }
  for(const q of [...res.qs].sort((a,b)=>(a.same?1:0)-(b.same?1:0)).slice(0,40)){ const d=document.createElement('div'); d.className='qrow';
    d.innerHTML=`<div><div class="meta">${q.upd?'<span class="pill st">更新</span>':q.same?'<span class="pill">沒有變動</span>':q.dup?'<span class="pill del">重複略過</span>':'<span class="pill" style="background:#d3f9e4">新增</span>'}<span class="pill"></span><span class="pill"></span></div><div class="q"></div><div class="ans"></div></div>`;
    const pl=d.querySelectorAll('.meta .pill'); pl[1].textContent=q.l?lessonLabel(q.l):'（未標課次）'; pl[2].textContent=q.c||'（未標題型）';
    d.querySelector('.q').textContent=q.q; d.querySelector('.ans').textContent='正解：'+q.a+'　誤：'+q.w.join('／'); pv.appendChild(d); }
  if(res.qs.length>40){ const p=document.createElement('p'); p.style.cssText='font-weight:800;text-align:center'; p.textContent=`……還有 ${res.qs.length-40} 題`; pv.appendChild(p); }
  $('impOk').disabled=!(add+upd);
  show('scrImport'); focusFirst('scrImport',add+upd?'#impOk':'#impCancel');
}
function confirmImport(){
  if(!IMP) return;
  let defL=$('impLes').value; if(defL==='__custom') defL=$('impCustom').value.trim()||IMP.base;
  const defC=$('impType').value;
  let add=0, upd=0;
  for(const it of IMP.res.qs){ if(it.dup) continue;
    const q={l:it.l||defL,c:it.c||defC,q:it.q,a:it.a,w:it.w,h:it.h||''};
    if(it.upd){ if(DEFAULT_BY_ID[it.id]){ const o=DEFAULT_BY_ID[it.id]; const same=o.l===q.l&&o.c===q.c&&o.q===q.q&&o.a===q.a&&o.w.join()===q.w.join()&&(o.h||'')===q.h; if(same){ if(DATA.overrides[it.id]) { delete DATA.overrides[it.id]; upd++; } } else { const cur=DATA.overrides[it.id]; if(!cur||JSON.stringify(cur)!==JSON.stringify(q)){ DATA.overrides[it.id]=q; upd++; } } }
      else { const i=DATA.added.findIndex(x=>x.id===it.id); if(i>=0){ DATA.added[i]={...q,id:it.id}; upd++; } } }
    else { DATA.added.push({...q,id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}); add++; }
  }
  IMP=null; hide('scrImport'); touchData(); fillLessonFilter(); renderList();
  toast(`已匯入：新增 ${add} 題、更新 ${upd} 題。記得按「儲存並同步」讓所有裝置更新。`,5200);
  focusFirst('scrAdmin','#adPublish');
}

boot();
</script>
