<title>好康滑滑樂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one-screen phone app. Sticker-style cards with thick ink borders, hard offset shadows and hand-drawn sticker illustrations; single deliberate light look. */
:root{
  --paper:#EFE9FB;
  --paper-2:#E2D9F7;
  --ink:#1E1633;
  --card:#FFFFFF;
  --yes:#FF4F79;
  --no:#22A99A;
  --gold:#FFC43D;
  --alarm:#E8352B;
  --gray:#8F7BD6;
  --muted:#6B6285;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);margin:0;overflow:hidden;
  background-image:radial-gradient(var(--paper-2) 1.2px,transparent 1.2px);background-size:18px 18px}
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:9px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.logo b{background:var(--yes);color:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 7px;box-shadow:3px 3px 0 var(--ink);font-weight:400}
.hr{display:flex;gap:6px;align-items:center;min-width:0}
.week{font-size:12.5px;font-weight:900;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mute{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:15px;box-shadow:2px 2px 0 var(--ink);flex:none;padding:0}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.prog i{height:6px;border-radius:3px;background:var(--paper-2);border:1.5px solid var(--ink)}
.prog i.on{background:var(--yes)}.prog i.done{background:var(--ink)}
.stats{display:grid;grid-template-columns:1.25fr 1.25fr 1fr .8fr;gap:6px}
.stat{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:5px 8px;box-shadow:3px 3px 0 var(--ink);min-width:0}
.stat small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.stat span{font-family:var(--f-num);font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp{height:6px;border:1.5px solid var(--ink);border-radius:4px;margin-top:3px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--no);transition:width .5s}
.stat.bump{animation:bump .5s}
.stat.hurt{animation:hurt .6s}
@keyframes bump{40%{transform:scale(1.08);background:var(--gold)}}
@keyframes hurt{20%,60%{transform:translateX(-5px);background:#FFD5D2}40%,80%{transform:translateX(5px)}}

.stage{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  display:flex;flex-direction:column;padding:15px;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;overflow:hidden}
.card.under{transform:scale(.95) translateY(10px);filter:saturate(.6);box-shadow:3px 3px 0 var(--ink)}
.card.fly{transition:transform .35s ease-in}
.card.back{transition:transform .25s cubic-bezier(.3,1.6,.6,1)}
.card.event{background:var(--gold)}
.who{display:flex;align-items:center;gap:12px}
.ava{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;flex:none}
.who h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:400}
.who .rel{font-size:12px;font-weight:700;color:var(--muted)}
.bubble{margin-top:12px;background:var(--paper);border:2px solid var(--ink);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:17px;line-height:1.6;font-weight:500;flex:none}
.card.event .bubble{background:#fff}
.ill{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 0}
.ill svg{height:100%;max-height:180px;width:auto;max-width:100%;overflow:visible}
.ill svg *{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.ill svg .bg{stroke:none;opacity:.55}
.ill svg text{stroke:none;fill:var(--ink);font-family:var(--f-display);font-weight:400}
.fy{fill:var(--gold)}.fp{fill:var(--yes)}.ft{fill:var(--no)}.fw{fill:#fff}.fl{fill:var(--paper-2)}.fr{fill:var(--alarm)}.fk{fill:var(--ink)}.fn{fill:none}.fg{fill:var(--gray)}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reward{background:var(--gold);border:2.5px solid var(--ink);border-radius:999px;padding:5px 13px;font-weight:900;font-size:15.5px;box-shadow:3px 3px 0 var(--ink);min-width:0}
.reward.neg{background:#FFD5D2}
.reward .n{font-family:var(--f-num)}
.count{font-family:var(--f-num);font-size:12px;color:var(--muted);flex:none}
.stamp{position:absolute;top:20px;font-family:var(--f-display);font-size:36px;border:4px solid;border-radius:12px;padding:0 12px;opacity:0;pointer-events:none;background:#fff;z-index:2}
.stamp.y{right:16px;color:var(--yes);transform:rotate(12deg)}
.stamp.n{left:16px;color:var(--no);transform:rotate(-12deg)}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;background:var(--no);color:#fff;border:3px solid var(--ink);border-radius:14px;
  padding:10px 16px;font-weight:900;font-size:16px;box-shadow:4px 4px 0 var(--ink);text-align:center;pointer-events:none;animation:pop 1.8s both;width:max-content;max-width:86%}
.toast.y{background:var(--gold);color:var(--ink)}
.toast.s{background:var(--ink);top:22%}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

.controls{display:flex;justify-content:center;gap:28px;padding-bottom:2px}
.btn{font:inherit;font-weight:900;cursor:pointer;border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--yes);outline-offset:3px}
.round{width:70px;height:70px;font-size:16px;display:grid;place-items:center;line-height:1.1}
.round.no{background:var(--no);color:#fff}
.round.yes{background:var(--yes);color:#fff}
.round i{font-style:normal;font-size:25px;display:block}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(30,22,51,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px;max-width:420px;width:100%;box-sizing:border-box;max-height:88vh;overflow:auto}
.start h1{font-family:var(--f-display);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.start p{font-size:16px;line-height:1.7;margin:0 0 8px}
.howto{display:flex;gap:10px;margin:14px 0 16px}
.howto div{flex:1;border:2px solid var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:14px}
.howto .l{background:#D3F3EE}.howto .r{background:#FFE0E8}
.wide{width:100%;padding:13px;font-size:19px;background:var(--yes);color:#fff}

.noti{animation:drop .45s cubic-bezier(.2,1.4,.5,1)}
.noti .bar{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px}
.noti .bar b{background:var(--alarm);color:#fff;border-radius:6px;padding:1px 6px}
.noti.g .bar b{background:var(--gray)}
.noti h3{font-family:var(--f-display);font-weight:400;font-size:27px;margin:0 0 8px;color:var(--alarm)}
.noti.g h3{color:var(--gray)}
.noti p{font-size:16px;line-height:1.7;margin:0 0 12px}
.loss{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.loss span{border:2px solid var(--ink);border-radius:8px;padding:3px 9px;font-weight:900;font-size:14px;background:#FFE3E0}
.dark{background:var(--ink);color:#fff;width:100%;padding:12px;font-size:17px}
@keyframes drop{0%{transform:translateY(-120%) rotate(-4deg)}100%{transform:none}}
.shake{animation:hurt .5s}

.later{font-family:var(--f-display);color:#fff;font-size:40px;text-align:center;animation:fade 2s both;line-height:1.4}
.later small{display:block;font-size:18px;font-family:var(--f-body);font-weight:700}
@keyframes fade{0%{opacity:0;transform:scale(.9)}25%,75%{opacity:1;transform:none}100%{opacity:0}}

.result h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.result .rank{display:inline-block;margin:8px 0 14px;background:var(--gold);border:2.5px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:900;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sum div{border:2px solid var(--ink);border-radius:10px;padding:7px 4px;text-align:center;min-width:0}
.sum small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sum b{font-family:var(--f-num);font-size:13.5px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.semh{font-family:var(--f-display);font-size:18px;margin:14px 0 0;padding:4px 10px;background:var(--ink);color:#fff;border-radius:8px;display:inline-block}
.match{border-top:2px dashed var(--ink);padding:12px 0;display:grid;grid-template-columns:40px 1fr;gap:10px}
.semh + .match{border-top:none}
.match .ava{width:38px;height:38px;font-size:17px}
.match > div{min-width:0}
.match h4{margin:0 0 4px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:900;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;white-space:nowrap}
.tag.bad{background:var(--alarm);color:#fff}.tag.good{background:var(--no);color:#fff}.tag.dodge{background:#D3F3EE}.tag.miss{background:var(--gold)}.tag.gray{background:var(--gray);color:#fff}
.match p{margin:0 0 5px;font-size:14px;line-height:1.65}
.match .law{background:var(--paper);border-radius:8px;padding:6px 9px;font-size:13.5px}
.match .stat-law{border:2px solid var(--alarm);border-radius:8px;padding:6px 9px;font-size:13.5px;background:#FFF4F3;margin:0 0 5px;line-height:1.65}
.match .stat-law b{color:var(--alarm)}
.match .stat-law ul{margin:4px 0;padding-left:18px}
.match .news{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin:12px 0 14px;line-height:1.6}
@media (max-height:640px){.ill svg{max-height:110px}.bubble{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header>
    <div class="logo"><b>好康</b>滑滑樂</div>
    <div class="hr"><div class="week" id="week">國一上・12 歲</div><button class="btn mute" id="mute" aria-label="關閉聲音">♪</button></div>
  </header>
  <div class="prog" id="prog"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="stats">
    <div class="stat" id="sMoney"><small>我的零用錢</small><span id="money">$0</span></div>
    <div class="stat" id="sParents"><small>爸媽存款</small><span id="parents">$200,000</span></div>
    <div class="stat" id="sHealth"><small>健康</small><span id="health">100</span><div class="hp"><i id="hpbar" style="width:100%"></i></div></div>
    <div class="stat" id="sRec"><small>紀錄</small><span id="rec">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="btn round no" id="bNo" aria-label="拒絕"><span><i>✕</i>不要</span></button>
    <button class="btn round yes" id="bYes" aria-label="接受"><span><i>♥</i>要！</span></button>
  </div>
</div>
<div class="overlay" id="ov"></div>

/* ===== 音效 (Web Audio 合成) ===== */
const A={ctx:null,on:true,master:null,mus:null,timer:null,step:0,next:0};
const mf=m=>440*Math.pow(2,(m-69)/12);
function aInit(){if(A.ctx){try{A.ctx.resume()}catch(e){}return;}
  try{A.ctx=new (window.AudioContext||window.webkitAudioContext)();A.master=A.ctx.createGain();A.master.gain.value=A.on?.9:0;A.master.connect(A.ctx.destination);
  A.mus=A.ctx.createGain();A.mus.gain.value=.5;A.mus.connect(A.master);A.next=A.ctx.currentTime+.1;A.timer=setInterval(sched,25);}catch(e){A.ctx=null}}
function tone(f,t,d,type,vol,dest,f2){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||A.master);o.start(t);o.stop(t+d+.05);}
function noise(t,d,vol,f1,f2,dest){const c=A.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const bp=c.createBiquadFilter();bp.type="bandpass";
  bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+d);const g=c.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp);bp.connect(g);g.connect(dest||A.master);s.start(t);}
const MEL=[72,0,76,79,81,0,79,76,74,0,72,74,76,0,0,0,72,0,76,79,84,0,81,79,76,0,74,72,74,0,0,0];
const BASS=[48,48,45,45,41,41,43,43];
let musicMode="main";
function sched(){if(!A.ctx)return;const st=60/116/2;
  while(A.next<A.ctx.currentTime+.12){const s=A.step%32,t=A.next;
    if(musicMode==="main"){
      if(MEL[s])tone(mf(MEL[s]),t,st*.9,"square",.05,A.mus);
      if(s%4===0)tone(mf(BASS[s/4]),t,st*1.8,"triangle",.14,A.mus);
      if(s%2===1)noise(t,.04,.05,6000,8000,A.mus);
    }else if(musicMode==="dark"){
      if(s%8===0)tone(mf(s%16===0?40:39),t,st*7,"sawtooth",.05,A.mus);
      if(s%4===2)noise(t,.06,.04,3000,2000,A.mus);
    }
    A.next+=st;A.step++;}}

/* ===== 遊戲狀態 ===== */
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?"-$":"$")+Math.abs(n).toLocaleString("zh-TW");
let S,DECK;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const inSem=(c,s)=>!c.s||(s>=c.s[0]&&s<=c.s[1]);
const isLegal=c=>["legal","miss","keep"].includes(c.t);
function draw(sem,used){const out=[];
  const take=(f,n)=>{shuffle(POOL.filter(c=>!used.has(c.id)&&inSem(c,sem)&&f(c))).slice(0,n).forEach(c=>{used.add(c.id);out.push(c)})};
  take(c=>c.t==="crime",1);take(c=>c.t==="gray",1);take(isLegal,1);take(c=>c.t==="crime"||c.t==="gray",1);
  return shuffle(out)}
function buildDeck(){const used=new Set(),d=[];
  for(let s=0;s<6;s++){if(EVENTS[s])d.push({c:EVENTS[s],sem:s});draw(s,used).forEach(c=>d.push({c,sem:s}))}
  return d}
function reset(){DECK=buildDeck();S={i:0,sem:0,money:0,parents:200000,health:100,rec:0,age:12,pending:[],log:[],busy:false,qBusy:false};musicMode="main";duck(.5);render()}
function render(){$("money").textContent=fmt(S.money);$("parents").textContent=fmt(S.parents);$("rec").textContent=S.rec;

  const nx=DECK[S.i+1],cur=DECK[S.i];
  if(nx){const u=cardEl(nx.c,S.i+2);u.classList.add("under");st.appendChild(u)}
  if(cur){const t=cardEl(cur.c,S.i+1);st.appendChild(t);bindDrag(t)}}

function bindDrag(el){let sx=0,sy=0,dx=0,dy=0,down=false;
  const sY=el.querySelector(".stamp.y"),sN=el.querySelector(".stamp.n");
  el.addEventListener("pointerdown",e=>{if(S.busy||S.qBusy)return;down=true;sx=e.clientX;sy=e.clientY;el.classList.remove("back");try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/14}deg)`;
    sY.style.opacity=Math.max(0,Math.min(1,dx/90));sN.style.opacity=Math.max(0,Math.min(1,-dx/90))});
  const up=()=>{if(!down)return;down=false;
    if(Math.abs(dx)>90)decide(dx>0,el);else{el.classList.add("back");el.style.transform="";sY.style.opacity=0;sN.style.opacity=0}dx=0;dy=0};
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up)}

function decide(yes,el){if(S.busy||S.qBusy)return;const item=DECK[S.i];if(!item)return;const c=item.c;S.busy=true;aInit();
  el=el||[...$("stage").querySelectorAll(".card")].pop();el.querySelector(yes?".stamp.y":".stamp.n").style.opacity=1;
  el.classList.add("fly");el.style.transform=`translate(${yes?600:-600}px,40px) rotate(${yes?30:-30}deg)`;
  yes?SFX.yes():SFX.no();
  const entry={c,yes,res:null,age:S.age,sem:item.sem};S.log.push(entry);
  const gain=v=>{S.money+=v;if(v>0){flash("sMoney","bump");setTimeout(SFX.coin,120);buzz(30)}else if(v<0)flash("sMoney","hurt")};
  if(c.t==="event"){gain(c.money);S.age=c.age;entry.res="good";setTimeout(SFX.bday,150);setTimeout(()=>toast(c.toast,"y"),350)}
  else if(yes){
    if(isLegal(c)){gain(c.money);entry.res="good";setTimeout(SFX.good,200);setTimeout(()=>toast("✓ 合法收入 "+(c.label||fmt(c.money))),350)}
    else{gain(c.money);entry.res=c.t==="crime"?"bad":"gray";S.pending.push({at:S.i+c.delay,entry,o:c.cons,kind:entry.res})}
  }else{
    if(c.t==="miss"){entry.res="miss";S.pending.push({at:S.i+1,entry,o:c.missed,kind:"gray"})}
    else if(c.t==="keep"){entry.res="bad";entry.kept=true;gain(c.kept.money);S.pending.push({at:S.i+2,entry,o:Object.assign({},c.kept,{money:-c.kept.money}),kind:"bad"})}
    else if(c.t==="legal")entry.res="skip";
    else entry.res="dodge";
  }
  setTimeout(()=>{S.i++;S.busy=false;
    const nx=DECK[S.i];let newSem=false;
    if(nx&&nx.sem!==S.sem){S.sem=nx.sem;S.age=Math.max(S.age,SEM_AGE[S.sem]);newSem=true}
    render();
    if(newSem){setTimeout(SFX.bell,100);toast(SEM[S.sem]+" 開學了","s")}
    checkPending()},330)}

function checkPending(){const due=S.pending.filter(p=>p.at<=S.i);S.pending=S.pending.filter(p=>p.at>S.i);
  if(S.i>=DECK.length){const rest=due.concat(S.pending);S.pending=[];return endPhase(rest)}
  if(due.length)setTimeout(()=>showQueue(due,()=>{}),250)}

function applyO(o){S.money+=o.money||0;S.parents+=o.parents||0;S.rec+=o.rec||0;S.health=Math.max(0,Math.min(100,S.health+(o.health||0)));
  if(o.money<0)flash("sMoney","hurt");if(o.money>0)flash("sMoney","bump");if(o.parents)flash("sParents","hurt");if(o.health)flash("sHealth","hurt");if(o.rec)flash("sRec","hurt");
  $("money").textContent=fmt(S.money);$("parents").textContent=fmt(S.parents);$("rec").textContent=S.rec;$("health").textContent=S.health;$("hpbar").style.width=S.health+"%"}
function showQueue(list,done){const ov=$("ov");if(!list.length){S.qBusy=false;ov.hidden=true;duck(.5);return done()}
  S.qBusy=true;const p=list.shift(),o=p.o;applyO(o);
  const bad=p.kind==="bad";bad?SFX.alarm():SFX.meh();buzz(bad?[80,60,80,60,80]:[60]);duck(.12);
  const chips=[];if(o.money)chips.push(`<span>零用錢 ${o.money>0?"+":""}${fmt(o.money)}</span>`);if(o.parents)chips.push(`<span>爸媽存款 ${fmt(o.parents)}</span>`);
  if(o.health)chips.push(`<span>健康 ${o.health}</span>`);if(o.rec)chips.push(`<span>紀錄 +1</span>`);
  ov.hidden=false;
  ov.innerHTML=`<div class="sheet noti${bad?"":" g"}"><div class="bar"><b>${bad?"警告":"通知"}</b>關於：${p.entry.c.from}・${bad?"違法":p.entry.c.victim?"你是被害人":"有事但不犯法"}</div>
  <h3>${o.title}</h3><p>${o.body}</p><div class="loss">${chips.join("")}</div>
  <button class="btn dark" id="ok">……好喔</button></div>`;
  const app=$("app");app.classList.remove("shake");void app.offsetWidth;if(bad)app.classList.add("shake");
  const b=$("ok");b.focus();b.onclick=()=>showQueue(list,done)}

function endPhase(rest){const ov=$("ov");ov.hidden=false;S.qBusy=true;
  ov.innerHTML=`<div class="later">畢業典禮<small>${rest.length?"可是在你拿到畢業證書之前……":"三年過去了"}</small></div>`;
  SFX.bell();
  if(!rest.length)return setTimeout(results,2000);
  musicMode="dark";setTimeout(()=>showQueue(rest,results),2000)}

function juv(age,kind){
  if(kind==="admin")return age<14
    ?`你當時 ${age} 歲：行政罰法和社會秩序維護法都規定未滿 14 歲不罰，但罰單、沒入和賠償通常會找上車主或家長，學校也會處理。`
    :`你當時 ${age} 歲：14 到 18 歲的違規可以減輕處罰，但還是會罰。`;
  return age<14
    ?`你當時 ${age} 歲：刑法第 18 條規定未滿 14 歲不罰，所以不會被判刑。但少年事件處理法規定 12 到 18 歲觸法由少年法院處理，可能被訓誡、假日生活輔導、保護管束，嚴重時安置輔導或感化教育。`
    :`你當時 ${age} 歲：已經到刑事責任年齡。少年法院會先審理，多半給保護處分；但若犯的是最輕本刑 5 年以上的重罪，會移送檢察官，跟大人一樣起訴、可能被判刑。`}
function rank(){const r=S.rec,h=S.health;
  if(r===0&&h>=80)return"人間清醒・法律雷達滿格";if(r===0)return"沒犯法，但把自己搞得很累";if(r<=2)return"差一點就被坑";if(r<=4)return"好康收割機（被收割的那種）";if(r<=6)return"少年法院的常客";return"詐騙集團的 VIP 會員"}
function results(){S.qBusy=true;musicMode="main";duck(.35);SFX.end();const ov=$("ov");ov.hidden=false;
  const lost=200000-S.parents,dodged=S.log.filter(l=>l.res==="dodge").length;
  const tags={bad:["犯法","bad"],gray:["有事但不犯法","gray"],good:["合法","good"],dodge:["閃過陷阱","dodge"],miss:["錯過權利","miss"],skip:["沒拿","dodge"]};
  let lastSem=-1,rows="";
  S.log.filter(l=>l.c.t!=="event").forEach(l=>{const c=l.c,t=(c.victim&&l.res==="gray")?["你是被害人","miss"]:tags[l.res];let out="",extra="";
    if(l.sem!==lastSem){rows+=`<div class="semh">${SEM[l.sem]}</div>`;lastSem=l.sem}
    if(l.kept){out=c.kept.body;extra=`<div class="stat-law"><b>違反條文</b><ul>${c.keptLaws.map(x=>`<li>${x}</li>`).join("")}</ul>${juv(l.age,"criminal")}</div>`}
    else if(l.res==="bad"){out=c.cons.body;extra=`<div class="stat-law"><b>違反條文</b><ul>${c.laws.map(x=>`<li>${x}</li>`).join("")}</ul>${juv(l.age,c.kind)}${c.civil?"<br>另外，未成年人造成別人損失，爸媽依民法第 187 條要連帶賠償。":""}</div>`}
    else if(l.res==="gray")out=c.cons.body;
    else if(l.res==="miss")out=c.missed.body;
    else if(l.res==="dodge")out="你拒絕了。如果接受："+c.cons.body;
    else if(l.res==="good")out="這是合法的好康，你拿到了。";
    else out="這其實是合法的好康，你錯過了。";
    rows+=`<div class="match"><div class="ava" style="background:${c.c}">${c.from[0]}</div><div>
    <h4>${c.from}<span class="tag ${t[1]}">${t[0]}</span><span class="tag">你${l.yes?"右滑":"左滑"}</span></h4>
    <p>${out}</p>${extra}<p class="law">${c.law}</p>${c.news?`<p class="news">${c.news}</p>`:""}</div></div>`});
  ov.innerHTML=`<div class="sheet result"><h1>國中三年畢業結算</h1><div class="rank">${rank()}</div>
  <div class="sum"><div><small>零用錢</small><b>${fmt(S.money)}</b></div><div><small>爸媽賠掉</small><b>${fmt(lost)}</b></div><div><small>健康</small><b>${S.health}</b></div><div><small>紀錄</small><b>${S.rec} 筆</b></div></div>
  <div class="legend"><span class="tag bad">犯法</span><span class="tag gray">有事但不犯法</span><span class="tag good">合法</span><span class="tag dodge">閃過陷阱 ${dodged}</span></div>
  ${rows}
  <p class="foot">遊戲裡的罰款、賠償金額與事件經過為示意，實際結果依個案而定。遇到不確定的「好康」，先問家人或老師；疑似詐騙可撥 165 反詐騙專線，消費問題可撥 1950。每次重玩，卡片都會重新抽。</p>
  <button class="btn wide" id="again">重新入學（換一副牌）</button></div>`;
  ov.querySelector(".sheet").scrollTop=0;$("again").onclick=()=>{ov.hidden=true;reset()}}

function start(){const ov=$("ov");ov.hidden=false;
  ov.innerHTML=`<div class="sheet start"><h1>好康滑滑樂</h1>
  <p>你 12 歲，剛升上國一。接下來三年，很多人會丟好康給你：打工、團購、跑腿、便宜貨、好玩的東西。</p>
  <p>你只要決定<b>要</b>還是<b>不要</b>。目標：畢業時零用錢越多越好。</p>
  <div class="howto"><div class="l">← 左滑<br>不要</div><div class="r">右滑 →<br>要！</div></div>
  <button class="btn wide" id="go">開始國中生活</button></div>`;
  $("go").onclick=()=>{aInit();SFX.bell();ov.hidden=true};$("go").focus()}

$("bYes").onclick=()=>decide(true);$("bNo").onclick=()=>decide(false);
$("mute").onclick=()=>{A.on=!A.on;aInit();if(A.master)A.master.gain.value=A.on?.9:0;$("mute").textContent=A.on?"♪":"✕";$("mute").setAttribute("aria-label",A.on?"關閉聲音":"開啟聲音")};
document.addEventListener("keydown",e=>{if(!$("ov").hidden)return;if(e.key==="ArrowRight")decide(true);if(e.key==="ArrowLeft")decide(false)});
reset();start();
</script>

</body></html>
