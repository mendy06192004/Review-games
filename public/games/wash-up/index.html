<style>
/* Layout: one-screen game column. Slim HUD (hint + finish), canvas stage with scrollable item shelf, overlays for title / menu / ending. Soft realistic bathroom palette with warm brown line art. */
:root{
  --tile:#e3f1f4; --grout:#cfe3e8; --pink:#ff6f9f; --pink-soft:#ffe0ea; --lemon:#ffe27a;
  --ink:#7a5a52; --cream:#fffaf5; --mint:#2fae8f; --sky:#8ccfee; --muted:#7d625c;
  --f-display:'Huninn','Chiron GoRound TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-body:'Chiron GoRound TC','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 2px,transparent 2px),linear-gradient(90deg,var(--grout) 2px,transparent 2px);
  background-size:46px 46px;
  color:var(--ink); font-family:var(--f-body); overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
#app{height:100%; max-width:1600px; margin:0 auto; box-sizing:border-box; display:flex; flex-direction:column; gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:8px}
.hud{background:var(--cream); border:2.5px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink); padding:8px 10px; display:flex; flex-direction:column; gap:6px}
.hud .row{display:flex; align-items:center; gap:8px}
.lvname{font-family:var(--f-display); font-size:25px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.btn-s{font:700 17px var(--f-body); color:var(--ink); background:var(--lemon); border:2px solid var(--ink); border-radius:999px; padding:5px 11px; cursor:pointer; white-space:nowrap}
.btn-s.ghost{background:#fff}
.btn-s.go{background:var(--pink); color:#fff}
.btn-s[aria-pressed="false"]{background:#ece4e2}
.btn-s:focus-visible,.btn-big:focus-visible,.theme:focus-visible{outline:3px solid var(--pink); outline-offset:2px}
.hint{display:flex; align-items:center; gap:8px}
.hint p{margin:0; flex:1; min-width:0; font-weight:700; font-size:19px; line-height:1.45; text-wrap:balance}
.hint p b{color:var(--pink)}
.hint p small{display:block; font-size:12px; color:var(--muted); font-weight:700}
#stage{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center}
#cv{display:block; border:2.5px solid var(--ink); border-radius:22px; box-shadow:0 5px 0 var(--ink); background:#fff; touch-action:none; cursor:grab}
#toast{position:absolute; top:10px; left:50%; transform:translate(-50%,-8px); opacity:0; pointer-events:none; max-width:88%; text-align:center; font-weight:900; font-size:17px; line-height:1.4;
  background:#fff; border:2.5px solid var(--ink); border-radius:14px; padding:6px 12px; box-shadow:0 3px 0 var(--ink); transition:opacity .2s, transform .2s; z-index:9}
#toast.show{opacity:1; transform:translate(-50%,0)}
.overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; z-index:8}
.overlay[hidden]{display:none!important}
#titleOv{justify-content:space-between; padding-block:14px; pointer-events:none}
#titleOv > *{pointer-events:auto}
.title{font-family:var(--f-display); font-size:clamp(26px,8vw,40px); line-height:1.2; text-align:center; text-wrap:balance; margin:0; padding:0 8px; letter-spacing:.02em}
.title span{display:inline-block; animation:bob 1.6s ease-in-out infinite;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 6px 0 var(--ink)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.sub{font-weight:900; background:var(--cream); border:2.5px solid var(--ink); border-radius:999px; padding:4px 14px; margin-top:8px; font-size:14px}
.btn-big{font:900 19px var(--f-display); color:#fff; background:var(--pink); border:2.5px solid var(--ink); border-radius:999px; padding:11px 26px; box-shadow:0 5px 0 var(--ink); cursor:pointer; letter-spacing:.04em}
.btn-big.alt{background:#fff; color:var(--ink)}
.btn-big:active{transform:translateY(3px); box-shadow:0 2px 0 var(--ink)}
#menuOv{background:rgba(255,250,245,.6); justify-content:flex-start; padding:12px; overflow:auto}
.menu-head{text-align:center; display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
.menu-head h2{font-family:var(--f-display); font-size:24px; margin:0}
.menu-head p{margin:0; font-weight:700; font-size:14px}
.themes{display:grid; grid-template-columns:1fr; gap:9px; width:100%; max-width:420px}
.theme{font:inherit; color:var(--ink); text-align:left; cursor:pointer; min-width:0; background:#fff; border:2.5px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink);
  padding:8px 12px; display:grid; grid-template-columns:54px 1fr auto; gap:2px 12px; align-items:center}
.theme:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.theme canvas{grid-row:span 2; width:54px; height:54px; background:var(--pink-soft); border:2px solid var(--ink); border-radius:14px}
.theme b{font-family:var(--f-display); font-size:22px; font-weight:400; line-height:1.2}
.theme small{font-size:16px; line-height:1.35; font-weight:700; color:var(--muted)}
.theme .tag{grid-column:3; grid-row:1 / span 2; font-size:12px; font-weight:900; border:2px solid var(--ink); border-radius:999px; padding:2px 9px; background:#ece4e2; white-space:nowrap}
.theme.ok .tag{background:#c4f0de}
#finaleBtn{margin-top:14px}
#endOv{justify-content:flex-end; padding:10px; pointer-events:none}
#endOv .card{pointer-events:auto}
.card{background:var(--cream); border:2.5px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); width:100%; max-width:400px; max-height:72%; overflow:auto; box-sizing:border-box; padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px}
.card .eyebrow{font-size:12px; font-weight:900; letter-spacing:.12em; color:var(--mint)}
.card h2{font-family:var(--f-display); font-size:27px; margin:0; text-wrap:balance}
.card p{margin:0; line-height:1.6; font-size:18px}
.card h3{margin:4px 0 0; font-size:16px; letter-spacing:.08em; color:var(--muted)}
.card ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.card li{position:relative; padding-left:20px; line-height:1.55; font-size:18px}
.card li::before{content:""; position:absolute; left:2px; top:.45em; width:10px; height:10px; border-radius:50%; background:var(--sky); border:2px solid var(--ink); box-sizing:border-box}
.card li.bad::before{background:#ff9fb6}
.card li.good::before{background:#9ce8c8}
.score{display:flex; align-items:baseline; justify-content:space-between; gap:8px; border-bottom:2px dashed var(--ink); padding-bottom:6px}
.score b{font-family:var(--f-display); font-size:30px; color:var(--pink); font-variant-numeric:tabular-nums}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px}
.bigscore{display:flex; flex-direction:column; align-items:center; gap:0; padding:4px 0 8px; border-bottom:2px dashed var(--ink)}
.bigscore span{font-weight:900; font-size:13px; letter-spacing:.12em; color:var(--muted)}
.bigscore b{font-family:var(--f-display); font-size:60px; line-height:1; color:var(--pink); font-weight:400; font-variant-numeric:tabular-nums}
.bigscore i{font-style:normal; font-family:var(--f-display); font-size:26px; color:var(--pink)}
.stars{font-size:22px; letter-spacing:4px; color:#f0b020; min-height:26px}
.steps{display:flex; flex-wrap:wrap; align-items:center; gap:6px 4px}
.step{display:flex; flex-direction:column; align-items:center; gap:2px; width:62px; position:relative}
.step canvas{width:46px; height:46px; border:2px solid var(--ink); border-radius:12px; background:#fff}
.step.ok canvas{background:#d8f6ea}
.step.no canvas{background:#ffe3ea; opacity:.85}
.step small{font-size:13px; font-weight:900; line-height:1.25; text-align:center}
.step .badge{position:absolute; top:-6px; right:2px; width:20px; height:20px; border-radius:50%; border:2px solid var(--ink); font-size:12px; font-weight:900; display:grid; place-items:center; background:#fff}
.step.ok .badge{background:#2fae8f; color:#fff}
.step.no .badge{background:#ff6f9f; color:#fff}
.step .num{position:absolute; top:-6px; left:4px; font-size:11px; font-weight:900; background:var(--lemon); border:2px solid var(--ink); border-radius:999px; padding:0 5px}
.arrow{font-weight:900; color:var(--muted)}
#finishBtn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#endOv .card.intro > *:not(.bigscore):not(#endTitle):not(.eyebrow){display:none}
#endOv .card.intro .bigscore b{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (min-aspect-ratio: 5/4){.hud{max-width:none}#app{max-width:1600px}}
@media (prefers-reduced-motion: reduce){.title span,#finishBtn.pulse{animation:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="row">
      <button class="btn-s ghost" id="menuBtn" type="button" hidden>← 主題</button>
      <span class="lvname" id="lvName">洗香香大作戰</span>
      <button class="btn-s" id="bgmBtn" type="button" aria-pressed="true">♪ 音樂開</button>
    </div>
    <div class="hint">
      <p id="hintText">按「開始洗香香」，選一個主題開始玩！</p>
      <div style="display:flex;flex-direction:column;gap:5px"><button class="btn-s" id="hintBtn" type="button" aria-pressed="false" hidden>提示</button><button class="btn-s go" id="finishBtn" type="button" hidden>完成！看結果</button></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv" width="420" height="780" aria-label="遊戲畫面：從下方道具架拖曳道具到角色身上"></canvas>

    <div class="overlay" id="titleOv">
      <div style="display:flex;flex-direction:column;align-items:center">
        <h1 class="title" id="titleText">今天好無聊喔！不然把自己洗香香吧！</h1>
        <div class="sub">6 個主題・想怎麼洗就怎麼洗・每種選擇都有結局</div>
      </div>
      <button class="btn-big" id="startBtn" type="button">開始洗香香</button>
    </div>
    <div class="overlay" id="menuOv" hidden>
      <div class="menu-head"><h2>今天想洗哪裡？</h2><p>沒有標準答案，亂洗也會有結局！</p></div>
      <div class="themes" id="themes"></div>
      <button class="btn-big" id="finaleBtn" type="button" hidden>看看變身結果 ✨</button>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="card">
        <div class="bigscore"><span>香香指數</span><div><b id="endScore">0</b><i>%</i></div><div class="stars" id="endStars"></div></div>

        <h3>做得好・可以更好</h3>
        <ul id="endLines"></ul>
        <h3>衛教小知識</h3>
        <ul id="endTips"></ul>
        <div class="btns"><button class="btn-big alt" id="retryBtn" type="button">再玩一次</button><button class="btn-big" id="backBtn" type="button">回主題選單</button></div>
      </div>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),MAIN=cv.getContext('2d');let g=MAIN;
const W=420,H=780,SH=560,TAU=Math.PI*2,LINE='rgba(120,78,68,.38)',TXT='#5b3a32';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rgbOf(c){if(c[0]==='#'){const v=parseInt(c.slice(1),16);return[v>>16,v>>8&255,v&255]}const m=c.match(/[\d.]+/g)||[0,0,0];return[+m[0],+m[1],+m[2]]}
function mix(c1,c2,t){t=clamp(t,0,1);const a=rgbOf(c1),b=rgbOf(c2);return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`}
function E(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU)}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function FL(c,fill,lw=1.4,stroke=LINE){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke()}}
function LG(c,x0,y0,x1,y1,...st){const q=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>q.addColorStop(i/(st.length-1||1),s));return q}
function RG(c,x,y,r,...st){const q=c.createRadialGradient(x,y,0,x,y,Math.max(.1,r));st.forEach((s,i)=>q.addColorStop(i/(st.length-1||1),s));return q}
function star(c,x,y,r,col){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.35:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fillStyle=col;c.fill()}
function outlineText(c,s,x,y,size,fill,stroke=TXT,w=5){c.font=`900 ${size}px "Huninn","Chiron GoRound TC",sans-serif`;c.textAlign='center';c.lineJoin='round';c.lineWidth=w;c.strokeStyle=stroke;c.strokeText(s,x,y);c.fillStyle=fill;c.fillText(s,x,y)}
function makeCells(x0,y0,w,h,step,test,init){const a=[];for(let y=y0;y<=y0+h;y+=step)for(let x=x0;x<=x0+w;x+=step)if(test(x,y))a.push(Object.assign({x,y,jx:rnd(-3,3),jy:rnd(-3,3),k:Math.random()},init?init(x,y):{}));return a}
function forNear(cells,x,y,r,fn){const r2=r*r;for(const c of cells){const dx=c.x-x,dy=c.y-y,q=dx*dx+dy*dy;if(q<r2)fn(c,1-Math.sqrt(q)/r*.6)}}
function frac(cells,pred){if(!cells.length)return 1;let n=0;for(const c of cells)if(pred(c))n++;return n/cells.length}
function avg(cells,key){if(!cells.length)return 0;let s=0;for(const c of cells)s+=c[key];return s/cells.length}
function centroid(cells,pred){let x=0,y=0,n=0;for(const c of cells)if(pred(c)){x+=c.x;y+=c.y;n++}return n?{x:x/n,y:y/n}:null}
function inE(p,cx,cy,rx,ry){return ((p.x-cx)/rx)**2+((p.y-cy)/ry)**2<1}
function inR(p,x0,y0,x1,y1){return p.x>=x0&&p.x<=x1&&p.y>=y0&&p.y<=y1}

/* ================= AUDIO ================= */
const AU={C:null,on:true};
function auInit(){
  if(AU.C){if(AU.C.state==='suspended')AU.C.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const C=new AC();AU.C=C;
  AU.master=C.createGain();AU.master.gain.value=.9;AU.master.connect(C.destination);
  AU.sfx=C.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.master);
  AU.bgm=C.createGain();AU.bgm.gain.value=AU.on?.3:0;AU.bgm.connect(AU.master);
  const dl=C.createDelay();dl.delayTime.value=.27;const fb=C.createGain();fb.gain.value=.28;const wet=C.createGain();wet.gain.value=.35;
  dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AU.bgm);AU.echo=dl;
  const len=C.sampleRate*2,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=buf;
  AU.water=loop('bandpass',1300,.5);AU.air=loop('lowpass',650,.4);
  startBgm();
  if(C.state==='suspended')C.resume();
}
function loop(type,f,q){const C=AU.C,s=C.createBufferSource();s.buffer=AU.nb;s.loop=true;const fl=C.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const ga=C.createGain();ga.gain.value=0;s.connect(fl);fl.connect(ga);ga.connect(AU.sfx);s.start();return ga}
function tone(f,dur,type='sine',vol=.25,f2,delay=0,dest){if(!AU.C)return;const C=AU.C,t=C.currentTime+delay,o=C.createOscillator(),ga=C.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(vol,t+.012);ga.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(ga);ga.connect(dest||AU.sfx);if(dest===AU.bgm&&AU.echo)ga.connect(AU.echo);o.start(t);o.stop(t+dur+.05);return o}
function noise(dur,vol,type,f,q=1,delay=0,f2,dest){if(!AU.C)return;const C=AU.C,t=C.currentTime+delay,s=C.createBufferSource();s.buffer=AU.nb;const fl=C.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);const ga=C.createGain();ga.gain.setValueAtTime(vol,t);ga.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(ga);ga.connect(dest||AU.sfx);s.start(t,Math.random());s.stop(t+dur+.05)}
function vib(o,rate,depth,dur){if(!o||!AU.C)return;const C=AU.C,l=C.createOscillator(),lg=C.createGain();l.frequency.value=rate;lg.gain.value=depth;l.connect(lg);lg.connect(o.frequency);l.start();l.stop(C.currentTime+dur)}
const sfx={
  pick(){tone(520,.09,'triangle',.2,880)},
  tap(){tone(700,.06,'sine',.12,900)},
  pop(){tone(rnd(600,800),.08,'sine',.2,rnd(1200,1500))},
  squeeze(){noise(.14,.4,'lowpass',520,2,0,160);tone(140,.12,'square',.05,70)},
  splat(){noise(.18,.35,'lowpass',900,1,0,200);tone(220,.15,'sine',.12,90)},
  brush(){noise(.07,.25,'bandpass',rnd(3000,4200),1.4)},
  scrub(){noise(.08,.22,'bandpass',rnd(1400,2000),1.2)},
  squish(){tone(rnd(300,420),.06,'sine',.1,rnd(700,900))},
  file(){noise(.06,.24,'bandpass',rnd(1800,2400),2)},
  clip(){noise(.035,.6,'highpass',4500);tone(2600,.04,'square',.07)},
  pat(){noise(.06,.3,'lowpass',500,1);tone(180,.05,'sine',.1)},
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,0,i*.07))},
  good(){[784,988,1175,1568].forEach((f,i)=>tone(f,.25,'triangle',.18,0,i*.09))},
  wah(){[392,370,349,294].forEach((f,i)=>vib(tone(f,i===3?.7:.28,'sawtooth',.1,0,i*.3),6,i===3?14:4,1.6))},
  fail(){tone(420,.35,'sawtooth',.08,140);tone(300,.3,'triangle',.1,110,.08)},
  boom(){noise(.7,.6,'lowpass',260,1,0,80);tone(90,.5,'sine',.35,40)},
  gross(){vib(tone(170,.8,'sawtooth',.12,90),9,30,.9);noise(.5,.15,'lowpass',600,1,.1)},
  fire(){noise(.8,.45,'bandpass',300,.8,0,3000);tone(220,.6,'sawtooth',.08,900)},
  yelp(){vib(tone(880,.35,'square',.06,1250),18,40,.4);tone(1300,.2,'sine',.08,900,.05)},
  ouch(){vib(tone(950,.55,'square',.07,1300),14,60,.6)},
  gargle(){vib(tone(190,.32,'sine',.18),22,60,.35)},
  gulp(){tone(300,.1,'sine',.2,150);tone(260,.1,'sine',.18,130,.15)},

function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-2.5)/(r.width-5)*CW,y:(e.clientY-r.top-2.5)/(r.height-5)*CH}}

function up(){
  cv.style.cursor='grab';
  if(S.sd){const sd=S.sd;S.sd=null;if(!sd.mode&&sd.i>=0&&S.th){sfx.tap()}if(!S.down)return}
  if(!S.down)return;S.down=false;const id=S.held;S.held=null;const sq=S.sq;S.sq=null;
  if(!id||S.mode!=='play')return;
  if(S.heldFrom==='placed'&&S.placed){S.heldFrom='scene';if(inShelf(S.ptr)){S.placed=null;sfx.pick();return}
    const ts=S.tapStart||{t:0,x:0,y:0};if(S.t-ts.t<.35&&hyp(S.ptr.x-ts.x,S.ptr.y-ts.y)<10){pressTowel(S.placed.id,S.placed.x,S.placed.y)}else{S.placed.x=S.ptr.x;S.placed.y=S.ptr.y}return}

  S.d=0;S.rev=false;
  if(S.mode==='play'&&S.down&&S.held){const mx=S.ptr.x-S.last.x,my=S.ptr.y-S.last.y,d=hyp(mx,my);S.d=d;S.speed=S.speed*.7+(d/Math.max(dt,.001))*.3;
    if(d>1.2){const dir={x:mx/d,y:my/d};if(S.lastDir&&dir.x*S.lastDir.x+dir.y*S.lastDir.y<-.2){S.rev=true;S.revN++}S.lastDir=dir}
    squeezeUpdate(dt);

    if(S.held==='shower')washSmears(S.ptr.x,S.ptr.y+60,70,dt*1.6);
    if(['towel','hanky','bigtowel','smalltowel','bathsheet','wipes'].includes(S.held)&&S.d>.3)washSmears(S.ptr.x,S.ptr.y,34,S.d*.012);
    if(!(S.sq&&S.sq.t>0))S.th.hold&&S.th.hold(S.held,S.ptr.x,S.ptr.y,dt)}
  else S.sq=null;

      $('hintText').innerHTML=false?(h?`<small>提示（不一定要照做）</small>${h.text}`:'看起來都洗好了！可以按「完成！看結果」，或繼續玩'):'自由探索！想怎麼洗都可以，洗好就按「完成！看結果」';

  if(AU.C){const t=AU.C.currentTime;AU.water.gain.setTargetAtTime(S.wantWater?.3:0,t,.06);AU.air.gain.setTargetAtTime(S.wantAir?.32:0,t,.08)}
}
