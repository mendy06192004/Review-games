<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>國英數複習平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#" id="home-link" class="brand">📚 國英數複習平台</a>
    <ol class="steps" id="steps" aria-label="步驟"></ol>
  </header>

  <main id="main">
    <!-- 1 科目 -->
    <section class="step" data-step="subject">
      <h1>今天想複習哪一科？</h1>
      <div class="cards big" id="subject-cards"></div>
    </section>

    <!-- 其他：特殊需求領域與固定範圍的學科遊戲 -->
    <section class="step" data-step="others" hidden>
      <h1>其他遊戲</h1>
      <p class="tip">不需要選範圍，點了就能玩。</p>
      <nav class="chips" id="other-tabs" aria-label="分類"></nav>
      <div id="other-list"></div>
      <div class="nav"><button class="btn ghost" data-back>← 回首頁</button></div>
    </section>

    <!-- 2 版本 -->
    <section class="step" data-step="version" hidden>
      <h1>你的課本是哪一個版本？</h1>
      <div class="cards" id="version-cards"></div>
      <div class="nav"><button class="btn ghost" data-back>← 上一步</button></div>
    </section>

    <!-- 3 年級與冊 -->
    <section class="step" data-step="volume" hidden>
      <h1>選擇年級與冊別 <small>（可多選）</small></h1>
      <div id="volume-groups"></div>
      <div class="nav">
        <button class="btn ghost" data-back>← 上一步</button>
        <button class="btn primary" id="volume-next" disabled>下一步 →</button>
      </div>
    </section>

    <!-- 4 章節 -->
    <section class="step" data-step="chapter" hidden>
      <h1>選擇章節</h1>
      <p class="tip">勾選整章，或展開後只勾選某幾節。</p>
      <div class="toolbar"><button class="btn small ghost" id="check-all">全選</button><button class="btn small ghost" id="check-none">全部取消</button></div>
      <div id="chapter-tree" class="tree"></div>
      <div class="nav">
        <button class="btn ghost" data-back>← 上一步</button>
        <button class="btn primary" id="chapter-next" disabled>下一步 →</button>
      </div>
    </section>

    <!-- 5 遊戲模式 -->
    <section class="step" data-step="mode" hidden>
      <h1>選擇遊戲模式</h1>
      <div class="cards" id="mode-cards"></div>
      <div class="nav"><button class="btn ghost" data-back>← 上一步</button></div>
    </section>

    <!-- 6 開始 -->
    <section class="step" data-step="ready" hidden>
      <h1>準備好了嗎？</h1>
      <div class="summary" id="summary"></div>
      <label class="count-row">題數
        <select id="count"></select>
      </label>
      <p class="msg" id="ready-msg" role="alert"></p>
      <div class="nav">
        <button class="btn ghost" data-back>← 上一步</button>
        <button class="btn primary huge" id="start">開始遊戲 ▶</button>
      </div>
    </section>

    <!-- 遊戲進行 -->
    <section class="step play" data-step="play" hidden>
      <div class="play-bar">
        <button class="btn small ghost" id="quit">✕ 離開</button>
        <span id="play-title"></span>
      </div>
      <div id="game-root" class="game-root"></div>
    </section>

    <!-- 結果 -->
    <section class="step" data-step="result" hidden>
      <h1 id="result-title">完成！</h1>
      <div class="score-box" id="score-box"></div>
      <ol class="review" id="review"></ol>
      <div class="nav wrap">
        <button class="btn primary" id="again">同範圍再玩一次</button>
        <button class="btn" id="other-mode">換個遊戲</button>
        <button class="btn ghost" id="restart">重新選範圍</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
