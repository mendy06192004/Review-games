<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台登入</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <style>
    main{display:grid;place-items:center}
    .login{width:min(360px,100%);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:32px 28px;margin-top:6vh}
    .login h1{font-size:1.4rem;margin:0 0 4px}
    .login input{width:100%;font:inherit;font-size:1.3rem;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper);color:var(--ink);margin:18px 0 6px}
    .login .btn{width:100%;margin-top:8px}
  </style>
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><span class="seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.2 5 7.6 4.5 4 4.8v13.4c3.6-.3 6.2.2 8 1.7 1.8-1.5 4.4-2 8-1.7V4.8c-3.6-.3-6.2.2-8 1.7z"/><path d="M12 6.5v13.4"/></svg></span>複習小書房</a></header>
  <main>
    <form class="login" id="f">
      <p class="eyebrow">老師專用</p>
      <h1>後台登入</h1>
      <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="密碼" autofocus required>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn primary" type="submit">登入</button>
    </form>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const target = next && next.startsWith('/admin') ? next : '/admin/';
    fetch('/api/login/status').then((r) => r.json()).then((s) => { if (s.已登入) location.replace(target); });
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ 密碼: document.getElementById('pw').value }) });
      if (res.ok) location.replace(target);
      else { msg.textContent = (await res.json().catch(() => ({}))).error || '登入失敗'; document.getElementById('pw').select(); }
    });
  </script>
</body>
</html>
